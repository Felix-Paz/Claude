<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 — OVERSTACK</title>
<style>
/* OVERSTACK 404. Same tokens, same shapes, same wordmark as the game — one
   self-contained file with an embedded 1.8 KB font subset and no network. */
:root {
  --ink: #16352A;
  --text: #FFFFFF;
  --text-mute: rgba(255,255,255,0.62);
  --gold: #FFD24A; --gold-hi: #FFE79A; --gold-lo: #E9A81E;
  --glass-line: rgba(255,255,255,0.28);
  --r-btn: 18px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-size: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Sora', -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--ink); color: var(--text);
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
@font-face {
  font-family: 'Unbounded';
  font-style: normal; font-weight: 800; font-display: block;
  src: url(data:font/woff2;base64,d09GMgABAAAAAAb0ABAAAAAADPQAAAaWAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGhYbhCwcgToGYD9TVEFUKgB8EQgKiGCGZwskAAE2AiQDRAQgBYRqByAMBxu/ClEU84FMI2Xh/P3gefrO+lNdlaS1dA+1suKZWYi/j1LwYN/J977SXTdd+IsHrtSF1Jl0lWfkneze3H3JSr+Ox+/n6jZc66xRGqFoC/v3ZvcPEU2bv31cSyRBM0miVlcy2omEmlnEsxioTtmRg54owEcrs1AyOfFZwKWSgeix46fOpf2aHRtTJDG1anNjPmai8Yvhlly3sRE7Z+F5DA42Rl2tNqv+tERhMYuNxZNLPP8mg4uzm5P8Ia/Lp7RIXqvT6zF/St6WvfJ+ib+xsp/lL5b1wziI4imOP1KfT/BPnvQX+Vb+kbcE1vNfeUe+AMmryr8lL59n5WjWS2n2u9vCCQTJXnyb5by3RHwfgNXJQgdOu6o1rTHiW2Ow0Je4giJMiAheli0A/T6WxRBCo9WL5TgYxShaWiyK6dhT7uJt/afka2zJ4sizGJS8jpa/seUnHHltoV9QbuMs5ySDJ7fm8l9GXy/s07ajYSC9Kafn/YtUaHayvCv/4snHXP4ufssrPJG6PJv1zXOS8XpWQwpwF9SYtY1Naaobt6Q3UtrcuCVNsNmirqNZWkT/LAGHU5GOpT8B7vOVZSNpRKZ3T4j8n9KnBbW/N70WwaVdTeFhdJ0OCIF10loITElnUMvprRbyukuxPqDZa+ql00dNp60fJWC+/kQ8einzveoJ6pxXXgVrmPU9EMDplQpoH3fqjrUtGtus7g67tCbl6eC9Iy7beJqAGsbkx3WkNZowAfX0ZRRjGMcUZjCX+SIQ/fQpZl9LfpS3JS+PyiPysNwnd8udcgeWA3g6alEitOI+beSF2FW21IN64gkxfh+yDOJ6f6xSYYN8jLO/XWh827Ru3cnUGWO39n3VxV/hGXebrEy0wLe8uEC1YnncTXgxN7krk8m4J3M5dSCf905ls/Pci1/PuSczGfZns96p/Bu9NtFSzVs4vxUtlyyWf7jAC3nmQ7sRukRBzeFFu4EpDx92z3/yhJn6ePYxYtD8O8zU2ywn+LC+QRM2YDkhSM0JcO2p1acwU493d0MHrzstAVOOVXU9mlw/7/Fj46m/VxgItbJGqOMMEFSQ2KzP/8jjw/pCVXcICGW0IrLgC2i9WO+azpQgwDFiKX0rv2UilyX085XPA9LbgPezjnsdV2ha6P+QOSWhc/41U8CHlUClY/XJjnEzLmGzRAj5b7yEZ4w72eFYBVXf1zV2JPClYnJ6d2FhepeYUsp3xDWtB3eu7kjesaktJRGpCo5fySW55PzxHKQCZfKX3MOLfH8hurxv39xhXwPAx9DZ17FNIsQmXcezZ1/HNokQm3Qdz7pdMZCU2c7zme0DSRUVA0mZ7Tyf2T6QBN7t9UvyHzbMP2m4znjkm3xdmF5UZ66vrbNMLxRGKpE30wfB4N8/+V11kRlVjfGJMSdLfaazW+ESl7Kt17Q712HZV6Sy+dT/zC6tCEstro2Ni96/Ygk0+s/IKOgub+0fc6Dc5TlapiZg5Jxvc79F0ag7USBYj6Om/xJooED/gweh085ivUSIXjqLp009iw0SIQbpLJ5yok9jwAqNvq9Xp1dgnQG8oPLn2eWeTaB60d6s7Rsugpmhpm0IHZo0GR3chkymbQgdnDwZHdyGjCeqm5Q6XZOyurpJqdM1KcFsKr+Y7WHogIsZP/q6D69Y8iSvPf7Euds3P/XrsO2bvkt/0hYrQktQVSigSFVZra3vUYC6Y8sD2S/SK1oN/c3W+kuAD0acPQzw4dKiWf/f+f9dkRXmXSCM9QnM5DOz6sjW/+/8d2FkxavsnTZ6LaP0ayL6Zop0EdV6I6P08xTqFYzSiyjWw2iv7xHR11Cmm+mifbpzVVurgaIifv }
#pile { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

main {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  display: flex; flex-direction: column; align-items: center;
  padding: max(24px, 4vh) 22px calc(24px + var(--safe-bottom));
  text-align: center;
}

/* ---------- wordmark (the game's own, same choreography) ---------- */
.wordmark {
  font-family: 'Unbounded', 'Sora', system-ui, sans-serif;
  font-weight: 800; line-height: 1; letter-spacing: -0.005em;
  font-size: 1.05rem; color: var(--text); white-space: nowrap;
  display: flex; justify-content: center; align-items: flex-end;
  opacity: 0.92;
}
.wordmark .wm-over, .wordmark .wm-stack { display: inline-flex; }
.wordmark i { font-style: normal; display: inline-block; }
.wordmark.play .wm-over  { animation: wm-drop 1.6s cubic-bezier(0.36, 0, 0.2, 1) both; z-index: 1; }
.wordmark.play .wm-stack { animation: wm-take 1.6s ease both; }
.wordmark.play i { color: var(--gold); animation: wm-light 0.42s ease forwards; animation-delay: calc(1.66s + var(--i) * 0.075s); }
@keyframes wm-drop {
  0%   { transform: translate(112.6%, -430%); opacity: 0; animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.5); }
  7%   { opacity: 1; }
  25%  { transform: translate(112.6%, -106%); animation-timing-function: cubic-bezier(0.3, 0, 0.35, 1); }
  30%  { transform: translate(112.6%, -96%); }
  35%  { transform: translate(112.6%, -106%); }
  39%  { transform: translate(112.6%, -102%); }
  43%  { transform: translate(112.6%, -106%); }
  58%  { transform: translate(112.6%, -106%); animation-timing-function: cubic-bezier(0.62, 0, 0.3, 1); }
  78%  { transform: translate(0%, -106%); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.45); }
  94%  { transform: translate(0%, 4%); animation-timing-function: cubic-bezier(0.25, 0, 0.3, 1); }
  100% { transform: translate(0, 0); }
}
@keyframes wm-take {
  0%, 23% { transform: translateY(0); }
  28%     { transform: translateY(6%); }
  35%     { transform: translateY(0); }
  92%     { transform: translateY(0); }
  95%     { transform: translateY(4%); }
  100%    { transform: translateY(0); }
}
@keyframes wm-light { 0% { color: var(--gold); } 45% { color: #FFFFFF; } 100% { color: #FFFFFF; } }

/* ---------- the number ---------- */
.code {
  font-family: 'Unbounded', 'Sora', system-ui, sans-serif;
  font-weight: 800; letter-spacing: -0.02em; line-height: 0.86;
  font-size: clamp(5.5rem, 30vw, 12rem);
  margin-top: clamp(18px, 6vh, 54px);
  color: var(--gold);
  text-shadow: 0 18px 60px rgba(0,0,0,0.42);
  animation: code-in 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) both 0.15s;
}
@keyframes code-in {
  0%   { transform: translateY(-46px) scale(0.94); opacity: 0; }
  62%  { transform: translateY(6px) scale(1.01); opacity: 1; }
  100% { transform: translateY(0) scale(1); }
}
.line {
  margin-top: 14px; font-size: 1.06rem; font-weight: 700; line-height: 1.4;
  max-width: 22ch; text-shadow: 0 2px 14px rgba(0,0,0,0.45);
  animation: fade-up 0.7s ease both 0.5s;
}
.sub {
  margin-top: 7px; font-size: 0.74rem; font-weight: 700;
  letter-spacing: 0.24em; color: var(--text-mute);
  animation: fade-up 0.7s ease both 0.62s;
}
@keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.btn {
  margin-top: clamp(18px, 4vh, 34px);
  pointer-events: auto; display: inline-block; text-decoration: none;
  padding: 15px 30px; border-radius: var(--r-btn);
  font-family: inherit; font-size: 1rem; font-weight: 800; letter-spacing: 0.14em;
  color: #2A1B00; background: linear-gradient(165deg, var(--gold-hi), var(--gold-lo));
  border: 1px solid rgba(255,235,170,0.75);
  box-shadow: 0 12px 34px -10px rgba(255,180,40,0.75), inset 0 1px 0 rgba(255,255,255,0.55);
  transition: transform 0.14s ease;
  animation: fade-up 0.7s ease both 0.74s;
}
.btn:active { transform: scale(0.96); }
.tip {
  margin-top: 13px; font-size: 0.66rem; font-weight: 700;
  letter-spacing: 0.22em; color: var(--text-mute);
  animation: fade-up 0.7s ease both 0.86s;
}
@media (prefers-reduced-motion: reduce) {
  .wordmark.play .wm-over, .wordmark.play .wm-stack, .wordmark.play i,
  .code, .line, .sub, .btn, .tip { animation: none; opacity: 1; transform: none; color: inherit; }
  .code { color: var(--gold); }
}
</style>
</head>
<body>
<canvas id="pile"></canvas>
<main>
  <div class="wordmark play"><span class="wm-over"><i style="--i:0">O</i><i style="--i:1">V</i><i style="--i:2">E</i><i style="--i:3">R</i></span><span class="wm-stack"><i style="--i:4">S</i><i style="--i:5">T</i><i style="--i:6">A</i><i style="--i:7">C</i><i style="--i:8">K</i></span></div>
  <div class="code">404</div>
  <p class="line">This page fell off the tower.</p>
  <p class="sub">NOTHING HERE TO STACK</p>
  <a class="btn" href="./">BACK TO THE GAME</a>
  <p class="tip">TAP ANYWHERE TO DROP A SHAPE</p>
</main>
<script>
/* A small pile sim — circles for the collisions, the game's polygons for the
   look. Not Matter.js: a 404 page has no business shipping a physics engine. */
(function () {
  var COLORS = ['#FF2E2E', '#FF7A00', '#FFE500', '#22DD4B', '#00D4D4', '#2E6BFF', '#B23BFF', '#FFFFFF'];
  var SIDES  = [3, 4, 5, 6, 7, 8, 9, 12];
  var RADII  = [15, 19, 24, 31, 39, 49, 61, 76];
  var MAX = 30;

  var cv = document.getElementById('pile'), ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, floorY = 0, scale = 1, deckL = 0, deckR = 0;
  var bodies = [], last = 0, bgH = 152, bgS = 42, idle = 0;
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.max(0.5, Math.min(0.94, W / 470));
    floorY = H - Math.max(92, H * 0.16);
    // A deck with edges, like the game's: without them the shapes spread into
    // one flat row instead of doing the only thing this game asks of them.
    var deckW = Math.min(W - 56, 318);
    deckL = (W - deckW) / 2; deckR = deckL + deckW;
  }
  window.addEventListener('resize', resize);
  resize();

  function lighten(hex, k) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 'rgb(' + Math.round(r + (255 - r) * k) + ',' + Math.round(g + (255 - g) * k) + ',' + Math.round(b + (255 - b) * k) + ')';
  }
  function hueOf(hex) {              // the world takes the colour of the best piece, as in the game
    var n = parseInt(hex.slice(1), 16);
    var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    var l = (mx + mn) / 2;
    var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    return [h, s * 100];
  }

  function add(x, tier) {
    if (bodies.length >= MAX) bodies.shift();
    var t = tier == null ? (Math.random() < 0.62 ? (Math.random() * 4) | 0 : 4 + ((Math.random() * 3) | 0)) : tier;
    bodies.push({
      x: x, y: -60 - Math.random() * 90, vx: (Math.random() - 0.5) * 26, vy: 0,
      a: Math.random() * 6.28, va: (Math.random() - 0.5) * 2.4,
      r: RADII[t] * scale * 0.86, tier: t, rest: 0,
    });
  }

  function step(dt) {
    var moving = 0;
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      b.vy += 1750 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.a += b.va * dt;
      b.va *= 0.985;
      if (b.x < deckL + b.r) { b.x = deckL + b.r; b.vx = Math.abs(b.vx) * 0.35; }
      if (b.x > deckR - b.r) { b.x = deckR - b.r; b.vx = -Math.abs(b.vx) * 0.35; }
      if (b.y > floorY - b.r) {
        b.y = floorY - b.r;
        if (b.vy > 90) { b.vy *= -0.24; b.va *= 0.5; } else { b.vy = 0; }
        b.vx *= 0.82; b.va *= 0.82;
      }
      if (b.y > -200 && (Math.abs(b.vx) > 4 || Math.abs(b.vy) > 4)) moving++;
    }
    // two relaxation passes keep the pile from jittering itself apart
    for (var pass = 0; pass < 2; pass++) {
      for (var i2 = 0; i2 < bodies.length; i2++) {
        for (var j = i2 + 1; j < bodies.length; j++) {
          var A = bodies[i2], B = bodies[j];
          var dx = B.x - A.x, dy = B.y - A.y;
          var d = Math.hypot(dx, dy) || 0.001;
          var ov = A.r + B.r - d;
          if (ov <= 0) continue;
          var nx = dx / d, ny = dy / d, push = ov * 0.5;
          A.x -= nx * push; A.y -= ny * push;
          B.x += nx * push; B.y += ny * push;
          var rel = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
          if (rel < 0) {
            var imp = rel * 0.62;
            A.vx += nx * imp; A.vy += ny * imp;
            B.vx -= nx * imp; B.vy -= ny * imp;
            A.va -= imp * 0.004; B.va += imp * 0.004;
          }
        }
      }
    }
    return moving;
  }

  function poly(b) {
    var n = SIDES[b.tier];
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var ang = b.a + (i / n) * Math.PI * 2;
      var px = b.x + Math.cos(ang) * b.r, py = b.y + Math.sin(ang) * b.r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function draw() {
    var best = 0;
    for (var i = 0; i < bodies.length; i++) if (bodies[i].tier > best) best = bodies[i].tier;
    var hs = hueOf(COLORS[best]);
    var dh = ((hs[0] - bgH + 540) % 360) - 180;
    bgH += dh * 0.05;
    bgS += (hs[1] - bgS) * 0.05;
    ctx.fillStyle = 'hsl(' + bgH.toFixed(1) + ', ' + (bgS * 0.55).toFixed(1) + '%, 21%)';
    ctx.fillRect(0, 0, W, H);
    // the soft pool the game puts behind its tower
    var pool = ctx.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.46, Math.max(W, H) * 0.62);
    pool.addColorStop(0, 'hsla(' + bgH.toFixed(1) + ', ' + (bgS * 0.6).toFixed(1) + '%, 33%, 0.55)');
    pool.addColorStop(1, 'transparent');
    ctx.fillStyle = pool; ctx.fillRect(0, 0, W, H);

    for (var k = 0; k < bodies.length; k++) {
      var b = bodies[k];
      var c = COLORS[b.tier];
      poly(b);
      var g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.4, b.r * 0.1, b.x, b.y, b.r * 1.5);
      g.addColorStop(0, lighten(c, 0.35));
      g.addColorStop(1, c);
      ctx.fillStyle = g;
      ctx.shadowColor = c; ctx.shadowBlur = 8 + b.tier * 3;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineJoin = 'round'; ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.stroke();
    }
    // the deck they are all resting on — the game's dock, same proportions
    var dh = Math.max(16, Math.min(22, H * 0.026));
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#2E4258';
    ctx.beginPath(); ctx.roundRect(deckL, floorY, deckR - deckL, dh, 8); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.roundRect(deckL + 5, floorY + 3, deckR - deckL - 10, 2.5, 2); ctx.fill();
  }

  function frame(t) {
    var dt = Math.min((t - last) / 1000 || 0.016, 0.033);
    last = t;
    var moving = step(dt);
    draw();
    idle = moving ? 0 : idle + dt;
    if (idle < 1.2 || !still) requestAnimationFrame(frame);
    else running = false;              // reduced motion: settle, then stop entirely
  }
  var running = true;
  function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }

  // seed the pile, staggered so it builds itself in front of you
  var seedN = W < 520 ? 19 : 22;
  for (var s = 0; s < seedN; s++) {
    (function (i) {
      setTimeout(function () {
        add(deckL + 30 + Math.random() * (deckR - deckL - 60));
        kick();
      }, still ? 0 : 220 + i * 130);
    })(s);
  }

  addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.btn')) return;
    add(Math.max(deckL + 26, Math.min(deckR - 26, e.clientX)));
    kick();
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
