{id:"k37", s1:"I won’t tolerate this noise any longer.", key:"PUT", s2:"I won’t ____ this noise any longer.", ans:["put up with"], halves:[["put up"],["with"]], tags:["pv"], diff:2, exp:"PUT UP WITH = tolerate.", trap:"Three-part phrasal verbs keep all parts in order."},
{id:"k38", s1:"Jess is very similar to her mother in character.", key:"AFTER", s2:"Jess really ____ her mother.", ans:["takes after"], halves:[["takes"],["after"]], tags:["pv"], diff:2, exp:"TAKE AFTER = resemble an older family member.", trap:"Third person -s: takES after."},
{id:"k39", s1:"Tom can’t decide where to go on holiday.", key:"MIND", s2:"Tom can’t make ____ where to go on holiday.", ans:["up his mind","up his mind about"], halves:[["up"],["his mind"]], tags:["fix"], diff:2, exp:"MAKE UP YOUR MIND = decide.", trap:"The possessive changes with the subject: make up HIS mind."},
{id:"k40", s1:"Two hundred runners participated in the city race.", key:"PART", s2:"Two hundred runners ____ the city race.", ans:["took part in"], halves:[["took part"],["in"]], tags:["fix","prep"], diff:1, exp:"TAKE PART IN = participate in. Past: took.", trap:"IN is the half-mark most often lost."},
{id:"k41", s1:"Students rarely listen carefully to the announcements.", key:"ATTENTION", s2:"Students rarely ____ the announcements.", ans:["pay attention to","pay any attention to"], halves:[["pay attention","pay any attention"],["to"]], tags:["fix","col"], diff:2, exp:"PAY attention TO — collocation + preposition.", trap:"PAY (not put/give in FCE answers) and TO at the end."},
{id:"k42", s1:"Mrs Reyes manages the sales department.", key:"CHARGE", s2:"Mrs Reyes is ____ the sales department.", ans:["in charge of"], halves:[["in charge"],["of"]], tags:["depprep"], diff:1, exp:"BE IN CHARGE OF = manage / be responsible for.", trap:"Triple chunk: in + charge + of. Each word is a half-mark."},
{id:"k43", s1:"I’m sure he didn’t break the window deliberately.", key:"PURPOSE", s2:"I’m sure he didn’t break the window ____ .", ans:["on purpose"], halves:[["on"],["purpose"]], tags:["depprep"], diff:1, exp:"ON purpose = deliberately. Opposite: BY accident.", trap:"Prepositions swap in the pair: ON purpose / BY accident."},
{id:"k44", s1:"You may camp here if you leave no rubbish behind.", key:"PROVIDED", s2:"You may camp here ____ no rubbish behind.", ans:["provided that you leave","provided you leave"], halves:[["provided"],["you leave"]], tags:["cond","link"], diff:3, exp:"PROVIDED (THAT) = only if / on condition that.", trap:"Keep the verb present: 'provided you will leave' fails."},
{id:"k45", s1:"My father stopped smoking two years ago.", key:"GAVE", s2:"My father ____ two years ago.", ans:["gave up smoking"], halves:[["gave up"],["smoking"]], tags:["pv","ger"], diff:2, exp:"GIVE UP + -ING = quit a habit.", trap:"-ING after give up: 'gave up to smoke' is wrong."},
{id:"k46", s1:"I posted your letter — I remember it clearly.", key:"REMEMBER", s2:"I clearly ____ your letter.", ans:["remember posting"], halves:[["remember"],["posting"]], tags:["ger"], diff:4, exp:"REMEMBER + -ING = memory of a past action.", trap:"remember TO POST = a duty for the future — opposite meaning."},
{id:"k47", s1:"I’m sorry that I sold my grandfather’s guitar.", key:"REGRET", s2:"I ____ my grandfather’s guitar.", ans:["regret selling","regret having sold"], halves:[["regret"],["selling","having sold"]], tags:["ger"], diff:3, exp:"REGRET + -ING = be sorry about a past action.", trap:"regret TO SELL would mean you’re about to do it (formal announcements)."},
{id:"k48", s1:"You should see a doctor about that cough.", key:"BETTER", s2:"You ____ a doctor about that cough.", ans:["had better see","'d better see"], halves:[["had better","'d better"],["see"]], tags:["modal"], diff:2, exp:"HAD BETTER + bare infinitive = strong advice.", trap:"HAD (not would) better, and no TO after it."},
{id:"k49", s1:"The rule says employees must wear a badge at all times.", key:"SUPPOSED", s2:"Employees ____ a badge at all times.", ans:["are supposed to wear"], halves:[["are supposed"],["to wear"]], tags:["modal","pass"], diff:3, exp:"BE SUPPOSED TO = required by rules/expectations.", trap:"ARE supposed (plural) and TO before the verb."},
{id:"k50", s1:"Rita finally managed to pass her driving test.", key:"SUCCEEDED", s2:"Rita finally ____ her driving test.", ans:["succeeded in passing"], halves:[["succeeded in"],["passing"]], tags:["prep","ger"], diff:3, exp:"SUCCEED IN + -ING.", trap:"The mirror of k23 — succeed takes IN + -ing, not to."},
{id:"k51", s1:"Ben found it hard to follow the lecture.", key:"DIFFICULTY", s2:"Ben ____ the lecture.", ans:["had difficulty following","had difficulty in following","had great difficulty following"], halves:[["had difficulty","had great difficulty"],["following"]], tags:["fix","ger"], diff:4, exp:"HAVE DIFFICULTY (IN) + -ING.", trap:"No TO: 'had difficulty to follow' is the standard error."},
{id:"k52", s1:"Visiting the old town is really worthwhile.", key:"WORTH", s2:"The old town is ____ .", ans:["well worth visiting","worth visiting","really worth visiting"], halves:[["worth"],["visiting"]], tags:["fix","ger"], diff:3, exp:"BE WORTH + -ING — the object becomes the subject.", trap:"'worth to visit' / 'worth a visit it' — keep it simple: worth visitING."},
{id:"k53", s1:"Let’s walk rather than take the bus.", key:"INSTEAD", s2:"Let’s walk ____ the bus.", ans:["instead of taking"], halves:[["instead of"],["taking"]], tags:["link","ger"], diff:2, exp:"INSTEAD OF + -ING.", trap:"Preposition OF → -ing follows automatically."},
{id:"k54", s1:"It was Joe’s fault that we missed the train.", key:"BLAME", s2:"Joe ____ missing the train.", ans:["was to blame for"], halves:[["was to blame"],["for"]], tags:["fix","prep"], diff:4, exp:"BE TO BLAME FOR = be responsible for (something bad).", trap:"Fixed as an active phrase: 'was to blame', never 'was blamed to'."},
{id:"k55", s1:"“Well done on winning the cup, Aya!” said the coach.", key:"CONGRATULATED", s2:"The coach ____ winning the cup.", ans:["congratulated aya on"], halves:[["congratulated aya"],["on"]], tags:["rep","prep"], diff:3, exp:"CONGRATULATE somebody ON + -ing.", trap:"ON is the tested preposition (not for)."},
{id:"k56", s1:"The storm stopped us from leaving the harbour.", key:"PREVENTED", s2:"The storm ____ the harbour.", ans:["prevented us from leaving"], halves:[["prevented us from"],["leaving"]], tags:["rep","prep"], diff:2, exp:"PREVENT somebody FROM + -ing.", trap:"FROM is obligatory after prevent in FCE answers."},
{id:"k57", s1:"My parents let me stay out late at weekends.", key:"ALLOWED", s2:"I ____ out late at weekends.", ans:["am allowed to stay","was allowed to stay"], halves:[["am allowed","was allowed"],["to stay"]], tags:["pass","modal"], diff:3, exp:"LET has no passive — use BE ALLOWED TO.", trap:"'I am let to stay' doesn’t exist in English."},
{id:"k58", s1:"They made us wait for hours at the embassy.", key:"WERE", s2:"We ____ for hours at the embassy.", ans:["were made to wait"], halves:[["were made"],["to wait"]], tags:["pass"], diff:4, exp:"make sb DO → passive: BE MADE TO DO — the TO comes back.", trap:"That returning TO is precisely what Cambridge is checking."},
{id:"k59", s1:"I advise you to book the tickets early.", key:"WERE", s2:"If I ____ , I would book the tickets early.", ans:["were you","were in your position","were in your shoes"], halves:[["were"],["you","in your position","in your shoes"]], tags:["cond","fix"], diff:3, exp:"Advice idiom: If I WERE YOU, I would…", trap:"WERE for all persons in this hypothetical — 'if I was you' is penalised here."},
{id:"k60", s1:"Swimming is forbidden in this lake.", key:"NOT", s2:"You are ____ in this lake.", ans:["not allowed to swim","not permitted to swim"], halves:[["not allowed","not permitted"],["to swim"]], tags:["pass","modal"], diff:2, exp:"forbidden ↔ NOT allowed/permitted TO + infinitive.", trap:"Keep TO: 'not allowed swim' loses a half mark."},
];

/* ---------- Open Cloze (one word per gap) ----------
   gt = gap type for the heatmap. */
FCE.BANK.cloze = [
{id:"c01", s:"She has been working at the hospital ____ 2019.", ans:["since"], gt:"prep", tags:["prep","aux"], diff:1, exp:"Point in time after present perfect → SINCE; period → FOR.", trap:"FOR 2019 is the bait — 2019 is a starting point, not a period."},
{id:"c02", s:"I’m not very keen ____ horror films, to be honest.", ans:["on"], gt:"prep", tags:["prep"], diff:1, exp:"keen ON — dependent preposition.", trap:"Spanish/French speakers reach for 'of' or 'in'."},
{id:"c03", s:"Whether we have the picnic depends entirely ____ the weather.", ans:["on","upon"], gt:"prep", tags:["prep"], diff:1, exp:"depend ON/UPON.", trap:"'depends OF' is the classic L1-interference error."},
{id:"c04", s:"She insisted ____ paying for everyone’s dinner.", ans:["on","upon"], gt:"prep", tags:["prep","ger"], diff:2, exp:"insist ON + -ing.", trap:"The -ing after the gap confirms a preposition is needed."},
{id:"c05", s:"The ending was completely different ____ what I had expected.", ans:["from","to"], gt:"prep", tags:["prep"], diff:2, exp:"different FROM (also accepted: different TO in British English).", trap:"'different THAN' is American/informal — risky at Cambridge."},
{id:"c06", s:"Who was responsible ____ locking up the office last night?", ans:["for"], gt:"prep", tags:["prep","ger"], diff:1, exp:"responsible FOR + -ing.", trap:"responsible OF doesn’t exist."},
{id:"c07", s:"The region is famous ____ its spectacular beaches.", ans:["for"], gt:"prep", tags:["prep"], diff:1, exp:"famous FOR something.", trap:"famous BY/OF are the usual wrong guesses."},
{id:"c08", s:"I’ve never been much good ____ remembering names.", ans:["at"], gt:"prep", tags:["prep","ger"], diff:1, exp:"good/bad AT + -ing.", trap:"good IN appears right but fails."},
{id:"c09", s:"____ first, I found the course difficult, but it got easier.", ans:["at"], gt:"prep", tags:["depprep"], diff:2, exp:"AT first = in the beginning (contrast follows).", trap:"IN first / At the first — the chunk is exactly AT FIRST."},
{id:"c10", s:"He accepted the award ____ behalf of the whole team.", ans:["on"], gt:"prep", tags:["depprep"], diff:3, exp:"ON behalf of = representing.", trap:"IN behalf is the near-miss."},
{id:"c11", s:"Most residents are ____ favour of the new cycle lanes.", ans:["in"], gt:"prep", tags:["depprep"], diff:2, exp:"IN favour of = supporting.", trap:"ON favour mixes it with 'on behalf'."},
{id:"c12", s:"The breakthrough came as a result ____ years of patient research.", ans:["of"], gt:"prep", tags:["depprep"], diff:2, exp:"as a result OF.", trap:"as a result FROM is the bait."},
{id:"c13", s:"____ addition to the salary, the job offers free accommodation.", ans:["in"], gt:"prep", tags:["depprep"], diff:2, exp:"IN addition to = besides.", trap:"The capital letter shows it starts the phrase: In addition to."},
{id:"c14", s:"Her latest novel is quite similar ____ her first one.", ans:["to"], gt:"prep", tags:["prep"], diff:1, exp:"similar TO.", trap:"similar WITH/AS — both wrong."},
{id:"c15", s:"The recipe consists ____ only five basic ingredients.", ans:["of"], gt:"prep", tags:["prep"], diff:2, exp:"consist OF = be made of.", trap:"consist IN exists but means something different (rare) — Cambridge wants OF here."},
{id:"c16", s:"She’s been happily married ____ a dentist for ten years.", ans:["to"], gt:"prep", tags:["prep"], diff:2, exp:"married TO somebody.", trap:"married WITH is the L1 trap par excellence."},
{id:"c17", s:"I don’t know ____ to accept the job offer or wait for something better.", ans:["whether"], gt:"link", tags:["link"], diff:3, exp:"WHETHER … or — IF is not used before 'to + infinitive'.", trap:"IF feels natural but fails before 'to accept'."},
{id:"c18", s:"____ being exhausted after the flight, she went straight to the meeting.", ans:["despite"], gt:"link", tags:["link","ger"], diff:3, exp:"DESPITE + -ing.", trap:"Although + -ing is impossible; and despite never takes OF."},
{id:"c19", s:"He went to work ____ though he was feeling terrible.", ans:["even"], gt:"link", tags:["link"], diff:2, exp:"EVEN though = although (stronger).", trap:"The gap is before 'though', so ALTHOUGH itself cannot fit."},
{id:"c20", s:"We enjoyed the festival in ____ of the dreadful weather.", ans:["spite"], gt:"link", tags:["link"], diff:2, exp:"in SPITE of.", trap:"The OF after the gap points to 'spite', not 'despite'."},
{id:"c21", s:"____ long as you keep the receipt, you can return it.", ans:["as","so"], gt:"link", tags:["link","cond"], diff:2, exp:"AS/SO long as = provided that.", trap:"The capital + 'long as' pattern identifies the chunk."},
{id:"c22", s:"Take a jacket in ____ it gets cold on the boat.", ans:["case"], gt:"link", tags:["link","cond"], diff:2, exp:"in CASE + clause = as a precaution.", trap:"'in case OF' would need a noun, not a clause."},
{id:"c23", s:"I’ll lend you the money on condition ____ you pay it back by Friday.", ans:["that"], gt:"link", tags:["link","cond"], diff:3, exp:"on condition THAT = only if.", trap:"OF after 'condition' fails before a full clause."},
{id:"c24", s:"Rarely ____ we see such generosity from a stranger.", ans:["do"], gt:"aux", tags:["inv","aux"], diff:4, exp:"Negative adverb first → inversion with DO.", trap:"'Rarely we see' without the auxiliary is the trap."},
{id:"c25", s:"Not until the final whistle ____ the fans start to celebrate.", ans:["did"], gt:"aux", tags:["inv","aux"], diff:5, exp:"Not until X + DID + subject + verb.", trap:"Past context → DID, and inversion is compulsory."},
{id:"c26", s:"She has lived here much longer than I ____ .", ans:["have"], gt:"aux", tags:["aux","comp"], diff:3, exp:"Comparative ellipsis echoes the auxiliary: than I HAVE.", trap:"'than I do' clashes with the present perfect before it."},
{id:"c27", s:"I didn’t enjoy the film, and neither ____ my brother.", ans:["did"], gt:"aux", tags:["aux"], diff:2, exp:"neither + auxiliary + subject, copying the tense (didn’t → did).", trap:"'neither my brother' or 'neither does' (wrong tense) are the traps."},
{id:"c28", s:"____ you need any further information, please contact our office.", ans:["should"], gt:"aux", tags:["cond","inv"], diff:4, exp:"SHOULD you need = If you need (formal inverted conditional).", trap:"IF fits the meaning but the inversion slot wants SHOULD."},
{id:"c29", s:"The windows ____ being cleaned at the moment, so use the back door.", ans:["are"], gt:"aux", tags:["pass","aux"], diff:2, exp:"Present continuous passive: ARE being cleaned.", trap:"'is' fails — windows is plural."},
{id:"c30", s:"By next summer, they will ____ finished the new terminal.", ans:["have"], gt:"aux", tags:["aux"], diff:3, exp:"Future perfect: will HAVE + participle, triggered by 'By + time'.", trap:"'will BE finished' changes the structure — HAVE is the cloze answer."},
{id:"c31", s:"I ____ been told that the museum closes early on Sundays.", ans:["have"], gt:"aux", tags:["aux","pass"], diff:2, exp:"Present perfect passive: have BEEN told.", trap:"The BEEN after the gap is the signpost."},
{id:"c32", s:"It’s high time something was ____ about the traffic in this town.", ans:["done"], gt:"vform", tags:["fix","pass"], diff:4, exp:"Fixed passive chunk: something must be DONE / was done about it.", trap:"'made about' is the collocation trap — English DOES something about problems."},
{id:"c33", s:"You ____ better hurry — the last train leaves in ten minutes.", ans:["had"], gt:"modal", tags:["modal"], diff:2, exp:"HAD better + bare infinitive.", trap:"'would better' doesn’t exist; the contraction ’d = HAD."},
{id:"c34", s:"You ____ have told me you were coming — I’d have cooked something!", ans:["should","could","might"], gt:"modal", tags:["modal"], diff:3, exp:"Past criticism/reproach: should/could/might HAVE + participle.", trap:"MUST have told = deduction, not reproach — wrong flavour here."},
{id:"c35", s:"Visitors ____ not feed the animals under any circumstances.", ans:["must","may"], gt:"modal", tags:["modal"], diff:2, exp:"Prohibition on signs: MUST NOT (or formal MAY NOT).", trap:"'do not' would need different word order — the slot wants a modal."},
{id:"c36", s:"The film, ____ was shot entirely in Iceland, won three awards.", ans:["which"], gt:"rel", tags:["rel"], diff:2, exp:"Non-defining clause (commas) about a thing → WHICH.", trap:"THAT after a comma is forbidden."},
{id:"c37", s:"The author, ____ first book sold a million copies, lives quietly in Wales.", ans:["whose"], gt:"rel", tags:["rel"], diff:3, exp:"Possession → WHOSE (her first book).", trap:"'who his' / 'which' both fail — possession needs whose."},
{id:"c38", s:"The village ____ my grandparents grew up has hardly changed.", ans:["where"], gt:"rel", tags:["rel"], diff:2, exp:"Place + complete clause after the gap → WHERE.", trap:"'which' would need a preposition: in which they grew up."},
{id:"c39", s:"Much of ____ he told us later turned out to be untrue.", ans:["what"], gt:"rel", tags:["rel"], diff:4, exp:"WHAT = the thing(s) that; no noun before the gap.", trap:"'that' after 'of' is impossible — preposition + THAT never combines like this."},
{id:"c40", s:"It was the manner in ____ she spoke that upset everyone.", ans:["which"], gt:"rel", tags:["rel"], diff:4, exp:"Preposition + WHICH (in which = how).", trap:"in THAT / in WHERE are both impossible after a preposition."},
{id:"c41", s:"Carlos cut ____ rather badly while he was chopping onions.", ans:["himself"], gt:"pron", tags:["pron"], diff:1, exp:"Reflexive: subject and object are the same person.", trap:"'him' would mean somebody else got cut."},
{id:"c42", s:"The twins send each ____ funny photos every single day.", ans:["other"], gt:"pron", tags:["pron"], diff:2, exp:"each OTHER = reciprocal action.", trap:"'each others' / 'each one' — the chunk is exactly each other."},
{id:"c43", s:"I found ____ almost impossible to stay awake during the lecture.", ans:["it"], gt:"pron", tags:["pron","fix"], diff:3, exp:"Dummy IT: find IT + adjective + to-infinitive.", trap:"Leaving the gap for 'myself' — the pattern needs empty IT."},
{id:"c44", s:"Sofia decorated the whole flat by ____ in a single weekend.", ans:["herself"], gt:"pron", tags:["pron","fix"], diff:2, exp:"BY + reflexive = alone, without help.", trap:"'by her own' blends two idioms — it’s ON her own or BY herself."},
{id:"c45", s:"There was hardly ____ traffic on the roads this morning.", ans:["any"], gt:"det", tags:["det"], diff:2, exp:"hardly ANY = almost no.", trap:"'hardly no traffic' double-negates."},
{id:"c46", s:"____ of my friends has ever been to Japan, so I have no one to ask.", ans:["none"], gt:"det", tags:["det"], diff:3, exp:"NONE of + plural = not one of them.", trap:"'No one of my friends' — NO ONE never takes of."},
{id:"c47", s:"He spends far ____ much time playing video games.", ans:["too"], gt:"det", tags:["det","comp"], diff:2, exp:"far TOO much = excessively.", trap:"'so much' fits rhythm but 'far so much' is impossible."},
{id:"c48", s:"You can take ____ of the two routes — they’re equally fast.", ans:["either"], gt:"det", tags:["det"], diff:3, exp:"EITHER of the two = one or the other.", trap:"'any of the two' is the L1 calque; with two, use either."},
{id:"c49", s:"Very ____ people realise how old this bridge actually is.", ans:["few"], gt:"det", tags:["det"], diff:2, exp:"very FEW + plural countable = almost none.", trap:"'very little people' would comment on their height!"},
{id:"c50", s:"It was ____ a boring speech that half the audience fell asleep.", ans:["such"], gt:"det", tags:["det","comp"], diff:2, exp:"SUCH + a + adjective + noun … that.", trap:"SO + adjective only — 'so a boring speech' is impossible."},
{id:"c51", s:"She plays ____ violin in the national youth orchestra.", ans:["the"], gt:"art", tags:["art"], diff:1, exp:"play THE + musical instrument.", trap:"Zero article works for sports (play tennis) but NOT instruments."},
{id:"c52", s:"The new stadium is nothing like as good as ____ old one was.", ans:["the"], gt:"art", tags:["art"], diff:2, exp:"THE old one — specified by contrast.", trap:"'an old one' loses the specific reference."},
{id:"c53", s:"____ more you practise retrieval, the longer you remember things.", ans:["the"], gt:"art", tags:["art","comp"], diff:2, exp:"THE + comparative, THE + comparative.", trap:"Both halves need THE — including the first."},
{id:"c54", s:"We should make ____ effort to arrive before the speeches start.", ans:["an"], gt:"art", tags:["art","fix"], diff:2, exp:"make AN effort — fixed collocation with article.", trap:"Dropping the article ('make effort') is the typical loss."},
{id:"c55", s:"On ____ other hand, living in the centre is far more convenient.", ans:["the"], gt:"art", tags:["art","fix"], diff:1, exp:"on THE other hand — fixed discourse chunk.", trap:"'On other hand' — the article is not optional."},
{id:"c56", s:"Carry ____ with the exercises while I check your essays.", ans:["on"], gt:"adv", tags:["pv"], diff:1, exp:"carry ON = continue.", trap:"carry OUT (= perform a task) is the near neighbour."},
{id:"c57", s:"The plane finally took ____ after a two-hour delay.", ans:["off"], gt:"adv", tags:["pv"], diff:1, exp:"take OFF = leave the ground.", trap:"take UP/OUT change the meaning entirely."},
{id:"c58", s:"While clearing the attic, I came ____ a box of wartime letters.", ans:["across","upon"], gt:"adv", tags:["pv"], diff:2, exp:"come ACROSS = find by chance.", trap:"come ACROSS vs come UP WITH (invent) — different particles, different worlds."},
{id:"c59", s:"Could you fill ____ this form and sign it at the bottom?", ans:["in","out"], gt:"adv", tags:["pv"], diff:1, exp:"fill IN (BrE) / fill OUT (AmE) a form.", trap:"fill UP is for petrol tanks, not forms."},
{id:"c60", s:"Don’t worry — the noise of the city is easy to get used ____ .", ans:["to"], gt:"adv", tags:["ger","prep"], diff:3, exp:"get used TO something — the TO survives at the end.", trap:"The stranded preposition is invisible to many students."},
{id:"c61", s:"He made ____ his mind to apply for the scholarship.", ans:["up"], gt:"adv", tags:["fix","pv"], diff:2, exp:"make UP your mind = decide.", trap:"make OUT / make OVER don’t produce decisions."},
{id:"c62", s:"How long does it ____ to get to the coast from here?", ans:["take"], gt:"vform", tags:["fix"], diff:1, exp:"it TAKES + time — fixed time expression.", trap:"'how long does it last' works for events, not journeys with IT."},
{id:"c63", s:"I couldn’t help ____ when I saw his new haircut.", ans:["laughing","smiling"], gt:"vform", tags:["ger","fix"], diff:3, exp:"can’t help + -ING = can’t stop yourself.", trap:"'couldn’t help to laugh' is the bait."},
{id:"c64", s:"I have ____ idea where she keeps the spare keys.", ans:["no"], gt:"det", tags:["det","fix"], diff:1, exp:"have NO idea = don’t know at all.", trap:"'any idea' needs a negative verb before it."},
{id:"c65", s:"The sooner we book the flights, ____ cheaper they will be.", ans:["the"], gt:"comp", tags:["comp","art"], diff:2, exp:"the + comparative, THE + comparative.", trap:"Second half also needs THE."},
{id:"c66", s:"His second album is far ____ ambitious than his first.", ans:["more","less"], gt:"comp", tags:["comp"], diff:2, exp:"far MORE/LESS + adjective + than.", trap:"'far ambitious' or 'far most' break the comparative."},
{id:"c67", s:"At fifteen, she is already twice ____ tall as her mother.", ans:["as"], gt:"comp", tags:["comp"], diff:3, exp:"twice AS tall AS — multiplier + as…as.", trap:"'twice more tall' calques from other languages."},
{id:"c68", s:"____ matter how hard I try, I can’t roll my Rs.", ans:["no"], gt:"fixphrase", tags:["fix"], diff:3, exp:"NO matter how = however hard.", trap:"'Not matter' / 'Never matter' — the chunk is NO matter."},
{id:"c69", s:"The invitation arrived completely out of ____ blue.", ans:["the"], gt:"fixphrase", tags:["fix","art"], diff:2, exp:"out of THE blue = unexpectedly.", trap:"Articles inside idioms are fixed — no variations allowed."},
{id:"c70", s:"From now ____ , all reports must be submitted online.", ans:["on","onwards"], gt:"fixphrase", tags:["fix"], diff:1, exp:"from now ON = starting now.", trap:"'From now and then' confuses two different idioms."},
{id:"c71", s:"All of a ____ , the lights went out and the music stopped.", ans:["sudden"], gt:"fixphrase", tags:["fix"], diff:2, exp:"all of a SUDDEN = suddenly.", trap:"'all of the sudden' is non-standard."},
{id:"c72", s:"It goes without ____ that mobile phones must be switched off.", ans:["saying"], gt:"fixphrase", tags:["fix","ger"], diff:3, exp:"it goes without SAYING = it’s obvious.", trap:"'without say' / 'without said' — the -ING is fixed."},
{id:"c73", s:"As far as I’m ____ , the proposal is a complete waste of money.", ans:["concerned"], gt:"fixphrase", tags:["fix"], diff:3, exp:"as far as I’m CONCERNED = in my opinion.", trap:"'as far as I’m concern' loses the -ed and the mark."},
{id:"c74", s:"In ____ of fire, do not use the lifts.", ans:["case"], gt:"fixphrase", tags:["fix"], diff:2, exp:"in CASE of + noun = if there is.", trap:"Here OF follows, so it’s the noun version of in case."},
{id:"c75", s:"Preparations for the festival are already well under ____ .", ans:["way"], gt:"fixphrase", tags:["fix"], diff:4, exp:"under WAY = in progress.", trap:"'under work' / 'under going' — the idiom is under way."},
{id:"c76", s:"She turned ____ to be the best manager the club ever had.", ans:["out"], gt:"adv", tags:["pv"], diff:2, exp:"turn OUT to be = prove to be in the end.", trap:"turn UP = arrive; turn OUT = result."},
{id:"c77", s:"Thanks to the new coach, the team’s results are improving little ____ little.", ans:["by"], gt:"fixphrase", tags:["fix"], diff:2, exp:"little BY little = gradually.", trap:"'little to little' / 'little and little' miss the idiom."},
{id:"c78", s:"____ average, students need about 600 hours to reach B2 level.", ans:["on"], gt:"prep", tags:["depprep"], diff:3, exp:"ON average — fixed statistical phrase.", trap:"IN average / AT average are the standard misses."},
{id:"c79", s:"The concert had to be cancelled owing ____ the singer’s illness.", ans:["to"], gt:"prep", tags:["link","prep"], diff:3, exp:"owing TO = because of.", trap:"owing OF mixes it with 'because of'."},
{id:"c80", s:"There’s no point ____ arguing with the referee — he never changes his mind.", ans:["in"], gt:"prep", tags:["fix","ger"], diff:2, exp:"no point IN + -ing.", trap:"TO argue after 'point' is the bait."},
{id:"c81", s:"____ though she’d never acted before, she got the leading role.", ans:["even"], gt:"link", tags:["link"], diff:2, exp:"EVEN though + clause.", trap:"ALTHOUGH can’t combine with though."},
{id:"c82", s:"The meeting went ahead as planned, ____ the chairman’s absence.", ans:["despite"], gt:"link", tags:["link"], diff:3, exp:"DESPITE + noun phrase.", trap:"If you wrote 'in', the phrase would need 'in spite OF'. Despite stands alone."},
];


/* ===== js/data-bank2.js ===== */
/* FCE Mastery — question bank II: Word Formation (Part 3), Multiple-Choice Cloze (Part 1),
   and full exam-style passages for mock tests. */
window.FCE = window.FCE || {};
FCE.BANK = FCE.BANK || {};

/* ---------- Word Formation (stem given in capitals, one word answer) ---------- */
FCE.BANK.wf = [
{id:"w01", s:"Her ____ to adapt to new situations impressed the interviewers.", stem:"ABLE", ans:["ability"], tags:["wfnoun"], diff:1, exp:"able → ability (noun, -ity).", trap:"Check it isn’t negative: the sentence is positive, so not 'inability'."},
{id:"w02", s:"After three ____ attempts, she finally passed her driving test.", stem:"SUCCEED", ans:["unsuccessful"], tags:["wfadj","wfneg"], diff:3, exp:"succeed → successful → UNsuccessful. 'After … finally passed' forces the negative.", trap:"The polarity trap: write 'successful' and you lose the mark."},
{id:"w03", s:"Moving abroad was the best ____ I have ever made.", stem:"DECIDE", ans:["decision"], tags:["wfnoun","spell"], diff:1, exp:"decide → decision (-sion).", trap:"Spelling: deciSion, not decition."},
{id:"w04", s:"The story is told with extraordinary ____ and humour.", stem:"IMAGINE", ans:["imagination"], tags:["wfnoun"], diff:1, exp:"imagine → imagination.", trap:"Not 'imaginations' — abstract noun stays singular here."},
{id:"w05", s:"The market for streaming services has become fiercely ____ .", stem:"COMPETE", ans:["competitive"], tags:["wfadj"], diff:2, exp:"compete → competitive (-itive).", trap:"'competing' is grammatical but weaker — Cambridge wants the adjective."},
{id:"w06", s:"Youth ____ has fallen to its lowest level in a decade.", stem:"EMPLOY", ans:["unemployment"], tags:["wfnoun","wfneg"], diff:3, exp:"'has fallen' + good news = UNemployment falling.", trap:"'employment has fallen' would be bad news — read the logic, not just the gap."},
{id:"w07", s:"There is no ____ proof that the remedy actually works.", stem:"SCIENCE", ans:["scientific"], tags:["wfadj"], diff:1, exp:"science → scientific (-ific).", trap:"Spelling: scien-TI-fic."},
{id:"w08", s:"Surprisingly, the flavour of the dish was completely ____ .", stem:"NATURE", ans:["natural","unnatural"], tags:["wfadj"], diff:2, exp:"nature → natural; 'Surprisingly' allows unnatural too — both accepted here.", trap:"In the real exam, read the surrounding sentences to fix polarity."},
{id:"w09", s:"Climbing without ropes puts climbers in serious ____ .", stem:"DANGEROUS", ans:["danger"], tags:["wfnoun"], diff:2, exp:"Adjective given, noun needed: danger.", trap:"Reverse formation — the stem is not always the shortest form."},
{id:"w10", s:"The ____ of the new runway will double the airport’s capacity.", stem:"LONG", ans:["lengthening"], tags:["wfnoun","wfverb"], diff:4, exp:"long → lengthen → lengthening (the process).", trap:"'length' alone doesn’t fit — the gap needs the action noun."},
{id:"w11", s:"Regular exercise builds both ____ and confidence.", stem:"STRONG", ans:["strength"], tags:["wfnoun","spell"], diff:2, exp:"strong → strength (vowel change).", trap:"Spelling: strenGth — three consonants in a row."},
{id:"w12", s:"The ____ of the tower makes it visible from the whole valley.", stem:"HIGH", ans:["height"], tags:["wfnoun","spell"], diff:2, exp:"high → height.", trap:"Spelling: h-e-i-g-h-t, not 'hight' or 'heighth'."},
{id:"w13", s:"They plan to ____ the main road to four lanes.", stem:"WIDE", ans:["widen"], tags:["wfverb"], diff:2, exp:"wide → widen (verb, -en).", trap:"A verb slot after 'to' — don’t write 'width'."},
{id:"w14", s:"Divers measured the ____ of the lake at its centre.", stem:"DEEP", ans:["depth"], tags:["wfnoun","spell"], diff:2, exp:"deep → depth.", trap:"Spelling: depth, not 'deepth'."},
{id:"w15", s:"To tell the ____ , I never expected to win.", stem:"TRUE", ans:["truth"], tags:["wfnoun"], diff:1, exp:"true → truth; fixed phrase 'to tell the truth'.", trap:"'truly' is the adverb — wrong slot."},
{id:"w16", s:"They had a heated ____ about whose turn it was to pay.", stem:"ARGUE", ans:["argument"], tags:["wfnoun","spell"], diff:2, exp:"argue → argument.", trap:"Spelling: drop the E — arguMent, not 'arguement'."},
{id:"w17", s:"The lift is out of order due to essential ____ work.", stem:"MAINTAIN", ans:["maintenance"], tags:["wfnoun","spell"], diff:3, exp:"maintain → maintenance.", trap:"Spelling: mainTENance — the 'tain' changes to 'ten'."},
{id:"w18", s:"The teacher’s ____ of the rule was admirably clear.", stem:"EXPLAIN", ans:["explanation"], tags:["wfnoun","spell"], diff:2, exp:"explain → explanation.", trap:"Spelling: explAnation — the 'i' disappears."},
{id:"w19", s:"Her ____ of English is almost perfect, apart from a slight accent.", stem:"PRONOUNCE", ans:["pronunciation"], tags:["wfnoun","spell"], diff:3, exp:"pronounce → pronunciation.", trap:"The most famous spelling trap in FCE: pronUnciation, no 'o'."},
{id:"w20", s:"Learning vocabulary requires constant ____ .", stem:"REPEAT", ans:["repetition"], tags:["wfnoun","spell"], diff:3, exp:"repeat → repetition.", trap:"Spelling: repEtition, not 'repeatition'."},
{id:"w21", s:"Pure ____ led her to open the mysterious box.", stem:"CURIOUS", ans:["curiosity"], tags:["wfnoun","spell"], diff:2, exp:"curious → curiosity.", trap:"Drop the U of -ous: curiOsity."},
{id:"w22", s:"He hid his ____ behind a confident smile.", stem:"ANXIOUS", ans:["anxiety"], tags:["wfnoun","spell"], diff:3, exp:"anxious → anxiety.", trap:"anxiety has no 'ous' — the form changes completely."},
{id:"w23", s:"The menu offers a wide ____ of vegetarian dishes.", stem:"VARY", ans:["variety"], tags:["wfnoun"], diff:2, exp:"vary → variety.", trap:"'variation' exists but 'a wide variety of' is the collocation."},
{id:"w24", s:"A daily walk is hugely ____ for your concentration.", stem:"BENEFIT", ans:["beneficial"], tags:["wfadj"], diff:2, exp:"benefit → beneficial.", trap:"'beneficious' doesn’t exist."},
{id:"w25", s:"Buying in bulk is usually more ____ than shopping daily.", stem:"ECONOMY", ans:["economical"], tags:["wfadj"], diff:4, exp:"economical = money-saving. economic = relating to the economy.", trap:"THE classic pair: economic growth / an economical car."},
{id:"w26", s:"The country’s ____ growth slowed sharply last year.", stem:"ECONOMY", ans:["economic"], tags:["wfadj"], diff:4, exp:"economic = of the economy.", trap:"The mirror of w25 — meaning decides the suffix."},
{id:"w27", s:"Who is ____ for booking the rehearsal room this week?", stem:"RESPONSE", ans:["responsible"], tags:["wfadj"], diff:2, exp:"response → responsible.", trap:"-IBLE not -ABLE: responsible."},
{id:"w28", s:"She has an impressive ____ of medieval history.", stem:"KNOW", ans:["knowledge"], tags:["wfnoun","spell"], diff:2, exp:"know → knowledge.", trap:"Spelling: knowLEDGE — d before g."},
{id:"w29", s:"The rapid ____ of the city has put pressure on housing.", stem:"GROW", ans:["growth"], tags:["wfnoun"], diff:1, exp:"grow → growth.", trap:"No E: growth."},
{id:"w30", s:"Our ____ to Buenos Aires was delayed by fog.", stem:"FLY", ans:["flight"], tags:["wfnoun","spell"], diff:1, exp:"fly → flight.", trap:"Irregular formation — not 'flying' in this slot."},
{id:"w31", s:"Going freelance was a brave ____ that paid off.", stem:"CHOOSE", ans:["choice"], tags:["wfnoun","spell"], diff:2, exp:"choose → choice.", trap:"Spelling: choice, not 'choise' or 'chose'."},
{id:"w32", s:"The ____ of the championship final still hurts the fans.", stem:"LOSE", ans:["loss"], tags:["wfnoun","spell"], diff:2, exp:"lose → loss.", trap:"loss (noun) / lose (verb) / loose (adjective) — three different words."},
{id:"w33", s:"The bridge can support a maximum ____ of forty tonnes.", stem:"WEIGH", ans:["weight"], tags:["wfnoun","spell"], diff:1, exp:"weigh → weight.", trap:"Spelling: weiGHt."},
{id:"w34", s:"It is my firm ____ that practice beats talent.", stem:"BELIEVE", ans:["belief"], tags:["wfnoun","spell"], diff:2, exp:"believe → belief.", trap:"The noun loses the final -ve: belief."},
{id:"w35", s:"Old smartphones are rarely ____ after five years of updates.", stem:"RELY", ans:["reliable"], tags:["wfadj","spell"], diff:2, exp:"rely → reliable (y → i).", trap:"reliAble — i before a."},
{id:"w36", s:"Plastic waste causes lasting ____ damage.", stem:"ENVIRONMENT", ans:["environmental"], tags:["wfadj","spell"], diff:1, exp:"environment → environmental.", trap:"Keep the N: environNmental? No — enviroNMENTal, one N before m? Spell it: e-n-v-i-r-o-n-m-e-n-t-a-l."},
{id:"w37", s:"____ , the storm passed before the open-air concert began.", stem:"FORTUNE", ans:["fortunately"], tags:["wfadv"], diff:2, exp:"fortune → fortunately (sentence adverb).", trap:"Polarity check: the news is good, so not 'unfortunately'."},
{id:"w38", s:"____ , the tickets had sold out by the time we arrived.", stem:"LUCK", ans:["unluckily","unfortunately"], tags:["wfadv","wfneg"], diff:3, exp:"Bad news → UNluckily.", trap:"The negative prefix trap in adverb form."},
{id:"w39", s:"These chairs look stylish but are deeply ____ to sit on.", stem:"COMFORT", ans:["uncomfortable"], tags:["wfadj","wfneg"], diff:2, exp:"'but' flips the polarity → UNcomfortable.", trap:"BUT is the signal word for the negative."},
{id:"w40", s:"He drummed his fingers ____ while the page loaded.", stem:"PATIENT", ans:["impatiently"], tags:["wfadv","wfneg"], diff:3, exp:"patient → impatient → impatiently. Double transformation.", trap:"im- before p, AND the -ly: two changes, one word."},
{id:"w41", s:"The actor answered every question with great ____ .", stem:"HONEST", ans:["honesty"], tags:["wfnoun"], diff:2, exp:"honest → honesty.", trap:"'honestity' doesn’t exist."},
{id:"w42", s:"It is ____ to park within ten metres of a junction.", stem:"LEGAL", ans:["illegal"], tags:["wfadj","wfneg"], diff:2, exp:"Rule about NOT doing something → ILlegal (il- before l).", trap:"unlegal/inlegal — the prefix must match the first letter."},
{id:"w43", s:"Finishing the report by Friday is a near ____ .", stem:"POSSIBLE", ans:["impossibility"], tags:["wfnoun","wfneg"], diff:4, exp:"possible → impossible → impossibility: prefix + suffix.", trap:"Double-step words are Cambridge’s favourite hard item."},
{id:"w44", s:"The bus service here is famously ____ .", stem:"REGULAR", ans:["irregular","unreliable"], tags:["wfadj","wfneg"], diff:3, exp:"'famously' + complaint context → IRregular (ir- before r).", trap:"ir- only before r: irregular, irresponsible, irresistible."},
{id:"w45", s:"The smell of fresh bread proved utterly ____ .", stem:"RESIST", ans:["irresistible"], tags:["wfadj","wfneg","spell"], diff:4, exp:"resist → irresistible: ir- prefix AND -ible suffix.", trap:"Double R, then -IBLE: ir-resist-ible."},
{id:"w46", s:"A simple ____ about the dates caused the whole delay.", stem:"UNDERSTAND", ans:["misunderstanding"], tags:["wfnoun","wfneg"], diff:3, exp:"mis- + understanding = wrong understanding.", trap:"MIS- (wrongly), not UN- (not)."},
{id:"w47", s:"The head teacher will not tolerate ____ in class.", stem:"BEHAVE", ans:["misbehaviour","misbehavior"], tags:["wfnoun","wfneg"], diff:3, exp:"behave → misbehaviour.", trap:"'not tolerate' tells you the word is negative."},
{id:"w48", s:"The sudden ____ of the paintings baffled the police.", stem:"APPEAR", ans:["disappearance"], tags:["wfnoun","wfneg"], diff:3, exp:"appear → disappearance ('baffled the police' implies they vanished).", trap:"dis- + appearance; double check -ANCE."},
{id:"w49", s:"Despite the rain, the players showed no ____ to leave the pitch.", stem:"WILLING", ans:["unwillingness","willingness"], tags:["wfnoun","wfneg"], diff:4, exp:"'no willingness to leave' = they wanted to stay; 'no unwillingness' double-negates awkwardly — Cambridge would accept willingness.", trap:"When NO precedes the gap, the noun itself usually stays positive."},
{id:"w50", s:"You need the manager’s ____ before ordering new stock.", stem:"APPROVE", ans:["approval"], tags:["wfnoun"], diff:2, exp:"approve → approval.", trap:"-AL noun: approval, arrival, refusal."},
{id:"w51", s:"Her ____ in the final round earned a standing ovation.", stem:"PERFORM", ans:["performance"], tags:["wfnoun"], diff:1, exp:"perform → performance.", trap:"-ANCE not -ENCE: performance."},
{id:"w52", s:"____ at the workshop is optional but recommended.", stem:"ATTEND", ans:["attendance"], tags:["wfnoun"], diff:2, exp:"attend → attendance.", trap:"-ANCE again — attendance."},
{id:"w53", s:"The two countries finally reached an ____ on fishing rights.", stem:"AGREE", ans:["agreement"], tags:["wfnoun"], diff:1, exp:"agree → agreement.", trap:"If the sentence had been about conflict, DISagreement — always check."},
{id:"w54", s:"Thick fog reduced ____ to less than fifty metres.", stem:"VISIBLE", ans:["visibility"], tags:["wfnoun"], diff:2, exp:"visible → visibility.", trap:"-ITY noun from -IBLE adjective."},
{id:"w55", s:"The hotel apologised for the ____ caused by the building work.", stem:"CONVENIENT", ans:["inconvenience"], tags:["wfnoun","wfneg"], diff:3, exp:"'apologised for' → something bad → INconvenience.", trap:"Negative prefix + noun suffix: in-convenien-ce."},
{id:"w56", s:"Sales figures grew ____ during the holiday season.", stem:"DRAMA", ans:["dramatically"], tags:["wfadv","spell"], diff:3, exp:"drama → dramatic → dramatically.", trap:"-ic → -ically: dramatICALLY, not 'dramaticly'."},
{id:"w57", s:"____ , the museum is closed on the only day I’m free.", stem:"FORTUNE", ans:["unfortunately"], tags:["wfadv","wfneg"], diff:2, exp:"Bad news → UNfortunately.", trap:"Compare w37 — same stem, opposite polarity. Context is everything."},
{id:"w58", s:"The team’s ____ to detail is what wins them contracts.", stem:"ATTEND", ans:["attention"], tags:["wfnoun"], diff:3, exp:"attend → attention (attention to detail).", trap:"Same stem as w52, different noun — collocation decides: attention to detail."},
];

/* ---------- Multiple-Choice Cloze (Part 1 style) ---------- */
FCE.BANK.mcc = [
{id:"m01", s:"I’m afraid I ____ a serious mistake in the booking.", opts:["did","made","took","put"], cor:1, tags:["col","fix"], diff:1, exp:"MAKE a mistake — core collocation.", trap:"DO is the eternal bait with mistake/decision/effort."},
{id:"m02", s:"____ rain forced the organisers to move the ceremony indoors.", opts:["Strong","Hard","Heavy","Powerful"], cor:2, tags:["col"], diff:1, exp:"HEAVY rain (also heavy traffic, heavy smoker).", trap:"STRONG collocates with wind and coffee, not rain."},
{id:"m03", s:"Could you make me a cup of really ____ coffee?", opts:["heavy","strong","powerful","deep"], cor:1, tags:["col"], diff:1, exp:"STRONG coffee.", trap:"The mirror of m02 — swap the partners and both fail."},
{id:"m04", s:"If you don’t wear a scarf, you’ll ____ a cold.", opts:["take","catch","get on","win"], cor:1, tags:["col"], diff:1, exp:"CATCH a cold (illnesses are caught).", trap:"'take a cold' calques from several languages."},
{id:"m05", s:"Hurry up or we’ll ____ the last bus home.", opts:["lose","miss","fail","skip"], cor:1, tags:["col"], diff:1, exp:"MISS the bus/train/flight.", trap:"LOSE the bus is the classic L1 transfer error."},
{id:"m06", s:"Whatever happens, always ____ the truth.", opts:["say","speak","tell","talk"], cor:2, tags:["col","fix"], diff:1, exp:"TELL the truth (also tell a lie, tell a story).", trap:"SAY the truth — wrong partner."},
{id:"m07", s:"Despite months of therapy, the rumour did lasting ____ to her career.", opts:["damage","hurt","wound","break"], cor:0, tags:["col"], diff:3, exp:"DO damage (do harm, do good).", trap:"All four 'mean' injury; only damage partners with DO."},
{id:"m08", s:"The students have ____ remarkable progress this term.", opts:["done","made","taken","given"], cor:1, tags:["col"], diff:1, exp:"MAKE progress.", trap:"DO progress is the bait — progress is created, so MAKE."},
{id:"m09", s:"The award ceremony will ____ place in the town hall.", opts:["take","have","get","hold"], cor:0, tags:["fix"], diff:1, exp:"TAKE place = happen.", trap:"HOLD an event is fine, but the fixed phrase is take place."},
{id:"m10", s:"After hours of negotiation, the two sides finally ____ an agreement.", opts:["arrived","reached","got","came"], cor:1, tags:["col"], diff:2, exp:"REACH an agreement (also reach a decision/conclusion).", trap:"ARRIVE AT an agreement needs AT; bare 'arrived' fails."},
{id:"m11", s:"She ____ the world record by almost half a second.", opts:["beat","won","broke","defeated"], cor:2, tags:["col"], diff:2, exp:"BREAK a record.", trap:"You BEAT people, WIN prizes, BREAK records."},
{id:"m12", s:"Whatever you promised, you must ____ your word.", opts:["hold","keep","stay","save"], cor:1, tags:["col","fix"], diff:2, exp:"KEEP your word/promise.", trap:"HOLD your word — almost right, completely wrong."},
{id:"m13", s:"He ____ his temper when the referee ignored the foul.", opts:["lost","missed","dropped","broke"], cor:0, tags:["col","fix"], diff:2, exp:"LOSE your temper = get angry.", trap:"BREAK your temper doesn’t exist."},
{id:"m14", s:"The school fair ____ over two thousand euros for charity.", opts:["raised","rose","lifted","earned"], cor:0, tags:["col"], diff:2, exp:"RAISE money (for charity).", trap:"RISE is intransitive — it can’t take an object."},
{id:"m15", s:"It’s getting harder to ____ a living as a freelance photographer.", opts:["win","gain","earn","make do"], cor:2, tags:["col","fix"], diff:2, exp:"EARN a living (also make a living).", trap:"WIN a living — money is earned, not won."},
{id:"m16", s:"I didn’t ____ the joke until everyone had stopped laughing.", opts:["catch","get","take","realise"], cor:1, tags:["col","pv"], diff:2, exp:"GET a joke = understand it.", trap:"REALISE needs a clause, and you don’t 'catch' jokes in standard usage."},
{id:"m17", s:"The committee ____ to a unanimous conclusion after midnight.", opts:["came","reached","arrived","drew"], cor:0, tags:["col","prep"], diff:3, exp:"COME TO a conclusion (the TO is already in the sentence).", trap:"REACH a conclusion is right WITHOUT 'to' — the preposition decides."},
{id:"m18", s:"My grandparents ____ me up while my parents worked abroad.", opts:["grew","brought","raised up","carried"], cor:1, tags:["pv"], diff:2, exp:"BRING somebody UP = raise a child.", trap:"GROW UP is what the child does; RAISE never takes 'up'."},
{id:"m19", s:"This song always ____ me of our summer in Galicia.", opts:["remembers","reminds","recalls","memorises"], cor:1, tags:["col"], diff:2, exp:"REMIND somebody OF something.", trap:"REMEMBER can’t take a person + of: things remind YOU."},
{id:"m20", s:"The new tax will mainly ____ small online businesses.", opts:["effect","affect","afflict","infect"], cor:1, tags:["col","spell"], diff:3, exp:"AFFECT (verb) = have an effect on.", trap:"EFFECT is the noun; the verb slot wants affect."},
{id:"m21", s:"The team’s confidence ____ after the third straight defeat.", opts:["sank","drowned","dipped under","descended"], cor:0, tags:["col"], diff:4, exp:"Confidence/spirits SANK.", trap:"All options are 'go down' words; only sink collocates with confidence."},
{id:"m22", s:"We had great ____ finding a parking space near the stadium.", opts:["problem","difficulty","obstacle","effort"], cor:1, tags:["col","ger"], diff:3, exp:"have difficulty + -ing.", trap:"'great problem' would need 'a'; difficulty is uncountable here."},
{id:"m23", s:"The travel agency ____ us a full refund for the cancelled tour.", opts:["proposed","suggested","offered","invited"], cor:2, tags:["ger","col"], diff:2, exp:"OFFER somebody something.", trap:"SUGGEST never takes person + object: 'suggested us' is impossible."},
{id:"m24", s:"The doctor ____ him to cut down on sugary drinks.", opts:["said","suggested","advised","insisted"], cor:2, tags:["rep","ger"], diff:2, exp:"ADVISE somebody TO do.", trap:"SAY and INSIST can’t take object + to-infinitive."},
{id:"m25", s:"They ____ us from entering the site without helmets.", opts:["avoided","prevented","refused","forbade to"], cor:1, tags:["prep","rep"], diff:3, exp:"PREVENT somebody FROM + -ing.", trap:"AVOID takes -ing but no object+from; the FROM in the sentence decides."},
{id:"m26", s:"He flatly ____ to apologise for the comment.", opts:["denied","refused","rejected","resisted"], cor:1, tags:["ger","rep"], diff:3, exp:"REFUSE TO do.", trap:"DENY + -ing (deny doing); refuse + to — the TO in the sentence is the clue."},
{id:"m27", s:"She ____ ever having seen the document before.", opts:["refused","denied","rejected","disagreed"], cor:1, tags:["ger","rep"], diff:3, exp:"DENY + -ing (having seen).", trap:"The mirror of m26 — the -ING after the gap is the clue."},
{id:"m28", s:"I’ll lend you my notes ____ you photocopy them today.", opts:["unless","in case","provided","whether"], cor:2, tags:["cond","link"], diff:3, exp:"PROVIDED (that) = on condition that.", trap:"UNLESS would reverse the logic; IN CASE is preparation, not condition."},
{id:"m29", s:"Take some cash ____ the card machine isn’t working.", opts:["unless","in case","so that","provided"], cor:1, tags:["cond","link"], diff:3, exp:"IN CASE = as a precaution.", trap:"SO THAT expresses purpose, not precaution."},
{id:"m30", s:"____ the high price, the concert sold out in minutes.", opts:["Although","Despite","Even though","However"], cor:1, tags:["link"], diff:2, exp:"DESPITE + noun phrase.", trap:"Although/even though need a clause with a verb."},
{id:"m31", s:"I had ____ finished dinner when the doorbell rang.", opts:["yet","hardly","almost not","nearly not"], cor:1, tags:["fix","inv"], diff:3, exp:"HARDLY = only just.", trap:"'almost not finished' is not natural English."},
{id:"m32", s:"____ to the forecast, the heatwave will break on Friday.", opts:["According","Regarding","Referring","Depending"], cor:0, tags:["depprep","link"], diff:2, exp:"ACCORDING to = as stated by.", trap:"All four take TO, but only ACCORDING reports a source."},
{id:"m33", s:"We left at dawn ____ to avoid the holiday traffic.", opts:["for","so as","in order that","because"], cor:1, tags:["link","ger"], diff:3, exp:"SO AS to + infinitive = purpose.", trap:"IN ORDER THAT needs a clause; the TO after the gap decides."},
{id:"m34", s:"The instructions were ____ confusing that nobody finished the task.", opts:["such","so","too","very"], cor:1, tags:["comp","det"], diff:2, exp:"SO + adjective + that.", trap:"SUCH needs a noun; TOO doesn’t combine with that-clauses."},
{id:"m35", s:"It was ____ a tense match that I could barely watch.", opts:["so","such","too","quite"], cor:1, tags:["comp","det"], diff:2, exp:"SUCH + a + adjective + noun + that.", trap:"The mirror of m34 — the noun 'match' demands SUCH."},
{id:"m36", s:"You can ____ my number from reception if you lose it.", opts:["lend","borrow","get","rent"], cor:2, tags:["col"], diff:2, exp:"GET information from somewhere.", trap:"BORROW/LEND apply to things you return — not phone numbers."},
{id:"m37", s:"Could you ____ me your charger until lunchtime?", opts:["borrow","lend","rent","loan to"], cor:1, tags:["col"], diff:1, exp:"LEND = give temporarily (lender’s side).", trap:"BORROW is the receiver’s verb: I borrow FROM you, you lend TO me."},
{id:"m38", s:"The museum was ____ interesting than the guidebook suggested.", opts:["very","far more","much","most"], cor:1, tags:["comp"], diff:2, exp:"FAR MORE + adjective + than.", trap:"'much interesting' lacks MORE; 'very' can’t modify a comparative."},
{id:"m39", s:"The view from the lighthouse simply ____ our breath away.", opts:["took","caught","stole","blew"], cor:0, tags:["fix"], diff:2, exp:"TAKE your breath away = amaze.", trap:"BLEW is tempting via 'blew us away' — but breath pairs with TAKE."},
{id:"m40", s:"I’m not in the ____ for a party tonight, honestly.", opts:["feeling","spirit","mood","sense"], cor:2, tags:["fix"], diff:2, exp:"be in the MOOD for = feel like.", trap:"SPIRIT(S) is about morale, not desire."},
{id:"m41", s:"The startup went ____ after barely a year of trading.", opts:["broke","bankrupt","poor","penniless"], cor:1, tags:["col"], diff:3, exp:"GO BANKRUPT (companies).", trap:"GO BROKE is informal/personal; companies go bankrupt."},

window.FCE = window.FCE || {};
(function(){
var E = FCE.engine = {};
var KEY = 'fce-mastery-state-v1';
var DAY = 86400000;

/* ---------------- state ---------------- */
E.blank = function(){

    xp:0, streak:{count:0, last:''}, badges:[], records:{bestRun:0, bestAcc:0, total:0},
    week:{id:'', counts:{}},
    ability:{kwt:1150, cloze:1150, wf:1150, mcc:1150},
    tags:{}, items:{}, gaps:{},
    calib:{g:{att:0,cor:0}, f:{att:0,cor:0}, s:{att:0,cor:0}},
    log:[], sessions:[], mocks:[], trend:[],
    passSeen:{},
    beh:{ n:0, ttfkSum:0, editSum:0, pauseSum:0, changed:0, changedRight:0, selfCorrect:0, hiddenHesit:0, fluentSure:0, skips:0, fastRight:0 },
    boost:{},            // tag -> remaining reinforcement count (error generalization)
    wants:{},            // itemId -> {t, tag, cleared:0} — "I want to master this"
    accepts:{},          // itemId -> [extra accepted answers] (user reported "I was right")
    reports:[],          // {t,id,user} app-mistake reports

E.state = null;
E.load = function(){

  }catch(e){ E.state = E.blank(); }
  if(!E.state.v) E.state = E.blank();
  var b = E.blank(); // migrate forward: fill anything missing
  Object.keys(b).forEach(function(k){ if(E.state[k] === undefined) E.state[k] = b[k]; });
  ['boost','wants','accepts','passSeen','spellSeen'].forEach(function(k){ if(!E.state[k]) E.state[k]={}; });
  if(!E.state.spell) E.state.spell = {pat:{}, words:{}};

E.save = function(){ try{ localStorage.setItem(KEY, JSON.stringify(E.state)); }catch(e){} };
E.reset = function(){ E.state = E.blank(); E.save(); };

E.import = function(json){ var s = JSON.parse(json); if(!s || !s.v) throw new Error('bad file'); E.state = s; E.load2(); E.save(); };
E.load2 = function(){ var b=E.blank(); Object.keys(b).forEach(function(k){ if(E.state[k]===undefined) E.state[k]=b[k]; }); };

/* ---------------- bank access ---------------- */
E.allItems = function(){

  B.kwt.forEach(function(q){ out.push({q:q, type:'kwt'}); });
  B.cloze.forEach(function(q){ out.push({q:q, type:'cloze'}); });
  B.wf.forEach(function(q){ out.push({q:q, type:'wf'}); });
  B.mcc.forEach(function(q){ out.push({q:q, type:'mcc'}); });
  return out;
};
E.byId = {};
E.indexBank = function(){ E.allItems().forEach(function(it){ E.byId[it.q.id] = it; }); };
E.itemState = function(id){
  var s = E.state.items[id];
  if(!s){ s = E.state.items[id] = {att:0,cor:0,last:0,due:0,ivl:0,ease:2.3,lapses:0,conf:'',hist:[]}; }
  if(!s.hist) s.hist = [];

  if(!s){ s = E.state.tags[tag] = {att:0,cor:0,m:0.5,last:0,lapses:0,causes:{},hist:[]}; }
  return s;
};

/* ---------------- normalization & grading ---------------- */
E.norm = function(s){
  return String(s||'').toLowerCase()
    .replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"')
    .replace(/\s+/g,' ').trim()
    .replace(/[.!?,;:]+$/g,'').trim();
};
E.wordCount = function(s){
  var t = E.norm(s); if(!t) return 0;
  var toks = t.split(' '), n = 0;
  toks.forEach(function(w){ n += 1; if(/[a-z]'(t|s|ll|re|ve|d|m)\b/.test(w)) n += 1; });
  return n;

function userAccepts(q, u){
  var ex = E.state.accepts[q.id];
  return !!(ex && ex.indexOf(u) !== -1);
}
E.gradeKWT = function(q, user){
  var u = E.norm(user);
  var full = q.ans.some(function(a){ return E.norm(a) === u; }) || userAccepts(q, u);
  if(full) return {score:2, ok:true};
  var hits = 0;
  q.halves.forEach(function(h){
    if(h.some(function(a){ return u.indexOf(E.norm(a)) !== -1; })) hits++;
  });
  return {score: hits >= 1 ? 1 : 0, ok:false};
};
E.gradeOne = function(q, user){
  var u = E.norm(user);
  return q.ans.some(function(a){ return E.norm(a) === u; }) || userAccepts(q, u);
};

/* ---------------- answer diagnosis (what KIND of wrong was it?) ---------------- */
E.lev = function(a, b){
  a = String(a); b = String(b);
  if(Math.abs(a.length-b.length) > 3) return 99;
  var m = [], i, j;
  for(i=0;i<=b.length;i++) m[i]=[i];
  for(j=0;j<=a.length;j++) m[0][j]=j;
  for(i=1;i<=b.length;i++) for(j=1;j<=a.length;j++)
    m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1] + (b[i-1]===a[j-1]?0:1));
  return m[b.length][a.length];
};
E.classOf = function(w){
  w = E.norm(w);
  var order = ['art','modal','aux','rel','pron','det','comp','prep','advpart','link'];
  for(var i=0;i<order.length;i++){
    if(FCE.WORDCLASS[order[i]].indexOf(w) !== -1) return order[i];
  }
  return null;
};
function stemOverlap(a, b){
  var n = 0, L = Math.min(a.length, b.length);
  while(n < L && a[n] === b[n]) n++;
  return n;
}
/* Returns {code, msg, right} — codes: blank | spell | family | class | key | half | wrong */
E.diagnose = function(q, type, user){
  var u = E.norm(user);
  var best = E.norm(q.ans[0]);
  if(!u) return {code:'blank', msg:'Left blank — in the real exam ALWAYS write something; blanks score zero with certainty.', right:best};

    var hits = 0;
    q.halves.forEach(function(h){ if(h.some(function(a){ return u.indexOf(E.norm(a)) !== -1; })) hits++; });
    if(hits === 1) return {code:'half', msg:'Half right — one of the two marking chunks is there. In the exam this earns 1 of 2 marks.', right:best};
    return {code:'wrong', msg:'', right:best};
  }
  // single-word answers (cloze / wf)
  var bestDist = 99, bestAns = best;
  q.ans.forEach(function(a){
    var d = E.lev(u, E.norm(a));
    if(d < bestDist){ bestDist = d; bestAns = E.norm(a); }
  });
  var tol = bestAns.length >= 7 ? 2 : 1;
  if(bestDist > 0 && bestDist <= tol)
    return {code:'spell', msg:'You had the right word — the spelling betrayed you: “'+user.trim()+'” → “'+bestAns+'”. At Cambridge, spelling is all-or-nothing.', right:bestAns};
  var ov = stemOverlap(u, bestAns);
  if(ov >= 4 && Math.abs(u.length - bestAns.length) <= 5)
    return {code:'family', msg:'Right word family, wrong form: “'+user.trim()+'” vs “'+bestAns+'”. Re-read the sentence — what part of speech does the gap demand?', right:bestAns};
  if(type === 'cloze' && q.gt && FCE.GT2CLASS[q.gt]){
    var need = FCE.GT2CLASS[q.gt], got = E.classOf(u);
    if(got && got !== need)
      return {code:'class', msg:'You wrote a '+FCE.CLASSNAMES[got]+' (“'+user.trim()+'”), but this gap needs a '+FCE.CLASSNAMES[need]+'. Look at the words either side of the gap.', right:bestAns};
  }
  return {code:'wrong', msg:'', right:bestAns};
};
/* Spelling error pattern classifier */
E.spellPattern = function(wrong, right){
  wrong = E.norm(wrong); right = E.norm(right);
  function squash(s){ return s.replace(/(.)\1+/g,'$1'); }
  if(squash(wrong) === squash(right)) return {id:'double', name:'double letters', tip:'Your enemy is the double letter (occurrence, beginning, necessary). Say the word slowly and tap each doubled letter twice.'};
  if(wrong.replace(/ie/g,'ei') === right || wrong.replace(/ei/g,'ie') === right) return {id:'ie', name:'ie / ei order', tip:'I before E except after C — and learn the rebels (foreign, height) by heart.'};
  if(wrong.replace(/tion/g,'sion') === right || wrong.replace(/sion/g,'tion') === right) return {id:'tion', name:'-tion vs -sion', tip:'decide→decision, explain→explanation: the verb’s final sound usually decides T or S.'};
  var wv = wrong.replace(/[aeiou]/g,'•'), rv = right.replace(/[aeiou]/g,'•');
  if(wv === rv && wrong !== right) return {id:'vowel', name:'weak vowel choice', tip:'Unstressed vowels all sound like “uh” (separate, definite). Anchor the letter visually: sep-A-rate has A RAT in it.'};
  if(wrong.length === right.length - 1 && right.indexOf('e') !== -1) return {id:'silente', name:'dropped letters', tip:'A letter is going missing — usually a silent E or a quiet N (government). Write the word out by hand, slowly, once.'};
  if(wrong.length === right.length && squash(wrong) !== wrong) return {id:'double', name:'double letters', tip:'Check which letter doubles — and which doesn’t (until has one L).'};
  return {id:'other', name:'letter order / shape', tip:'Photograph the word: write it large, circle the danger zone, then write it twice from memory.'};
};

/* ---------------- Elo, mastery, forgetting ---------------- */
E.qElo = function(q){ return 950 + (q.diff||2)*110; };
E.pWin = function(ability, qe){ return 1/(1+Math.pow(10,(qe-ability)/400)); };
E.updAbility = function(type, q, ok){
  var a = E.state.ability, n = E.state.records.total;
  var k = n < 30 ? 40 : (n < 120 ? 28 : 18);
  var p = E.pWin(a[type], E.qElo(q));
  a[type] = Math.max(700, Math.min(1700, a[type] + k*((ok?1:0)-p)));
};
E.recordTag = function(tag, ok, weight){
  var t = E.tagState(tag);
  t.att++; if(ok) t.cor++;
  var alpha = Math.min(0.5, Math.max(0.12, 1/(t.att)) * (weight||1));
  t.m = Math.max(0, Math.min(1, t.m + alpha*((ok?1:0) - t.m)));
  // Bayesian track: Beta(a,b) posterior — gives the coach calibrated uncertainty
  t.a = (t.a||1) + (weight||1)*(ok?1:0);
  t.b = (t.b||1) + (weight||1)*(ok?0:1);
  if(!ok) t.lapses++;
  t.last = Date.now();
  t.hist.push(ok?1:0); if(t.hist.length>30) t.hist.shift();
};
/* Beta posterior with time-decay toward the prior (unused skills become uncertain again) */
E.mBeta = function(tag){
  var t = E.state.tags[tag];
  if(!t || !t.att) return {mean:0.5, sd:0.29, n:0};
  var days = (Date.now()-t.last)/DAY;
  var f = Math.exp(-days/14);
  var a = 1 + ((t.a||1)-1)*f, b = 1 + ((t.b||1)-1)*f;
  var mean = a/(a+b);
  var sd = Math.sqrt(a*b/((a+b)*(a+b)*(a+b+1)));
  return {mean:mean, sd:sd, n:t.att};
};
var gaussSpare = null;
function gauss(){
  if(gaussSpare !== null){ var s = gaussSpare; gaussSpare = null; return s; }
  var u = 0, v = 0;
  while(u === 0) u = Math.random();
  while(v === 0) v = Math.random();
  var r = Math.sqrt(-2*Math.log(u));
  gaussSpare = r*Math.sin(2*Math.PI*v);
  return r*Math.cos(2*Math.PI*v);
}
E.mEff = function(tag){
  var t = E.state.tags[tag];
  if(!t || !t.att) return null;
  var days = (Date.now()-t.last)/DAY;
  return 0.5 + (t.m-0.5)*Math.exp(-days/12);
};
E.tagTrend = function(tag){
  var t = E.state.tags[tag];
  if(!t || t.hist.length < 6) return 0;
  var h = t.hist, mid = Math.floor(h.length/2);
  var a = h.slice(0,mid), b = h.slice(mid);
  return b.reduce(function(x,y){return x+y;},0)/b.length - a.reduce(function(x,y){return x+y;},0)/a.length;
};

/* ---------------- expected pace ---------------- */
E.par = function(type, diff){
  var base = {mcc:35, cloze:35, wf:35, kwt:60}[type] || 40;
  return Math.round(base * (0.75 + 0.125*(diff||3)));
};

/* ---------------- spaced repetition ---------------- */
E.schedule = function(id, ok, conf, fast){
  var it = E.itemState(id), now = Date.now();
  if(ok){
    var lucky = (conf === 'g');
    if(it.ivl === 0) it.ivl = lucky ? 0.25 : (fast ? 1.6 : 1);
    else it.ivl = Math.min(15, it.ivl * (lucky ? 1.2 : it.ease) * (fast ? 1.15 : 1));
    it.ease = Math.min(2.8, it.ease + (conf==='s' ? 0.08 : 0.02));
  }else{
    it.lapses++; it.ivl = 0.2;
    it.ease = Math.max(1.4, it.ease - (conf==='s' ? 0.3 : 0.18));
  }
  it.due = now + it.ivl*DAY;
};
E.dueItems = function(){
  var now = Date.now(), out = [];
  Object.keys(E.state.items).forEach(function(id){
    var it = E.state.items[id];
    if(it.att > 0 && it.due && it.due <= now && E.byId[id]) out.push(id);
  });
  out.sort(function(a,b){ return E.state.items[a].due - E.state.items[b].due; });
  return out;
};
E.leeches = function(){
  return Object.keys(E.state.items).filter(function(id){
    var it = E.state.items[id];
    return it.lapses >= 3 && E.byId[id];
  });
};
/* wobbly = right-wrong-right-wrong pattern: it isn't sticking */
E.isWobbly = function(id){
  var it = E.state.items[id];
  if(!it || !it.hist || it.hist.length < 3) return false;
  var flips = 0;
  for(var i=1;i<it.hist.length;i++) if(it.hist[i] !== it.hist[i-1]) flips++;
  return flips >= 2 && it.hist.indexOf(0) !== -1;
};

/* ---------------- behavioural confidence inference ---------------- */
E.inferConf = function(beh, ms, parMs){
  if(!beh) return 'f';
  var hesit = (beh.ttfk||0) > 4000 || (beh.edits||0) >= 6 || (beh.pauses||0) >= 2 || beh.changed;
  var fluent = (beh.ttfk||0) > 0 && (beh.ttfk||0) < 2600 && (beh.edits||0) <= 1 && !beh.changed && ms < parMs;
  if(fluent) return 's';
  if(hesit) return 'g';
  return 'f';
};

/* ---------------- the master record call ---------------- */
E.record = function(q, type, ok, conf, ms, user, cause, opts){
  opts = opts || {};
  var st = E.state, now = Date.now();
  var parMs = E.par(type, q.diff) * 1000;
  var beh = opts.beh;
  var declared = !!conf;
  var effConf = conf || E.inferConf(beh, ms||parMs, parMs);
  var fast = ok && ms > 0 && ms < parMs*0.8 && (!beh || (beh.edits||0) <= 1);

  var w = 1;
  if(!ok && effConf==='s') w = 1.3;
  if(ok && effConf==='g') w = 0.5;
  if(fast) w *= 1.1;
  (q.tags||[]).forEach(function(t){ E.recordTag(t, ok, w); });

  if(type==='cloze' && q.gt){
    var g = st.gaps[q.gt] || (st.gaps[q.gt]={att:0,cor:0,recent:[]});
    g.att++; if(ok) g.cor++;
    g.recent.push(ok?1:0); if(g.recent.length>14) g.recent.shift();
  }
  var it = E.itemState(q.id);
  it.att++; if(ok) it.cor++; it.last = now; it.conf = effConf;
  it.hist.push(ok?1:0); if(it.hist.length>10) it.hist.shift();
  E.schedule(q.id, ok, effConf, fast);
  E.updAbility(type, q, ok);
  if(declared && st.calib[conf]){ st.calib[conf].att++; if(ok) st.calib[conf].cor++; }

  var entry = {t:now, id:q.id, type:type, tags:q.tags||[], gt:q.gt||'', ok:ok?1:0,
               conf:declared?conf:'', iconf:effConf, ms:ms||0, cause:cause||'', user:String(user||'').slice(0,80)};
  if(opts.diag) entry.diag = opts.diag.code;
  if(beh){
    entry.beh = beh;
    var B = st.beh;
    B.n++; B.ttfkSum += beh.ttfk||0; B.editSum += beh.edits||0; B.pauseSum += beh.pauses||0;
    if(beh.skipped) B.skips++;
    if(beh.changed){
      B.changed++;
      if(beh.firstRight && !ok) B.changedRight++;
      if(!beh.firstRight && ok) B.selfCorrect++;
    }
    var hes = (beh.ttfk||0) > 4000 || (beh.edits||0) >= 6 || (beh.pauses||0) >= 2;
    if(declared && conf==='s' && hes) B.hiddenHesit++;
    if(declared && conf==='g' && !hes && !beh.changed && ok) B.fluentSure++;
    if(fast) B.fastRight++;
    if(ok && hes){ it.ivl = Math.max(0.2, it.ivl*0.8); it.due = now + it.ivl*DAY; }
  }
  st.log.push(entry);
  if(st.log.length > 1500) st.log = st.log.slice(-1200);

  /* spelling intelligence */
  if(opts.diag && opts.diag.code === 'spell'){
    var sp = E.spellPattern(user, opts.diag.right);
    st.spell.pat[sp.id] = (st.spell.pat[sp.id]||0)+1;
    st.spell.words[opts.diag.right] = (st.spell.words[opts.diag.right]||0)+1;
    entry.cause = entry.cause || 'spell';
    var ts0 = q.tags||[]; ts0.forEach(function(t){ var s2=E.tagState(t); s2.causes.spell=(s2.causes.spell||0)+1; });
  }

  /* error generalization: a miss boosts the CONCEPT, so the idea returns in NEW exercises */
  if(!ok){
    (q.tags||[]).slice(0,2).forEach(function(t){
      st.boost[t] = Math.min(9, (st.boost[t]||0) + (E.isWobbly(q.id) ? 4 : 3));
    });
  } else {
    // wants clearing: a wanted item answered correctly twice in a row clears
    var wnt = st.wants[q.id];
    if(wnt){
      wnt.cleared = (wnt.cleared||0)+1;
      if(wnt.cleared >= 2){
        delete st.wants[q.id];
        var clearedCount = (st.wantsCleared = (st.wantsCleared||0)+1);
        if(clearedCount >= 3) E.award('wants');
        if(FCE.ui && FCE.ui.toast) FCE.ui.toast('🎯 Mastered: that one is off your Mastery List.');
      }
    }
  }

  st.records.total++;
  if(ok){ st.xp += 8 + (q.diff||2)*4 + (fast?4:0) + (effConf==='s'&&declared?3:0); } else { st.xp += 2; }
  E.touchStreak();
  E.bumpWeek(type, ok);
  if(!opts.quiet){ E.checkBadges(opts.runStreak||0); }
  E.save();
  return {fast:fast, effConf:effConf, declared:declared};
};
E.setCause = function(cause){
  var l = E.state.log[E.state.log.length-1];
  if(!l || l.ok) return;
  l.cause = cause;
  (l.tags||[]).forEach(function(t){
    var ts = E.tagState(t);
    ts.causes[cause] = (ts.causes[cause]||0)+1;
  });
  E.save();
};

/* "I was actually right" — accept the user's answer, repair the stats, log a report */
E.amend = function(qid){
  var st = E.state;
  var l = null;
  for(var i=st.log.length-1;i>=0;i--){ if(st.log[i].id===qid){ l = st.log[i]; break; } }
  if(!l || l.ok) return false;
  var u = E.norm(l.user);
  if(!u) return false;
  l.ok = 1; l.amended = true;
  (st.accepts[qid] = st.accepts[qid] || []).push(u);
  st.reports.push({t:Date.now(), id:qid, user:l.user});
  (l.tags||[]).forEach(function(t){
    var ts = E.tagState(t);
    ts.cor++; ts.lapses = Math.max(0, ts.lapses-1);
    ts.m = Math.min(1, ts.m + 0.25*(1-ts.m));
    if(ts.hist.length) ts.hist[ts.hist.length-1] = 1;
  });
  var it = E.itemState(qid);
  it.cor++; it.lapses = Math.max(0, it.lapses-1);
  if(it.hist.length) it.hist[it.hist.length-1] = 1;
  it.ivl = 2; it.due = Date.now() + 2*DAY;
  if(l.gt && st.gaps[l.gt]){ st.gaps[l.gt].cor++; if(st.gaps[l.gt].recent.length) st.gaps[l.gt].recent[st.gaps[l.gt].recent.length-1]=1; }
  (l.tags||[]).slice(0,2).forEach(function(t){ if(st.boost[t]) st.boost[t] = Math.max(0, st.boost[t]-2); });
  st.xp += 12;
  E.save();
  return true;
};

/* "I want to master this" */
E.addWant = function(qid){
  var it = E.byId[qid]; if(!it) return;
  E.state.wants[qid] = {t:Date.now(), tag:(it.q.tags||[])[0]||'', cleared:0};
  (it.q.tags||[]).slice(0,2).forEach(function(t){
    E.state.boost[t] = Math.min(10, (E.state.boost[t]||0) + 5);
  });
  E.save();
};

/* ---------------- streak / week / badges ---------------- */
E.today = function(){ return new Date().toISOString().slice(0,10); };
E.touchStreak = function(){
  var s = E.state.streak, today = E.today();
  if(s.last === today) return;
  var y = new Date(Date.now()-DAY).toISOString().slice(0,10);
  s.count = (s.last === y) ? s.count+1 : 1;
  s.last = today;
};
E.weekId = function(){
  var d = new Date(); var onejan = new Date(d.getFullYear(),0,1);
  var wk = Math.ceil((((d - onejan)/DAY) + onejan.getDay()+1)/7);
  return d.getFullYear()+'-'+wk;
};
E.challenge = function(){
  var wid = E.weekId();
  if(E.state.week.id !== wid){ E.state.week = {id:wid, counts:{}}; }
  var list = FCE.CHALLENGES;
  var idx = parseInt(wid.split('-')[1],10) % list.length;
  var ch = list[idx];
  var c = E.state.week.counts;
  var prog = ch.type==='correct' ? (c.correct||0) : (c[ch.type]||0);
  return {ch:ch, prog:Math.min(prog, ch.n), done:prog>=ch.n};
};
E.bumpWeek = function(type, ok){
  E.challenge();
  var c = E.state.week.counts;
  c[type] = (c[type]||0)+1;
  if(ok) c.correct = (c.correct||0)+1;
};
E.award = function(id){
  if(E.state.badges.indexOf(id) !== -1) return false;
  E.state.badges.push(id);
  var b = FCE.BADGES.filter(function(x){return x.id===id;})[0];
  if(b && FCE.ui && FCE.ui.toast) FCE.ui.toast(b.icon+' Badge earned: <b>'+b.name+'</b>', 'gold');
  return true;
};
E.checkBadges = function(runStreak){
  var st = E.state;
  if(st.records.total >= 50) E.award('q50');
  if(st.records.total >= 200) E.award('q200');
  if(st.streak.count >= 3) E.award('streak3');
  if(st.streak.count >= 7) E.award('streak7');
  if(runStreak >= 10) E.award('perfect10');
  if(st.calib.s.att >= 25 && st.calib.s.cor/st.calib.s.att >= 0.9) E.award('calib');
  var types = {}; st.log.forEach(function(l){ types[l.type]=1; });
  if(types.kwt && types.cloze && types.wf && types.mcc) E.award('allparts');
  var cb = Object.keys(st.items).some(function(id){ var it=st.items[id]; return it.lapses>=3 && it.ivl>=2; });
  if(cb) E.award('comeback');
};
E.level = function(){ return Math.floor(Math.sqrt(E.state.xp/90)) + 1; };
E.levelProgress = function(){
  var lvl = E.level();
  var cur = Math.pow(lvl-1,2)*90, next = Math.pow(lvl,2)*90;
  return (E.state.xp-cur)/(next-cur);
};

/* ---------------- grade prediction (Cambridge scale 122–190) ---------------- */
var SCALE_MAP = [[0,126],[0.25,148],[0.40,158],[0.50,164],[0.60,170],[0.72,177],[0.82,183],[0.92,188],[1,190]];
function toScale(p){
  for(var i=0;i<SCALE_MAP.length-1;i++){
    if(p >= SCALE_MAP[i][0] && p <= SCALE_MAP[i+1][0]){
      var f = (p-SCALE_MAP[i][0])/(SCALE_MAP[i+1][0]-SCALE_MAP[i][0] || 1);
      return SCALE_MAP[i][1] + f*(SCALE_MAP[i+1][1]-SCALE_MAP[i][1]);
    }
  }
  return 126;
}
/* Integrate ability over the item bank's real difficulty distribution (self-calibrating) */
var diffHist = null;
function bankDiffHist(){
  if(diffHist) return diffHist;
  diffHist = {kwt:{}, cloze:{}, wf:{}, mcc:{}};
  var counts = {kwt:0, cloze:0, wf:0, mcc:0};
  E.allItems().forEach(function(it){
    var d = it.q.diff||3;
    diffHist[it.type][d] = (diffHist[it.type][d]||0)+1;
    counts[it.type]++;
  });
  Object.keys(diffHist).forEach(function(t){
    Object.keys(diffHist[t]).forEach(function(d){ diffHist[t][d] /= counts[t]||1; });
  });
  return diffHist;
}
E.expectedAccuracy = function(){
  var a = E.state.ability, acc = {}, H = bankDiffHist();
  ['kwt','cloze','wf','mcc'].forEach(function(t){
    var s = 0, h = H[t];
    Object.keys(h).forEach(function(d){ s += h[d]*E.pWin(a[t], 950 + (+d)*110); });
    acc[t] = s || E.pWin(a[t], 950+3*110);
  });
  return {p:(8*acc.mcc + 8*acc.cloze + 8*acc.wf + 12*acc.kwt)/36, per:acc};
};
E.predict = function(){
  var n = E.state.records.total;
  var ex = E.expectedAccuracy(), p = ex.p;
  var recent = E.state.log.slice(-80);
  if(recent.length >= 10){
    var obs = recent.reduce(function(x,l){return x+l.ok;},0)/recent.length;
    p = 0.55*p + 0.45*obs;
  }
  // practice here is deliberately harder than the exam (desirable difficulty) — correct for it
  p = Math.min(1, p*1.05 + 0.02);
  var scale = toScale(p);
  if(E.state.mocks.length){
    var last = E.state.mocks[E.state.mocks.length-1];
    scale = 0.55*scale + 0.45*last.scale;
  }
  var ci = Math.max(2.5, 22/Math.sqrt(n+3));
  var sd = ci/1.6;
  var phi = function(z){
    var t = 1/(1+0.2316419*Math.abs(z));
    var d = 0.3989423*Math.exp(-z*z/2);
    var pr = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
    return z>0 ? 1-pr : pr;
  };
  var pAbove = function(th){ return 1-phi((th-scale)/sd); };
  var pA = pAbove(180), pB = Math.max(0,pAbove(173)-pA), pC = Math.max(0,pAbove(160)-pA-pB);
  var grade = scale>=180 ? 'A' : scale>=173 ? 'B' : scale>=160 ? 'C' : scale>=140 ? 'B1' : '—';
  var borderline = Math.abs(scale-160)<=ci || Math.abs(scale-173)<=ci || Math.abs(scale-180)<=ci;
  var label = grade==='A' ? 'Grade A — top 2% territory'
            : grade==='B' ? 'Grade B — strong pass'
            : grade==='C' ? 'Grade C — a pass'
            : grade==='B1' ? 'Just below pass (B1 certificate)'
            : 'Below pass — keep building';
  return {
    scale:Math.round(scale), ci:Math.round(ci), p:p, n:n, per:ex.per,
    pass:pAbove(160), pA:pA, pB:pB, pC:pC,
    grade:grade, label:label, borderline:borderline,
    cefr: scale>=180 ? 'C1' : scale>=160 ? 'B2' : scale>=140 ? 'B1' : 'A2–B1',
  };
};

/* ---------------- coach ---------------- */
E.coach = function(sampled){
  var recs = [];
  Object.keys(FCE.TAGS).forEach(function(tag){
    var meta = FCE.TAGS[tag];
    var m = E.mEff(tag);
    var t = E.state.tags[tag];
    var mb = E.mBeta(tag);
    var why, seen = !!(t && t.att);
    // risk: Bayesian. Selection THOMPSON-SAMPLES the posterior (smart exploration);
    // the displayed coach is deterministic, and a CONFIRMED weakness must outrank a merely
    // unexplored skill — so unseen risk is capped below evidence-backed risk.
    var risk;
    if(sampled){
      risk = Math.max(0, Math.min(1, 1 - (mb.mean + mb.sd*gauss())));
    } else if(!seen){
      risk = 0.46;
    } else {
      risk = Math.max(0, Math.min(1, (1 - mb.mean) + 0.22*mb.sd));
    }
    if(!seen){ why = 'Not tested yet — unknown territory is risk.'; }
    else{
      var days = (Date.now()-t.last)/DAY;
      if(days > 3 && t.m > 0.6){ risk += 0.12; why = 'Was solid, but untouched for '+Math.round(days)+' days — forgetting has started.'; }
      else if(t.lapses >= 4 && risk > 0.35){ why = 'A stubborn weakness ('+t.lapses+' misses so far).'; }
      else if(risk > 0.5){ why = Math.round((t.cor/t.att)*100)+'% over '+t.att+' tries — below exam-safe.'; }
      else why = 'Close to mastery — cheap marks still on the table.';
    }
    var boost = E.state.boost[tag] ? 0.35 : 0;
    var cost = meta.weight * Math.max(0, risk - 0.12) + boost;
    recs.push({tag:tag, name:meta.name, risk:risk, cost:cost, why:why, seen:seen, m:m, boosted:!!E.state.boost[tag]});
  });
  recs.sort(function(a,b){ return b.cost - a.cost; });
  return recs;
};
E.daysToExam = function(){
