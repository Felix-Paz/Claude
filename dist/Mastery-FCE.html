};
E.checkBadges = function(runStreak){
  var st = E.state;
  if(st.records.total >= 50) E.award('q50');
  if(st.records.total >= 200) E.award('q200');
  if(st.streak.count >= 3) E.award('streak3');
  if(st.streak.count >= 7) E.award('streak7');
  if(runStreak >= 10) E.award('perfect10');
  if(st.calib.s.att >= 25 && st.calib.s.cor/st.calib.s.att >= 0.9) E.award('calib');
  var types = {}; st.log.forEach(function(l){ types[l.type]=1; });
  if(types.kwt && types.cloze && types.wf && types.mcc) E.award('allparts');
  var cb = Object.keys(st.items).some(function(id){ var it=st.items[id]; return it.lapses>=3 && it.ivl>=2; });
  if(cb) E.award('comeback');
};
E.level = function(){ return Math.floor(Math.sqrt(E.state.xp/90)) + 1; };
/* human-readable difficulty tier from average Elo ability */
E.difficultyTier = function(){
  var a = E.state.ability;
  var avg = (a.kwt + a.cloze + a.wf + a.mcc) / 4;
  if(avg < 1080) return {name:'Foundation',  desc:'easier items while the engine maps you', icon:'•'};
  if(avg < 1180) return {name:'Developing',  desc:'core B2 difficulty', icon:'••'};
  if(avg < 1280) return {name:'Exam level',  desc:'true FCE paper difficulty', icon:'•••'};
  if(avg < 1380) return {name:'Sharp',       desc:'above-paper difficulty — building margin', icon:'••••'};
  return {name:'Distinction', desc:'C1-leaning items — grade-A training', icon:'•••••'};
};
E.levelProgress = function(){
  var lvl = E.level();
  var cur = Math.pow(lvl-1,2)*90, next = Math.pow(lvl,2)*90;
  return (E.state.xp-cur)/(next-cur);
};

/* ---------------- grade prediction (Cambridge scale 122–190) ---------------- */
var SCALE_MAP = [[0,126],[0.25,148],[0.40,158],[0.50,164],[0.60,170],[0.72,177],[0.82,183],[0.92,188],[1,190]];
function toScale(p){
  for(var i=0;i<SCALE_MAP.length-1;i++){
    if(p >= SCALE_MAP[i][0] && p <= SCALE_MAP[i+1][0]){
      var f = (p-SCALE_MAP[i][0])/(SCALE_MAP[i+1][0]-SCALE_MAP[i][0] || 1);
      return SCALE_MAP[i][1] + f*(SCALE_MAP[i+1][1]-SCALE_MAP[i][1]);
    }
  }
  return 126;
}
/* Integrate ability over the item bank's real difficulty distribution (self-calibrating) */
var diffHist = null;
function bankDiffHist(){
  if(diffHist) return diffHist;
  diffHist = {kwt:{}, cloze:{}, wf:{}, mcc:{}};
  var counts = {kwt:0, cloze:0, wf:0, mcc:0};
  E.allItems().forEach(function(it){
    var d = it.q.diff||3;
    diffHist[it.type][d] = (diffHist[it.type][d]||0)+1;
    counts[it.type]++;
  });
  Object.keys(diffHist).forEach(function(t){
    Object.keys(diffHist[t]).forEach(function(d){ diffHist[t][d] /= counts[t]||1; });
  });
  return diffHist;
}
E.expectedAccuracy = function(){
  var a = E.state.ability, acc = {}, H = bankDiffHist();
  ['kwt','cloze','wf','mcc'].forEach(function(t){
    var s = 0, h = H[t];
    Object.keys(h).forEach(function(d){ s += h[d]*E.pWin(a[t], 950 + (+d)*110); });
    acc[t] = s || E.pWin(a[t], 950+3*110);
  });
  return {p:(8*acc.mcc + 8*acc.cloze + 8*acc.wf + 12*acc.kwt)/36, per:acc};
};
E.predict = function(){
  var n = E.state.records.total;
  var ex = E.expectedAccuracy(), p = ex.p;
  var recent = E.state.log.slice(-80);
  if(recent.length >= 10){
    var obs = recent.reduce(function(x,l){return x+l.ok;},0)/recent.length;
    p = 0.55*p + 0.45*obs;
  }
  // practice here is deliberately harder than the exam (desirable difficulty) — correct for it
  p = Math.min(1, p*1.05 + 0.02);
  var scale = toScale(p);
  if(E.state.mocks.length){
    var last = E.state.mocks[E.state.mocks.length-1];
    scale = 0.55*scale + 0.45*last.scale;
  }
  var ci = Math.max(2.5, 22/Math.sqrt(n+3));
  var sd = ci/1.6;
  var phi = function(z){
    var t = 1/(1+0.2316419*Math.abs(z));
    var d = 0.3989423*Math.exp(-z*z/2);
    var pr = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
    return z>0 ? 1-pr : pr;
  };
  var pAbove = function(th){ return 1-phi((th-scale)/sd); };
  var pA = pAbove(180), pB = Math.max(0,pAbove(173)-pA), pC = Math.max(0,pAbove(160)-pA-pB);
  var grade = scale>=180 ? 'A' : scale>=173 ? 'B' : scale>=160 ? 'C' : scale>=140 ? 'B1' : '—';
  var borderline = Math.abs(scale-160)<=ci || Math.abs(scale-173)<=ci || Math.abs(scale-180)<=ci;
  var label = grade==='A' ? 'Grade A — top 2% territory'
            : grade==='B' ? 'Grade B — strong pass'
            : grade==='C' ? 'Grade C — a pass'
            : grade==='B1' ? 'Just below pass (B1 certificate)'
            : 'Below pass — keep building';
  return {
    scale:Math.round(scale), ci:Math.round(ci), p:p, n:n, per:ex.per,
    pass:pAbove(160), pA:pA, pB:pB, pC:pC,
    grade:grade, label:label, borderline:borderline,
    cefr: scale>=180 ? 'C1' : scale>=160 ? 'B2' : scale>=140 ? 'B1' : 'A2–B1',
  };
};

/* ---------------- coach ---------------- */
E.coach = function(sampled){
  var recs = [];
  Object.keys(FCE.TAGS).forEach(function(tag){
    var meta = FCE.TAGS[tag];
    var m = E.mEff(tag);
    var t = E.state.tags[tag];
    var mb = E.mBeta(tag);
    var why, seen = !!(t && t.att);
    // risk: Bayesian. Selection THOMPSON-SAMPLES the posterior (smart exploration);
    // the displayed coach is deterministic, and a CONFIRMED weakness must outrank a merely
    // unexplored skill — so unseen risk is capped below evidence-backed risk.
    var risk;
    if(sampled){
      risk = Math.max(0, Math.min(1, 1 - (mb.mean + mb.sd*gauss())));
    } else if(!seen){
      risk = 0.46;
    } else {
      risk = Math.max(0, Math.min(1, (1 - mb.mean) + 0.22*mb.sd));
    }
    if(!seen){ why = 'Not tested yet — unknown territory is risk.'; }
    else{
      var days = (Date.now()-t.last)/DAY;
      if(days > 3 && t.m > 0.6){ risk += 0.12; why = 'Was solid, but untouched for '+Math.round(days)+' days — forgetting has started.'; }
      else if(t.lapses >= 4 && risk > 0.35){ why = 'A stubborn weakness ('+t.lapses+' misses so far).'; }
      else if(risk > 0.5){ why = Math.round((t.cor/t.att)*100)+'% over '+t.att+' tries — below exam-safe.'; }
      else why = 'Close to mastery — cheap marks still on the table.';
    }
    var boost = E.state.boost[tag] ? 0.35 : 0;
    var cost = meta.weight * Math.max(0, risk - 0.12) + boost;
    recs.push({tag:tag, name:meta.name, risk:risk, cost:cost, why:why, seen:seen, m:m, boosted:!!E.state.boost[tag]});
  });
  recs.sort(function(a,b){ return b.cost - a.cost; });
  return recs;
};
E.daysToExam = function(){
  if(!E.state.examDate) return null;
  return Math.ceil((new Date(E.state.examDate+'T00:00:00') - new Date())/DAY);
};
E.emergencyOn = function(){
  var d = E.daysToExam();
  return E.state.settings.emergency || (d !== null && d >= 0 && d <= 7);
};
E.emergencyPlan = function(){
  var d = E.daysToExam();
  var top = E.coach().slice(0,6);
  var names = top.map(function(r){ return r.name; });
  var plan = [
    {day:1, title:'Damage report', what:'Two Smart Sessions + review every mistake', focus:names.slice(0,3).join(', ')},
    {day:2, title:'Heaviest weakness', what:'20 targeted questions on your #1 weak skill', focus:names[0]||'—'},
    {day:3, title:'Transformations day', what:'Part 4 sprint — highest marks per minute', focus:'Part 4 patterns'},
    {day:4, title:'Little words day', what:'Open Cloze + your two worst gap types + Spelling Gym', focus:'Part 2 & 3 function words'},
    {day:5, title:'Full mock test', what:'36 marks under real timing, then autopsy every error', focus:'Exam conditions'},
    {day:6, title:'Mastery List hunt', what:'Clear everything you marked “want to master”', focus:'Stubborn items'},
    {day:7, title:'Light polish', what:'One short Smart Session + read your Grammar Book. Sleep well.', focus:'Confidence'},
  ];
  if(d !== null && d > 0 && d <= 7){ plan = plan.slice(Math.max(0, 7-d)); }
  return plan;
};

/* ---------------- adaptive selection ----------------
   Priorities: due reviews → boosted concepts (your recent errors, in NEW exercises)
   → wanted re-tests → weak×valuable skills → coverage explore → type balance. */
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
E.pickSession = function(n, filter){
  n = n || 10;
  filter = filter || {};
  var types = filter.types || (filter.type ? [filter.type] : null);
  var st = E.state, picked = [], usedTags = [], usedIds = {}, typeCount = {kwt:0,cloze:0,wf:0,mcc:0};
  var pool = E.allItems().filter(function(it){
    if(types && types.indexOf(it.type) === -1) return false;
    if(filter.tag && (it.q.tags||[]).indexOf(filter.tag) === -1) return false;
    return true;
  });
  var nTypes = types ? types.length : 4;
  // part quotas: equal until ~40 answers, then weighted toward your weaker parts
  var quotas = {};
  var base = Math.max(1, Math.ceil(n/nTypes));
  var allT = types || ['kwt','cloze','wf','mcc'];
  if(!types && !filter.tag && st.records.total >= 40 && isFinite(n)){
    // gently tilt quotas toward weaker parts, never more than one extra question
    var abil = st.ability;
    var meanA = (abil.kwt+abil.cloze+abil.wf+abil.mcc)/4;
    allT.forEach(function(t){
      quotas[t] = base + ((meanA - abil[t]) > 35 ? 1 : 0) - ((abil[t] - meanA) > 60 ? 1 : 0);
      quotas[t] = Math.max(1, quotas[t]);
    });
  } else {
    allT.forEach(function(t){ quotas[t] = base; });
  }
  var extra = {kwt:0,cloze:0,wf:0,mcc:0};
  function fits(it, allowExtra){
    if(usedIds[it.q.id]) return false;
    if(types || filter.tag) return true;
    if(typeCount[it.type] < (quotas[it.type]||base)) return true;
    if(allowExtra && extra[it.type] < 1) return true; // boosts may exceed by at most one
    return false;
  }
  function take(it, tag){
    picked.push(it); usedIds[it.q.id]=1; typeCount[it.type]++;
    if(typeCount[it.type] > (quotas[it.type]||base)) extra[it.type]++;
    if(tag) usedTags.push(tag);
  }
  // 1) due reviews
  E.dueItems().filter(function(id){
    var it = E.byId[id];
    if(types && types.indexOf(it.type) === -1) return false;
    if(filter.tag && (it.q.tags||[]).indexOf(filter.tag) === -1) return false;
    return true;
  }).slice(0, E.emergencyOn() ? 4 : 3).forEach(function(id){ take(E.byId[id]); });
  // 2) boosted concepts — same idea, NEW exercises
  var boostTags = Object.keys(st.boost).filter(function(t){ return st.boost[t] > 0; })
    .sort(function(a,b){ return st.boost[b]-st.boost[a]; });
  boostTags.forEach(function(tag){
    if(picked.length >= n) return;
    if(filter.tag && tag !== filter.tag) return;
    var cands = pool.filter(function(it){
      return fits(it, true) && (it.q.tags||[]).indexOf(tag) !== -1 &&
             (!st.items[it.q.id] || st.items[it.q.id].att === 0 || E.isWobbly(it.q.id));
    });
    if(!cands.length) cands = pool.filter(function(it){ return fits(it, true) && (it.q.tags||[]).indexOf(tag) !== -1; });
    if(cands.length){
      take(shuffle(cands)[0], tag);
      st.boost[tag]--;
      if(st.boost[tag] <= 0) delete st.boost[tag];
    }
  });
  // 3) one wanted re-test per session
  var wantIds = Object.keys(st.wants).filter(function(id){ return E.byId[id] && !usedIds[id]; });
  if(wantIds.length && picked.length < n){
    var wid = shuffle(wantIds)[0];
    if(!types || types.indexOf(E.byId[wid].type) !== -1) take(E.byId[wid]);
  }
  // 4) weak × valuable via Thompson sampling, interleaved, learning zone; 5) explore least-seen
  var recs = E.coach(true).filter(function(r){ return !filter.tag || r.tag === filter.tag; });
  var weakTags = recs.slice(0, E.emergencyOn() ? 5 : 6).map(function(r){ return r.tag; });
  var tries = 0;
  while(picked.length < n && tries < 500){
    tries++;
    var roll = Math.random();
    var explorize = st.records.total < 60 ? 0.25 : 0.15; // early on, prioritise mapping the student
    var tagPick;
    if(roll < explorize){ // coverage: least practised skill
      var unseen = recs.filter(function(r){ return !r.seen; });
      var leastSeen = unseen.length ? unseen : recs.slice().sort(function(a,b){
        return (st.tags[a.tag]?st.tags[a.tag].att:0) - (st.tags[b.tag]?st.tags[b.tag].att:0);
      });
      tagPick = leastSeen[Math.floor(Math.random()*Math.min(4,leastSeen.length))];
    } else if(roll < 0.25 && recs.length > 5){ // retrieval of strengths
      tagPick = recs[recs.length-1-Math.floor(Math.random()*3)];
    } else {
      var wt = recs.filter(function(r){ return weakTags.indexOf(r.tag) !== -1; });
      tagPick = wt[Math.floor(Math.random()*wt.length)] || recs[0];
    }
    if(!tagPick) break;
    if(tagPick.tag === usedTags[usedTags.length-1] && Math.random() < 0.7) continue;
    var cands2 = pool.filter(function(it){
      if(!fits(it)) return false;
      if((it.q.tags||[]).indexOf(tagPick.tag) === -1) return false;
      var p = E.pWin(st.ability[it.type], E.qElo(it.q));
      return p >= 0.25 && p <= 0.92;
    });
    if(!cands2.length) cands2 = pool.filter(function(it){ return fits(it) && (it.q.tags||[]).indexOf(tagPick.tag) !== -1; });
    if(!cands2.length) continue;
    var wp = E.worstPos();
    cands2.sort(function(a,b){
      var pa = (wp && a.type==='cloze' && E.clozeFeatures(a.q).indexOf(wp) !== -1) ? -1e12 : 0;
      var pb = (wp && b.type==='cloze' && E.clozeFeatures(b.q).indexOf(wp) !== -1) ? -1e12 : 0;
      var ia = st.items[a.q.id], ib = st.items[b.q.id];
      return (pa + (ia?ia.last:0)) - (pb + (ib?ib.last:0));
    });
    take(cands2[Math.floor(Math.random()*Math.min(3,cands2.length))], tagPick.tag);
  }
  // 6) fill
  if(picked.length < n){
    shuffle(pool).forEach(function(it){ if(picked.length < n && fits(it)) take(it); });
  }
  if(picked.length < n){
    shuffle(pool).forEach(function(it){ if(picked.length < n && !usedIds[it.q.id]) take(it); });
  }
  return picked.slice(0,n);
};

/* ---------------- open-cloze positional intelligence ----------------
   WHERE in a sentence do this student's cloze errors live?
   start of sentence · after a comma · mid-clause · sentence end · after/before word classes. */
E.clozeFeatures = function(q){
  var s = q.s || '';
  var gi = s.indexOf('____');
  if(gi < 0) return [];
  var before = s.slice(0, gi).trim();
  var after = s.slice(gi+4).replace(/^_+/,'').trim();
  var f = [];
  if(!before || /[.!?]$/.test(before)) f.push('start');
  if(/,$/.test(before)) f.push('afterComma');
  if(!after || /^[.!?]/.test(after)) f.push('end');
  if(f.indexOf('start') < 0 && f.indexOf('end') < 0) f.push('mid');
  var pw = (before.match(/([\w'’]+)[^\w]*$/)||[])[1];
  var nw = (after.match(/^[^\w]*([\w'’]+)/)||[])[1];
  var pc = pw ? E.classOf(pw) : null;
  var nc = nw ? E.classOf(nw) : null;
  if(pc) f.push('after-'+pc);
  if(nc) f.push('before-'+nc);
  if(nw && /ing$/.test(nw)) f.push('before-ing');
  return f;
};
E.POSNAMES = { start:'first word of the sentence', end:'last word of the sentence', mid:'mid-sentence',
  afterComma:'right after a comma', 'before-ing':'before an -ing form' };
E.posName = function(k){
  if(E.POSNAMES[k]) return E.POSNAMES[k];
  var m = k.match(/^(after|before)-(\w+)$/);
  if(m) return m[1]+' a '+(FCE.CLASSNAMES[m[2]]||m[2]);
  return k;
};
E.recPos = function(q, ok){
  E.clozeFeatures(q).forEach(function(k){
    var p = E.state.pos[k] || (E.state.pos[k] = {att:0, cor:0});
    p.att++; if(ok) p.cor++;
  });
};
E.posReport = function(){

    var p = E.state.pos[k];
    if(p.att >= 3) out.push({k:k, name:E.posName(k), att:p.att, err:1 - p.cor/p.att});
  });
  out.sort(function(a,b){ return b.err - a.err; });
  return out;
};
E.worstPos = function(){
  var r = E.posReport().filter(function(p){ return p.att >= 4 && p.err >= 0.4; });
  return r.length ? r[0].k : null;
};

    else if(v.box < 4) later.push(it);
  });
  function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

E.searchLearnables = function(query){
  var q = E.norm(query);

  var out = [], seen = {};
  Object.keys(FCE.TAGS).forEach(function(t){
    if(FCE.TAGS[t].name.toLowerCase().indexOf(q) !== -1)
      out.push({kind:'tag', id:t, label:FCE.TAGS[t].name, sub:'skill — sessions will lean into it'});
  });
  FCE.PATTERNS.forEach(function(p){
    var hit = p.name.toLowerCase().indexOf(q) !== -1 || p.match.some(function(m){ return E.norm(m).indexOf(q) !== -1; });
    if(hit && !seen['pt'+p.id]){ seen['pt'+p.id]=1; out.push({kind:'pattern', id:p.id, tags:p.tags, label:p.name, sub:'exam pattern ★'.concat('★'.repeat(Math.max(0,p.freq-1)))}); }
  });
  E.allItems().forEach(function(it2){

    var hay = (it2.type==='mcc' ? it2.q.opts[it2.q.cor] : it2.q.ans.join(' ')) + ' ' + (it2.q.key||'') + ' ' + (it2.q.stem||'');
    if(E.norm(hay).indexOf(q) !== -1 && !seen[it2.q.id]){
      seen[it2.q.id]=1;

      out.push({kind:'item', id:it2.q.id, tags:it2.q.tags, label:'\u201C'+label+'\u201D', sub:'exact exercise — added to your Mastery List'});

  });

};

};

/* ===== js/charts.js ===== */
/* FCE Mastery — dependency-free SVG charts (light "paper & glass" theme) */
window.FCE = window.FCE || {};
FCE.charts = (function(){
var C = {};
var T = { ink:'#1B1C21', sub:'#52504A', faint:'#8E8878', grid:'rgba(27,28,33,.12)',
          teal:'#E0492F', teal2:'#C2371F', ok:'#2E7D4F', bad:'#C2371F', warn:'#C98A2D',
          gold:'#C98A2D', sage:'#7FA98C' };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* Semi-circular score gauge, Cambridge scale 122–190, with CI band */
C.gauge = function(scale, ci){
  var min=122, max=190, cx=130, cy=132, R=104;
  function ang(v){ return Math.PI * (1 - (v-min)/(max-min)); }
  function pt(v, r){ var a=ang(v); return [cx + r*Math.cos(a), cy - r*Math.sin(a)]; }
  function arc(v1,v2,r){
    var p1=pt(v1,r), p2=pt(v2,r);
    var large = (ang(v1)-ang(v2)) > Math.PI ? 1 : 0;
    return 'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  var zones = [
    [122,140,T.bad],[140,160,T.warn],[160,173,T.sage],[173,180,T.ok],[180,190,T.gold]
  ];
  var s = '<svg viewBox="0 0 260 158" style="width:100%;max-width:280px">';
  zones.forEach(function(z){
    s += '<path d="'+arc(z[0],z[1],R)+'" stroke="'+z[2]+'" stroke-width="13" fill="none" stroke-linecap="butt" opacity=".22"/>';
  });
  var lo = Math.max(min, scale-ci), hi = Math.min(max, scale+ci);
  s += '<path d="'+arc(lo,hi,R)+'" stroke="url(#ggrad)" stroke-width="13" fill="none" stroke-linecap="round"/>';
  s += '<defs><linearGradient id="ggrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="'+T.teal+'"/><stop offset="1" stop-color="'+T.teal2+'"/></linearGradient></defs>';
  var np = pt(Math.max(min,Math.min(max,scale)), R-22);
  s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+np[0].toFixed(1)+'" y2="'+np[1].toFixed(1)+'" stroke="'+T.ink+'" stroke-width="2.5" stroke-linecap="round"/>';
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="'+T.ink+'"/>';
  [[140,'140'],[160,'160 pass'],[180,'180 A']].forEach(function(t){
    var p = pt(t[0], R+15);
    s += '<text x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" font-size="8.5" fill="'+T.faint+'" text-anchor="middle">'+t[1]+'</text>';
  });
  s += '</svg>';
  return s;
};

/* Radar / spider chart of skills */
C.radar = function(data){
  var N = data.length; if(N < 3) return '<div class="tiny">Answer more questions to unlock the radar (3+ skills needed).</div>';
  var cx=160, cy=150, R=104;
  function pt(i, r){
    var a = -Math.PI/2 + i*2*Math.PI/N;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  }
  var s = '<svg viewBox="0 0 320 300" style="width:100%;max-width:360px">';
  [0.25,0.5,0.75,1].forEach(function(f){
    var d = '';
    for(var i=0;i<N;i++){ var p=pt(i,R*f); d += (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }
    s += '<path d="'+d+'Z" fill="none" stroke="'+T.grid+'"/>';
  });
  for(var i=0;i<N;i++){
    var p = pt(i,R);
    s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="'+T.grid+'"/>';
  }
  var d2 = '';
  for(var j=0;j<N;j++){
    var v = Math.max(0.06, data[j].val);
    var p2 = pt(j, R*v);
    d2 += (j?'L':'M')+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  s += '<path d="'+d2+'Z" fill="rgba(224,73,47,.14)" stroke="'+T.teal+'" stroke-width="2"/>';
  for(var k=0;k<N;k++){
    var v2 = Math.max(0.06, data[k].val);
    var pp = pt(k, R*v2);
    s += '<circle cx="'+pp[0].toFixed(1)+'" cy="'+pp[1].toFixed(1)+'" r="3.4" fill="'+T.teal+'"/>';
    var lp = pt(k, R+24);
    var anchor = Math.abs(lp[0]-cx)<12 ? 'middle' : (lp[0]>cx ? 'start' : 'end');
    var nm = data[k].name.length > 15 ? data[k].name.slice(0,14)+'…' : data[k].name;
    s += '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3).toFixed(1)+'" font-size="9.5" fill="'+T.sub+'" text-anchor="'+anchor+'">'+esc(nm)+'</text>';
  }
  s += '</svg>';
  return s;
};

/* Confidence vs reality grouped bars */
C.calibration = function(rows){
  var x0=46, bw=34, gap=64, y0=150, scaleH=120;
  var s = '<svg viewBox="0 0 340 196" style="width:100%;max-width:380px">';
  [0,0.25,0.5,0.75,1].forEach(function(f){
    var y = y0 - f*scaleH;
    s += '<line x1="'+x0+'" y1="'+y+'" x2="320" y2="'+y+'" stroke="'+T.grid+'"/>';
    s += '<text x="'+(x0-7)+'" y="'+(y+3)+'" font-size="8.5" fill="'+T.faint+'" text-anchor="end">'+(f*100)+'%</text>';
  });
  rows.forEach(function(r,i){
    var x = x0 + 22 + i*(bw*2+gap);
    var hc = r.claimed*scaleH;
    s += '<rect x="'+x+'" y="'+(y0-hc)+'" width="'+bw+'" height="'+hc+'" rx="5" fill="rgba(27,28,33,.14)"/>';
    if(r.actual !== null){
      var ha = r.actual*scaleH;
      var col = r.actual >= r.claimed-0.07 ? T.ok : T.bad;
      s += '<rect x="'+(x+bw+5)+'" y="'+(y0-ha)+'" width="'+bw+'" height="'+ha+'" rx="5" fill="'+col+'" opacity=".85"/>';
    } else {
      s += '<text x="'+(x+bw+5)+'" y="'+(y0-8)+'" font-size="8.5" fill="'+T.faint+'">no data</text>';
    }
    s += '<text x="'+(x+bw+2)+'" y="'+(y0+16)+'" font-size="10" fill="'+T.sub+'" text-anchor="middle">'+r.icon+' '+esc(r.name)+'</text>';
    if(r.att) s += '<text x="'+(x+bw+2)+'" y="'+(y0+30)+'" font-size="8.5" fill="'+T.faint+'" text-anchor="middle">'+r.att+' answers</text>';
  });
  s += '<rect x="'+x0+'" y="178" width="9" height="9" rx="2" fill="rgba(27,28,33,.14)"/><text x="'+(x0+14)+'" y="186" font-size="9" fill="'+T.faint+'">what you claim</text>';
  s += '<rect x="'+(x0+110)+'" y="178" width="9" height="9" rx="2" fill="'+T.ok+'"/><text x="'+(x0+124)+'" y="186" font-size="9" fill="'+T.faint+'">what you score</text>';
  s += '</svg>';
  return s;
};

/* Accuracy trend sparkline */
C.spark = function(data, w, h){
  w = w||300; h = h||56;
  if(data.length < 2) return '<div class="tiny">Complete two or more sessions to see your trend.</div>';
  var pad=6, n=data.length;
  var pts = data.map(function(v,i){
    return [(pad + i*(w-2*pad)/(n-1)).toFixed(1), (h-pad - v*(h-2*pad)).toFixed(1)];
  });
  var d = pts.map(function(p,i){ return (i?'L':'M')+p[0]+' '+p[1]; }).join('');
  var s = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%">';
  s += '<path d="'+d+' L'+pts[pts.length-1][0]+' '+(h-2)+' L'+pts[0][0]+' '+(h-2)+'Z" fill="rgba(224,73,47,.10)" stroke="none"/>';
  s += '<path d="'+d+'" fill="none" stroke="'+T.teal+'" stroke-width="2.2" stroke-linecap="round"/>';
  var last = pts[pts.length-1];
  s += '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.4" fill="'+T.ink+'"/>';
  s += '</svg>';
  return s;
};

/* Progress ring */
C.ring = function(frac, label, sub, color){
  frac = Math.max(0, Math.min(1, frac||0));
  var R=34, CIRC=2*Math.PI*R;
  return '<div style="text-align:center">'+
    '<svg viewBox="0 0 84 84" style="width:84px;height:84px">'+
    '<circle cx="42" cy="42" r="'+R+'" fill="none" stroke="rgba(27,28,33,.12)" stroke-width="7"/>'+

    'stroke-dasharray="'+CIRC.toFixed(1)+'" stroke-dashoffset="'+(CIRC*(1-frac)).toFixed(1)+'" transform="rotate(-90 42 42)" style="transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.26,1)"/>'+
    '<text x="42" y="47" font-size="17" font-weight="700" fill="'+T.ink+'" text-anchor="middle" font-family="Iowan Old Style,Palatino,Georgia,serif">'+esc(label)+'</text>'+

      }).join('')+

    '<div class="grid g3">'+
      '<div class="stat-tile"><div class="v">'+st.records.total+'</div><div class="l">answers given</div></div>'+
      '<div class="stat-tile"><div class="v">'+eng.dueItems().length+'</div><div class="l">reviews due</div></div>'+

        '</div></div>';

        '<div class="ins-note">'+(br.hiddenHesit>2?'On '+br.hiddenHesit+' answers you claimed “Certain” while your typing said otherwise — those items get earlier reviews automatically.':'Your declared confidence and your behaviour mostly agree — a sign of honest self-assessment.')+'</div>'+
        (br.fluentSure?'<div class="ins-note">'+br.fluentSure+' “guesses” were answered fast and clean — you know more than you give yourself credit for.</div>':'')+
        '</div>';
    } else {
      html += '<div class="card"><div class="row">'+U.mascot('think',56)+'<div class="muted" style="flex:1">Answer ~8 more questions and I’ll show what your typing reveals: hesitation, abandoned right answers, hidden doubt…</div></div></div>';
    }

      html += '<div class="card" style="margin-bottom:16px"><h3>Everything the engine is recording about how you answer</h3>'+

         ['avg. active typing time', (br.avgTypeMs/1000).toFixed(1)+'s'],

         ['right answers abandoned', br.changedRight],

      posR.slice(0,6).map(function(p){

        return '<div class="dna-bar"><span style="text-transform:capitalize">'+U.esc(p.name)+'</span><div class="bar thin"><i class="'+(p.err>0.5?'bad':p.err>0.3?'warn':'ok')+'" style="width:'+pct+'%"></i></div><b>'+pct+'%</b></div>';
      }).join('')+'</div>' : '')+
    '<div class="grid g2">'+
      '<div class="card"><h3>Spelling fingerprint</h3>'+
        (rep.total ? rep.patterns.slice(0,4).map(function(p2){

            return '<div class="dna-bar"><span>'+(names[p2.id]||p2.id)+'</span><div class="bar thin"><i class="warn" style="width:'+Math.round(100*p2.n/rep.total)+'%"></i></div><b>'+p2.n+'</b></div>';
          }).join('')+
          (rep.words.length?'<div class="ins-note">Words that beat you: '+rep.words.slice(0,5).map(function(w){return '<b>'+U.esc(w.w)+'</b>';}).join(', ')+'. The Gym serves these first.</div>':'')+
          '<button class="btn teal small" id="pg-gym" style="margin-top:10px">🏋️ Train them now</button>'
        : '<div class="muted">No spelling slips recorded yet. When they happen, the engine classifies the <i>kind</i> of slip and builds your antidote here.</div>')+
      '</div>'+
      '<div class="card"><h3>Why you miss things</h3>'+
        (dna.total ? dna.list.map(function(d2){

        : '<div class="muted">Tag the cause when you miss (one tap) and your error anatomy appears here.</div>')+
      '</div>'+
    '</div>';
  }

  var v = el(html);

/* ===== js/practice.js ===== */
/* Mastery (FCE) — sessions, spelling gym, mock test.
   Silent telemetry: hesitation, erase/rewrite cycles, first instinct, option switching,
   pauses, skips. Confidence rating optional — inferred from behaviour when not given. */
window.FCE = window.FCE || {};
FCE.practice = (function(){
var P = {};
var U = function(){ return FCE.ui; };
var E = function(){ return FCE.engine; };
var TYPE_LABEL = {kwt:'Part 4 · Transformation', cloze:'Part 2 · Open Cloze', wf:'Part 3 · Word Formation', mcc:'Part 1 · Multiple Choice'};

/* ---------- behaviour tracker ---------- */
function Tracker(t0){
  return { t0:t0, ttfk:0, edits:0, pauses:0, switches:0, lastInput:0, firstInput:0, keys:0,
           firstGuess:'', firstOpt:-1, settled:false, settleTimer:null, maxLen:0,
           skipped:false, pausedMs:0 };
}
function trackInput(tr, inp){
  inp.addEventListener('keydown', function(ev){
    var now = Date.now();
    if(!tr.ttfk) tr.ttfk = now - tr.t0 - tr.pausedMs;
    if(ev.key && ev.key.length === 1) tr.keys++;
    if(ev.key === 'Backspace' || ev.key === 'Delete') tr.edits++;
  });
  inp.addEventListener('input', function(){
    var now = Date.now();
    if(!tr.firstInput) tr.firstInput = now;
    if(tr.lastInput && now - tr.lastInput > 2000) tr.pauses++;
    tr.lastInput = now;
    if(inp.value.length > tr.maxLen) tr.maxLen = inp.value.length;
    if(tr.settleTimer) clearTimeout(tr.settleTimer);
    if(!tr.settled && inp.value.trim()){
      tr.settleTimer = setTimeout(function(){
        if(!tr.settled && inp.value.trim()){ tr.firstGuess = inp.value.trim(); tr.settled = true; }
      }, 1100);
    }
  });
}
function finishTracker(tr, finalVal){
  if(tr.settleTimer) clearTimeout(tr.settleTimer);
  if(!tr.settled && finalVal){ tr.firstGuess = String(finalVal).trim(); tr.settled = true; }
  return tr;
}
function behFromTracker(tr, finalVal, firstRight){
  var changed = tr.firstGuess && E().norm(tr.firstGuess) !== E().norm(finalVal||'');
  return { ttfk:tr.ttfk, edits:tr.edits, pauses:tr.pauses, switches:tr.switches,
           keys:tr.keys, typeMs: tr.firstInput ? Math.max(0, tr.lastInput - tr.firstInput) : 0,
           changed:!!changed, firstGuess: changed ? tr.firstGuess.slice(0,60) : '',
           firstRight:!!firstRight, skipped:tr.skipped };
}

/* ---------- key manager ---------- */
var keyHandler = null;
function setKeys(fn){
  if(keyHandler) document.removeEventListener('keydown', keyHandler);
  keyHandler = fn;
  if(fn) document.addEventListener('keydown', fn);
}
P.clearKeys = function(){ setKeys(null); };

/* ============================ SESSION ============================ */
var S = null;

P.start = function(cfg){
  cfg = cfg || {};
  var eng = E(), queue;
  var endless = cfg.mode === 'endless';
  if(cfg.mode === 'diagnostic') queue = eng.diagnosticSet();
  else if(cfg.mode === 'ids') queue = (cfg.ids||[]).map(function(id){ return eng.byId[id]; }).filter(Boolean);
  else queue = eng.pickSession(cfg.n || 10, {types:cfg.types, type:cfg.type, tag:cfg.tag});
  if(!queue.length){ U().toast('No questions available for that filter yet.'); return; }
  S = {queue:queue, idx:0, ok:0, run:0, mode:endless?'endless':(cfg.mode||'smart'), cfg:cfg,
       tag:cfg.tag||'', t0:Date.now(), selOpt:-1, conf:'', graded:false, results:[],
       skippedIds:{}, requeued:{}, planned:queue.length, summarySaved:false, paused:false, levelBefore:eng.level()};
  render();
};

function render(){
  var host = U().$('#view');
  host.innerHTML = '';
  if(S.mode !== 'endless' && S.idx >= S.queue.length){ host.appendChild(summaryView()); }
  else {
    if(S.mode === 'endless' && S.idx >= S.queue.length){
      var more = E().pickSession(10, {types:S.cfg.types, type:S.cfg.type, tag:S.cfg.tag});
      more.forEach(function(it){ S.queue.push(it); });
      if(S.idx >= S.queue.length){ host.appendChild(summaryView()); window.scrollTo(0,0); return; }
    }
    host.appendChild(qView());
  }
  window.scrollTo(0,0);
}

function qView(){
  var u = U(), eng = E();
  var it = S.queue[S.idx], q = it.q;
  S.selOpt = -1; S.conf = ''; S.graded = false;
  var tr = S.tr = Tracker(Date.now());
  tr.skipped = !!S.skippedIds[q.id];
  var seen = eng.state.items[q.id];
  var isReview = seen && seen.att > 0;
  var par = eng.par(it.type, q.diff);
  var endless = S.mode === 'endless';

  var body = '';
  if(it.type === 'kwt'){
    body = '<div class="q-text">'+u.esc(q.s1)+'</div>'+
      '<div class="q-key">key word: <b>'+u.esc(q.key)+'</b> <span class="tiny">2–5 words, key word unchanged</span></div>'+
      '<div class="q-text" style="margin-top:8px">'+gapify(q.s2)+'</div>'+
      '<input class="ans-input" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing words…">'+
      '<div class="tiny" id="wc" style="margin-top:6px"></div>';
  } else if(it.type === 'cloze'){
    body = '<div class="q-text">'+gapify(q.s)+'</div>'+
      '<input class="ans-input" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="One word only…">';
  } else if(it.type === 'wf'){
    body = '<div class="q-text">'+gapify(q.s)+'</div>'+
      '<div class="q-key" style="margin-top:12px">stem: <span class="q-stem">'+u.esc(q.stem)+'</span> <span class="tiny">— transform it to fit</span></div>'+
      '<input class="ans-input" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="The transformed word…">';
  } else {
    body = '<div class="q-text">'+gapify(q.s)+'</div>'+
      '<div class="opts">'+q.opts.map(function(o,i){
        return '<button class="opt" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+u.esc(o)+'</span></button>';
      }).join('')+'</div>';
  }

  var v = u.el(
  '<div class="q-shell">'+
    '<div class="q-top">'+
      '<button class="btn small ghost" id="q-quit">✕ End</button>'+
      '<button class="btn small ghost" id="q-pause" title="Pause — the clock stops">⏸</button>'+
      '<div class="q-progress"><div class="bar"><i style="width:'+(endless?100:Math.round(100*S.idx/S.queue.length))+'%"></i></div></div>'+
      '<span class="tiny mono">'+(endless ? (S.results.length+1)+' ∞' : (S.idx+1)+' / '+S.queue.length)+'</span>'+
      (S.run >= 3 ? '<span class="chip gold">🔥 ×'+S.run+'</span>' : '')+
      '<span class="q-timer" id="q-timer">0:00</span>'+
    '</div>'+
    '<div class="q-card">'+
      '<div class="q-type"><span class="chip acc">'+TYPE_LABEL[it.type]+'</span>'+
      (isReview?'<span class="chip warn">🔁 review</span>':'')+
      (tr.skipped?'<span class="chip">↩ skipped earlier</span>':'')+
      (S.mode==='diagnostic'?'<span class="chip">🧪 diagnostic</span>':'')+
      '<span class="grow"></span><span class="chip" style="font-size:10px" title="'+u.esc(eng.difficultyTier().desc)+'">'+eng.difficultyTier().icon+' '+u.esc(eng.difficultyTier().name)+'</span>'+
      '<span class="tiny" title="typical exam pace for this question">⏱ pace '+par+'s</span>'+
      '</div>'+
      body+

  var timerEl = u.$('#q-timer', v);

function gradeFirstGuess(it, q, tr){
  if(it.type === 'mcc') return tr.firstOpt >= 0 && tr.firstOpt === q.cor;
  if(!tr.firstGuess) return false;
  if(it.type === 'kwt') return E().gradeKWT(q, tr.firstGuess).ok;
  return E().gradeOne(q, tr.firstGuess);

function saveSummary(){
  if(S.summarySaved) return;
  S.summarySaved = true;
  var eng = E(), n = S.results.length;
  if(!n) return;
  var acc = S.ok/n;
  eng.state.sessions.push({t:Date.now(), n:n, ok:S.ok, type:S.mode});
  eng.state.trend.push({t:Date.now(), acc:acc, n:n});
  if(eng.state.trend.length > 40) eng.state.trend.shift();
  if(acc > eng.state.records.bestAcc && n >= 5) eng.state.records.bestAcc = acc;
  if(S.mode === 'diagnostic') eng.award('first');
  eng.save();
}
function finishSession(early){

  saveSummary();
  S.mode = S.mode==='endless' ? 'smart' : S.mode; // so render shows summary
  S.idx = S.queue.length;
  render();
}

/* ============================ SPELLING GYM ============================
   Rebuilt on the formats real spelling trainers use:
   · LETTERS — the word's skeleton with the danger letters missing + a definition clue
   · FLASH   — look·cover·write: the word flashes, then you rebuild it from the definition
   A wrong spelling is never shown; the clue never contains the word. */
var G = null;
P.spellingGym = function(){
  var eng = E();
  G = {set: eng.spellingSet(8), idx:0, ok:0, t0:Date.now(), graded:false, missed:[]};
  renderGym();
};
function renderGym(){
  var u = U(), host = u.$('#view');
  host.innerHTML = '';
  host.appendChild(G.idx >= G.set.length ? gymDone() : gymQ());
  window.scrollTo(0,0);
}
/* choose which letters to hide: where students actually go wrong */
function holePositions(item){
  var w = item.w, holes = {};
  var bad = (item.bad && item.bad[0]) || '';
  if(bad.length === w.length){
    for(var i=0;i<w.length;i++) if(w[i] !== bad[i]) holes[i] = 1;
  }
  // add doubled letters and unstressed vowels until we have enough
  var want = Math.max(2, Math.min(5, Math.floor(w.length/3)+1));
  for(var j=1;j<w.length && Object.keys(holes).length<want;j++){
    if(w[j] === w[j-1]){ holes[j]=1; }
  }
  for(var k=1;k<w.length-1 && Object.keys(holes).length<want;k++){
    if('aeiou'.indexOf(w[k])!==-1 && !holes[k]) holes[k]=1;
  }
  delete holes[0]; // first letter always visible
  if(!Object.keys(holes).length) holes[Math.max(1,Math.floor(w.length/2))]=1;
  return holes;
}
function boxesHTML(word, holes){
  var u = U();
  return '<div class="letterboxes">'+word.split('').map(function(ch,i){
    return '<span class="lbox'+(holes && holes[i] ? ' hole' : '')+'">'+(holes && holes[i] ? '' : u.esc(ch))+'</span>';
  }).join('')+'</div>';
}
function gymQ(){
  var u = U(), eng = E();
  var item = G.set[G.idx];
  G.graded = false;
  var flash = G.idx % 2 === 1; // letters first, flash second
  var defHTML = '<div class="gym-def"><span class="pos">'+u.esc(item.def.split('·')[0].trim())+'</span>'+
                u.esc(item.def.split('·').slice(1).join('·').trim())+'</div>';
  var stage;
  if(flash){
    stage = '<div class="gym-count" id="g-count">memorize · 3</div>'+
            '<div class="gym-flash" id="g-flash">'+u.esc(item.w)+'</div>';
  } else {
    stage = defHTML + boxesHTML(item.w, holePositions(item)) +
            '<div class="gym-count">fill the missing letters — type the whole word</div>';
  }
  var v = u.el(
    '<div class="q-shell">'+
      '<div class="q-top">'+
        '<button class="btn small ghost" id="g-quit">✕ End</button>'+

      (ok ? '<div class="fb-head">✓ '+u.esc(item.up[0])+(mode!=='choose'?' — produced from memory':'')+'</div>'
          : '<div class="fb-head">Not quite</div><div class="big-answer">'+u.esc(item.up.join('  ·  '))+'</div>')+

      '<div class="fb-diag">🔒 <b>Lock it in:</b> look away from the screen and say the whole sentence aloud, with <i>'+u.esc(item.up[0])+'</i> in place. Retrieval + production is what plants it for essay day.</div>'+

function gradeMock(v){

  var u = U(), eng = E(), s = M.set;
  var score = 0, parts = {p1:0,p2:0,p3:0,p4:0}, errors = [];

    if(ok){ score++; parts.p1++; }
    else errors.push({part:'Part 1', n:g.n, user: val>=0 ? g.opts[val] : '(blank)', corr:g.opts[g.cor], exp:g.exp});
    marks.p1[g.n] = {ok:ok, user: val>=0 ? g.opts[val] : '', corr:g.opts[g.cor], exp:g.exp};
    eng.record({id:s.p1.id+'-'+g.n, tags:g.tags, diff:3, ans:[g.opts[g.cor]]}, 'mcc', ok, '', 0, val>=0?g.opts[val]:'', '', {quiet:true});
  });
  s.p2.gaps.forEach(function(g){

    else errors.push({part:'Part 2', n:g.n, user:val||'(blank)', corr:g.ans.join(' / '), exp:g.exp});
    marks.p2[g.n] = {ok:ok, user:val, corr:g.ans[0], exp:g.exp};
    eng.record({id:s.p2.id+'-'+g.n, tags:g.tags, gt:g.gt, diff:3, ans:g.ans}, 'cloze', ok, '', 0, val, '', {quiet:true});
  });
  s.p3.gaps.forEach(function(g){
    var inp = u.$('input[data-part="p3"][data-n="'+g.n+'"]', v);
    var val = inp ? inp.value : '';
    var ok = eng.gradeOne({id:s.p3.id+'-'+g.n, ans:g.ans}, val);
    if(ok){ score++; parts.p3++; }
    else errors.push({part:'Part 3', n:g.n, user:val||'(blank)', corr:g.ans.join(' / ')+' ('+g.stem+')', exp:g.exp});
    marks.p3[g.n] = {ok:ok, user:val, corr:g.ans[0], stem:g.stem, exp:g.exp};
    eng.record({id:s.p3.id+'-'+g.n, tags:g.tags, diff:3, ans:g.ans}, 'wf', ok, '', 0, val, '', {quiet:true});

  s.p4.forEach(function(q,i){

    marks.p4.push({q:q, user:val, score:g.score, ok:g.ok});

  });
  eng.checkBadges(0);
  eng.markPassage(s.p1.id); eng.markPassage(s.p2.id); eng.markPassage(s.p3.id);
  var scale = eng.recordMock(score, 36, parts);
  var pr = eng.predict();
  // render the WHOLE paper back, corrected in place — like a marked exam script

    pass.gaps.forEach(function(g){

  host.innerHTML = '';
  host.appendChild(u.el(

      '<div class="mr-grid">'+

      '<p class="tiny">Overall prediction updated: <b>'+pr.grade+'</b> ('+pr.scale+'). Below is your whole paper, marked — green stays, red gets fixed. Every miss is queued for review.</p>'+
    '</div>'+
    '<h3 class="sec-label" style="margin-top:22px">Your paper, corrected</h3>'+
    '<div class="mock-part"><h4>Part 1 · '+u.esc(s.p1.title)+' <span class="chip '+(parts.p1>=6?'ok':'warn')+'">'+parts.p1+'/8</span></h4>'+corrected(s.p1,'p1')+'</div>'+
    '<div class="mock-part"><h4>Part 2 · '+u.esc(s.p2.title)+' <span class="chip '+(parts.p2>=6?'ok':'warn')+'">'+parts.p2+'/8</span></h4>'+corrected(s.p2,'p2')+'</div>'+
    '<div class="mock-part"><h4>Part 3 · '+u.esc(s.p3.title)+' <span class="chip '+(parts.p3>=6?'ok':'warn')+'">'+parts.p3+'/8</span></h4>'+corrected(s.p3,'p3')+'</div>'+
    '<div class="mock-part"><h4>Part 4 · Transformations <span class="chip '+(parts.p4>=9?'ok':'warn')+'">'+parts.p4+'/12</span></h4>'+
      marks.p4.map(function(m,i){
        return '<div class="mock-kwt"><div class="ms1">'+(i+1)+'. '+u.esc(m.q.s1)+' <span class="q-key" style="margin:0">[<b>'+u.esc(m.q.key)+'</b>]</span></div>'+
          '<div class="ms1" style="margin-top:6px">'+u.esc(m.q.s2).replace(/____+/g,
            m.ok ? '<b class="mk-ok">'+u.esc(m.user)+'</b>'
                 : (m.user?'<s class="mk-bad">'+u.esc(m.user)+'</s> ':'')+'<b class="mk-fix">'+u.esc(m.q.ans[0])+'</b>')+
          ' <span class="chip '+(m.score===2?'ok':m.score===1?'warn':'bad')+'" style="font-size:10px">'+m.score+'/2</span></div>'+
          (!m.ok ? '<div class="tiny" style="margin-top:6px">'+u.esc(m.q.exp||'')+'</div>' : '')+
        '</div>';
      }).join('')+
    '</div>'+
    '<div class="row" style="justify-content:center;margin-top:18px;flex-wrap:wrap">'+
      '<button class="btn primary" id="mk-dash">Home</button>'+
      '<button class="btn" id="mk-again">New mock</button>'+
    '</div></div>'
  ));
  u.$('#mk-dash').addEventListener('click', function(){ FCE.ui.go('dash'); });
  u.$('#mk-again').addEventListener('click', function(){ P.mock(); });
  window.scrollTo(0,0);
  function mr(name, got, of){
    var f = got/of;
    return '<div class="stat-tile"><div class="v" style="color:'+(f>=0.75?'var(--ok)':f>=0.5?'var(--warn)':'var(--bad)')+'">'+got+'/'+of+'</div><div class="l">'+name+'</div></div>';
  }
}

return P;
})();


/* ===== js/app.js ===== */
/* Mastery (FCE) — bootstrap: topbar + dock + blobs */
window.FCE = window.FCE || {};
FCE.app = (function(){
var A = {};
var NAV_FULL = [
  ['dash','⌂','Home'],
  ['practice','✎','Train'],
  ['mock','▤','Mock'],
  ['coach','◎','Coach'],
  ['progress','◔','Stats'],
  ['book','❡','Book'],
  ['settings','⚙','Setup'],
];
var NAV_LITE = [
  ['lite','⌂','Home'],
  ['mock','▤','Mock'],
  ['settings','⚙','Setup'],
];

/* mock intro view */
FCE.ui.views.mock = function(){
  var eng = FCE.engine;
  var mocks = eng.state.mocks;
  var v = FCE.ui.el(
    '<div class="h-page">Mock <em>Test</em></div>'+
    '<p class="sub">The full 36-mark Use of English paper: real passages, four parts, 35 minutes, official-style scoring. No feedback until you submit — just like the real room.</p>'+
    '<div class="grid g2" style="margin-bottom:16px">'+
      '<div class="card"><h3>What you’ll face</h3>'+
        '<div class="stack" style="gap:7px;font-size:13.5px">'+
        '<div><b>Part 1</b> · Multiple-Choice Cloze — 8 gaps · 8 marks</div>'+
        '<div><b>Part 2</b> · Open Cloze — 8 gaps · 8 marks</div>'+
        '<div><b>Part 3</b> · Word Formation — 8 gaps · 8 marks</div>'+
        '<div><b>Part 4</b> · Transformations — 6 items · 12 marks</div>'+
        '</div></div>'+
      '<div class="card"><h3>Examiner’s corner</h3>'+
        '<div class="stack" style="gap:7px;font-size:13px;color:var(--tx2)">'+
        '<div>• Never leave a blank — wrong answers cost nothing.</div>'+
        '<div>• Part 2: ONE word. Part 4: 2–5 words, key word unchanged.</div>'+
        '<div>• Spelling counts everywhere.</div>'+
        '<div>• Budget ≈ 8 minutes per part, 3 to check.</div>'+
        '</div></div>'+
    '</div>'+
    (mocks.length ? '<div class="card" style="margin-bottom:16px"><h3>Your mock history</h3>'+
      mocks.slice(-5).reverse().map(function(m){
        return '<div class="row between" style="padding:6px 0;font-size:13.5px"><span>'+new Date(m.t).toLocaleDateString()+'</span><span class="mono">'+m.score+'/36</span><span class="chip '+(m.scale>=160?'ok':'warn')+'">scale '+m.scale+'</span></div>';
      }).join('')+'</div>' : '')+
    '<button class="btn primary block" id="mock-start" style="font-size:16px;padding:16px">Start the paper · 35:00 ▸</button>'
  );
  FCE.ui.$('#mock-start', v).addEventListener('click', function(){ FCE.practice.mock(); });
  return v;
};

A.buildTopbar = function(){
  var tb = document.getElementById('topbar');
  if(!tb) return;
  var eng = FCE.engine, st = eng.state;
  tb.innerHTML =
    '<div class="tb-logo">'+FCE.ui.wordmark()+'</div>'+
    '<div class="tb-spacer"></div>'+
    '<div class="tb-level" title="XP = effort made visible. Levels grow on a square-root curve — each costs more work, and the engine raises its expectations as you climb."><span class="lvl">LVL '+eng.level()+'</span><div class="bar thin"><i class="shimmer" style="width:'+Math.round(eng.levelProgress()*100)+'%"></i></div><span class="lvl">'+st.xp+' XP</span></div>'+
    '<span class="tb-chip flame" title="Consecutive days practised. Habit is the best predictor of passing — protect the flame."><span class="fl">🔥</span>'+st.streak.count+'</span>';
};

A.buildNav = function(){
  var sb = document.querySelector('.sidebar');
  var items = FCE.ui.isLite() ? NAV_LITE : NAV_FULL;
  sb.innerHTML =
    '<div class="rail-card">'+
    items.map(function(n){
      return '<button class="nav-btn" data-v="'+n[0]+'" title="'+n[2]+'"><span class="ic">'+n[1]+'</span><span>'+n[2]+'</span></button>';
    }).join('')+
    '</div><div class="nav-spacer"></div>';
  Array.prototype.forEach.call(sb.querySelectorAll('.nav-btn'), function(b){
    b.addEventListener('click', function(){ FCE.ui.go(b.dataset.v); });
  });
  A.buildTopbar();
};

function boot(){
  FCE.engine.load();
  FCE.engine.indexBank();
  // liquid background blobs
  ['b1','b2','b3'].forEach(function(c){
    var d = document.createElement('div');
    d.className = 'blob '+c;
    document.body.appendChild(d);
  });
  A.buildNav();
  FCE.ui.go(FCE.engine.state.onboarded ? 'dash' : 'onboard');
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
return A;
})();

</script>

</body>
