/* FCE Mastery — question bank II: Word Formation (Part 3), Multiple-Choice Cloze (Part 1),
   and full exam-style passages for mock tests. */
window.FCE = window.FCE || {};
FCE.BANK = FCE.BANK || {};

/* ---------- Word Formation (stem given in capitals, one word answer) ---------- */
FCE.BANK.wf = [
{id:"w01", s:"Her ____ to adapt to new situations impressed the interviewers.", stem:"ABLE", ans:["ability"], tags:["wfnoun"], diff:1, exp:"able → ability (noun, -ity).", trap:"Check it isn’t negative: the sentence is positive, so not 'inability'."},
{id:"w02", s:"After three ____ attempts, she finally passed her driving test.", stem:"SUCCEED", ans:["unsuccessful"], tags:["wfadj","wfneg"], diff:3, exp:"succeed → successful → UNsuccessful. 'After … finally passed' forces the negative.", trap:"The polarity trap: write 'successful' and you lose the mark."},
{id:"w03", s:"Moving abroad was the best ____ I have ever made.", stem:"DECIDE", ans:["decision"], tags:["wfnoun","spell"], diff:1, exp:"decide → decision (-sion).", trap:"Spelling: deciSion, not decition."},
{id:"w04", s:"The story is told with extraordinary ____ and humour.", stem:"IMAGINE", ans:["imagination"], tags:["wfnoun"], diff:1, exp:"imagine → imagination.", trap:"Not 'imaginations' — abstract noun stays singular here."},
{id:"w05", s:"The market for streaming services has become fiercely ____ .", stem:"COMPETE", ans:["competitive"], tags:["wfadj"], diff:2, exp:"compete → competitive (-itive).", trap:"'competing' is grammatical but weaker — Cambridge wants the adjective."},
{id:"w06", s:"Youth ____ has fallen to its lowest level in a decade.", stem:"EMPLOY", ans:["unemployment"], tags:["wfnoun","wfneg"], diff:3, exp:"'has fallen' + good news = UNemployment falling.", trap:"'employment has fallen' would be bad news — read the logic, not just the gap."},
{id:"w07", s:"There is no ____ proof that the remedy actually works.", stem:"SCIENCE", ans:["scientific"], tags:["wfadj"], diff:1, exp:"science → scientific (-ific).", trap:"Spelling: scien-TI-fic."},
{id:"w08", s:"Surprisingly, the flavour of the dish was completely ____ .", stem:"NATURE", ans:["natural","unnatural"], tags:["wfadj"], diff:2, exp:"nature → natural; 'Surprisingly' allows unnatural too — both accepted here.", trap:"In the real exam, read the surrounding sentences to fix polarity."},
{id:"w09", s:"Climbing without ropes puts climbers in serious ____ .", stem:"DANGEROUS", ans:["danger"], tags:["wfnoun"], diff:2, exp:"Adjective given, noun needed: danger.", trap:"Reverse formation — the stem is not always the shortest form."},
{id:"w10", s:"The ____ of the new runway will double the airport’s capacity.", stem:"LONG", ans:["lengthening"], tags:["wfnoun","wfverb"], diff:4, exp:"long → lengthen → lengthening (the process).", trap:"'length' alone doesn’t fit — the gap needs the action noun."},
{id:"w11", s:"Regular exercise builds both ____ and confidence.", stem:"STRONG", ans:["strength"], tags:["wfnoun","spell"], diff:2, exp:"strong → strength (vowel change).", trap:"Spelling: strenGth — three consonants in a row."},
{id:"w12", s:"The ____ of the tower makes it visible from the whole valley.", stem:"HIGH", ans:["height"], tags:["wfnoun","spell"], diff:2, exp:"high → height.", trap:"Spelling: h-e-i-g-h-t, not 'hight' or 'heighth'."},
{id:"w13", s:"They plan to ____ the main road to four lanes.", stem:"WIDE", ans:["widen"], tags:["wfverb"], diff:2, exp:"wide → widen (verb, -en).", trap:"A verb slot after 'to' — don’t write 'width'."},
{id:"w14", s:"Divers measured the ____ of the lake at its centre.", stem:"DEEP", ans:["depth"], tags:["wfnoun","spell"], diff:2, exp:"deep → depth.", trap:"Spelling: depth, not 'deepth'."},
{id:"w15", s:"To tell the ____ , I never expected to win.", stem:"TRUE", ans:["truth"], tags:["wfnoun"], diff:1, exp:"true → truth; fixed phrase 'to tell the truth'.", trap:"'truly' is the adverb — wrong slot."},
{id:"w16", s:"They had a heated ____ about whose turn it was to pay.", stem:"ARGUE", ans:["argument"], tags:["wfnoun","spell"], diff:2, exp:"argue → argument.", trap:"Spelling: drop the E — arguMent, not 'arguement'."},
{id:"w17", s:"The lift is out of order due to essential ____ work.", stem:"MAINTAIN", ans:["maintenance"], tags:["wfnoun","spell"], diff:3, exp:"maintain → maintenance.", trap:"Spelling: mainTENance — the 'tain' changes to 'ten'."},
{id:"w18", s:"The teacher’s ____ of the rule was admirably clear.", stem:"EXPLAIN", ans:["explanation"], tags:["wfnoun","spell"], diff:2, exp:"explain → explanation.", trap:"Spelling: explAnation — the 'i' disappears."},
{id:"w19", s:"Her ____ of English is almost perfect, apart from a slight accent.", stem:"PRONOUNCE", ans:["pronunciation"], tags:["wfnoun","spell"], diff:3, exp:"pronounce → pronunciation.", trap:"The most famous spelling trap in FCE: pronUnciation, no 'o'."},
{id:"w20", s:"Learning vocabulary requires constant ____ .", stem:"REPEAT", ans:["repetition"], tags:["wfnoun","spell"], diff:3, exp:"repeat → repetition.", trap:"Spelling: repEtition, not 'repeatition'."},
{id:"w21", s:"Pure ____ led her to open the mysterious box.", stem:"CURIOUS", ans:["curiosity"], tags:["wfnoun","spell"], diff:2, exp:"curious → curiosity.", trap:"Drop the U of -ous: curiOsity."},
{id:"w22", s:"He hid his ____ behind a confident smile.", stem:"ANXIOUS", ans:["anxiety"], tags:["wfnoun","spell"], diff:3, exp:"anxious → anxiety.", trap:"anxiety has no 'ous' — the form changes completely."},
{id:"w23", s:"The menu offers a wide ____ of vegetarian dishes.", stem:"VARY", ans:["variety"], tags:["wfnoun"], diff:2, exp:"vary → variety.", trap:"'variation' exists but 'a wide variety of' is the collocation."},
{id:"w24", s:"A daily walk is hugely ____ for your concentration.", stem:"BENEFIT", ans:["beneficial"], tags:["wfadj"], diff:2, exp:"benefit → beneficial.", trap:"'beneficious' doesn’t exist."},
{id:"w25", s:"Buying in bulk is usually more ____ than shopping daily.", stem:"ECONOMY", ans:["economical"], tags:["wfadj"], diff:4, exp:"economical = money-saving. economic = relating to the economy.", trap:"THE classic pair: economic growth / an economical car."},
{id:"w26", s:"The country’s ____ growth slowed sharply last year.", stem:"ECONOMY", ans:["economic"], tags:["wfadj"], diff:4, exp:"economic = of the economy.", trap:"The mirror of w25 — meaning decides the suffix."},
{id:"w27", s:"Who is ____ for booking the rehearsal room this week?", stem:"RESPONSE", ans:["responsible"], tags:["wfadj"], diff:2, exp:"response → responsible.", trap:"-IBLE not -ABLE: responsible."},
{id:"w28", s:"She has an impressive ____ of medieval history.", stem:"KNOW", ans:["knowledge"], tags:["wfnoun","spell"], diff:2, exp:"know → knowledge.", trap:"Spelling: knowLEDGE — d before g."},
{id:"w29", s:"The rapid ____ of the city has put pressure on housing.", stem:"GROW", ans:["growth"], tags:["wfnoun"], diff:1, exp:"grow → growth.", trap:"No E: growth."},
{id:"w30", s:"Our ____ to Buenos Aires was delayed by fog.", stem:"FLY", ans:["flight"], tags:["wfnoun","spell"], diff:1, exp:"fly → flight.", trap:"Irregular formation — not 'flying' in this slot."},
{id:"w31", s:"Going freelance was a brave ____ that paid off.", stem:"CHOOSE", ans:["choice"], tags:["wfnoun","spell"], diff:2, exp:"choose → choice.", trap:"Spelling: choice, not 'choise' or 'chose'."},
{id:"w32", s:"The ____ of the championship final still hurts the fans.", stem:"LOSE", ans:["loss"], tags:["wfnoun","spell"], diff:2, exp:"lose → loss.", trap:"loss (noun) / lose (verb) / loose (adjective) — three different words."},
{id:"w33", s:"The bridge can support a maximum ____ of forty tonnes.", stem:"WEIGH", ans:["weight"], tags:["wfnoun","spell"], diff:1, exp:"weigh → weight.", trap:"Spelling: weiGHt."},
{id:"w34", s:"It is my firm ____ that practice beats talent.", stem:"BELIEVE", ans:["belief"], tags:["wfnoun","spell"], diff:2, exp:"believe → belief.", trap:"The noun loses the final -ve: belief."},
{id:"w35", s:"Old smartphones are rarely ____ after five years of updates.", stem:"RELY", ans:["reliable"], tags:["wfadj","spell"], diff:2, exp:"rely → reliable (y → i).", trap:"reliAble — i before a."},
{id:"w36", s:"Plastic waste causes lasting ____ damage.", stem:"ENVIRONMENT", ans:["environmental"], tags:["wfadj","spell"], diff:1, exp:"environment → environmental.", trap:"Keep the N: environNmental? No — enviroNMENTal, one N before m? Spell it: e-n-v-i-r-o-n-m-e-n-t-a-l."},
{id:"w37", s:"____ , the storm passed before the open-air concert began.", stem:"FORTUNE", ans:["fortunately"], tags:["wfadv"], diff:2, exp:"fortune → fortunately (sentence adverb).", trap:"Polarity check: the news is good, so not 'unfortunately'."},
{id:"w38", s:"____ , the tickets had sold out by the time we arrived.", stem:"LUCK", ans:["unluckily","unfortunately"], tags:["wfadv","wfneg"], diff:3, exp:"Bad news → UNluckily.", trap:"The negative prefix trap in adverb form."},
{id:"w39", s:"These chairs look stylish but are deeply ____ to sit on.", stem:"COMFORT", ans:["uncomfortable"], tags:["wfadj","wfneg"], diff:2, exp:"'but' flips the polarity → UNcomfortable.", trap:"BUT is the signal word for the negative."},
{id:"w40", s:"He drummed his fingers ____ while the page loaded.", stem:"PATIENT", ans:["impatiently"], tags:["wfadv","wfneg"], diff:3, exp:"patient → impatient → impatiently. Double transformation.", trap:"im- before p, AND the -ly: two changes, one word."},
{id:"w41", s:"The actor answered every question with great ____ .", stem:"HONEST", ans:["honesty"], tags:["wfnoun"], diff:2, exp:"honest → honesty.", trap:"'honestity' doesn’t exist."},
{id:"w42", s:"It is ____ to park within ten metres of a junction.", stem:"LEGAL", ans:["illegal"], tags:["wfadj","wfneg"], diff:2, exp:"Rule about NOT doing something → ILlegal (il- before l).", trap:"unlegal/inlegal — the prefix must match the first letter."},
{id:"w43", s:"Finishing the report by Friday is a near ____ .", stem:"POSSIBLE", ans:["impossibility"], tags:["wfnoun","wfneg"], diff:4, exp:"possible → impossible → impossibility: prefix + suffix.", trap:"Double-step words are Cambridge’s favourite hard item."},
{id:"w44", s:"The bus service here is famously ____ .", stem:"REGULAR", ans:["irregular","unreliable"], tags:["wfadj","wfneg"], diff:3, exp:"'famously' + complaint context → IRregular (ir- before r).", trap:"ir- only before r: irregular, irresponsible, irresistible."},
{id:"w45", s:"The smell of fresh bread proved utterly ____ .", stem:"RESIST", ans:["irresistible"], tags:["wfadj","wfneg","spell"], diff:4, exp:"resist → irresistible: ir- prefix AND -ible suffix.", trap:"Double R, then -IBLE: ir-resist-ible."},
{id:"w46", s:"A simple ____ about the dates caused the whole delay.", stem:"UNDERSTAND", ans:["misunderstanding"], tags:["wfnoun","wfneg"], diff:3, exp:"mis- + understanding = wrong understanding.", trap:"MIS- (wrongly), not UN- (not)."},
{id:"w47", s:"The head teacher will not tolerate ____ in class.", stem:"BEHAVE", ans:["misbehaviour","misbehavior"], tags:["wfnoun","wfneg"], diff:3, exp:"behave → misbehaviour.", trap:"'not tolerate' tells you the word is negative."},
{id:"w48", s:"The sudden ____ of the paintings baffled the police.", stem:"APPEAR", ans:["disappearance"], tags:["wfnoun","wfneg"], diff:3, exp:"appear → disappearance ('baffled the police' implies they vanished).", trap:"dis- + appearance; double check -ANCE."},
{id:"w49", s:"Despite the rain, the players showed no ____ to leave the pitch.", stem:"WILLING", ans:["unwillingness","willingness"], tags:["wfnoun","wfneg"], diff:4, exp:"'no willingness to leave' = they wanted to stay; 'no unwillingness' double-negates awkwardly — Cambridge would accept willingness.", trap:"When NO precedes the gap, the noun itself usually stays positive."},
{id:"w50", s:"You need the manager’s ____ before ordering new stock.", stem:"APPROVE", ans:["approval"], tags:["wfnoun"], diff:2, exp:"approve → approval.", trap:"-AL noun: approval, arrival, refusal."},
{id:"w51", s:"Her ____ in the final round earned a standing ovation.", stem:"PERFORM", ans:["performance"], tags:["wfnoun"], diff:1, exp:"perform → performance.", trap:"-ANCE not -ENCE: performance."},
{id:"w52", s:"____ at the workshop is optional but recommended.", stem:"ATTEND", ans:["attendance"], tags:["wfnoun"], diff:2, exp:"attend → attendance.", trap:"-ANCE again — attendance."},
{id:"w53", s:"The two countries finally reached an ____ on fishing rights.", stem:"AGREE", ans:["agreement"], tags:["wfnoun"], diff:1, exp:"agree → agreement.", trap:"If the sentence had been about conflict, DISagreement — always check."},
{id:"w54", s:"Thick fog reduced ____ to less than fifty metres.", stem:"VISIBLE", ans:["visibility"], tags:["wfnoun"], diff:2, exp:"visible → visibility.", trap:"-ITY noun from -IBLE adjective."},
{id:"w55", s:"The hotel apologised for the ____ caused by the building work.", stem:"CONVENIENT", ans:["inconvenience"], tags:["wfnoun","wfneg"], diff:3, exp:"'apologised for' → something bad → INconvenience.", trap:"Negative prefix + noun suffix: in-convenien-ce."},
{id:"w56", s:"Sales figures grew ____ during the holiday season.", stem:"DRAMA", ans:["dramatically"], tags:["wfadv","spell"], diff:3, exp:"drama → dramatic → dramatically.", trap:"-ic → -ically: dramatICALLY, not 'dramaticly'."},
{id:"w57", s:"____ , the museum is closed on the only day I’m free.", stem:"FORTUNE", ans:["unfortunately"], tags:["wfadv","wfneg"], diff:2, exp:"Bad news → UNfortunately.", trap:"Compare w37 — same stem, opposite polarity. Context is everything."},
{id:"w58", s:"The team’s ____ to detail is what wins them contracts.", stem:"ATTEND", ans:["attention"], tags:["wfnoun"], diff:3, exp:"attend → attention (attention to detail).", trap:"Same stem as w52, different noun — collocation decides: attention to detail."},
];

/* ---------- Multiple-Choice Cloze (Part 1 style) ---------- */
FCE.BANK.mcc = [
{id:"m01", s:"I’m afraid I ____ a serious mistake in the booking.", opts:["did","made","took","put"], cor:1, tags:["col","fix"], diff:1, exp:"MAKE a mistake — core collocation.", trap:"DO is the eternal bait with mistake/decision/effort."},
{id:"m02", s:"____ rain forced the organisers to move the ceremony indoors.", opts:["Strong","Hard","Heavy","Powerful"], cor:2, tags:["col"], diff:1, exp:"HEAVY rain (also heavy traffic, heavy smoker).", trap:"STRONG collocates with wind and coffee, not rain."},
{id:"m03", s:"Could you make me a cup of really ____ coffee?", opts:["heavy","strong","powerful","deep"], cor:1, tags:["col"], diff:1, exp:"STRONG coffee.", trap:"The mirror of m02 — swap the partners and both fail."},
{id:"m04", s:"If you don’t wear a scarf, you’ll ____ a cold.", opts:["take","catch","get on","win"], cor:1, tags:["col"], diff:1, exp:"CATCH a cold (illnesses are caught).", trap:"'take a cold' calques from several languages."},
{id:"m05", s:"Hurry up or we’ll ____ the last bus home.", opts:["lose","miss","fail","skip"], cor:1, tags:["col"], diff:1, exp:"MISS the bus/train/flight.", trap:"LOSE the bus is the classic L1 transfer error."},
{id:"m06", s:"Whatever happens, always ____ the truth.", opts:["say","speak","tell","talk"], cor:2, tags:["col","fix"], diff:1, exp:"TELL the truth (also tell a lie, tell a story).", trap:"SAY the truth — wrong partner."},
{id:"m07", s:"Despite months of therapy, the rumour did lasting ____ to her career.", opts:["damage","hurt","wound","break"], cor:0, tags:["col"], diff:3, exp:"DO damage (do harm, do good).", trap:"All four 'mean' injury; only damage partners with DO."},
{id:"m08", s:"The students have ____ remarkable progress this term.", opts:["done","made","taken","given"], cor:1, tags:["col"], diff:1, exp:"MAKE progress.", trap:"DO progress is the bait — progress is created, so MAKE."},
{id:"m09", s:"The award ceremony will ____ place in the town hall.", opts:["take","have","get","hold"], cor:0, tags:["fix"], diff:1, exp:"TAKE place = happen.", trap:"HOLD an event is fine, but the fixed phrase is take place."},
{id:"m10", s:"After hours of negotiation, the two sides finally ____ an agreement.", opts:["arrived","reached","got","came"], cor:1, tags:["col"], diff:2, exp:"REACH an agreement (also reach a decision/conclusion).", trap:"ARRIVE AT an agreement needs AT; bare 'arrived' fails."},
{id:"m11", s:"She ____ the world record by almost half a second.", opts:["beat","won","broke","defeated"], cor:2, tags:["col"], diff:2, exp:"BREAK a record.", trap:"You BEAT people, WIN prizes, BREAK records."},
{id:"m12", s:"Whatever you promised, you must ____ your word.", opts:["hold","keep","stay","save"], cor:1, tags:["col","fix"], diff:2, exp:"KEEP your word/promise.", trap:"HOLD your word — almost right, completely wrong."},
{id:"m13", s:"He ____ his temper when the referee ignored the foul.", opts:["lost","missed","dropped","broke"], cor:0, tags:["col","fix"], diff:2, exp:"LOSE your temper = get angry.", trap:"BREAK your temper doesn’t exist."},
{id:"m14", s:"The school fair ____ over two thousand euros for charity.", opts:["raised","rose","lifted","earned"], cor:0, tags:["col"], diff:2, exp:"RAISE money (for charity).", trap:"RISE is intransitive — it can’t take an object."},
{id:"m15", s:"It’s getting harder to ____ a living as a freelance photographer.", opts:["win","gain","earn","make do"], cor:2, tags:["col","fix"], diff:2, exp:"EARN a living (also make a living).", trap:"WIN a living — money is earned, not won."},
{id:"m16", s:"I didn’t ____ the joke until everyone had stopped laughing.", opts:["catch","get","take","realise"], cor:1, tags:["col","pv"], diff:2, exp:"GET a joke = understand it.", trap:"REALISE needs a clause, and you don’t 'catch' jokes in standard usage."},
{id:"m17", s:"The committee ____ to a unanimous conclusion after midnight.", opts:["came","reached","arrived","drew"], cor:0, tags:["col","prep"], diff:3, exp:"COME TO a conclusion (the TO is already in the sentence).", trap:"REACH a conclusion is right WITHOUT 'to' — the preposition decides."},
{id:"m18", s:"My grandparents ____ me up while my parents worked abroad.", opts:["grew","brought","raised up","carried"], cor:1, tags:["pv"], diff:2, exp:"BRING somebody UP = raise a child.", trap:"GROW UP is what the child does; RAISE never takes 'up'."},
{id:"m19", s:"This song always ____ me of our summer in Galicia.", opts:["remembers","reminds","recalls","memorises"], cor:1, tags:["col"], diff:2, exp:"REMIND somebody OF something.", trap:"REMEMBER can’t take a person + of: things remind YOU."},
{id:"m20", s:"The new tax will mainly ____ small online businesses.", opts:["effect","affect","afflict","infect"], cor:1, tags:["col","spell"], diff:3, exp:"AFFECT (verb) = have an effect on.", trap:"EFFECT is the noun; the verb slot wants affect."},
{id:"m21", s:"The team’s confidence ____ after the third straight defeat.", opts:["sank","drowned","dipped under","descended"], cor:0, tags:["col"], diff:4, exp:"Confidence/spirits SANK.", trap:"All options are 'go down' words; only sink collocates with confidence."},
{id:"m22", s:"We had great ____ finding a parking space near the stadium.", opts:["problem","difficulty","obstacle","effort"], cor:1, tags:["col","ger"], diff:3, exp:"have difficulty + -ing.", trap:"'great problem' would need 'a'; difficulty is uncountable here."},
{id:"m23", s:"The travel agency ____ us a full refund for the cancelled tour.", opts:["proposed","suggested","offered","invited"], cor:2, tags:["ger","col"], diff:2, exp:"OFFER somebody something.", trap:"SUGGEST never takes person + object: 'suggested us' is impossible."},
{id:"m24", s:"The doctor ____ him to cut down on sugary drinks.", opts:["said","suggested","advised","insisted"], cor:2, tags:["rep","ger"], diff:2, exp:"ADVISE somebody TO do.", trap:"SAY and INSIST can’t take object + to-infinitive."},
{id:"m25", s:"They ____ us from entering the site without helmets.", opts:["avoided","prevented","refused","forbade to"], cor:1, tags:["prep","rep"], diff:3, exp:"PREVENT somebody FROM + -ing.", trap:"AVOID takes -ing but no object+from; the FROM in the sentence decides."},
{id:"m26", s:"He flatly ____ to apologise for the comment.", opts:["denied","refused","rejected","resisted"], cor:1, tags:["ger","rep"], diff:3, exp:"REFUSE TO do.", trap:"DENY + -ing (deny doing); refuse + to — the TO in the sentence is the clue."},
{id:"m27", s:"She ____ ever having seen the document before.", opts:["refused","denied","rejected","disagreed"], cor:1, tags:["ger","rep"], diff:3, exp:"DENY + -ing (having seen).", trap:"The mirror of m26 — the -ING after the gap is the clue."},
{id:"m28", s:"I’ll lend you my notes ____ you photocopy them today.", opts:["unless","in case","provided","whether"], cor:2, tags:["cond","link"], diff:3, exp:"PROVIDED (that) = on condition that.", trap:"UNLESS would reverse the logic; IN CASE is preparation, not condition."},
{id:"m29", s:"Take some cash ____ the card machine isn’t working.", opts:["unless","in case","so that","provided"], cor:1, tags:["cond","link"], diff:3, exp:"IN CASE = as a precaution.", trap:"SO THAT expresses purpose, not precaution."},
{id:"m30", s:"____ the high price, the concert sold out in minutes.", opts:["Although","Despite","Even though","However"], cor:1, tags:["link"], diff:2, exp:"DESPITE + noun phrase.", trap:"Although/even though need a clause with a verb."},
{id:"m31", s:"I had ____ finished dinner when the doorbell rang.", opts:["yet","hardly","almost not","nearly not"], cor:1, tags:["fix","inv"], diff:3, exp:"HARDLY = only just.", trap:"'almost not finished' is not natural English."},
{id:"m32", s:"____ to the forecast, the heatwave will break on Friday.", opts:["According","Regarding","Referring","Depending"], cor:0, tags:["depprep","link"], diff:2, exp:"ACCORDING to = as stated by.", trap:"All four take TO, but only ACCORDING reports a source."},
{id:"m33", s:"We left at dawn ____ to avoid the holiday traffic.", opts:["for","so as","in order that","because"], cor:1, tags:["link","ger"], diff:3, exp:"SO AS to + infinitive = purpose.", trap:"IN ORDER THAT needs a clause; the TO after the gap decides."},
{id:"m34", s:"The instructions were ____ confusing that nobody finished the task.", opts:["such","so","too","very"], cor:1, tags:["comp","det"], diff:2, exp:"SO + adjective + that.", trap:"SUCH needs a noun; TOO doesn’t combine with that-clauses."},
{id:"m35", s:"It was ____ a tense match that I could barely watch.", opts:["so","such","too","quite"], cor:1, tags:["comp","det"], diff:2, exp:"SUCH + a + adjective + noun + that.", trap:"The mirror of m34 — the noun 'match' demands SUCH."},
{id:"m36", s:"You can ____ my number from reception if you lose it.", opts:["lend","borrow","get","rent"], cor:2, tags:["col"], diff:2, exp:"GET information from somewhere.", trap:"BORROW/LEND apply to things you return — not phone numbers."},
{id:"m37", s:"Could you ____ me your charger until lunchtime?", opts:["borrow","lend","rent","loan to"], cor:1, tags:["col"], diff:1, exp:"LEND = give temporarily (lender’s side).", trap:"BORROW is the receiver’s verb: I borrow FROM you, you lend TO me."},
{id:"m38", s:"The museum was ____ interesting than the guidebook suggested.", opts:["very","far more","much","most"], cor:1, tags:["comp"], diff:2, exp:"FAR MORE + adjective + than.", trap:"'much interesting' lacks MORE; 'very' can’t modify a comparative."},
{id:"m39", s:"The view from the lighthouse simply ____ our breath away.", opts:["took","caught","stole","blew"], cor:0, tags:["fix"], diff:2, exp:"TAKE your breath away = amaze.", trap:"BLEW is tempting via 'blew us away' — but breath pairs with TAKE."},
{id:"m40", s:"I’m not in the ____ for a party tonight, honestly.", opts:["feeling","spirit","mood","sense"], cor:2, tags:["fix"], diff:2, exp:"be in the MOOD for = feel like.", trap:"SPIRIT(S) is about morale, not desire."},
{id:"m41", s:"The startup went ____ after barely a year of trading.", opts:["broke","bankrupt","poor","penniless"], cor:1, tags:["col"], diff:3, exp:"GO BANKRUPT (companies).", trap:"GO BROKE is informal/personal; companies go bankrupt."},
{id:"m42", s:"Volunteers ____ a vital part in the festival’s success.", opts:["make","play","do","hold"], cor:1, tags:["col","fix"], diff:2, exp:"PLAY a part/role in.", trap:"MAKE a part — wrong partner; roles are played."},
{id:"m43", s:"The trial ____ several weaknesses in the security system.", opts:["showed up","revealed","appeared","emerged"], cor:1, tags:["col"], diff:3, exp:"REVEAL weaknesses (transitive).", trap:"EMERGE/APPEAR are intransitive — they can’t take an object."},
{id:"m44", s:"I can’t ____ the difference between the twins.", opts:["say","tell","notice on","make"], cor:1, tags:["fix","col"], diff:2, exp:"TELL the difference = distinguish.", trap:"SAY the difference — same trap family as say/tell the truth."},
{id:"m45", s:"The festival was called off ____ to the approaching storm.", opts:["due","owing for","because","thanks"], cor:0, tags:["link","depprep"], diff:2, exp:"DUE TO = because of.", trap:"BECAUSE needs OF before a noun; THANKS TO is for positive causes."},
{id:"m46", s:"She takes ____ her role as captain very seriously.", opts:["over","on","up","after"], cor:1, tags:["pv"], diff:3, exp:"TAKE ON a role/responsibility.", trap:"Take over = seize control; take up = start a hobby; take after = resemble."},
{id:"m47", s:"It took her months to get ____ the disappointment of the rejection.", opts:["over","through","across","by"], cor:0, tags:["pv"], diff:2, exp:"GET OVER = recover from.", trap:"GET THROUGH = survive/finish — close, but the idiom for recovery is get over."},
{id:"m48", s:"How do you ____ up with such a noisy flatmate?", opts:["take","put","get","stand"], cor:1, tags:["pv"], diff:2, exp:"PUT up with = tolerate.", trap:"STAND alone means tolerate, but with 'up with' only PUT works."},
{id:"m49", s:"The deal fell ____ at the last minute over payment terms.", opts:["off","down","through","apart"], cor:2, tags:["pv"], diff:4, exp:"FALL THROUGH = (of plans) fail to happen.", trap:"Fall apart = disintegrate; fall down = collapse physically."},
{id:"m50", s:"I came ____ a fascinating podcast about memory athletes.", opts:["across","up","over","into"], cor:0, tags:["pv"], diff:2, exp:"COME ACROSS = find by chance.", trap:"Come up with = invent — needs 'with'."},
{id:"m51", s:"Be sensible — don’t let one bad mark ____ you off studying.", opts:["take","put","set","turn"], cor:1, tags:["pv"], diff:3, exp:"PUT somebody OFF something = discourage.", trap:"Turn off = switch off / repel romantically; the study idiom is put off."},
{id:"m52", s:"Her acting career really took ____ after that TV series.", opts:["off","up","over","on"], cor:0, tags:["pv"], diff:2, exp:"TAKE OFF = suddenly succeed.", trap:"Careers take OFF like planes — up/over/on all fail."},
{id:"m53", s:"We’ve ____ out of printer paper again.", opts:["gone","used","run","finished"], cor:2, tags:["pv"], diff:1, exp:"RUN out of = exhaust the supply.", trap:"USED UP would need no 'out of'."},

/* ===== js/engine.js ===== */
/* FCE Mastery — adaptive engine. 100% local: Elo ability tracking, per-skill mastery
   with forgetting curves, SM-2-style spaced repetition, confidence calibration,
   mistake-DNA, Cambridge-scale score prediction, and the study coach. */
window.FCE = window.FCE || {};
(function(){
var E = FCE.engine = {};
var KEY = 'fce-mastery-state-v1';
var DAY = 86400000;

/* ---------------- state ---------------- */
E.blank = function(){
  return {
    v:1, name:'', examDate:'', createdAt:Date.now(), onboarded:false,
    settings:{dailyGoal:20, emergency:false},
    xp:0, streak:{count:0, last:''}, badges:[], records:{bestRun:0, bestAcc:0, total:0},
    week:{id:'', counts:{}},
    ability:{kwt:1150, cloze:1150, wf:1150, mcc:1150},
    tags:{},        // tagId -> {att,cor,m,last,lapses,causes:{},hist:[]}
    items:{},       // itemId -> {att,cor,last,due,ivl,ease,lapses,conf:''}
    gaps:{},        // gapType -> {att,cor,recent:[]}
    calib:{g:{att:0,cor:0}, f:{att:0,cor:0}, s:{att:0,cor:0}},
    log:[],         // {t,id,type,tags,gt,ok,conf,ms,cause,ans,user}
    sessions:[],    // {t,n,ok,type}
    mocks:[],       // {t,score,max,scale,parts}
    trend:[],       // rolling per-session accuracy {t,acc,n}
  };
};
E.state = null;
E.load = function(){
  try{
    var raw = localStorage.getItem(KEY);
    E.state = raw ? JSON.parse(raw) : E.blank();
  }catch(e){ E.state = E.blank(); }
  if(!E.state.v) E.state = E.blank();
  return E.state;
};
E.save = function(){ try{ localStorage.setItem(KEY, JSON.stringify(E.state)); }catch(e){} };
E.reset = function(){ E.state = E.blank(); E.save(); };
E.export = function(){ return JSON.stringify(E.state, null, 1); };
E.import = function(json){ var s = JSON.parse(json); if(!s || !s.v) throw new Error('bad file'); E.state = s; E.save(); };

/* ---------------- item access ---------------- */
E.allItems = function(){
  var B = FCE.BANK, out = [];
  B.kwt.forEach(function(q){ out.push({q:q, type:'kwt'}); });
  B.cloze.forEach(function(q){ out.push({q:q, type:'cloze'}); });
  B.wf.forEach(function(q){ out.push({q:q, type:'wf'}); });
  B.mcc.forEach(function(q){ out.push({q:q, type:'mcc'}); });
  return out;
};
E.byId = {};
E.indexBank = function(){
  E.allItems().forEach(function(it){ E.byId[it.q.id] = it; });
};
E.itemState = function(id){
  var s = E.state.items[id];
  if(!s){ s = E.state.items[id] = {att:0,cor:0,last:0,due:0,ivl:0,ease:2.3,lapses:0,conf:''}; }
  return s;
};
E.tagState = function(tag){
  var s = E.state.tags[tag];
  if(!s){ s = E.state.tags[tag] = {att:0,cor:0,m:0.5,last:0,lapses:0,causes:{},hist:[]}; }
  return s;
};

/* ---------------- normalization & grading ---------------- */
E.norm = function(s){
  return String(s||'').toLowerCase()
    .replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"')
    .replace(/\s+/g,' ').trim()
    .replace(/[.!?,;:]+$/g,'').trim();
};
E.wordCount = function(s){
  var t = E.norm(s); if(!t) return 0;
  var toks = t.split(' '), n = 0;
  toks.forEach(function(w){
    n += 1;
    // Cambridge rule: contractions count as two words (isn't = is not). Possessive 's is ambiguous; we follow the contraction rule.
    if(/[a-z]'(t|s|ll|re|ve|d|m)\b/.test(w)) n += 1;
  });
  return n;
};
E.gradeKWT = function(q, user){
  var u = E.norm(user);
  var full = q.ans.some(function(a){ return E.norm(a) === u; });
  if(full) return {score:2, ok:true};
  var hits = 0;
  q.halves.forEach(function(h){
    if(h.some(function(a){ return u.indexOf(E.norm(a)) !== -1; })) hits++;
  });
  return {score: hits >= 2 ? 1 : (hits === 1 ? 1 : 0), ok:false};
};
E.gradeOne = function(q, user){ // cloze + wf: exact one-word match against list
  var u = E.norm(user);
  return q.ans.some(function(a){ return E.norm(a) === u; });
};

/* ---------------- Elo ability & difficulty ---------------- */
E.qElo = function(q){ return 950 + (q.diff||2)*110; };           // diff 1..5 -> 1060..1500
E.pWin = function(ability, qe){ return 1/(1+Math.pow(10,(qe-ability)/400)); };
E.updAbility = function(type, q, ok){
  var a = E.state.ability, n = E.state.records.total;
  var k = n < 30 ? 40 : (n < 120 ? 28 : 18);
  var p = E.pWin(a[type], E.qElo(q));
  a[type] = Math.max(700, Math.min(1700, a[type] + k*((ok?1:0)-p)));
};

/* ---------------- mastery with forgetting ---------------- */
E.recordTag = function(tag, ok, weight){
  var t = E.tagState(tag);
  t.att++; if(ok) t.cor++;
  var alpha = Math.max(0.12, 1/(t.att)) * (weight||1);
  alpha = Math.min(0.5, alpha);
  t.m = Math.max(0, Math.min(1, t.m + alpha*((ok?1:0) - t.m)));
  if(!ok) t.lapses++;
  t.last = Date.now();
  t.hist.push(ok?1:0); if(t.hist.length>30) t.hist.shift();
};
E.mEff = function(tag){ // mastery decayed toward 0.5 (uncertainty) with time unseen
  var t = E.state.tags[tag];
  if(!t || !t.att) return null;
  var days = (Date.now()-t.last)/DAY;
  return 0.5 + (t.m-0.5)*Math.exp(-days/12);
};
E.tagTrend = function(tag){ // recent half vs older half of hist
  var t = E.state.tags[tag];
  if(!t || t.hist.length < 6) return 0;
  var h = t.hist, mid = Math.floor(h.length/2);
  var a = h.slice(0,mid), b = h.slice(mid);
  var av = a.reduce(function(x,y){return x+y;},0)/a.length;
  var bv = b.reduce(function(x,y){return x+y;},0)/b.length;
  return bv - av;
};

/* ---------------- spaced repetition (compressed for exam-week cramming) ---------------- */
E.schedule = function(id, ok, conf){
  var it = E.itemState(id), now = Date.now();
  if(ok){
    var lucky = (conf === 'g'); // lucky guess: re-test soon, half credit to interval
    if(it.ivl === 0) it.ivl = lucky ? 0.25 : 1;
    else it.ivl = Math.min(15, it.ivl * (lucky ? 1.2 : it.ease));
    it.ease = Math.min(2.8, it.ease + (conf==='s' ? 0.08 : 0.02));
  }else{
    it.lapses++; it.ivl = 0.2; // ~5h
    it.ease = Math.max(1.4, it.ease - (conf==='s' ? 0.3 : 0.18)); // false confidence hits harder
  }
  it.due = now + it.ivl*DAY;
};
E.dueItems = function(){
  var now = Date.now(), out = [];
  Object.keys(E.state.items).forEach(function(id){
    var it = E.state.items[id];
    if(it.att > 0 && it.due && it.due <= now && E.byId[id]) out.push(id);
  });
  out.sort(function(a,b){ return E.state.items[a].due - E.state.items[b].due; });
  return out;
};
E.leeches = function(){ // items failed 3+ times -> memory lab
  return Object.keys(E.state.items).filter(function(id){
    var it = E.state.items[id];
    return it.lapses >= 3 && E.byId[id];
  });
};

/* ---------------- the master record call ---------------- */
E.record = function(q, type, ok, conf, ms, user, cause, opts){
  opts = opts || {};
  var st = E.state, now = Date.now();
  // weight: certain-but-wrong counts extra (false confidence), guess-and-right counts half (lucky)
  var w = 1;
  if(!ok && conf==='s') w = 1.5;
  if(ok && conf==='g') w = 0.5;
  (q.tags||[]).forEach(function(t){ E.recordTag(t, ok, w); });
  if(type==='cloze' && q.gt){
    var g = st.gaps[q.gt] || (st.gaps[q.gt]={att:0,cor:0,recent:[]});
    g.att++; if(ok) g.cor++;
    g.recent.push(ok?1:0); if(g.recent.length>14) g.recent.shift();
  }
  var it = E.itemState(q.id);
  it.att++; if(ok) it.cor++; it.last = now; it.conf = conf;
  E.schedule(q.id, ok, conf);
  E.updAbility(type, q, ok);
  if(conf && st.calib[conf]){ st.calib[conf].att++; if(ok) st.calib[conf].cor++; }
  st.log.push({t:now, id:q.id, type:type, tags:q.tags||[], gt:q.gt||'', ok:ok?1:0,
               conf:conf, ms:ms||0, cause:cause||'', user:String(user||'').slice(0,80)});
  if(st.log.length > 1500) st.log = st.log.slice(-1200);
  // gamification
  st.records.total++;
  if(ok){ st.xp += 8 + (q.diff||2)*4 + (conf==='s'?3:0); } else { st.xp += 2; }
  E.touchStreak();
  E.bumpWeek(type, ok);
  if(!opts.quiet){ E.checkBadges(opts.runStreak||0); }
  E.save();
};
E.setCause = function(cause){ // attach cause to last log entry + tag stats
  var l = E.state.log[E.state.log.length-1];
  if(!l || l.ok) return;
  l.cause = cause;
  (l.tags||[]).forEach(function(t){
    var ts = E.tagState(t);
    ts.causes[cause] = (ts.causes[cause]||0)+1;
  });
  E.save();
};

/* ---------------- streak / week / badges ---------------- */
E.today = function(){ return new Date().toISOString().slice(0,10); };
E.touchStreak = function(){
  var s = E.state.streak, today = E.today();
  if(s.last === today) return;
  var y = new Date(Date.now()-DAY).toISOString().slice(0,10);
  s.count = (s.last === y) ? s.count+1 : 1;
  s.last = today;
};
E.weekId = function(){
  var d = new Date(); var onejan = new Date(d.getFullYear(),0,1);
  var wk = Math.ceil((((d - onejan)/DAY) + onejan.getDay()+1)/7);
  return d.getFullYear()+'-'+wk;
};
E.challenge = function(){
  var wid = E.weekId();
  if(E.state.week.id !== wid){ E.state.week = {id:wid, counts:{}}; }
  var list = FCE.CHALLENGES;
  var idx = parseInt(wid.split('-')[1],10) % list.length;
  var ch = list[idx];
  var c = E.state.week.counts;
  var prog = ch.type==='correct' ? (c.correct||0) : (c[ch.type]||0);
  return {ch:ch, prog:Math.min(prog, ch.n), done:prog>=ch.n};
};
E.bumpWeek = function(type, ok){
  E.challenge(); // ensures week reset
  var c = E.state.week.counts;
  c[type] = (c[type]||0)+1;
  if(ok) c.correct = (c.correct||0)+1;
};
E.award = function(id){
  if(E.state.badges.indexOf(id) !== -1) return false;
  E.state.badges.push(id);
  var b = FCE.BADGES.filter(function(x){return x.id===id;})[0];
  if(b && FCE.ui && FCE.ui.toast) FCE.ui.toast(b.icon+' Badge earned: <b>'+b.name+'</b>', 'gold');
  return true;
};
E.checkBadges = function(runStreak){
  var st = E.state;
  if(st.records.total >= 50) E.award('q50');
  if(st.records.total >= 200) E.award('q200');
  if(st.streak.count >= 3) E.award('streak3');
  if(st.streak.count >= 7) E.award('streak7');
  if(runStreak >= 10) E.award('perfect10');
  if(st.calib.s.att >= 25 && st.calib.s.cor/st.calib.s.att >= 0.9) E.award('calib');
  var types = {}; st.log.forEach(function(l){ types[l.type]=1; });
  if(types.kwt && types.cloze && types.wf && types.mcc) E.award('allparts');
  // comeback: an item with >=3 lapses now at 2+ consecutive correct (ivl>=2)
  var cb = Object.keys(st.items).some(function(id){ var it=st.items[id]; return it.lapses>=3 && it.ivl>=2; });
  if(cb) E.award('comeback');
};

/* ---------------- score predictor (Cambridge scale 122–190) ---------------- */
E.expectedAccuracy = function(){
  // marks-weighted: P1 8, P2 8, P3 8, P4 12 of 36
  var a = E.state.ability;
  var acc = {};
  ['kwt','cloze','wf','mcc'].forEach(function(t){
    // expected accuracy vs a mid-difficulty (diff 3) item
    acc[t] = E.pWin(a[t], 950+3*110);
  });
  var p = (8*acc.mcc + 8*acc.cloze + 8*acc.wf + 12*acc.kwt) / 36;
  return {p:p, per:acc};
};
E.predict = function(){
  var n = E.state.records.total;
  var ex = E.expectedAccuracy(), p = ex.p;
  // blend with recent observed accuracy when available
  var recent = E.state.log.slice(-60);
  if(recent.length >= 10){
    var obs = recent.reduce(function(x,l){return x+l.ok;},0)/recent.length;
    p = 0.6*p + 0.4*obs;
  }
  // piecewise map accuracy -> Cambridge scale
  var map = [[0,128],[0.30,145],[0.45,155],[0.55,160],[0.70,170],[0.82,180],[0.92,188],[1,190]];
  var scale = 128;
  for(var i=0;i<map.length-1;i++){
    if(p >= map[i][0] && p <= map[i+1][0]){
      var f = (p-map[i][0])/(map[i+1][0]-map[i][0] || 1);
      scale = map[i][1] + f*(map[i+1][1]-map[i][1]);
      break;
    }
  }
  // mock results carry real weight
  if(E.state.mocks.length){
    var last = E.state.mocks[E.state.mocks.length-1];
    scale = 0.55*scale + 0.45*last.scale;
  }
  var ci = Math.max(2.5, 22/Math.sqrt(n+3)); // narrows with evidence
  var sd = ci/1.6;
  var phi = function(z){ // standard normal CDF approx
    var t = 1/(1+0.2316419*Math.abs(z));
    var d = 0.3989423*Math.exp(-z*z/2);
    var pr = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
    return z>0 ? 1-pr : pr;
  };
  var pAbove = function(th){ return 1-phi((th-scale)/sd); };
  var pA = pAbove(180), pB = Math.max(0,pAbove(173)-pA), pC = Math.max(0,pAbove(160)-pA-pB);
  return {
    scale:Math.round(scale), ci:Math.round(ci), p:p, n:n, per:ex.per,
    pass:pAbove(160), pA:pA, pB:pB, pC:pC,

/* ---------------- coach: what to study next & why ---------------- */
E.coach = function(){
  var recs = [];
  Object.keys(FCE.TAGS).forEach(function(tag){
    var meta = FCE.TAGS[tag];
    var m = E.mEff(tag);
    var t = E.state.tags[tag];
    var risk, why, seen = !!(t && t.att);
    if(!seen){ risk = 0.45; why = 'Not tested yet — unknown territory is risk.'; }
    else{
      risk = 1 - m;
      var days = (Date.now()-t.last)/DAY;
      if(days > 3 && t.m > 0.6){ risk += 0.12; why = 'Was solid, but untouched for '+Math.round(days)+' days — forgetting has started.'; }
      else if(t.lapses >= 4 && risk > 0.35){ why = 'Repeated misses ('+t.lapses+' errors so far) — a stubborn weakness.'; }
      else if(risk > 0.5){ why = 'Accuracy '+Math.round((t.cor/t.att)*100)+'% over '+t.att+' tries — well below exam-safe.'; }
      else why = 'Fine-tuning: close to mastery, cheap marks available.';
    }
    var cost = meta.weight * Math.max(0, risk - 0.15); // marks at risk vs a strong candidate
    recs.push({tag:tag, name:meta.name, risk:risk, cost:cost, why:why, seen:seen, m:m});
  });
  recs.sort(function(a,b){ return b.cost - a.cost; });
  return recs;
};
E.daysToExam = function(){

E.emergencyOn = function(){

/* ---------------- adaptive question selection ---------------- */
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
E.pickSession = function(n, filter){
  n = n || 10;
  var st = E.state, picked = [], usedTags = [], usedIds = {};
  var pool = E.allItems().filter(function(it){
    if(filter && filter.type && it.type !== filter.type) return false;
    if(filter && filter.tag && (it.q.tags||[]).indexOf(filter.tag) === -1) return false;
    return true;
  });
  var emergency = E.emergencyOn();
  // 1) due reviews first (max 3, or 4 in emergency)
  var due = E.dueItems().filter(function(id){
    var it = E.byId[id];
    if(filter && filter.type && it.type !== filter.type) return false;
    if(filter && filter.tag && (it.q.tags||[]).indexOf(filter.tag) === -1) return false;
    return true;
  }).slice(0, emergency ? 4 : 3);
  due.forEach(function(id){ picked.push(E.byId[id]); usedIds[id]=1; });
  // 2) coach-driven weak-tag targeting with interleaving + difficulty window
  var recs = E.coach().filter(function(r){ return !filter || !filter.tag || r.tag===filter.tag; });
  var weakTags = recs.slice(0, emergency ? 5 : 8).map(function(r){ return r.tag; });
  var tries = 0;
  while(picked.length < n && tries < 400){
    tries++;
    var strengthCheck = Math.random() < 0.15 && recs.length > 4; // desirable difficulty: occasional strength retrieval
    var tagPool = strengthCheck ? recs.slice(-4) : recs.filter(function(r){ return weakTags.indexOf(r.tag)!==-1; });
    if(!tagPool.length) tagPool = recs;
    var rec = tagPool[Math.floor(Math.random()*tagPool.length)];
    var lastTag = usedTags[usedTags.length-1];
    if(rec.tag === lastTag && Math.random() < 0.7) continue; // interleave
    var cands = pool.filter(function(it){
      if(usedIds[it.q.id]) return false;
      if((it.q.tags||[]).indexOf(rec.tag) === -1) return false;
      var ab = st.ability[it.type], qe = E.qElo(it.q);
      var p = E.pWin(ab, qe);
      return p >= 0.25 && p <= 0.92; // the learning zone
    });
    if(!cands.length){
      cands = pool.filter(function(it){ return !usedIds[it.q.id] && (it.q.tags||[]).indexOf(rec.tag) !== -1; });
    }
    if(!cands.length) continue;
    // prefer unseen, then oldest-seen
    cands.sort(function(a,b){
      var ia = st.items[a.q.id], ib = st.items[b.q.id];
      var sa = ia ? ia.last : 0, sb = ib ? ib.last : 0;
      return sa - sb;
    });
    var pick = cands[Math.floor(Math.random()*Math.min(3,cands.length))];
    picked.push(pick); usedIds[pick.q.id]=1; usedTags.push(rec.tag);
  }
  // 3) fallback fill
  if(picked.length < n){
    shuffle(pool).forEach(function(it){
      if(picked.length < n && !usedIds[it.q.id]){ picked.push(it); usedIds[it.q.id]=1; }
    });
  }
  return picked.slice(0,n);
};

E.recordMock = function(score, max, parts){

  var scale = 128;
  for(var i=0;i<map.length-1;i++){
    if(p >= map[i][0] && p <= map[i+1][0]){
      var f = (p-map[i][0])/(map[i+1][0]-map[i][0] || 1);
      scale = Math.round(map[i][1] + f*(map[i+1][1]-map[i][1]));

    }
  }
  E.state.mocks.push({t:Date.now(), score:score, max:max, scale:scale, parts:parts});

  E.save();

};

  back.addEventListener('click', function(ev){ if(ev.target === back) back.remove(); });
  document.body.appendChild(back);
  return back;
};

/* ---------------- stats ---------------- */
U.views.stats = function(){
  var eng = E(), st = eng.state;
  var coach = eng.coach();
  var seen = coach.filter(function(r){ return r.seen; });
  var radarData = seen.slice().sort(function(a,b){ return (E().state.tags[b.tag].att)-(E().state.tags[a.tag].att); })
    .slice(0,8).map(function(r){ return {name:r.name, val:r.m===null?0.5:r.m}; });
  var heat = eng.heatmap();
  var dna = eng.dna();
  var calib = eng.confReality();
  var lf = eng.luckyAndFalse();
  var strongest = seen.slice().sort(function(a,b){ return (b.m||0)-(a.m||0); }).slice(0,3);
  var weakest = seen.slice().sort(function(a,b){ return (a.m||1)-(b.m||1); }).slice(0,3);
  var forgotten = seen.filter(function(r){
    var t = st.tags[r.tag];
    return t && t.m > 0.6 && (Date.now()-t.last)/86400000 > 3;
  }).slice(0,4);
  var avgMs = {};
  ['mcc','cloze','wf','kwt'].forEach(function(tp){
    var ls = st.log.filter(function(l){ return l.type===tp && l.ms>0; }).slice(-25);
    avgMs[tp] = ls.length ? ls.reduce(function(x,l){return x+l.ms;},0)/ls.length/1000 : null;
  });
  var targets = {mcc:45, cloze:45, wf:45, kwt:75};

  var v = el(
    '<div class="h-page">Weakness Radar</div>'+
    '<p class="sub">Perception vs reality, skill by skill. Red cells are where exam marks are bleeding.</p>'+
    '<div class="grid g2" style="margin-bottom:16px">'+
      '<div class="card"><h3>🕸️ Skill radar (most practised)</h3><div style="display:flex;justify-content:center">'+FCE.charts.radar(radarData)+'</div></div>'+
      '<div class="card"><h3>🧭 Confidence vs reality</h3>'+FCE.charts.calibration(calib)+
        '<div class="row wrap" style="margin-top:8px">'+
        '<span class="chip warn">🎲 '+lf.lucky+' lucky guesses</span>'+
        '<span class="chip bad">💪 '+lf.falseConf+' false-confidence errors</span></div>'+
        '<div class="tiny" style="margin-top:8px">Lucky guesses get re-tested early instead of counting as mastery. "Certain"-but-wrong answers are flagged as dangerous and weighted heavier.</div></div>'+
    '</div>'+

    '<div class="card" style="margin-bottom:16px"><h3>🔥 Open Cloze heatmap — which word types hurt you</h3>'+
      '<div class="heat-grid">'+
      heat.map(function(h){
        var pct = h.err===null ? '—' : Math.round(h.err*100)+'%';
        var tr = h.trend > 0.12 ? '<span class="chip ok" style="font-size:9.5px">▲ improving</span>' : h.trend < -0.12 ? '<span class="chip bad" style="font-size:9.5px">▼ slipping</span>' : '';
        var stars = '★★★★★'.slice(0,h.freq)+'<span style="opacity:.25">'+'★★★★★'.slice(h.freq)+'</span>';
        return '<div class="heat-cell" style="background:'+FCE.charts.heatColor(h.err)+';border-color:'+FCE.charts.heatBorder(h.err)+'">'+
          '<div class="hn">'+U.esc(h.name)+'</div><div class="hv">'+pct+'</div>'+
          '<div class="hs">error rate · '+(h.att||0)+' tries</div>'+
          '<div class="hs" title="frequency in real FCE papers">FCE freq: '+stars+'</div>'+tr+'</div>';
      }).join('')+
      '</div>'+
      '<div class="legend"><span><i style="background:rgba(52,211,153,.5)"></i>safe</span><span><i style="background:rgba(251,191,36,.5)"></i>warning</span><span><i style="background:rgba(251,113,133,.6)"></i>danger</span><span><i style="background:rgba(255,255,255,.12)"></i>no data yet</span><span style="flex:1"></span><span>sorted by exam danger = error × FCE frequency</span></div>'+
    '</div>'+

    '<div class="grid g2" style="margin-bottom:16px">'+
      '<div class="card"><h3>🧬 Mistake DNA — root causes</h3>'+
        (dna.total ? dna.list.map(function(d){
          var c = FCE.CAUSES[d.cause]; if(!c) return '';
          return '<div class="dna-bar"><span>'+c.icon+' '+c.name+'</span><div class="bar"><i class="bad" style="width:'+Math.round(d.pct*100)+'%"></i></div><b>'+d.n+'</b></div>';
        }).join('')+
        '<div class="tiny" style="margin-top:10px">'+dnaAdvice(dna)+'</div>'
        : '<div class="tiny">When you make a mistake, tag its cause — the engine will expose your error patterns here.</div>')+
      '</div>'+
      '<div class="card"><h3>⏱️ Speed vs exam pace</h3>'+
        [['mcc','Part 1'],['cloze','Part 2'],['wf','Part 3'],['kwt','Part 4']].map(function(p){
          var s = avgMs[p[0]], t = targets[p[0]];
          if(s===null) return '<div class="dna-bar"><span>'+p[1]+'</span><div class="bar"><i style="width:0"></i></div><b class="tiny">—</b></div>';
          var ratio = Math.min(1.6, s/t)/1.6;
          var cls = s <= t ? 'ok' : s <= t*1.4 ? 'warn' : 'bad';
          return '<div class="dna-bar"><span>'+p[1]+' <span class="tiny">(target '+t+'s)</span></span><div class="bar"><i class="'+cls+'" style="width:'+Math.round(ratio*100)+'%"></i></div><b>'+Math.round(s)+'s</b></div>';
        }).join('')+
        '<div class="tiny" style="margin-top:10px">Average seconds per question (last 25 of each type) vs the pace the real paper allows.</div></div>'+
    '</div>'+

    '<div class="grid g3" style="margin-bottom:16px">'+
      listCard('💪 Strongest', strongest, 'ok')+
      listCard('🩸 Weakest', weakest, 'bad')+
      listCard('🍂 Forgetting risk', forgotten.length?forgotten:null, 'warn', 'Skills you mastered but haven’t touched in 3+ days.')+
    '</div>'+

    '<div class="card"><h3>📋 Full skill table</h3>'+
      coach.map(function(r){
        var t = st.tags[r.tag];
        var pct = r.m===null ? null : r.m;
        var trend = E().tagTrend(r.tag);
        var trTxt = !t||t.hist.length<6 ? '' : trend>0.12 ? '▲' : trend<-0.12 ? '▼' : '—';
        var trCol = trend>0.12 ? '#6ee7b7' : trend<-0.12 ? '#fda4af' : 'var(--tx3)';
        return '<div class="skill-row"><span>'+U.esc(r.name)+'</span>'+
          '<div class="bar thin"><i class="'+(pct===null?'':pct>0.7?'ok':pct>0.45?'warn':'bad')+'" style="width:'+Math.round((pct||0)*100)+'%"></i></div>'+
          '<span style="color:'+trCol+';text-align:center">'+trTxt+'</span>'+
          '<span class="pct">'+(pct===null?'<span class="tiny">unseen</span>':Math.round(pct*100)+'%')+'</span></div>';
      }).join('')+
    '</div>'
  );
  return v;

  function listCard(title, rows, cls, empty){
    return '<div class="card"><h3>'+title+'</h3>'+
      (rows && rows.length ? rows.map(function(r){
        return '<div class="row between" style="padding:5px 0"><span style="font-size:13px">'+U.esc(r.name)+'</span><span class="chip '+cls+'">'+(r.m===null?'?':Math.round(r.m*100)+'%')+'</span></div>';
      }).join('') : '<div class="tiny">'+(empty||'Not enough data yet.')+'</div>')+'</div>';
  }
  function dnaAdvice(dna){
    if(!dna.list.length) return '';
    var top = dna.list[0], c = FCE.CAUSES[top.cause];
    return '<b>Dominant pattern:</b> '+Math.round(top.pct*100)+'% of your tagged errors are “'+c.name.toLowerCase()+'” — that’s '+c.advice+'.';
  }
};

/* ===== js/practice.js ===== */
/* FCE Mastery — practice sessions (adaptive) + full mock test */
window.FCE = window.FCE || {};
FCE.practice = (function(){
var P = {};
var U = function(){ return FCE.ui; };
var E = function(){ return FCE.engine; };
var TYPE_LABEL = {kwt:'Part 4 · Key Word Transformation', cloze:'Part 2 · Open Cloze', wf:'Part 3 · Word Formation', mcc:'Part 1 · Multiple-Choice Cloze'};

/* ============================ SESSION ============================ */
var S = null; // {queue, idx, ok, run, mode, t0, qt0, selOpt, conf, graded, results[]}

P.start = function(cfg){
  cfg = cfg || {};
  var eng = E(), queue;
  if(cfg.mode === 'diagnostic') queue = eng.diagnosticSet();
  else if(cfg.mode === 'ids') queue = (cfg.ids||[]).map(function(id){ return eng.byId[id]; }).filter(Boolean);
  else queue = eng.pickSession(cfg.n || 10, {type:cfg.type, tag:cfg.tag});
  if(!queue.length){ U().toast('No questions available for that filter yet.'); return; }
  S = {queue:queue, idx:0, ok:0, run:0, mode:cfg.mode||'smart', tag:cfg.tag||'', t0:Date.now(), qt0:0, selOpt:-1, conf:'', graded:false, results:[]};
  render();
};

function render(){
  var host = U().$('#view');
  host.innerHTML = '';
  host.appendChild(qView());
  window.scrollTo(0,0);
}

function qView(){
  var u = U(), eng = E();
  if(S.idx >= S.queue.length) return summaryView();
  var it = S.queue[S.idx], q = it.q;
  S.qt0 = Date.now(); S.selOpt = -1; S.conf = ''; S.graded = false;
  var seen = eng.state.items[q.id];
  var isReview = seen && seen.att > 0;

  var body = '';
  if(it.type === 'kwt'){
    body = '<div class="q-text">'+u.esc(q.s1)+'</div>'+
      '<div class="q-key">key word: <b>'+u.esc(q.key)+'</b> <span class="tiny">(use 2–5 words including the key word — do not change it)</span></div>'+
      '<div class="q-text" style="margin-top:8px">'+gapify(q.s2)+'</div>'+
      '<input class="ans-input" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing words…">'+
      '<div class="tiny" id="wc" style="margin-top:6px"></div>';
  } else if(it.type === 'cloze'){
    body = '<div class="q-text">'+gapify(q.s)+'</div>'+
      '<input class="ans-input" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="One word only…">';
  } else if(it.type === 'wf'){
    body = '<div class="q-text">'+gapify(q.s)+'</div>'+
      '<div class="q-key" style="margin-top:12px">stem: <span class="q-stem">'+u.esc(q.stem)+'</span> <span class="tiny">— transform it to fit the gap</span></div>'+
      '<input class="ans-input" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="The transformed word…">';
  } else {
    body = '<div class="q-text">'+gapify(q.s)+'</div>'+
      '<div class="opts">'+q.opts.map(function(o,i){
        return '<button class="opt" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+u.esc(o)+'</span></button>';
      }).join('')+'</div>';
  }

  var html =
  '<div class="q-shell">'+
    '<div class="q-top">'+
      '<button class="btn small ghost" id="q-quit">← End session</button>'+
      '<div class="q-progress"><div class="bar"><i style="width:'+Math.round(100*S.idx/S.queue.length)+'%"></i></div></div>'+
      '<span class="tiny mono">'+(S.idx+1)+' / '+S.queue.length+'</span>'+
      '<span class="q-timer" id="q-timer">0:00</span>'+
    '</div>'+
    '<div class="q-card">'+
      '<div class="q-type"><span class="chip acc">'+TYPE_LABEL[it.type]+'</span>'+
      (isReview?'<span class="chip warn">🔁 review — you’ve seen this before</span>':'')+
      (S.mode==='diagnostic'?'<span class="chip">🧪 diagnostic</span>':'')+
      '</div>'+
      body+
      '<div class="conf-row" id="conf-row">'+
        '<span class="conf-label">How sure are you? <span style="text-transform:none;letter-spacing:0">(be honest — the engine uses this to find hidden weaknesses)</span></span>'+
        ['g','f','s'].map(function(k){
          return '<button class="conf" data-c="'+k+'">'+FCE.CONF[k].icon+' '+FCE.CONF[k].name+'</button>';
        }).join('')+
      '</div>'+
      '<div class="q-actions"><button class="btn primary" id="q-check" disabled>Check answer</button></div>'+
      '<div id="fb"></div>'+
    '</div>'+
  '</div>';

  var v = u.el(html);

  // timer
  var timerEl = u.$('#q-timer', v);
  var tInt = setInterval(function(){
    if(!document.body.contains(timerEl)){ clearInterval(tInt); return; }
    var s = Math.floor((Date.now()-S.qt0)/1000);
    timerEl.textContent = Math.floor(s/60)+':'+('0'+s%60).slice(-2);
    var target = it.type==='kwt' ? 75 : 45;
    if(s > target) timerEl.classList.add('hot');
  }, 1000);

  var checkBtn = u.$('#q-check', v);
  function canCheck(){
    var hasAns = it.type==='mcc' ? S.selOpt>=0 : (u.$('#ans', v) && u.$('#ans', v).value.trim().length>0);
    checkBtn.disabled = !(hasAns && S.conf);
  }
  u.$$('.conf', v).forEach(function(b){
    b.addEventListener('click', function(){
      if(S.graded) return;
      u.$$('.conf', v).forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel'); S.conf = b.dataset.c; canCheck();
    });
  });
  u.$$('.opt', v).forEach(function(b){
    b.addEventListener('click', function(){
      if(S.graded) return;
      u.$$('.opt', v).forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel'); S.selOpt = +b.dataset.i; canCheck();
    });
  });
  var inp = u.$('#ans', v);
  if(inp){
    inp.addEventListener('input', function(){
      canCheck();
      if(it.type==='kwt'){
        var wc = E().wordCount(inp.value);
        var wcEl = u.$('#wc', v);
        if(!inp.value.trim()) wcEl.textContent = '';
        else wcEl.innerHTML = wc+' word'+(wc!==1?'s':'')+(wc<2||wc>5 ? ' — <span style="color:#fda4af">must be 2–5 (contractions count as two)</span>' : ' ✓');
      }
    });
    inp.addEventListener('keydown', function(ev){
      if(ev.key==='Enter' && !checkBtn.disabled && !S.graded) grade(v, it);
    });
    setTimeout(function(){ inp.focus(); }, 80);
  }
  checkBtn.addEventListener('click', function(){
    if(!S.graded) grade(v, it);
  });
  u.$('#q-quit', v).addEventListener('click', function(){ finishSession(true); });
  document.onkeydown = function(ev){
    if(ev.key==='Enter' && S && S.graded){
      var nx = u.$('#q-next'); if(nx){ ev.preventDefault(); nx.click(); }
    }
  };
  return v;
}

function gapify(s){
  return U().esc(s).replace(/____+/g, '<span class="gap">&nbsp;?&nbsp;</span>');
}

function grade(v, it){
  var u = U(), eng = E(), q = it.q;
  var ms = Date.now() - S.qt0;
  var ok, userTxt = '', kwtScore = null;
  if(it.type === 'mcc'){
    ok = S.selOpt === q.cor;
    userTxt = q.opts[S.selOpt] || '';
    u.$$('.opt', v).forEach(function(b,i){
      if(i === q.cor) b.classList.add('right');
      else if(i === S.selOpt && !ok) b.classList.add('wrong');
      b.disabled = true;
    });
  } else {
    userTxt = u.$('#ans', v).value;
    if(it.type === 'kwt'){
      var wc = eng.wordCount(userTxt);
      if(wc < 2 || wc > 5){
        u.toast('⚠️ Cambridge rule: between <b>2 and 5 words</b> (contractions = two words). Fix it before checking.');
        return;
      }
      var g = eng.gradeKWT(q, userTxt);
      ok = g.ok; kwtScore = g.score;
    } else {
      ok = eng.gradeOne(q, userTxt);
    }
    u.$('#ans', v).disabled = true;
  }
  S.graded = true;
  if(ok){ S.ok++; S.run++; if(S.run > eng.state.records.bestRun){ eng.state.records.bestRun = S.run; } }
  else S.run = 0;
  eng.record(q, it.type, ok, S.conf, ms, userTxt, '', {runStreak:S.run});
  S.results.push({id:q.id, ok:ok});

  // feedback panel
  var ansText = it.type==='mcc' ? q.opts[q.cor] : q.ans.join('  ·  ');
  var pattern = eng.patternFor(it.type==='mcc' ? q.opts[q.cor] : q.ans[0]);
  var slow = ms/1000 > (it.type==='kwt'?75:45);
  var lucky = ok && S.conf==='g';
  var falseConf = !ok && S.conf==='s';
  var fb = '<div class="feedback '+(ok?'ok':'bad')+'">'+
    '<div class="fb-head">'+(ok ? '✅ Correct'+(kwtScore===2?' — full 2 marks':'') : '❌ Not this time'+(kwtScore===1?' — but worth 1 of 2 marks':''))+'</div>'+
    '<div class="fb-ans">'+(it.type==='kwt'?'Accepted answer'+(q.ans.length>1?'s':'')+': ':'Answer: ')+'<code>'+u.esc(ansText)+'</code></div>'+
    '<div class="fb-exp">'+u.esc(q.exp||'')+'</div>'+
    (q.trap ? '<div class="fb-trap">⚠️ <b>Cambridge trap:</b> '+u.esc(q.trap)+'</div>' : '')+
    (pattern ? '<div class="fb-pattern">⭐ <b>'+u.esc(pattern.name)+'</b> — appears in real FCE papers '+'★'.repeat(pattern.freq)+' · '+u.esc(pattern.lose)+'</div>' : '')+
    (lucky ? '<div class="fb-trap">🎲 <b>Lucky guess detected.</b> This counts as half-learned — it will come back very soon.</div>' : '')+
    (falseConf ? '<div class="fb-trap">🚨 <b>False confidence.</b> You were certain and wrong — the most dangerous error type in an exam. Flagged and weighted heavier.</div>' : '')+
    (slow && ok ? '<div class="fb-pattern">🐢 Right, but slow ('+Math.round(ms/1000)+'s). Exam pace for this type: '+(it.type==='kwt'?75:45)+'s.</div>' : '')+
    (!ok ? '<div class="fb-hook">🧠 <b>Memory hook:</b> '+u.esc(FCE.makeHook(it.type==='mcc'?q.opts[q.cor]:q.ans[0], (q.s||q.s2||'').replace(/____+/g,'___')))+'</div>' : '')+
    (!ok ? '<div class="tiny" style="margin-top:12px">Why did you miss it? <i>(this trains your Mistake DNA)</i></div>'+
      '<div class="cause-row">'+Object.keys(FCE.CAUSES).map(function(c){
        return '<button class="cause" data-c="'+c+'">'+FCE.CAUSES[c].icon+' '+FCE.CAUSES[c].name+'</button>';
      }).join('')+'</div>' : '')+
    '<div class="q-actions"><button class="btn primary" id="q-next">'+(S.idx+1>=S.queue.length?'Finish session':'Next question')+' →</button></div>'+
  '</div>';
  u.$('#fb', v).innerHTML = fb;
  u.$$('.cause', v).forEach(function(b){
    b.addEventListener('click', function(){
      u.$$('.cause', v).forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel');
      eng.setCause(b.dataset.c);
    });
  });
  u.$('#q-next', v).addEventListener('click', function(){
    S.idx++; render();
  });
  u.$('#q-next', v).focus();
}

function finishSession(early){
  var eng = E();
  document.onkeydown = null;
  var n = S.results.length;
  if(early && n === 0){ FCE.ui.go('dash'); return; }
  S.idx = S.queue.length;
  render();
}

function summaryView(){
  var u = U(), eng = E();
  document.onkeydown = null;
  var n = S.results.length || 1;
  var acc = S.ok / n;
  if(!S.summarySaved){
    S.summarySaved = true;
    var accR = S.ok/(S.results.length||1);
    eng.state.sessions.push({t:Date.now(), n:S.results.length, ok:S.ok, type:S.mode});
    eng.state.trend.push({t:Date.now(), acc:accR, n:S.results.length});
    if(eng.state.trend.length > 40) eng.state.trend.shift();
    if(accR > eng.state.records.bestAcc && S.results.length >= 5) eng.state.records.bestAcc = accR;
    if(S.mode === 'diagnostic') eng.award('first');
    eng.save();
  }
  var pr = eng.predict();
  var msg = S.mode==='diagnostic'
    ? 'Diagnostic complete — your mastery map is live. From now on, every session is built around <b>your</b> data.'
    : acc >= 0.8 ? 'Excellent. The engine will now push your difficulty up to keep you in the learning zone.'
    : acc >= 0.5 ? 'Solid work — every error here just became a page in your Grammar Book and a future review.'
    : 'Tough one. That’s desirable difficulty: these exact items will return at the perfect moment to stick.';
  var wrong = S.results.filter(function(r){ return !r.ok; });
  var v = u.el(
    '<div class="q-shell"><div class="q-card session-done">'+
      '<div class="emoji">'+(acc>=0.8?'🏆':acc>=0.5?'💪':'🧗')+'</div>'+
      '<h2 style="margin:12px 0 4px">'+(S.mode==='diagnostic'?'Diagnostic complete':'Session complete')+'</h2>'+
      '<p class="muted">'+msg+'</p>'+
      '<div class="ring-stats">'+
        FCE.charts.ring(acc, Math.round(acc*100)+'%', 'accuracy', acc>=0.7?'#34d399':acc>=0.45?'#fbbf24':'#fb7185')+
        FCE.charts.ring(Math.min(1,S.results.length/10), String(S.results.length), 'questions', '#9d8cff')+
        FCE.charts.ring(pr.p, String(pr.scale), 'predicted scale', '#2dd4bf')+
      '</div>'+
      (wrong.length ? '<p class="tiny" style="margin-bottom:14px">'+wrong.length+' item'+(wrong.length>1?'s':'')+' joined your review queue and Grammar Book.</p>' : '<p class="tiny" style="margin-bottom:14px">Clean sweep — intervals extended on everything you saw.</p>')+
      '<div class="row" style="justify-content:center;flex-wrap:wrap">'+
        '<button class="btn primary" id="ss-again">Another session</button>'+
        '<button class="btn" id="ss-dash">Dashboard</button>'+
        (wrong.length?'<button class="btn" id="ss-book">📖 Grammar Book</button>':'')+
      '</div>'+
    '</div></div>'
  );
  u.$('#ss-again', v).addEventListener('click', function(){ P.start({mode:'smart', tag:S.tag||undefined}); });
  u.$('#ss-dash', v).addEventListener('click', function(){ FCE.ui.go('dash'); });
  var bk = u.$('#ss-book', v);
  if(bk) bk.addEventListener('click', function(){ FCE.ui.go('book'); });
  return v;
}

/* ============================ MOCK TEST ============================ */
var M = null;
P.mock = function(){
  var eng = E();
  M = {set: eng.mockSet(), t0: Date.now(), limit: 35*60, done:false};
  var u = U();
  var host = u.$('#view');
  host.innerHTML = '';
  host.appendChild(mockView());
  window.scrollTo(0,0);
};

function mockView(){
  var u = U(), s = M.set;
  function passageHTML(p, mode){
    var txt = u.esc(p.text);
    p.gaps.forEach(function(g){
      var inner;
      if(mode==='p1'){
        inner = '<select data-part="p1" data-n="'+g.n+'"><option value="-1">— '+g.n+' —</option>'+
          g.opts.map(function(o,i){ return '<option value="'+i+'">'+String.fromCharCode(65+i)+'. '+u.esc(o)+'</option>'; }).join('')+'</select>';
      } else if(mode==='p3'){
        inner = '<span class="pgap"><span class="n">'+g.n+'</span><input data-part="p3" data-n="'+g.n+'" autocomplete="off" spellcheck="false" placeholder="'+u.esc(g.stem)+'"></span>';
      } else {
        inner = '<span class="pgap"><span class="n">'+g.n+'</span><input data-part="p2" data-n="'+g.n+'" autocomplete="off" spellcheck="false"></span>';
      }
      txt = txt.replace('('+g.n+')'+(mode==='p3'?u.esc(g.stem):''), inner);
    });
    return '<div class="passage">'+txt+'</div>';
  }
  var html =
  '<div class="mock-timer"><div class="inner">⏱️ <span id="mt">35:00</span><span class="tiny">Use of English · 36 marks</span><button class="btn small danger" id="m-abort">Abandon</button></div></div>'+
  '<div class="h-page">Mock Test</div>'+
  '<p class="sub">Real format, real timing, no feedback until the end — exactly like exam day. Answers are scored with official-style marking (Part 4: 0, 1 or 2 marks each).</p>'+
  '<div class="mock-part"><h4>Part 1 — Multiple-Choice Cloze · '+u.esc(s.p1.title)+'</h4><div class="pd">For each gap, choose the option (A–D) that best fits. 8 marks.</div>'+passageHTML(s.p1,'p1')+'</div>'+
  '<div class="mock-part"><h4>Part 2 — Open Cloze · '+u.esc(s.p2.title)+'</h4><div class="pd">Write ONE word in each gap. 8 marks.</div>'+passageHTML(s.p2,'p2')+'</div>'+
  '<div class="mock-part"><h4>Part 3 — Word Formation · '+u.esc(s.p3.title)+'</h4><div class="pd">Use the word shown in each box to form a word that fits the gap. 8 marks.</div>'+passageHTML(s.p3,'p3')+'</div>'+
  '<div class="mock-part"><h4>Part 4 — Key Word Transformations</h4><div class="pd">Complete the second sentence (2–5 words, including the key word). 12 marks.</div>'+
    s.p4.map(function(q,i){
      return '<div class="mock-kwt"><div style="font-size:14.5px">'+(i+1)+'. '+u.esc(q.s1)+'</div>'+
        '<div class="q-key">key word: <b>'+u.esc(q.key)+'</b></div>'+
        '<div style="font-size:14.5px;margin:6px 0 10px">'+u.esc(q.s2).replace(/____+/g,'<span class="gap">&nbsp;?&nbsp;</span>')+'</div>'+
        '<input class="ans-input" style="margin-top:0;font-size:15px" data-part="p4" data-n="'+i+'" autocomplete="off" spellcheck="false">'+
      '</div>';
    }).join('')+
  '</div>'+
  '<button class="btn primary block" id="m-submit" style="font-size:16px;padding:15px">Submit paper →</button>';

  var v = u.el(html);
  var mt = u.$('#mt', v);
  var int = setInterval(function(){
    if(M.done || !document.body.contains(mt)){ clearInterval(int); return; }
    var left = M.limit - Math.floor((Date.now()-M.t0)/1000);
    if(left <= 0){ clearInterval(int); gradeMock(v); return; }
    mt.textContent = Math.floor(left/60)+':'+('0'+left%60).slice(-2);
    if(left < 300) mt.style.color = '#fda4af';
  }, 1000);
  u.$('#m-submit', v).addEventListener('click', function(){ gradeMock(v); });
  u.$('#m-abort', v).addEventListener('click', function(){ M.done = true; FCE.ui.go('dash'); });
  return v;
}

function gradeMock(v){
  if(M.done) return;
  M.done = true;
  var u = U(), eng = E(), s = M.set;
  var score = 0, parts = {p1:0,p2:0,p3:0,p4:0}, errors = [];
  // P1
  s.p1.gaps.forEach(function(g){
    var sel = u.$('select[data-part="p1"][data-n="'+g.n+'"]', v);
    var val = sel ? +sel.value : -1;
    var ok = val === g.cor;
    if(ok){ score++; parts.p1++; }
    else errors.push({part:'Part 1', n:g.n, user: val>=0 ? g.opts[val] : '(blank)', corr:g.opts[g.cor], exp:g.exp});
    eng.record({id:s.p1.id+'-'+g.n, tags:g.tags, diff:3, ans:[g.opts[g.cor]]}, 'mcc', ok, 'f', 0, val>=0?g.opts[val]:'', '', {quiet:true});
  });
  // P2
  s.p2.gaps.forEach(function(g){
    var inp = u.$('input[data-part="p2"][data-n="'+g.n+'"]', v);
    var val = inp ? inp.value : '';
    var ok = eng.gradeOne({ans:g.ans}, val);
    if(ok){ score++; parts.p2++; }
    else errors.push({part:'Part 2', n:g.n, user:val||'(blank)', corr:g.ans.join(' / '), exp:g.exp});
    eng.record({id:s.p2.id+'-'+g.n, tags:g.tags, gt:g.gt, diff:3, ans:g.ans}, 'cloze', ok, 'f', 0, val, '', {quiet:true});
  });
  // P3
  s.p3.gaps.forEach(function(g){
    var inp = u.$('input[data-part="p3"][data-n="'+g.n+'"]', v);
    var val = inp ? inp.value : '';
    var ok = eng.gradeOne({ans:g.ans}, val);
    if(ok){ score++; parts.p3++; }
    else errors.push({part:'Part 3', n:g.n, user:val||'(blank)', corr:g.ans.join(' / ')+' ('+g.stem+')', exp:g.exp});
    eng.record({id:s.p3.id+'-'+g.n, tags:g.tags, diff:3, ans:g.ans}, 'wf', ok, 'f', 0, val, '', {quiet:true});
  });
  // P4 (0/1/2)
  s.p4.forEach(function(q,i){
    var inp = u.$('input[data-part="p4"][data-n="'+i+'"]', v);
    var val = inp ? inp.value : '';
    var g = eng.gradeKWT(q, val);
    score += g.score; parts.p4 += g.score;
    if(!g.ok) errors.push({part:'Part 4', n:i+1, user:val||'(blank)', corr:q.ans[0], exp:q.exp + (g.score===1?' (You earned 1 mark for a correct half.)':'')});
    eng.record(q, 'kwt', g.ok, 'f', 0, val, '', {quiet:true});
  });
  eng.checkBadges(0);
  var scale = eng.recordMock(score, 36, parts);
  var pr = eng.predict();
  var grade = scale>=180?'A':scale>=173?'B':scale>=160?'C':scale>=140?'Below pass (B1 cert.)':'Below pass';
  var host = u.$('#view');
  host.innerHTML = '';
  host.appendChild(u.el(
    '<div class="q-shell"><div class="q-card session-done">'+
      '<div class="emoji">'+(score>=30?'🏆':score>=22?'🎯':'🧗')+'</div>'+
      '<div class="mock-result-score gradtx">'+score+'<span style="font-size:26px;color:var(--tx3)"> / 36</span></div>'+
      '<p class="muted" style="margin-top:6px">≈ Cambridge scale <b>'+scale+'</b> · '+grade+'</p>'+
      '<div class="mr-grid">'+
        mr('Part 1', parts.p1, 8)+mr('Part 2', parts.p2, 8)+mr('Part 3', parts.p3, 8)+mr('Part 4', parts.p4, 12)+
      '</div>'+
      '<p class="tiny">Your overall prediction has been updated to <b>'+pr.scale+'</b>. Every error below is now in your review queue.</p>'+
    '</div>'+
    (errors.length ? '<div class="card" style="margin-top:16px"><h3>🔍 Error autopsy ('+errors.length+')</h3>'+
      errors.map(function(e2){
        return '<div class="gb-mistake"><b>'+e2.part+' · gap '+e2.n+'</b> — you: <span class="yours">'+u.esc(e2.user)+'</span> → <span class="right">'+u.esc(e2.corr)+'</span><br><span class="tiny">'+u.esc(e2.exp||'')+'</span></div>';
      }).join('')+'</div>' : '')+
    '<div class="row" style="justify-content:center;margin-top:18px;flex-wrap:wrap">'+
      '<button class="btn primary" id="mk-dash">Dashboard</button>'+
      '<button class="btn" id="mk-again">New mock</button>'+
    '</div></div>'
  ));
  u.$('#mk-dash').addEventListener('click', function(){ FCE.ui.go('dash'); });
  u.$('#mk-again').addEventListener('click', function(){ P.mock(); });
  window.scrollTo(0,0);
  function mr(name, got, of){
    var f = got/of;
    return '<div class="stat-tile"><div class="v" style="color:'+(f>=0.75?'#6ee7b7':f>=0.5?'#fcd34d':'#fda4af')+'">'+got+'/'+of+'</div><div class="l">'+name+'</div></div>';
  }
}

return P;
})();
