<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="FCE Mastery — adaptive Cambridge B2 First Use of English trainer. 100% offline, no API.">
<title>FCE Mastery — B2 First Use of English Trainer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237c6cff'/><text x='50' y='70' font-size='58' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>F</text></svg>">
<style>
/* ============ FCE MASTERY — premium dark UI ============ */
:root{
  --bg0:#070b16; --bg1:#0b1124; --bg2:#101830;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#eef1fb; --tx2:#aab3d0; --tx3:#6b7699;
  --acc:#7c6cff; --acc2:#b44cff; --cy:#2dd4bf; --gold:#fbbf24;
  --ok:#34d399; --bad:#fb7185; --warn:#fbbf24;
  --grad:linear-gradient(135deg,#7c6cff 0%,#b44cff 55%,#ff5fa2 110%);
  --gradtx:linear-gradient(110deg,#a5b4ff,#d8b4fe 60%,#67e8f9);
  --r:18px; --rs:12px;
  --shadow:0 18px 50px -12px rgba(0,0,0,.55);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);background:var(--bg0);color:var(--tx);
  min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 520px at 85% -10%,rgba(124,108,255,.16),transparent 60%),
    radial-gradient(700px 460px at -10% 30%,rgba(180,76,255,.10),transparent 60%),
    radial-gradient(800px 600px at 60% 110%,rgba(45,212,191,.07),transparent 60%),
    var(--bg0);
}
::selection{background:rgba(124,108,255,.45)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;border:2px solid var(--bg0)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--tx)}
a{color:#a5b4ff}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex-shrink:0;position:sticky;top:0;height:100vh;
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  border-right:1px solid var(--line);background:rgba(7,11,22,.6);backdrop-filter:blur(14px);
}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 20px}
.logo-badge{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;box-shadow:0 6px 18px rgba(124,108,255,.45)}
.logo-name{font-weight:800;font-size:15px;letter-spacing:.2px;line-height:1.15}
.logo-name small{display:block;font-size:10.5px;font-weight:600;color:var(--tx3);letter-spacing:1.4px;text-transform:uppercase}
.nav-btn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--tx2);font-size:14px;font-weight:600;text-align:left;width:100%;
  transition:background .15s,color .15s;
}
.nav-btn:hover{background:var(--card);color:var(--tx)}
.nav-btn.active{background:linear-gradient(135deg,rgba(124,108,255,.20),rgba(180,76,255,.12));color:#fff;box-shadow:inset 0 0 0 1px rgba(124,108,255,.35)}
.nav-btn .ic{width:21px;text-align:center;font-size:16px;filter:saturate(.9)}
.nav-spacer{flex:1}
.nav-foot{font-size:10.5px;color:var(--tx3);padding:10px 12px;line-height:1.5}
.main{flex:1;min-width:0;padding:26px clamp(16px,3.4vw,44px) 110px;max-width:1180px;margin:0 auto}
.emg-ribbon{
  display:flex;align-items:center;gap:10px;margin:-4px 0 18px;padding:9px 16px;border-radius:14px;
  background:linear-gradient(90deg,rgba(251,113,133,.16),rgba(251,191,36,.10));
  border:1px solid rgba(251,113,133,.3);font-size:13px;font-weight:600;color:#fecdd3;
}
.emg-ribbon b{color:#fff}

/* ---------- generic ---------- */
.view{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h-page{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.sub{color:var(--tx2);font-size:14px;margin-bottom:22px;max-width:640px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;position:relative;
}
.card.glow{box-shadow:var(--shadow)}
.card h3{font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--tx3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.gradtx{background:var(--gradtx);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-1px;line-height:1.05}
.muted{color:var(--tx2);font-size:13px}
.tiny{color:var(--tx3);font-size:11.5px}
.mono{font-family:var(--mono)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:11px 20px;border-radius:13px;font-weight:700;font-size:14px;
  background:var(--card2);border:1px solid var(--line2);color:var(--tx);
  transition:transform .12s,box-shadow .12s,background .15s;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.11)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 24px -6px rgba(140,90,255,.55)}
.btn.primary:hover{box-shadow:0 12px 30px -6px rgba(140,90,255,.7)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn.danger{border-color:rgba(251,113,133,.4);color:#fda4af}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;
  font-size:11.5px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--tx2);
}
.chip.ok{color:#6ee7b7;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.chip.bad{color:#fda4af;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}
.chip.warn{color:#fcd34d;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.chip.acc{color:#c4b5fd;border-color:rgba(124,108,255,.4);background:rgba(124,108,255,.1)}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:5px}
.bar i.ok{background:linear-gradient(90deg,#34d399,#2dd4bf)}
.bar i.bad{background:linear-gradient(90deg,#fb7185,#f97316)}
.bar i.warn{background:linear-gradient(90deg,#fbbf24,#f97316)}
.divider{height:1px;background:var(--line);margin:16px 0}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px}
.gauge-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.grade-probs{flex:1;min-width:190px;display:flex;flex-direction:column;gap:9px}
.gp-row{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.gp-row b{color:var(--tx);text-align:right;font-variant-numeric:tabular-nums}
.stat-tile{padding:16px;border-radius:var(--rs);background:var(--card);border:1px solid var(--line);text-align:left}
.stat-tile .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat-tile .l{font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.coach-item{display:flex;gap:13px;padding:13px;border-radius:13px;background:var(--card);border:1px solid var(--line);align-items:flex-start;transition:border-color .15s}
.coach-item:hover{border-color:var(--line2)}
.coach-rank{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;color:#fff}
.coach-item .t{font-weight:700;font-size:14px}
.coach-item .d{font-size:12.5px;color:var(--tx2);margin-top:2px}
.coach-item .gain{margin-left:auto;text-align:right;flex-shrink:0}
.coach-item .gain b{color:#6ee7b7;font-size:15px}
.coach-item .gain span{display:block;font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qa{
  padding:16px 14px;border-radius:15px;border:1px solid var(--line);background:var(--card);
  text-align:left;transition:transform .14s,border-color .14s,background .15s;
}
.qa:hover{transform:translateY(-2px);border-color:rgba(124,108,255,.45);background:var(--card2)}
.qa .ic{font-size:22px}
.qa .t{font-weight:800;font-size:14px;margin-top:8px}
.qa .d{font-size:11.5px;color:var(--tx2);margin-top:2px;line-height:1.4}

/* ---------- practice ---------- */
.q-shell{max-width:760px;margin:0 auto}
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.q-progress{flex:1;min-width:120px}
.q-timer{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--tx2);background:var(--card);border:1px solid var(--line);padding:5px 11px;border-radius:9px}
.q-timer.hot{color:#fda4af;border-color:rgba(251,113,133,.4)}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3.5vw,34px);box-shadow:var(--shadow)}
.q-type{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.q-text{font-size:clamp(17px,2.2vw,20px);font-weight:500;line-height:1.7}
.q-text .gap{
  display:inline-block;min-width:90px;border-bottom:2px solid rgba(124,108,255,.65);
  text-align:center;color:#c4b5fd;font-weight:700;padding:0 6px;
}
.q-key{margin:14px 0 4px;font-size:14px;color:var(--tx2)}
.q-key b{font-family:var(--mono);background:rgba(124,108,255,.16);border:1px solid rgba(124,108,255,.4);padding:2px 10px;border-radius:8px;color:#d6ccff;letter-spacing:1px}
.q-stem{font-family:var(--mono);font-weight:800;letter-spacing:2px;color:#fcd34d;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);padding:2px 10px;border-radius:8px}
.ans-input{
  width:100%;margin-top:18px;padding:14px 16px;font-size:17px;border-radius:14px;
  background:rgba(0,0,0,.3);border:1.5px solid var(--line2);outline:none;transition:border-color .15s,box-shadow .15s;
}
.ans-input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(124,108,255,.18)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:13px;text-align:left;
  background:rgba(255,255,255,.035);border:1.5px solid var(--line);font-size:15.5px;font-weight:600;
  transition:border-color .12s,background .12s,transform .12s;
}
.opt:hover{border-color:rgba(124,108,255,.5);background:var(--card2)}
.opt .letter{width:28px;height:28px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--tx2);flex-shrink:0}
.opt.sel{border-color:var(--acc);background:rgba(124,108,255,.13)}
.opt.sel .letter{background:var(--grad);color:#fff;border:0}
.opt.right{border-color:rgba(52,211,153,.65);background:rgba(52,211,153,.1)}
.opt.right .letter{background:var(--ok);color:#052e22;border:0}
.opt.wrong{border-color:rgba(251,113,133,.65);background:rgba(251,113,133,.1)}
.opt.wrong .letter{background:var(--bad);color:#3f0d18;border:0}
.conf-row{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;align-items:center}
.conf-label{font-size:12px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.8px;width:100%}
.conf{
  flex:1;min-width:110px;padding:9px 12px;border-radius:11px;font-size:12.5px;font-weight:700;
  background:var(--card);border:1.5px solid var(--line);color:var(--tx2);transition:all .12s;
}
.conf:hover{border-color:var(--line2);color:var(--tx)}
.conf.sel{border-color:var(--acc);background:rgba(124,108,255,.14);color:#d6ccff}
.q-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.feedback{margin-top:20px;border-radius:16px;padding:18px;animation:rise .25s ease;border:1px solid}
.feedback.ok{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.3)}
.feedback.bad{background:rgba(251,113,133,.07);border-color:rgba(251,113,133,.3)}
.fb-head{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-bottom:8px}
.fb-ans{font-size:14px;margin:8px 0;line-height:1.6}
.fb-ans code{font-family:var(--mono);background:rgba(255,255,255,.08);padding:2px 8px;border-radius:7px;font-size:13px}
.fb-exp{font-size:13.5px;color:var(--tx2);line-height:1.65;margin-top:8px}
.fb-trap{margin-top:12px;padding:11px 13px;border-radius:11px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);font-size:13px;color:#fde68a;line-height:1.55}
.fb-pattern{margin-top:10px;font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fb-hook{margin-top:12px;padding:12px 14px;border-radius:11px;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.25);font-size:13.5px;color:#99f6e4;line-height:1.6}
.cause-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cause{padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--tx2);transition:all .12s}
.cause:hover{border-color:var(--line2)}
.cause.sel{border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.12);color:#fda4af}
.session-done{text-align:center;padding:40px 20px}
.session-done .emoji{font-size:52px}
.ring-stats{display:flex;justify-content:center;gap:34px;margin:26px 0;flex-wrap:wrap}

/* ---------- mock ---------- */
.mock-timer{position:sticky;top:12px;z-index:30;display:flex;justify-content:center;margin-bottom:18px}
.mock-timer .inner{background:rgba(7,11,22,.85);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:99px;padding:8px 22px;font-family:var(--mono);font-weight:800;font-size:16px;display:flex;gap:14px;align-items:center}
.mock-part{margin-bottom:26px}
.mock-part h4{font-size:15px;font-weight:800;margin-bottom:4px}
.mock-part .pd{font-size:12.5px;color:var(--tx2);margin-bottom:14px}
.passage{font-size:15.5px;line-height:1.9;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.passage .pgap{display:inline-flex;align-items:center;gap:4px;margin:0 2px}
.passage .pgap .n{font-size:10px;font-weight:800;color:var(--acc);background:rgba(124,108,255,.13);border-radius:5px;padding:1px 5px}
.passage input{width:108px;padding:4px 8px;font-size:14px;border-radius:8px;background:rgba(0,0,0,.32);border:1px solid var(--line2);outline:none;text-align:center}
.passage input:focus{border-color:var(--acc)}
.passage select{padding:4px 8px;font-size:13.5px;border-radius:8px;background:#101830;border:1px solid var(--line2);outline:none;color:var(--tx)}
.mock-kwt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.mock-result-score{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1}
.mr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:22px 0}

/* ---------- stats ---------- */
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.heat-cell{padding:13px;border-radius:13px;border:1px solid var(--line);position:relative;overflow:hidden}
.heat-cell .hn{font-size:12.5px;font-weight:700;position:relative}
.heat-cell .hv{font-size:20px;font-weight:800;margin-top:4px;position:relative}
.heat-cell .hs{font-size:10.5px;color:var(--tx2);position:relative;margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--tx3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.skill-row{display:grid;grid-template-columns:minmax(120px,180px) 1fr 52px 70px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.skill-row:last-child{border:0}
.skill-row .pct{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.dna-bar{display:grid;grid-template-columns:150px 1fr 38px;gap:12px;align-items:center;font-size:13px;padding:7px 0}
svg text{font-family:var(--sans)}

/* ---------- grammar book ---------- */
.gb-chapter{border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:14px;overflow:hidden}
.gb-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;transition:background .15s}
.gb-head:hover{background:var(--card2)}
.gb-head .num{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.gb-head .t{font-weight:800;font-size:15px}
.gb-head .m{font-size:12px;color:var(--tx2)}
.gb-body{padding:0 18px 18px;display:none}
.gb-chapter.open .gb-body{display:block}
.gb-rule{font-size:14px;line-height:1.7;color:var(--tx2);background:rgba(124,108,255,.06);border:1px solid rgba(124,108,255,.2);border-radius:12px;padding:14px 16px}
.gb-rule b{color:#d6ccff}
.gb-mistake{padding:11px 14px;border-radius:11px;background:rgba(251,113,133,.05);border:1px solid rgba(251,113,133,.18);margin-top:9px;font-size:13px;line-height:1.6}
.gb-mistake .yours{color:#fda4af;text-decoration:line-through}
.gb-mistake .right{color:#6ee7b7;font-weight:700}

/* ---------- memory lab ---------- */
.mem-card{background:linear-gradient(150deg,rgba(45,212,191,.09),rgba(124,108,255,.07));border:1px solid rgba(45,212,191,.25);border-radius:18px;padding:22px}
.mem-word{font-size:24px;font-weight:800;letter-spacing:-.5px}
.mem-hook{margin-top:12px;font-size:15px;line-height:1.7;color:#bdf5ea}
.flip-zone{min-height:120px;display:flex;flex-direction:column;justify-content:center}

/* ---------- onboarding ---------- */
.onb{max-width:560px;margin:6vh auto 0;text-align:center}
.onb .logo-big{width:76px;height:76px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;margin:0 auto 22px;box-shadow:0 18px 45px -10px rgba(140,90,255,.6)}
.onb h1{font-size:clamp(26px,4.5vw,36px);font-weight:800;letter-spacing:-1px;line-height:1.15}
.onb .field{text-align:left;margin-top:18px}
.onb label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);display:block;margin-bottom:7px}
.onb input{width:100%;padding:13px 16px;border-radius:13px;background:rgba(0,0,0,.3);border:1.5px solid var(--line2);outline:none;font-size:16px}
.onb input:focus{border-color:var(--acc)}
.diag-intro{font-size:14px;color:var(--tx2);line-height:1.7}

/* ---------- badges ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{padding:16px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:center;transition:transform .15s}
.badge.earned{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.06)}
.badge.earned:hover{transform:translateY(-2px)}
.badge .bi{font-size:28px;filter:grayscale(1);opacity:.35}
.badge.earned .bi{filter:none;opacity:1}
.badge .bt{font-weight:800;font-size:12.5px;margin-top:8px}
.badge .bd{font-size:10.5px;color:var(--tx3);margin-top:3px;line-height:1.4}

/* ---------- toast / modal ---------- */
#toasts{position:fixed;bottom:24px;right:24px;z-index:99;display:flex;flex-direction:column;gap:10px;max-width:330px}
.toast{
  background:rgba(16,24,48,.96);border:1px solid var(--line2);border-radius:14px;padding:13px 16px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:slidein .3s cubic-bezier(.2,.9,.3,1.2);
  display:flex;gap:10px;align-items:flex-start;line-height:1.5;
}
.toast.gold{border-color:rgba(251,191,36,.45)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.modal-back{position:fixed;inset:0;background:rgba(3,5,12,.72);backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:26px;max-width:520px;width:100%;max-height:86vh;overflow:auto;box-shadow:var(--shadow)}

/* ---------- responsive ---------- */
@media (max-width:840px){
  #app{flex-direction:column}
  .sidebar{
    width:100%;height:auto;position:fixed;bottom:0;top:auto;z-index:60;flex-direction:row;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);
    overflow-x:auto;background:rgba(7,11,22,.92);
  }
  .logo,.nav-foot,.nav-spacer{display:none}
  .nav-btn{flex-direction:column;gap:3px;font-size:9.5px;padding:7px 9px;flex:1;min-width:58px;align-items:center}
  .nav-btn .ic{font-size:18px}
  .main{padding:20px 16px 130px}
  .hero{grid-template-columns:1fr}
  .skill-row{grid-template-columns:minmax(90px,130px) 1fr 44px 56px;gap:8px;font-size:12px}
}
@media print{
  body::before,.sidebar,#toasts,.btn{display:none!important}
  body{background:#fff;color:#111}
  .card,.gb-chapter{border-color:#ddd;background:#fff}
  .gb-body{display:block!important}
  .gb-rule{color:#333;background:#f6f4ff}
  .gb-head .m,.gb-mistake{color:#444}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

</style>
</head>
<body>
<div id="app">
  <nav class="sidebar"></nav>
  <main class="main"><div id="view"></div></main>
</div>
<div id="toasts"></div>
<script>
/* ===== js/data-core.js ===== */
/* FCE Mastery — core knowledge layer: skill taxonomy, grammar rules,
   Cambridge pattern intelligence, memory hooks. All local, no APIs. */
window.FCE = window.FCE || {};

/* ---------- Skill taxonomy ----------
   weight = estimated marks (of 36 in Use of English) that typically hinge on this skill.
   Used by the coach to compute "this weakness costs ≈ X marks". */
FCE.TAGS = {
  prep:   {name:'Prepositions',            group:'Vocabulary', weight:4.5,
    rule:'Prepositions in FCE are rarely about place or time — they are about <b>dependent combinations</b> you must know as chunks: <b>keen ON, depend ON, insist ON, different FROM, responsible FOR, famous FOR, good AT, succeed IN, consist OF, similar TO, married TO</b>. Learn verb/adjective/noun + preposition as a single word. In Open Cloze, if the gap follows an adjective or verb, ask: which preposition does this word "own"?',
    tips:['Learn word + preposition as ONE unit, never separately.','In Open Cloze, look at the word BEFORE the gap first.','Make personal example sentences: "I am keen ON…" with your real hobbies.']},
  depprep:{name:'Fixed prepositional phrases', group:'Vocabulary', weight:2.5,
    rule:'English glues prepositions into fixed phrases: <b>in charge of, in favour of, on behalf of, by accident, on purpose, at first, in the end / at the end, out of the blue, in case of, under way, on the verge of, as a result of, in addition to</b>. Cambridge loves gapping the small word in the middle or at the start. These cannot be worked out by logic — only by familiarity.',
    tips:['Read the whole phrase aloud three times — rhythm helps memory.','Group them by preposition: ON purpose / ON behalf / ON the verge.','If a gap sits inside a phrase that "sounds idiomatic", trust the chunk.']},
  pv:     {name:'Phrasal verbs',            group:'Vocabulary', weight:3.5,
    rule:'FCE tests high-frequency phrasal verbs, usually as a paraphrase: postpone = <b>put off</b>, cancel = <b>call off</b>, reject = <b>turn down</b>, tolerate = <b>put up with</b>, invent/think of = <b>come up with</b>, recover from = <b>get over</b>, resemble = <b>take after</b>, quit = <b>give up</b>, exhaust supply = <b>run out of</b>, continue = <b>carry/go on</b>. In Key Word Transformations the phrasal verb often hides inside a passive: "The match WAS CALLED OFF."',
    tips:['Learn phrasal verbs with their one-word synonym (postpone → put off).','Practise them inside passives: "was put off", "has been turned down".','Particles carry meaning: OFF = cancelled/away, UP = completely, ON = continuing.']},
  fix:    {name:'Fixed expressions & idioms', group:'Vocabulary', weight:3.5,
    rule:'Cambridge recycles a core set of expressions: <b>make up your mind, take part in, take advantage of, pay attention to, take place, make an effort, do harm, make the most of, it’s no use / there’s no point in, can’t help -ing, it goes without saying, as far as I’m concerned, no matter how</b>. In transformations they are usually the "second key" alongside a grammar change.',
    tips:['MAKE = create/decide (make a decision, make progress). DO = activity/duty (do harm, do your best). TAKE = opportunity/time (take part, take advantage).','When a KWT gives you a noun key (PART, MIND, ATTENTION), an expression is almost certainly required.','Collect "expression families": take part in / take place / take after / take advantage of.']},
  col:    {name:'Collocations',             group:'Vocabulary', weight:4,
    rule:'Collocations are word marriages: <b>heavy rain</b> (not strong), <b>strong coffee</b> (not powerful), <b>fast food</b> but <b>a quick meal</b>, <b>catch a cold, miss the bus, break a record, keep a promise, reach an agreement, draw a conclusion, raise money, earn a living, lose your temper</b>. Part 1 (Multiple-Choice Cloze) is essentially a collocation exam: all four options "mean" the same; only one collocates.',
    tips:['In Part 1, ignore meaning first — ask which option PARTNERS the nearby noun.','Record collocations as pairs, never single words.','Wrong-but-tempting options in past papers are tomorrow’s correct answers — learn all four.']},
  link:   {name:'Linking words',            group:'Grammar', weight:3,
    rule:'Master the contrast set: <b>although/though/even though + clause</b>, <b>despite/in spite of + noun or -ing</b>, <b>whereas/while</b> for contrast, <b>unless</b> = if not, <b>as long as / provided (that)</b> = on condition that, <b>in case</b> = preparation for a possibility (NOT "if"), <b>whether</b> after prepositions and with "or not". The #1 trap: <b>despite</b> is never followed by "of"; <b>in spite</b> always is.',
    tips:['DESPITE + noun/-ing. ALTHOUGH + subject + verb. Never mix.','IN CASE prepares ("take an umbrella in case it rains") — IF reacts.','UNLESS already contains "not" — never add another negative.']},
  rel:    {name:'Relative clauses',         group:'Grammar', weight:2,
    rule:'<b>who</b> (people), <b>which</b> (things, and whole previous ideas: ", which surprised everyone"), <b>whose</b> (possession), <b>where</b> (places, when the clause is complete without an object), <b>what</b> = "the thing(s) that" (Much of WHAT he said…). After commas (non-defining), THAT is forbidden — use which/who. Prepositions can move: "the town in which I grew up" = "the town (which) I grew up in".',
    tips:['Comma before the gap? → which/who, never that.','If the relative clause is already complete (he grew up THERE), use WHERE.','WHAT never follows a noun — it replaces noun + that.']},
  pron:   {name:'Pronouns & reflexives',    group:'Grammar', weight:1.5,
    rule:'Watch reflexives (<b>hurt himself, enjoy yourselves, by myself</b> = alone), reciprocals (<b>each other / one another</b>), and substitution (<b>one/ones, so</b> in "I think so", <b>neither/so do I</b>). Open Cloze often gaps "each" in "each other" or "it" in dummy-subject patterns ("found IT hard to…").',
    tips:['"by + reflexive" = alone; "on + my own" — don’t blend them.','Check verbs that need a dummy IT: find it hard, make it clear.','EACH other — not "every other" — for two-way actions.']},
  art:    {name:'Articles',                 group:'Grammar', weight:2,
    rule:'FCE-level article gaps: <b>the</b> with superlatives, ordinals, unique things, "the same/the only/the first", musical instruments (play THE violin), comparative correlatives (<b>THE more… THE better</b>), and fixed chunks (<b>out of THE blue, on THE other hand, at THE moment</b>). <b>A/AN</b> appears in "make AN effort", "have A go", "as A result". Zero article with general plurals and abstract nouns.',
    tips:['"The more…, the better" — both gaps are THE.','Fixed phrases own their articles: make AN effort, take THE trouble.','If the noun is unique-in-context, use THE even first mention.']},
  det:    {name:'Determiners & quantifiers', group:'Grammar', weight:2,
    rule:'High-value items: <b>hardly ANY, NO + noun, NONE of, EVERY/EACH, BOTH/EITHER/NEITHER, FEW vs A FEW, LITTLE vs A LITTLE, TOO much/many, ENOUGH, SUCH a, WHICHEVER/WHATEVER, ANOTHER vs OTHER</b>. Open Cloze loves "hardly any", "none of", and "such a".',
    tips:['FEW/LITTLE (without "a") = almost none — negative feeling.','NEITHER of + plural noun + singular verb (formally).','ENOUGH goes AFTER adjectives (cool enough) but BEFORE nouns (enough time).']},
  aux:    {name:'Auxiliaries & question tags', group:'Grammar', weight:2.5,
    rule:'Auxiliaries surface in: perfect forms (<b>have/has/had + participle</b>), continuous passives (<b>are BEING cleaned</b>), echo forms (<b>neither DID Tom, so DO I</b>), inversion (<b>rarely DO we see…</b>), comparative ellipsis (…than I <b>HAVE</b>), and future perfect (<b>will HAVE finished</b>). In Open Cloze, a participle right after the gap screams have/has/had/been/being.',
    tips:['Gap + past participle? Try have/has/had/been/being first.','"Neither/So" + AUXILIARY + subject — copy the tense of the first verb.','BY + future time → will HAVE + participle (future perfect).']},
  modal:  {name:'Modals & deduction',       group:'Grammar', weight:2,
    rule:'Past deduction is the exam favourite: <b>must have + participle</b> (sure it happened), <b>can’t/couldn’t have</b> (sure it didn’t), <b>may/might/could have</b> (possible). Also: <b>should have</b> (criticism), <b>needn’t have</b> (did it, wasn’t necessary), <b>had better</b>, <b>be supposed to</b> (rules/expectations), <b>be allowed to</b> (permission in passives).',
    tips:['"I’m sure he DIDN’T" → can’t have + participle (NOT mustn’t have).','LET has no passive — use BE ALLOWED TO.','HAD better (never "would better") + bare infinitive.']},
  cond:   {name:'Conditionals',             group:'Grammar', weight:2.5,
    rule:'Beyond the basic three: <b>unless, provided that, as long as, in case, otherwise</b>, mixed conditionals ("If I had taken the map, I would not BE lost now"), and inverted conditionals (<b>Had I known…, Should you need…</b>). KWT pattern: a past regret → third conditional with WOULD/WOULDN’T HAVE + participle.',
    tips:['Regret about the past → IF + had + participle, WOULD HAVE + participle.','Never put WOULD inside the IF-clause.','SHOULD you need anything = If you need anything (formal inversion).']},
  wish:   {name:'Wish / rather / time',     group:'Grammar', weight:1.5,
    rule:'<b>wish + past simple</b> (present regret), <b>wish + past perfect</b> (past regret), <b>wish + would</b> (annoying habit). <b>would rather + subject + PAST</b> ("I’d rather you CAME early"), <b>it’s (high) time + PAST</b> ("It’s time we LEFT"). The tense goes BACK although the meaning is present/future.',
    tips:['I wish I HAD studied = past regret (very common in KWT).','I’d rather YOU + past simple — the past is not about time here.','"It’s time we went" — past form, present meaning.']},
  pass:   {name:'Passive & causative',      group:'Grammar', weight:2.5,
    rule:'KWT loves switching voice: "They are building X" → "X <b>is being built</b>"; and the causative <b>have/get something done</b>: "A mechanic repaired my car" → "I <b>had my car repaired</b>". After MAKE in the passive, TO returns: "We <b>were made TO wait</b>". LET becomes <b>be allowed to</b>.',
    tips:['Causative order: HAVE + object + PARTICIPLE (had my car repaired).','Continuous passive needs BEING: is/was being built.','make someone do → BE MADE TO DO (to reappears).']},
  inv:    {name:'Inversion & emphasis',     group:'Grammar', weight:1.5,
    rule:'After negative adverbials the auxiliary jumps before the subject: <b>No sooner HAD we sat down than…, Hardly HAD they arrived when…, Not only DOES she sing…, Rarely DO we see…, Under no circumstances SHOULD you…, On no account MUST you…</b>. NO SOONER pairs with THAN; HARDLY pairs with WHEN.',
    tips:['NO SOONER … THAN / HARDLY … WHEN — never mix the pairs.','The inversion uses an auxiliary, exactly like a question.','Spot the trigger words at the start: No sooner, Hardly, Not only, Seldom, Rarely, Little.']},
  rep:    {name:'Reported speech',          group:'Grammar', weight:2,
    rule:'Backshift tenses (will→would, can→could, present→past), shift time words (tomorrow→<b>the following day</b>, yesterday→the previous day/the day before). Reported questions use statement order: "Where do you live?" → "asked me where I <b>lived</b>" (no DO, no question mark). Reporting verbs carry patterns: <b>accuse sb OF -ing, apologise FOR -ing, congratulate sb ON -ing, insist ON -ing, suggest -ing, warn sb NOT to, refuse TO, admit -ing, deny -ing</b>.',
    tips:['Reported question = statement word order, no auxiliary DO.','The reporting verb decides the structure — learn verb + pattern as one chunk.','tomorrow → the following day; ago → before.']},
  comp:   {name:'Comparatives & "as…as"',   group:'Grammar', weight:2,
    rule:'Key transforms: "X is cheaper than Y" ↔ "Y is <b>not as/so cheap as</b> X" (notice the adjective flips back to its base form). Also: <b>the + comparative, the + comparative</b> ("The sooner, the better"), <b>far/much + comparative</b>, <b>twice as … as</b>, and <b>less … than</b>. In KWT, keep the comparison direction straight — that is the trap.',
    tips:['not as + BASE adjective + as (never the -er form).','"The more you practise, THE better you get" — double THE.','Check WHO is bigger/cheaper after rewriting — direction reverses easily.']},
  ger:    {name:'Gerunds & infinitives',    group:'Grammar', weight:2.5,
    rule:'Chunks that decide the form: <b>suggest/enjoy/avoid/admit/deny/can’t help/it’s no use/worth/look forward to/be used to + -ING</b>; <b>manage/refuse/decide/afford/promise + TO</b>; meaning-changers: <b>remember/forget/regret/stop/try</b> (remember POSTING = memory of a past action; remember TO POST = duty). After prepositions, ALWAYS -ing — including the famous <b>to</b> in "look forward TO seeING".',
    tips:['Preposition → -ING. No exceptions ("after leavING", "without sayING").','LOOK FORWARD TO + -ing — "to" here is a preposition.','REGRET + -ing = past action you’re sorry about (the KWT favourite).']},
  wfnoun: {name:'Word formation: nouns',    group:'Word building', weight:2.5,
    rule:'Suffixes: <b>-tion/-sion (decide→decision, explain→explanation), -ment (improve→improvement), -ness (aware→awareness), -ity (able→ability, curious→curiosity), -ence/-ance (patient→patience, assist→assistance), -ship (member→membership), -hood (child→childhood), -dom (free→freedom, bore→boredom), -th (grow→growth, strong→strength, long→length, deep→depth, wide→width)</b>. Check singular/plural — a verb like "were" before the gap forces a plural noun.',
    tips:['Read the WHOLE sentence — does grammar demand plural? (many …S)','-th nouns change the vowel: strong→strength, long→length.','Person or thing? employER gives work, employEE receives it.']},
  wfadj:  {name:'Word formation: adjectives', group:'Word building', weight:2.2,
    rule:'Suffixes: <b>-ful/-less, -ous (danger→dangerous), -al (nature→natural), -ive (compete→competitive), -able/-ible (rely→reliable, resist→irresistible), -ic (science→scientific), -ed/-ing (satisfied vs satisfying)</b>. Classic traps: <b>economic</b> (of the economy) vs <b>economical</b> (money-saving); <b>sensitive</b> vs <b>sensible</b>. -ED = how you feel; -ING = what causes the feeling.',
    tips:['Bored person, boring film — feelings get -ED.','rely → reliable (y→i), resist → irresistible (double trap: ir- and -ible).','economic policy / economical car — meaning decides.']},
  wfadv:  {name:'Word formation: adverbs',  group:'Word building', weight:1.3,
    rule:'Usually adjective + <b>-ly</b>, with spelling shifts: <b>true→truly, whole→wholly, easy→easily, automatic→automatically (-ally after -ic)</b>. Sentence-position adverbs from FCE: <b>(un)fortunately, surprisingly, increasingly</b>. If the gap sits between subject and verb, or describes a verb/adjective, an adverb is likely.',
    tips:['-ic → -ically (automatically, scientifically). Almost no exceptions.','true → truly, whole → wholly: the E disappears.','A gap before an adjective ("____ difficult") is usually an adverb.']},
  wfverb: {name:'Word formation: verbs',    group:'Word building', weight:1,
    rule:'Prefixes/suffixes that build verbs: <b>en- (large→enlarge, able→enable, sure→ensure), -en (strong→strengthen, wide→widen, short→shorten), -ise/-ize (modern→modernise), -ify (simple→simplify)</b>.',
    tips:['-EN attaches to adjectives of size/degree: widen, deepen, shorten.','EN- at the front: enable, enrich, encourage, ensure.','Need a verb? Look for a missing action between subject and object.']},
  wfneg:  {name:'Negative prefixes',        group:'Word building', weight:1.8,
    rule:'THE Word Formation trap: the sentence logic demands a NEGATIVE. <b>un- (unable, unlikely, unemployment), in- (informal), im- before m/p (impossible, impatient), il- before l (illegal), ir- before r (irregular, irresponsible), dis- (dishonest, disagree, dissatisfied), mis- (misunderstand, misbehave)</b>. Read for words like "but, however, failed, refused, without" — they flip the polarity.',
    tips:['ALWAYS ask: positive or negative? before writing the word.','im- before m/p (impatient), il- before l (illegal), ir- before r (irregular).','dis+satisfied keeps double S: dissatisfied.']},
  spell:  {name:'Spelling shifts',          group:'Word building', weight:1.2,
    rule:'Cambridge marks spelling strictly. Danger words: <b>pronunciation</b> (not pronOUnciation), <b>explanation</b> (not explaination), <b>maintenance, argument</b> (no E), <b>truly, repetition, curiosity, anxiety, height</b> (vs high), <b>choice, loss, weight, flight</b>.',
    tips:['pronounce → pronUnciation; explain → explAnation.','argue → argument (drop the E).','Write the word, then spell-check it backwards letter by letter.']},
};

/* ---------- Open Cloze gap-type meta (for the heatmap) ---------- */
FCE.GAPTYPES = {
  prep:{name:'Prepositions', freq:5}, art:{name:'Articles', freq:4},
  link:{name:'Conjunctions / linkers', freq:4}, aux:{name:'Auxiliary verbs', freq:4},
  modal:{name:'Modal verbs', freq:3}, rel:{name:'Relative pronouns', freq:4},
  pron:{name:'Pronouns', freq:3}, det:{name:'Determiners / quantifiers', freq:3},
  adv:{name:'Adverbs / particles', freq:3}, vform:{name:'Verb forms', freq:3},
  comp:{name:'Comparatives', freq:2}, fixphrase:{name:'Fixed phrases', freq:5},
};

/* ---------- Cambridge Pattern Intelligence ----------
   freq: 1–5 stars = how often this pattern shows up in official papers.
   lose: note on where students typically lose the mark. */
FCE.PATTERNS = [
  {id:'pt-causative', match:['had my','have my','had her','had his','have it','got my'], tags:['pass'], freq:5, name:'have something done', lose:'Students write "I repaired my car" instead of "I had my car repaired".'},
  {id:'pt-passive-being', match:['is being','was being','are being'], tags:['pass'], freq:4, name:'continuous passive (is being done)', lose:'The word BEING gets dropped.'},
  {id:'pt-wish-past', match:['wish i had','wish she had','wish he had'], tags:['wish'], freq:5, name:'wish + past perfect', lose:'Past regret written with simple past instead of past perfect.'},
  {id:'pt-nosooner', match:['no sooner had'], tags:['inv'], freq:4, name:'No sooner had … than', lose:'Pairing it with WHEN instead of THAN.'},
  {id:'pt-hardly', match:['hardly had'], tags:['inv'], freq:4, name:'Hardly had … when', lose:'Forgetting the inversion (hardly THEY HAD).'},
  {id:'pt-notonly', match:['not only does','not only did','not only is'], tags:['inv'], freq:3, name:'Not only + inversion', lose:'Writing "Not only she sings" without the auxiliary.'},
  {id:'pt-asas', match:['not as','not so','as far as','as long as','as soon as'], tags:['comp','fix'], freq:5, name:'as … as family', lose:'Using the comparative form inside as…as ("not as cheaper as").'},
  {id:'pt-thethe', match:['the more','the sooner','the better','the harder'], tags:['comp','art'], freq:4, name:'the + comparative, the + comparative', lose:'Dropping one of the THEs.'},
  {id:'pt-deduction', match:['must have','can’t have','cannot have','couldn’t have','might have'], tags:['modal'], freq:5, name:'modal + have + participle', lose:'"mustn’t have" used for impossibility (it should be CAN’T have).'},
  {id:'pt-despite', match:['in spite of','despite'], tags:['link'], freq:5, name:'despite / in spite of + noun/-ing', lose:'"despite of" — the most famous FCE error.'},
  {id:'pt-pointin', match:['no point in','no use','not worth'], tags:['fix','ger'], freq:4, name:'no point in / no use / not worth + -ing', lose:'Following these with TO + infinitive.'},
  {id:'pt-lookfwd', match:['looking forward to','look forward to'], tags:['pv','ger'], freq:5, name:'look forward to + -ing', lose:'"look forward to SEE you".'},
  {id:'pt-usedto', match:['used to','accustomed to'], tags:['ger'], freq:5, name:'used to do vs be used to doing', lose:'Mixing past habit (used to DO) with familiarity (be used to DOING).'},
  {id:'pt-suggest', match:['suggested going','suggest going','suggested that'], tags:['rep','ger'], freq:4, name:'suggest + -ing / that-clause', lose:'"suggested to go" — suggest never takes to-infinitive.'},
  {id:'pt-accuse', match:['accused','apologised for','apologized for','congratulated','insisted on','blamed','prevented'], tags:['rep','prep'], freq:5, name:'reporting verb + preposition + -ing', lose:'Wrong preposition: accuse OF, blame FOR, congratulate ON, insist ON, prevent FROM.'},
  {id:'pt-firsttime', match:['first time i have','first time i’ve'], tags:['fix'], freq:4, name:'It’s the first time + present perfect', lose:'Using simple present ("first time I eat").'},
  {id:'pt-ittook', match:['it took'], tags:['fix'], freq:4, name:'It took (sb) + time + to do', lose:'Forgetting the dummy IT.'},
  {id:'pt-rather', match:['would rather','’d rather'], tags:['wish'], freq:4, name:'would rather + sb + PAST', lose:'"I’d rather you COME" instead of CAME.'},
  {id:'pt-unless', match:['unless'], tags:['cond','link'], freq:4, name:'unless = if not', lose:'Double negative: "unless you don’t revise".'},
  {id:'pt-madeto', match:['made to','allowed to'], tags:['pass'], freq:4, name:'be made TO do / be allowed to', lose:'Dropping TO after passive MAKE.'},
  {id:'pt-takepart', match:['took part in','take part in'], tags:['fix'], freq:4, name:'take part in = participate', lose:'Missing the preposition IN.'},
  {id:'pt-runout', match:['run out of'], tags:['pv'], freq:4, name:'run out of', lose:'Dropping OF: "we ran out milk".'},
  {id:'pt-putoff-passive', match:['was put off','was called off','was turned down'], tags:['pv','pass'], freq:5, name:'phrasal verb inside a passive', lose:'Reordering or losing the particle: "was put it off".'},
  {id:'pt-incase', match:['in case'], tags:['link'], freq:4, name:'in case + present', lose:'Writing "in case of you need" or using WILL after in case.'},
  {id:'pt-succeed', match:['succeeded in'], tags:['prep','ger'], freq:3, name:'succeed IN -ing ↔ manage TO do', lose:'Crossing the patterns: "succeeded to pass".'},

/* Template-based hook generator for items without a hand-written hook.
   Deterministic (seeded by the word) so each student-word pair feels stable. */
FCE.makeHook = function(word, context){
  var w = String(word||'').trim(); if(!w) return '';
  var lw = w.toLowerCase();
  for (var i=0;i<FCE.HOOKS.length;i++){
    if (lw.indexOf(FCE.HOOKS[i].k) !== -1 || FCE.HOOKS[i].k.indexOf(lw) !== -1) return FCE.HOOKS[i].h;
  }
  var seed = 0; for (var j=0;j<lw.length;j++) seed = (seed*31 + lw.charCodeAt(j)) >>> 0;
  var scenes = ['a tiny exam hall on the moon','your kitchen at midnight','the Cambridge exam room','a crowded metro carriage','your grandmother’s garden','a silent library where one phone rings'];
  var actions = ['written in giant neon letters','tattooed on a whale that swims past the window','baked into a birthday cake','printed on every umbrella','shouted by a parrot wearing glasses','carved into an ice sculpture that refuses to melt'];
  var scene = scenes[seed % scenes.length], action = actions[(seed>>3) % actions.length];
  var chunk = lw.length > 3 ? (lw.slice(0,Math.ceil(lw.length/2)) + ' + ' + lw.slice(Math.ceil(lw.length/2))) : lw;
  var out = 'Picture ' + scene + ': “' + w.toUpperCase() + '” is ' + action + '. Say it three times as you see it.';
  if (context) out += ' Anchor it to the chunk: “' + context + '”.';
  out += ' (Chunk it: ' + chunk + '.)';
  return out;
};

{id:"k47", s1:"I’m sorry that I sold my grandfather’s guitar.", key:"REGRET", s2:"I ____ my grandfather’s guitar.", ans:["regret selling","regret having sold"], halves:[["regret"],["selling","having sold"]], tags:["ger"], diff:3, exp:"REGRET + -ING = be sorry about a past action.", trap:"regret TO SELL would mean you’re about to do it (formal announcements)."},
{id:"k48", s1:"You should see a doctor about that cough.", key:"BETTER", s2:"You ____ a doctor about that cough.", ans:["had better see","'d better see"], halves:[["had better","'d better"],["see"]], tags:["modal"], diff:2, exp:"HAD BETTER + bare infinitive = strong advice.", trap:"HAD (not would) better, and no TO after it."},
{id:"k49", s1:"The rule says employees must wear a badge at all times.", key:"SUPPOSED", s2:"Employees ____ a badge at all times.", ans:["are supposed to wear"], halves:[["are supposed"],["to wear"]], tags:["modal","pass"], diff:3, exp:"BE SUPPOSED TO = required by rules/expectations.", trap:"ARE supposed (plural) and TO before the verb."},
{id:"k50", s1:"Rita finally managed to pass her driving test.", key:"SUCCEEDED", s2:"Rita finally ____ her driving test.", ans:["succeeded in passing"], halves:[["succeeded in"],["passing"]], tags:["prep","ger"], diff:3, exp:"SUCCEED IN + -ING.", trap:"The mirror of k23 — succeed takes IN + -ing, not to."},
{id:"k51", s1:"Ben found it hard to follow the lecture.", key:"DIFFICULTY", s2:"Ben ____ the lecture.", ans:["had difficulty following","had difficulty in following","had great difficulty following"], halves:[["had difficulty","had great difficulty"],["following"]], tags:["fix","ger"], diff:4, exp:"HAVE DIFFICULTY (IN) + -ING.", trap:"No TO: 'had difficulty to follow' is the standard error."},
{id:"k52", s1:"Visiting the old town is really worthwhile.", key:"WORTH", s2:"The old town is ____ .", ans:["well worth visiting","worth visiting","really worth visiting"], halves:[["worth"],["visiting"]], tags:["fix","ger"], diff:3, exp:"BE WORTH + -ING — the object becomes the subject.", trap:"'worth to visit' / 'worth a visit it' — keep it simple: worth visitING."},
{id:"k53", s1:"Let’s walk rather than take the bus.", key:"INSTEAD", s2:"Let’s walk ____ the bus.", ans:["instead of taking"], halves:[["instead of"],["taking"]], tags:["link","ger"], diff:2, exp:"INSTEAD OF + -ING.", trap:"Preposition OF → -ing follows automatically."},
{id:"k54", s1:"It was Joe’s fault that we missed the train.", key:"BLAME", s2:"Joe ____ missing the train.", ans:["was to blame for"], halves:[["was to blame"],["for"]], tags:["fix","prep"], diff:4, exp:"BE TO BLAME FOR = be responsible for (something bad).", trap:"Fixed as an active phrase: 'was to blame', never 'was blamed to'."},
{id:"k55", s1:"“Well done on winning the cup, Aya!” said the coach.", key:"CONGRATULATED", s2:"The coach ____ winning the cup.", ans:["congratulated aya on"], halves:[["congratulated aya"],["on"]], tags:["rep","prep"], diff:3, exp:"CONGRATULATE somebody ON + -ing.", trap:"ON is the tested preposition (not for)."},
{id:"k56", s1:"The storm stopped us from leaving the harbour.", key:"PREVENTED", s2:"The storm ____ the harbour.", ans:["prevented us from leaving"], halves:[["prevented us from"],["leaving"]], tags:["rep","prep"], diff:2, exp:"PREVENT somebody FROM + -ing.", trap:"FROM is obligatory after prevent in FCE answers."},
{id:"k57", s1:"My parents let me stay out late at weekends.", key:"ALLOWED", s2:"I ____ out late at weekends.", ans:["am allowed to stay","was allowed to stay"], halves:[["am allowed","was allowed"],["to stay"]], tags:["pass","modal"], diff:3, exp:"LET has no passive — use BE ALLOWED TO.", trap:"'I am let to stay' doesn’t exist in English."},
{id:"k58", s1:"They made us wait for hours at the embassy.", key:"WERE", s2:"We ____ for hours at the embassy.", ans:["were made to wait"], halves:[["were made"],["to wait"]], tags:["pass"], diff:4, exp:"make sb DO → passive: BE MADE TO DO — the TO comes back.", trap:"That returning TO is precisely what Cambridge is checking."},
{id:"k59", s1:"I advise you to book the tickets early.", key:"WERE", s2:"If I ____ , I would book the tickets early.", ans:["were you","were in your position","were in your shoes"], halves:[["were"],["you","in your position","in your shoes"]], tags:["cond","fix"], diff:3, exp:"Advice idiom: If I WERE YOU, I would…", trap:"WERE for all persons in this hypothetical — 'if I was you' is penalised here."},
{id:"k60", s1:"Swimming is forbidden in this lake.", key:"NOT", s2:"You are ____ in this lake.", ans:["not allowed to swim","not permitted to swim"], halves:[["not allowed","not permitted"],["to swim"]], tags:["pass","modal"], diff:2, exp:"forbidden ↔ NOT allowed/permitted TO + infinitive.", trap:"Keep TO: 'not allowed swim' loses a half mark."},
];

/* ---------- Open Cloze (one word per gap) ----------
   gt = gap type for the heatmap. */
FCE.BANK.cloze = [
{id:"c01", s:"She has been working at the hospital ____ 2019.", ans:["since"], gt:"prep", tags:["prep","aux"], diff:1, exp:"Point in time after present perfect → SINCE; period → FOR.", trap:"FOR 2019 is the bait — 2019 is a starting point, not a period."},
{id:"c02", s:"I’m not very keen ____ horror films, to be honest.", ans:["on"], gt:"prep", tags:["prep"], diff:1, exp:"keen ON — dependent preposition.", trap:"Spanish/French speakers reach for 'of' or 'in'."},
{id:"c03", s:"Whether we have the picnic depends entirely ____ the weather.", ans:["on","upon"], gt:"prep", tags:["prep"], diff:1, exp:"depend ON/UPON.", trap:"'depends OF' is the classic L1-interference error."},
{id:"c04", s:"She insisted ____ paying for everyone’s dinner.", ans:["on","upon"], gt:"prep", tags:["prep","ger"], diff:2, exp:"insist ON + -ing.", trap:"The -ing after the gap confirms a preposition is needed."},
{id:"c05", s:"The ending was completely different ____ what I had expected.", ans:["from","to"], gt:"prep", tags:["prep"], diff:2, exp:"different FROM (also accepted: different TO in British English).", trap:"'different THAN' is American/informal — risky at Cambridge."},
{id:"c06", s:"Who was responsible ____ locking up the office last night?", ans:["for"], gt:"prep", tags:["prep","ger"], diff:1, exp:"responsible FOR + -ing.", trap:"responsible OF doesn’t exist."},
{id:"c07", s:"The region is famous ____ its spectacular beaches.", ans:["for"], gt:"prep", tags:["prep"], diff:1, exp:"famous FOR something.", trap:"famous BY/OF are the usual wrong guesses."},
{id:"c08", s:"I’ve never been much good ____ remembering names.", ans:["at"], gt:"prep", tags:["prep","ger"], diff:1, exp:"good/bad AT + -ing.", trap:"good IN appears right but fails."},
{id:"c09", s:"____ first, I found the course difficult, but it got easier.", ans:["at"], gt:"prep", tags:["depprep"], diff:2, exp:"AT first = in the beginning (contrast follows).", trap:"IN first / At the first — the chunk is exactly AT FIRST."},
{id:"c10", s:"He accepted the award ____ behalf of the whole team.", ans:["on"], gt:"prep", tags:["depprep"], diff:3, exp:"ON behalf of = representing.", trap:"IN behalf is the near-miss."},
{id:"c11", s:"Most residents are ____ favour of the new cycle lanes.", ans:["in"], gt:"prep", tags:["depprep"], diff:2, exp:"IN favour of = supporting.", trap:"ON favour mixes it with 'on behalf'."},
{id:"c12", s:"The breakthrough came as a result ____ years of patient research.", ans:["of"], gt:"prep", tags:["depprep"], diff:2, exp:"as a result OF.", trap:"as a result FROM is the bait."},
{id:"c13", s:"____ addition to the salary, the job offers free accommodation.", ans:["in"], gt:"prep", tags:["depprep"], diff:2, exp:"IN addition to = besides.", trap:"The capital letter shows it starts the phrase: In addition to."},
{id:"c14", s:"Her latest novel is quite similar ____ her first one.", ans:["to"], gt:"prep", tags:["prep"], diff:1, exp:"similar TO.", trap:"similar WITH/AS — both wrong."},
{id:"c15", s:"The recipe consists ____ only five basic ingredients.", ans:["of"], gt:"prep", tags:["prep"], diff:2, exp:"consist OF = be made of.", trap:"consist IN exists but means something different (rare) — Cambridge wants OF here."},
{id:"c16", s:"She’s been happily married ____ a dentist for ten years.", ans:["to"], gt:"prep", tags:["prep"], diff:2, exp:"married TO somebody.", trap:"married WITH is the L1 trap par excellence."},
{id:"c17", s:"I don’t know ____ to accept the job offer or wait for something better.", ans:["whether"], gt:"link", tags:["link"], diff:3, exp:"WHETHER … or — IF is not used before 'to + infinitive'.", trap:"IF feels natural but fails before 'to accept'."},
{id:"c18", s:"____ being exhausted after the flight, she went straight to the meeting.", ans:["despite"], gt:"link", tags:["link","ger"], diff:3, exp:"DESPITE + -ing.", trap:"Although + -ing is impossible; and despite never takes OF."},
{id:"c19", s:"He went to work ____ though he was feeling terrible.", ans:["even"], gt:"link", tags:["link"], diff:2, exp:"EVEN though = although (stronger).", trap:"The gap is before 'though', so ALTHOUGH itself cannot fit."},
{id:"c20", s:"We enjoyed the festival in ____ of the dreadful weather.", ans:["spite"], gt:"link", tags:["link"], diff:2, exp:"in SPITE of.", trap:"The OF after the gap points to 'spite', not 'despite'."},
{id:"c21", s:"____ long as you keep the receipt, you can return it.", ans:["as","so"], gt:"link", tags:["link","cond"], diff:2, exp:"AS/SO long as = provided that.", trap:"The capital + 'long as' pattern identifies the chunk."},
{id:"c22", s:"Take a jacket in ____ it gets cold on the boat.", ans:["case"], gt:"link", tags:["link","cond"], diff:2, exp:"in CASE + clause = as a precaution.", trap:"'in case OF' would need a noun, not a clause."},
{id:"c23", s:"I’ll lend you the money on condition ____ you pay it back by Friday.", ans:["that"], gt:"link", tags:["link","cond"], diff:3, exp:"on condition THAT = only if.", trap:"OF after 'condition' fails before a full clause."},
{id:"c24", s:"Rarely ____ we see such generosity from a stranger.", ans:["do"], gt:"aux", tags:["inv","aux"], diff:4, exp:"Negative adverb first → inversion with DO.", trap:"'Rarely we see' without the auxiliary is the trap."},
{id:"c25", s:"Not until the final whistle ____ the fans start to celebrate.", ans:["did"], gt:"aux", tags:["inv","aux"], diff:5, exp:"Not until X + DID + subject + verb.", trap:"Past context → DID, and inversion is compulsory."},
{id:"c26", s:"She has lived here much longer than I ____ .", ans:["have"], gt:"aux", tags:["aux","comp"], diff:3, exp:"Comparative ellipsis echoes the auxiliary: than I HAVE.", trap:"'than I do' clashes with the present perfect before it."},
{id:"c27", s:"I didn’t enjoy the film, and neither ____ my brother.", ans:["did"], gt:"aux", tags:["aux"], diff:2, exp:"neither + auxiliary + subject, copying the tense (didn’t → did).", trap:"'neither my brother' or 'neither does' (wrong tense) are the traps."},
{id:"c28", s:"____ you need any further information, please contact our office.", ans:["should"], gt:"aux", tags:["cond","inv"], diff:4, exp:"SHOULD you need = If you need (formal inverted conditional).", trap:"IF fits the meaning but the inversion slot wants SHOULD."},
{id:"c29", s:"The windows ____ being cleaned at the moment, so use the back door.", ans:["are"], gt:"aux", tags:["pass","aux"], diff:2, exp:"Present continuous passive: ARE being cleaned.", trap:"'is' fails — windows is plural."},
{id:"c30", s:"By next summer, they will ____ finished the new terminal.", ans:["have"], gt:"aux", tags:["aux"], diff:3, exp:"Future perfect: will HAVE + participle, triggered by 'By + time'.", trap:"'will BE finished' changes the structure — HAVE is the cloze answer."},
{id:"c31", s:"I ____ been told that the museum closes early on Sundays.", ans:["have"], gt:"aux", tags:["aux","pass"], diff:2, exp:"Present perfect passive: have BEEN told.", trap:"The BEEN after the gap is the signpost."},
{id:"c32", s:"It’s high time something was ____ about the traffic in this town.", ans:["done"], gt:"vform", tags:["fix","pass"], diff:4, exp:"Fixed passive chunk: something must be DONE / was done about it.", trap:"'made about' is the collocation trap — English DOES something about problems."},
{id:"c33", s:"You ____ better hurry — the last train leaves in ten minutes.", ans:["had"], gt:"modal", tags:["modal"], diff:2, exp:"HAD better + bare infinitive.", trap:"'would better' doesn’t exist; the contraction ’d = HAD."},
{id:"c34", s:"You ____ have told me you were coming — I’d have cooked something!", ans:["should","could","might"], gt:"modal", tags:["modal"], diff:3, exp:"Past criticism/reproach: should/could/might HAVE + participle.", trap:"MUST have told = deduction, not reproach — wrong flavour here."},
{id:"c35", s:"Visitors ____ not feed the animals under any circumstances.", ans:["must","may"], gt:"modal", tags:["modal"], diff:2, exp:"Prohibition on signs: MUST NOT (or formal MAY NOT).", trap:"'do not' would need different word order — the slot wants a modal."},
{id:"c36", s:"The film, ____ was shot entirely in Iceland, won three awards.", ans:["which"], gt:"rel", tags:["rel"], diff:2, exp:"Non-defining clause (commas) about a thing → WHICH.", trap:"THAT after a comma is forbidden."},
{id:"c37", s:"The author, ____ first book sold a million copies, lives quietly in Wales.", ans:["whose"], gt:"rel", tags:["rel"], diff:3, exp:"Possession → WHOSE (her first book).", trap:"'who his' / 'which' both fail — possession needs whose."},
{id:"c38", s:"The village ____ my grandparents grew up has hardly changed.", ans:["where"], gt:"rel", tags:["rel"], diff:2, exp:"Place + complete clause after the gap → WHERE.", trap:"'which' would need a preposition: in which they grew up."},
{id:"c39", s:"Much of ____ he told us later turned out to be untrue.", ans:["what"], gt:"rel", tags:["rel"], diff:4, exp:"WHAT = the thing(s) that; no noun before the gap.", trap:"'that' after 'of' is impossible — preposition + THAT never combines like this."},
{id:"c40", s:"It was the manner in ____ she spoke that upset everyone.", ans:["which"], gt:"rel", tags:["rel"], diff:4, exp:"Preposition + WHICH (in which = how).", trap:"in THAT / in WHERE are both impossible after a preposition."},
{id:"c41", s:"Carlos cut ____ rather badly while he was chopping onions.", ans:["himself"], gt:"pron", tags:["pron"], diff:1, exp:"Reflexive: subject and object are the same person.", trap:"'him' would mean somebody else got cut."},
{id:"c42", s:"The twins send each ____ funny photos every single day.", ans:["other"], gt:"pron", tags:["pron"], diff:2, exp:"each OTHER = reciprocal action.", trap:"'each others' / 'each one' — the chunk is exactly each other."},
{id:"c43", s:"I found ____ almost impossible to stay awake during the lecture.", ans:["it"], gt:"pron", tags:["pron","fix"], diff:3, exp:"Dummy IT: find IT + adjective + to-infinitive.", trap:"Leaving the gap for 'myself' — the pattern needs empty IT."},
{id:"c44", s:"Sofia decorated the whole flat by ____ in a single weekend.", ans:["herself"], gt:"pron", tags:["pron","fix"], diff:2, exp:"BY + reflexive = alone, without help.", trap:"'by her own' blends two idioms — it’s ON her own or BY herself."},
{id:"c45", s:"There was hardly ____ traffic on the roads this morning.", ans:["any"], gt:"det", tags:["det"], diff:2, exp:"hardly ANY = almost no.", trap:"'hardly no traffic' double-negates."},
{id:"c46", s:"____ of my friends has ever been to Japan, so I have no one to ask.", ans:["none"], gt:"det", tags:["det"], diff:3, exp:"NONE of + plural = not one of them.", trap:"'No one of my friends' — NO ONE never takes of."},
{id:"c47", s:"He spends far ____ much time playing video games.", ans:["too"], gt:"det", tags:["det","comp"], diff:2, exp:"far TOO much = excessively.", trap:"'so much' fits rhythm but 'far so much' is impossible."},
{id:"c48", s:"You can take ____ of the two routes — they’re equally fast.", ans:["either"], gt:"det", tags:["det"], diff:3, exp:"EITHER of the two = one or the other.", trap:"'any of the two' is the L1 calque; with two, use either."},
{id:"c49", s:"Very ____ people realise how old this bridge actually is.", ans:["few"], gt:"det", tags:["det"], diff:2, exp:"very FEW + plural countable = almost none.", trap:"'very little people' would comment on their height!"},
{id:"c50", s:"It was ____ a boring speech that half the audience fell asleep.", ans:["such"], gt:"det", tags:["det","comp"], diff:2, exp:"SUCH + a + adjective + noun … that.", trap:"SO + adjective only — 'so a boring speech' is impossible."},
{id:"c51", s:"She plays ____ violin in the national youth orchestra.", ans:["the"], gt:"art", tags:["art"], diff:1, exp:"play THE + musical instrument.", trap:"Zero article works for sports (play tennis) but NOT instruments."},
{id:"c52", s:"The new stadium is nothing like as good as ____ old one was.", ans:["the"], gt:"art", tags:["art"], diff:2, exp:"THE old one — specified by contrast.", trap:"'an old one' loses the specific reference."},
{id:"c53", s:"____ more you practise retrieval, the longer you remember things.", ans:["the"], gt:"art", tags:["art","comp"], diff:2, exp:"THE + comparative, THE + comparative.", trap:"Both halves need THE — including the first."},
{id:"c54", s:"We should make ____ effort to arrive before the speeches start.", ans:["an"], gt:"art", tags:["art","fix"], diff:2, exp:"make AN effort — fixed collocation with article.", trap:"Dropping the article ('make effort') is the typical loss."},
{id:"c55", s:"On ____ other hand, living in the centre is far more convenient.", ans:["the"], gt:"art", tags:["art","fix"], diff:1, exp:"on THE other hand — fixed discourse chunk.", trap:"'On other hand' — the article is not optional."},
{id:"c56", s:"Carry ____ with the exercises while I check your essays.", ans:["on"], gt:"adv", tags:["pv"], diff:1, exp:"carry ON = continue.", trap:"carry OUT (= perform a task) is the near neighbour."},
{id:"c57", s:"The plane finally took ____ after a two-hour delay.", ans:["off"], gt:"adv", tags:["pv"], diff:1, exp:"take OFF = leave the ground.", trap:"take UP/OUT change the meaning entirely."},
{id:"c58", s:"While clearing the attic, I came ____ a box of wartime letters.", ans:["across","upon"], gt:"adv", tags:["pv"], diff:2, exp:"come ACROSS = find by chance.", trap:"come ACROSS vs come UP WITH (invent) — different particles, different worlds."},
{id:"c59", s:"Could you fill ____ this form and sign it at the bottom?", ans:["in","out"], gt:"adv", tags:["pv"], diff:1, exp:"fill IN (BrE) / fill OUT (AmE) a form.", trap:"fill UP is for petrol tanks, not forms."},
{id:"c60", s:"Don’t worry — the noise of the city is easy to get used ____ .", ans:["to"], gt:"adv", tags:["ger","prep"], diff:3, exp:"get used TO something — the TO survives at the end.", trap:"The stranded preposition is invisible to many students."},
{id:"c61", s:"He made ____ his mind to apply for the scholarship.", ans:["up"], gt:"adv", tags:["fix","pv"], diff:2, exp:"make UP your mind = decide.", trap:"make OUT / make OVER don’t produce decisions."},
{id:"c62", s:"How long does it ____ to get to the coast from here?", ans:["take"], gt:"vform", tags:["fix"], diff:1, exp:"it TAKES + time — fixed time expression.", trap:"'how long does it last' works for events, not journeys with IT."},
{id:"c63", s:"I couldn’t help ____ when I saw his new haircut.", ans:["laughing","smiling"], gt:"vform", tags:["ger","fix"], diff:3, exp:"can’t help + -ING = can’t stop yourself.", trap:"'couldn’t help to laugh' is the bait."},
{id:"c64", s:"I have ____ idea where she keeps the spare keys.", ans:["no"], gt:"det", tags:["det","fix"], diff:1, exp:"have NO idea = don’t know at all.", trap:"'any idea' needs a negative verb before it."},
{id:"c65", s:"The sooner we book the flights, ____ cheaper they will be.", ans:["the"], gt:"comp", tags:["comp","art"], diff:2, exp:"the + comparative, THE + comparative.", trap:"Second half also needs THE."},
{id:"c66", s:"His second album is far ____ ambitious than his first.", ans:["more","less"], gt:"comp", tags:["comp"], diff:2, exp:"far MORE/LESS + adjective + than.", trap:"'far ambitious' or 'far most' break the comparative."},
{id:"c67", s:"At fifteen, she is already twice ____ tall as her mother.", ans:["as"], gt:"comp", tags:["comp"], diff:3, exp:"twice AS tall AS — multiplier + as…as.", trap:"'twice more tall' calques from other languages."},
{id:"c68", s:"____ matter how hard I try, I can’t roll my Rs.", ans:["no"], gt:"fixphrase", tags:["fix"], diff:3, exp:"NO matter how = however hard.", trap:"'Not matter' / 'Never matter' — the chunk is NO matter."},
{id:"c69", s:"The invitation arrived completely out of ____ blue.", ans:["the"], gt:"fixphrase", tags:["fix","art"], diff:2, exp:"out of THE blue = unexpectedly.", trap:"Articles inside idioms are fixed — no variations allowed."},
{id:"c70", s:"From now ____ , all reports must be submitted online.", ans:["on","onwards"], gt:"fixphrase", tags:["fix"], diff:1, exp:"from now ON = starting now.", trap:"'From now and then' confuses two different idioms."},
{id:"c71", s:"All of a ____ , the lights went out and the music stopped.", ans:["sudden"], gt:"fixphrase", tags:["fix"], diff:2, exp:"all of a SUDDEN = suddenly.", trap:"'all of the sudden' is non-standard."},
{id:"c72", s:"It goes without ____ that mobile phones must be switched off.", ans:["saying"], gt:"fixphrase", tags:["fix","ger"], diff:3, exp:"it goes without SAYING = it’s obvious.", trap:"'without say' / 'without said' — the -ING is fixed."},
{id:"c73", s:"As far as I’m ____ , the proposal is a complete waste of money.", ans:["concerned"], gt:"fixphrase", tags:["fix"], diff:3, exp:"as far as I’m CONCERNED = in my opinion.", trap:"'as far as I’m concern' loses the -ed and the mark."},
{id:"c74", s:"In ____ of fire, do not use the lifts.", ans:["case"], gt:"fixphrase", tags:["fix"], diff:2, exp:"in CASE of + noun = if there is.", trap:"Here OF follows, so it’s the noun version of in case."},
{id:"c75", s:"Preparations for the festival are already well under ____ .", ans:["way"], gt:"fixphrase", tags:["fix"], diff:4, exp:"under WAY = in progress.", trap:"'under work' / 'under going' — the idiom is under way."},
{id:"c76", s:"She turned ____ to be the best manager the club ever had.", ans:["out"], gt:"adv", tags:["pv"], diff:2, exp:"turn OUT to be = prove to be in the end.", trap:"turn UP = arrive; turn OUT = result."},
{id:"c77", s:"Thanks to the new coach, the team’s results are improving little ____ little.", ans:["by"], gt:"fixphrase", tags:["fix"], diff:2, exp:"little BY little = gradually.", trap:"'little to little' / 'little and little' miss the idiom."},
{id:"c78", s:"____ average, students need about 600 hours to reach B2 level.", ans:["on"], gt:"prep", tags:["depprep"], diff:3, exp:"ON average — fixed statistical phrase.", trap:"IN average / AT average are the standard misses."},
{id:"c79", s:"The concert had to be cancelled owing ____ the singer’s illness.", ans:["to"], gt:"prep", tags:["link","prep"], diff:3, exp:"owing TO = because of.", trap:"owing OF mixes it with 'because of'."},
{id:"c80", s:"There’s no point ____ arguing with the referee — he never changes his mind.", ans:["in"], gt:"prep", tags:["fix","ger"], diff:2, exp:"no point IN + -ing.", trap:"TO argue after 'point' is the bait."},
{id:"c81", s:"____ though she’d never acted before, she got the leading role.", ans:["even"], gt:"link", tags:["link"], diff:2, exp:"EVEN though + clause.", trap:"ALTHOUGH can’t combine with though."},
{id:"c82", s:"The meeting went ahead as planned, ____ the chairman’s absence.", ans:["despite"], gt:"link", tags:["link"], diff:3, exp:"DESPITE + noun phrase.", trap:"If you wrote 'in', the phrase would need 'in spite OF'. Despite stands alone."},
