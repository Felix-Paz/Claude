<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Drift Lasso — Neon Drift &amp; Capture</title>
<meta name="description" content="Drift Lasso: release to roam, hold to curl your trail into a lasso and pop the drones. One thumb, endless combos. A free hypercasual drift .io arcade game." />
<meta name="theme-color" content="#0A0A14" />
<!-- Discoverability / portal share card. Genre-clear, searchable: drift, io, arcade, hypercasual. -->
<meta property="og:title" content="Drift Lasso" />
<meta property="og:description" content="Release to roam, hold to lasso. Pop the drones. Don't cross your own trail." />
<meta property="og:type" content="website" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- brand favicon: amber drone inside a cyan→magenta lasso loop on ink (inline, no network) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23241A4D'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300E5FF'/%3E%3Cstop offset='1' stop-color='%23FF49C3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='34' r='17' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%23FFB020'/%3E%3C/svg%3E" />
<style>
  /* ---------------------------------------------------------------------------
     Drift Lasso — BOLD CARTOON 2.5D styles. Self-contained, no external fonts/CDN
     (fast first paint). Bright cream cards, a single dark "ink" outline, chunky
     candy buttons with a solid 3D drop. Tabular figures keep the score from jittering.
  --------------------------------------------------------------------------- */
  :root{
    --ink:#241A4D; --cream:#FFF7EC; --sky1:#5AD1FF; --sky2:#6A5BFF;
    --cyan:#00E5FF; --magenta:#FF49C3; --amber:#FFB020; --purple:#7C4DFF;
    --red:#FF3B5C; --white:#FFFFFF;
    --font: 800 16px/1.1 "Eurostile","Bahnschrift","DIN Alternate Bold","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:linear-gradient(180deg,var(--sky1),var(--sky2));
    overflow:hidden; position:fixed; inset:0;
    touch-action:none; overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
    font:var(--font); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #game{ position:absolute; inset:0; display:block; z-index:0; }
  #flash{ position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; }

  /* chunky cartoon corner buttons (ink outline + solid 3D drop) */
  .ui-btn{
    position:absolute; z-index:5; cursor:pointer; color:var(--ink);
    background:var(--white); border:3px solid var(--ink); border-radius:16px;
    box-shadow:0 4px 0 var(--ink); font:900 20px/1 inherit;
    width:54px; height:54px; display:flex; align-items:center; justify-content:center;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .ui-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  #btn-mute{ top:max(14px,env(safe-area-inset-top)); right:14px; }
  #btn-shop{ top:max(14px,env(safe-area-inset-top)); left:14px; color:var(--amber); }

  /* Overlay screens — DOM = crisp text + reliable large touch targets, off the hot path */
  .overlay{
    position:absolute; inset:0; z-index:10; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 38%, rgba(36,26,77,.40), rgba(36,26,77,.72));
    text-align:center; opacity:0; transition:opacity .26s ease;
  }
  .overlay.show{ display:flex; opacity:1; }
  /* the bright card */
  .panel{
    width:min(430px,94vw); display:flex; flex-direction:column; align-items:center; gap:12px;
    background:var(--cream); border:4px solid var(--ink); border-radius:30px;
    box-shadow:0 10px 0 rgba(36,26,77,.40), 0 22px 44px rgba(0,0,0,.28);
    padding:22px 20px 24px;
    animation:pop .26s cubic-bezier(.2,1.3,.5,1) both;
    max-height:94vh; overflow-y:auto; -webkit-overflow-scrolling:touch;  /* never clip the action buttons on short screens */
  }
  @keyframes pop{ from{ transform:scale(.86) translateY(8px); opacity:0; } to{ transform:none; opacity:1; } }

  .eyebrow{ font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--purple); font-weight:900; }
  .headline{ font-size:clamp(34px,11vw,56px); letter-spacing:1px; line-height:.95; margin:1px 0; color:var(--ink); text-shadow:0 3px 0 rgba(36,26,77,.18); }
  .headline.close{ color:var(--magenta); }
  .sub{ font-size:15px; color:#5a5480; font-weight:700; }

  .score-big{ font-size:clamp(58px,18vw,96px); color:var(--magenta); letter-spacing:1px; font-variant-numeric:tabular-nums; text-shadow:0 4px 0 rgba(36,26,77,.22); }
  .best-row{ display:flex; gap:16px; justify-content:center; align-items:center; font-size:15px; color:#6b6493; letter-spacing:.5px; font-weight:800; }
  .best-row b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  .near{ font-size:14px; color:#5a5480; line-height:1.5; max-width:340px; font-weight:700; }
  .near b{ color:var(--magenta); }

  /* chunky candy buttons with a solid ink 3D drop */
  .btn{
    width:100%; max-width:380px; min-height:62px; border:3px solid var(--ink); border-radius:18px;
    color:var(--ink); font:900 19px/1 inherit; letter-spacing:.4px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 6px 0 var(--ink); transition:transform .06s ease, box-shadow .06s ease; padding:0 16px;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.primary{ background:var(--cyan); }
  .btn.reward{ background:var(--magenta); color:var(--white); }
  .btn.ghost{ background:var(--white); }
  .btn .tag{ font-size:12px; font-weight:900; padding:3px 8px; border-radius:999px; background:rgba(36,26,77,.16); letter-spacing:.5px; }
  .btn[disabled]{ filter:grayscale(.5) brightness(.92); opacity:.7; pointer-events:none; }
  .btn-row{ display:flex; gap:12px; width:100%; max-width:380px; }
  .btn-row .btn{ flex:1; min-width:0; }

  /* Coins + next-unlock progress (always-visible goal) */
  .wallet{ display:flex; align-items:center; gap:8px; font-size:19px; color:#b9770a; font-weight:900; }
  .wallet .coin{ width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6cf, var(--amber) 62%, #a86f00); border:2px solid var(--ink); display:inline-block; }
  .progress-wrap{ width:100%; max-width:380px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12.5px; color:#6b6493; letter-spacing:.4px; margin-bottom:6px; font-weight:800; }
  .progress-label b{ color:var(--ink); }
  .bar{ height:14px; border-radius:999px; background:#EADFce; border:3px solid var(--ink); overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--amber),#ffd86b); transition:width .4s ease; }

  /* Shop grid */
  .shop-grid{ width:100%; display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:2px; max-height:44vh; overflow-y:auto; padding:4px; -webkit-overflow-scrolling:touch; }
  .skin{ position:relative; border-radius:18px; padding:12px 10px 11px; background:var(--white); border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink); display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; transition:transform .06s ease, box-shadow .06s ease; }
  .skin:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .skin.equipped{ background:#E9FBFF; box-shadow:0 4px 0 var(--ink), 0 0 0 3px var(--cyan) inset; }
  .skin canvas{ width:110px; height:46px; display:block; }
  .skin .name{ font-size:13px; letter-spacing:.2px; color:var(--ink); font-weight:900; }
  .skin .cost{ font-size:13px; color:#b9770a; font-weight:900; display:flex; align-items:center; gap:5px; }
  .skin .state{ font-size:11px; letter-spacing:.6px; text-transform:uppercase; font-weight:900; }
  .skin .state.eq{ color:#0098b0; }
  .skin .state.un{ color:#8a83ad; }
  .skin .mini-coin{ width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6cf, var(--amber) 62%, #a86f00); border:1.5px solid var(--ink); display:inline-block; }

  .toast{ position:absolute; left:50%; top:13%; transform:translateX(-50%); z-index:30; background:var(--white); border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); color:var(--ink); padding:12px 18px; border-radius:16px; font-weight:900; letter-spacing:.3px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; text-align:center; max-width:88vw; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(6px); }

  /* Simulated ad modal (stub). Real SDK replaces this entirely — see AdSDK. */
  #ad{ position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(20,14,40,.92); flex-direction:column; gap:20px; text-align:center; padding:24px; }
  #ad.show{ display:flex; }
  #ad .ad-box{ width:min(420px,92vw); border:3px solid var(--ink); border-radius:22px; padding:26px 22px; background:var(--cream); box-shadow:0 10px 0 rgba(36,26,77,.4); }
  #ad .ad-mark{ font-size:11px; letter-spacing:3px; color:#8a83ad; text-transform:uppercase; font-weight:900; }
  #ad .ad-title{ font-size:22px; margin:10px 0 4px; color:var(--ink); }
  #ad .ad-sub{ font-size:13.5px; color:#6b6493; margin-bottom:18px; font-weight:700; }
  #ad .ad-bar{ height:14px; border-radius:999px; background:#EADFce; border:3px solid var(--ink); overflow:hidden; margin-bottom:18px; }
  #ad .ad-bar > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--magenta),var(--cyan)); }
  #ad .ad-actions{ display:flex; gap:10px; justify-content:center; }
  #ad .ad-actions .btn{ min-height:48px; font-size:16px; }

  /* brand logo on the game-over card */
  .logo{ width:min(240px,66vw); height:auto; display:block; margin:0 auto 2px; }
  /* PLAY AGAIN is the hero action — biggest button on the screen */
  .btn.big{ min-height:76px; font-size:24px; box-shadow:0 8px 0 var(--ink); }
  .btn.big:active{ transform:translateY(5px); box-shadow:0 3px 0 var(--ink); }
  #over-lvl{ color:var(--cyan); font-weight:900; }
  /* objectives / goals */
  .goals{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:7px; }
  .goal{ display:flex; align-items:center; gap:9px; background:var(--white); border:3px solid var(--ink); border-radius:13px; padding:8px 11px; box-shadow:0 3px 0 var(--ink); }
  .goal.done{ background:#E9FFE9; }
  .goal .gicon{ font-size:18px; }
  .goal .gtext{ flex:1; min-width:0; text-align:left; }
  .goal .gname{ font-size:13px; font-weight:900; color:var(--ink); }
  .goal .gbar{ height:8px; border-radius:999px; background:#EADFce; border:2px solid var(--ink); overflow:hidden; margin-top:4px; }
  .goal .gbar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--magenta)); }
  .goal .greward{ font-size:13px; font-weight:900; color:#b9770a; white-space:nowrap; }
  .goal.done .greward{ color:#1a9d2e; }
  /* garage section header + equipped power chip */
  .wallet-big{ font-size:32px; }
  .wallet-big .coin{ width:26px; height:26px; }
  .wallet-big .run-delta{ font-size:16px; color:#1a9d2e; font-weight:900; }
  .shop-sec{ grid-column:1/-1; text-align:left; font-size:12px; letter-spacing:2px; font-weight:900; color:var(--purple); text-transform:uppercase; margin:6px 2px 0; }
  .skin .pico{ font-size:30px; line-height:1; margin:3px 0; }
  .skin-wide{ grid-column:1/-1; }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:2px; }
  .sw{ width:24px; height:24px; border-radius:7px; border:2px solid var(--ink); cursor:pointer; }
  .sw.on{ box-shadow:0 0 0 3px var(--cyan); }

  /* ---- V2 UI: account spine, leaderboard, settings, share ---- */
  .acct{ display:flex; align-items:center; justify-content:center; gap:10px; font-size:13px; font-weight:900; color:#6b6493; }
  .acct .acct-title{ color:var(--purple); letter-spacing:.5px; }
  .acct .acct-lv{ color:var(--ink); }
  .acct-bar{ width:100%; max-width:380px; height:12px; }
  .acct-bar > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--purple)); transition:width .5s ease; }
  .near.teaser b{ color:var(--cyan); }

  /* ---- game-over: a clear 3-tier hierarchy + desktop-wide layout ---- */
  .over-panel{ width:min(560px,94vw); }                /* widen so it doesn't crumple in the centre on desktop */
  .over-panel .score-big{ line-height:.9; }
  /* TIER 1 — the hero action (biggest thing on screen) */
  .btn.hero{ background:var(--cyan); width:100%; max-width:none; min-height:78px; font-size:25px; box-shadow:0 8px 0 var(--ink); }
  .btn.hero:active{ transform:translateY(5px); box-shadow:0 3px 0 var(--ink); }
  /* TIER 2 — ad-reward group, visually distinct (magenta + ▶ chip) and labelled */
  .bonus-group{ width:100%; border:3px dashed rgba(36,26,77,.35); border-radius:16px; padding:9px 10px 11px; display:flex; flex-direction:column; gap:8px; }
  .bonus-label{ font-size:11px; letter-spacing:1.5px; font-weight:900; color:#8a83ad; text-align:center; }
  .btn.bonus{ background:var(--magenta); color:var(--white); min-height:52px; font-size:16px; }
  .btn.bonus::before{ content:"\25B6"; font-size:12px; margin-right:6px; opacity:.9; }
  /* TIER 3 — small secondary nav (icons + short labels), never competes with PLAY AGAIN */
  .nav-row{ display:flex; gap:8px; width:100%; flex-wrap:wrap; }
  .btn.nav{ flex:1 1 40%; min-width:120px; min-height:46px; font-size:14px; background:var(--white); box-shadow:0 4px 0 var(--ink); }
  .btn.nav:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  /* leaderboard */
  .board-list{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:6px; max-height:52vh; overflow-y:auto; padding:2px; }
  .brow{ display:flex; align-items:center; gap:10px; background:var(--white); border:3px solid var(--ink); border-radius:12px; padding:8px 12px; box-shadow:0 3px 0 var(--ink); }
  .brow.me{ background:#E9FBFF; box-shadow:0 3px 0 var(--ink), 0 0 0 3px var(--cyan) inset; }
  .brow .rank{ font-size:14px; font-weight:900; color:var(--purple); width:30px; text-align:left; }
  .brow .who{ flex:1; text-align:left; font-size:13px; font-weight:800; color:var(--ink); }
  .brow .sc{ font-size:15px; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums; }
  /* settings */
  .set-row{ display:flex; align-items:center; justify-content:space-between; width:100%; max-width:380px; background:var(--white); border:3px solid var(--ink); border-radius:14px; padding:12px 14px; box-shadow:0 3px 0 var(--ink); font-size:15px; font-weight:900; color:var(--ink); }
  .toggle{ min-width:74px; min-height:38px; border:3px solid var(--ink); border-radius:999px; background:#EADFce; color:var(--ink); font:900 14px/1 inherit; cursor:pointer; box-shadow:0 3px 0 var(--ink); }
  .toggle.on{ background:var(--cyan); }
  /* garage: wider on desktop + a responsive grid that fills the space */
  .garage-panel{ width:min(680px,96vw); }
  .garage-panel .shop-grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); max-height:56vh; }
  /* rarity corner badge on each skin tile */
  .skin{ position:relative; }
  .skin .rar{ position:absolute; top:6px; right:6px; font-size:9px; font-weight:900; letter-spacing:.6px; padding:2px 6px; border-radius:999px; border:2px solid var(--ink); color:var(--ink); }
  .skin.locked{ filter:saturate(.85); }
  .skin .cost.afford{ color:#1a9d2e; }
  .skin .cost.cant{ color:#c0392b; }
  /* custom editor card */
  .style-row{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
  .stylechip{ font-size:10px; font-weight:900; letter-spacing:.4px; text-transform:uppercase; padding:4px 8px; border-radius:999px; border:2px solid var(--ink); background:var(--white); cursor:pointer; color:var(--ink); }
  .stylechip.on{ background:var(--magenta); color:#fff; }
  .hidden{ display:none !important; }
  a{ color:var(--purple); }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="flash"></div>

  <button id="btn-shop" class="ui-btn" aria-label="Shop">&#9733;</button>
  <button id="btn-mute" class="ui-btn" aria-label="Mute">&#128266;</button>

  <!-- GAME OVER -->
  <div id="over" class="overlay">
    <div class="panel over-panel">
      <svg id="logo" class="logo" viewBox="0 0 380 168" aria-label="Drift Lasso">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#8A5BFF"/><stop offset="1" stop-color="#FF49C3"/></linearGradient></defs>
        <!-- swinging lasso rope: a big loop + a coiled tail, ink-shadowed -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M250 40 C320 30 360 70 330 104 C300 138 150 140 96 112 C58 92 70 58 120 56" stroke="#241A4D" stroke-width="20" transform="translate(0,5)"/>
          <path d="M250 40 C320 30 360 70 330 104 C300 138 150 140 96 112 C58 92 70 58 120 56" stroke="url(#lg)" stroke-width="13"/>
          <path d="M120 56 C150 54 150 30 120 26 C96 23 92 44 112 50" stroke="#241A4D" stroke-width="18" transform="translate(0,5)"/>
          <path d="M120 56 C150 54 150 30 120 26 C96 23 92 44 112 50" stroke="#00E5FF" stroke-width="11"/>
        </g>
        <!-- a wee amber critter caught in the loop (witty + iconic) -->
        <g transform="translate(300,92)"><circle r="15" fill="#241A4D"/><circle r="12" fill="#FFB020"/><circle cx="-4" cy="-2" r="3.2" fill="#241A4D"/><circle cx="4" cy="-2" r="3.2" fill="#241A4D"/></g>
        <!-- wordmark with a chunky ink drop-shadow -->
        <g font-family="'Segoe UI',system-ui,Arial" font-weight="900" text-anchor="middle">
          <text x="192" y="98" font-size="58" fill="#241A4D" letter-spacing="1">DRIFT</text>
          <text x="190" y="94" font-size="58" fill="#00E5FF" stroke="#241A4D" stroke-width="7" paint-order="stroke" letter-spacing="1">DRIFT</text>
          <text x="192" y="156" font-size="58" fill="#241A4D" letter-spacing="6">LASSO</text>
          <text x="190" y="152" font-size="58" fill="#FF49C3" stroke="#241A4D" stroke-width="7" paint-order="stroke" letter-spacing="6">LASSO</text>
        </g>
      </svg>
      <div class="score-big" id="over-score">0</div>
      <div class="best-row"><span>BEST <b id="over-best">0</b></span><span id="over-lvl">LV 1</span><span id="over-newbest" class="hidden" style="color:var(--magenta)">NEW BEST!</span></div>
      <div class="wallet wallet-big"><span class="coin"></span><span id="over-coinTotal">0</span><span class="run-delta" id="over-coins">+0</span></div>

      <!-- account spine: title + level + XP bar -->
      <div class="acct"><span class="acct-title" id="over-title">Rookie Wrangler</span><span class="acct-lv" id="over-acctlv">ACCT LV 1</span></div>
      <div class="bar acct-bar"><i id="over-xpfill"></i></div>
      <!-- rank nudge + Zeigarnik teaser (closest goal) -->
      <div class="near" id="over-rank"></div>
      <div class="near teaser" id="over-teaser"></div>

      <!-- TIER 1 — the one hero action -->
      <button class="btn hero" id="btn-again">PLAY AGAIN</button>

      <!-- TIER 2 — ad-rewards, clearly grouped so they don't read as navigation -->
      <div class="bonus-group">
        <div class="bonus-label">&#9654; WATCH A SHORT AD FOR A BONUS</div>
        <div class="btn-row">
          <button class="btn bonus" id="btn-revive">REVIVE</button>
          <button class="btn bonus" id="btn-double">2&#215; COINS</button>
        </div>
      </div>

      <!-- TIER 3 — small secondary navigation -->
      <div class="nav-row">
        <button class="btn nav" id="btn-openshop">&#128295; Garage</button>
        <button class="btn nav" id="btn-board">&#127942; Ranks</button>
        <button class="btn nav" id="btn-share">&#128228; Share</button>
        <button class="btn nav" id="btn-settings">&#9881; Settings</button>
      </div>
    </div>
  </div>

  <!-- LEADERBOARD (weekly) -->
  <div id="board" class="overlay">
    <div class="panel">
      <div class="eyebrow">This Week</div>
      <div class="headline" style="font-size:clamp(26px,8vw,40px)">RANKINGS</div>
      <div class="board-list" id="board-list"></div>
      <button class="btn primary" id="btn-board-close">BACK</button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="settings" class="overlay">
    <div class="panel">
      <div class="eyebrow">Settings</div>
      <div class="headline" style="font-size:clamp(26px,8vw,40px)">OPTIONS</div>
      <div class="set-row"><span>Colour-blind aid</span><button class="toggle" id="set-cb">OFF</button></div>
      <div class="set-row"><span>Reduce motion</span><button class="toggle" id="set-rm">OFF</button></div>
      <div class="set-row"><span>Sound</span><button class="toggle on" id="set-mute">ON</button></div>
      <div class="near" id="set-info" style="margin-top:4px"></div>

<script>
"use strict";
/* =============================================================================
   DRIFT LASSO
   A portal-ready hypercasual game. Single self-contained build.
   Vanilla JS + HTML5 Canvas 2D. No dependencies, no network calls.

   The file is organized into clearly separated modules (search the banners):
     [CONFIG]      all tunables, named for data-driven iteration
     [RNG]         seedable PRNG — ALL gameplay randomness routes here (V2)
     [UTIL]        math + geometry (segment intersect, point-in-poly, area)
     [STORAGE]     persistence abstraction (localStorage now, cloud-save later)
     [PERF]        one-time FPS probe -> device tier (visual-only governor) (V2)
     [AUDIO]       procedural WebAudio engine (autoplay-safe, mute toggle)
     [ADSDK]       ad interface stub (rewarded/interstitial + fallbacks)
     [LEADER]      weekly leaderboard (local now, portal seam later) (V2)
     [META]        account XP, mastery tiers, titles, collection, sets (V2)
     [INPUT]       pointer/touch/mouse/keyboard/gamepad -> steer axis
     [POOL]        generic object pool (zero per-frame allocation)
     [SPRITES]     pre-rendered glow sprites (cheap bloom on mobile)
     [ENTITIES]    car, trail, drones
     [PARTICLES]   pooled particle system (cosmetic RNG = Math.random)
     [POPUPS]      pooled score popups
     [FX]          screen shake, hit-stop, flashes, chroma, near-miss
     [COSMETICS]   trail STYLES + car skins (rarity tiers), coins, unlocks (V2)
     [OBJECTIVES]  rotating goals = the game's "purpose" (paid in coins)
     [GAME]        state machine, spawn director, scoring, collisions
     [RENDER]      the draw pass (trail-style dispatch)
     [SHARE]       offscreen branded score-card PNG (V2)
     [UI]          DOM overlays (game over + logo + objectives, garage/shop)
     [LOOP]        fixed-timestep update + rAF render + lifecycle

   INVARIANTS (do not break):
     • ONE death rule: empty self-cross. No new fatal conditions.
     • Determinism: same seed + same effective-steer timeline => identical run.
       Gameplay randomness is consumed ONLY inside the fixed-timestep update via
       RNG; render-rate/cosmetic randomness uses Math.random so display FPS and
       the PERF governor can never desync the sim.
     • Zero per-frame heap alloc on the hot path (pools / pre-alloc buffers).
============================================================================= */

/* ============================== [CONFIG] ==================================== */
/* Every number a designer would touch lives here. See README "Tuning". */
const CONFIG = {
  // --- CAR / DRIFT ---------------------------------------------------------
  CAR_SPEED: 250,        // px/sec forward travel (constant)
  TURN_RATE: 2.7,        // rad/sec while steering -> lasso radius = CAR_SPEED/TURN_RATE (~93px)
  STEER_LERP: 16,        // how quickly the steering input ramps in (snappy, not jittery)
                         // DIRECT STEERING: ← / → (or A / D) on desktop; hold the LEFT or RIGHT
                         // half of the screen on phone. No input = drive straight.

  // --- TRAIL (the hero) ----------------------------------------------------
  TRAIL_LIFESPAN: 2.6,   // seconds a trail point stays alive (hazard + lasso window)
  TRAIL_MIN_DIST: 6,     // min px between recorded trail points (perf + smoothness)
  MAX_TRAIL_POINTS: 260, // hard cap (object pool size)
  TRAIL_WIDTH: 7.5,      // core stroke width in px
  SELF_GRACE_SEGMENTS: 6,// adjacency window skipped near the head = forgiving hitbox
  NEAR_MISS_DIST: 24,    // px proximity (no cross) that fires the near-miss warning
  PREVIEW_DIST: 30,      // px head->earlier-point that lights the close preview

  // --- DRONES (targets) ----------------------------------------------------
  DRONE_RADIUS: 13,
  DRONE_BASE_SPEED: 14,   // px/sec at difficulty 0
  DRONE_MAX_SPEED: 64,    // px/sec at difficulty 1
  MIN_DRONES: 7,          // a busy, fun arena even early on (lots of easy wins)
  MAX_DRONES: 28,         // ceiling at full difficulty / swarm peaks

  SMALL_CHANCE: 0.16,     // 🔹 tiny zippy ones — easy, low value, come in crowds
  BIG_CHANCE: 0.08,       // 🔵 big slow lunkers — worth a lot, hard to fit in a loop
  MAGNET_CHANCE: 0.08,    // 🧲 drawn toward your trail — they come to you
  GLUTTON_CHANCE: 0.05,   // 🟩 eats other critters and GROWS — huge payoff if you lasso it
  BOMB_CHANCE: 0.16,      // 💣 do NOT lasso — spoils the loop (tension-scaled by the director)
  SMALL_VALUE: 0.6, RUNNER_VALUE: 1.6, BIG_VALUE: 2.6, MAGNET_VALUE: 1.3, BONUS_VALUE: 3.0,

  // --- SWARMS (the "ups and downs" — occasional CRAZY moments) --------------
  SWARM_MIN: 22, SWARM_MAX: 40, // sec between swarm events
  SWARM_SIZE: 14,        // extra critters dumped in during a swarm

  // --- DIFFICULTY DIRECTOR (the win→tension→relief rhythm) ------------------
  TENSION_PERIOD: 22,    // sec per tension wave (calm troughs = easy wins, peaks = pressure)
  TENSION_SWING: 12,     // how many extra drones the wave adds at its peak (big ups & downs)
  RELIEF_TIME: 6,        // sec of calm after a revive (guaranteed quick win to recover)
  DDA_REF: 1400,         // recent-average score that = "skilled"; below it the game eases off
  DDA_MAX_EASE: 0.35,    // how much a struggling player's difficulty is reduced (0..1)

  // --- PROGRESSION + POWERS -----------------------------------------------
  LEVEL_STEP: 500,       // score per level-up (purpose: climb the levels)
  TAIL_GROW: 0.07,       // seconds added to the trail per drone circled (snake grows visibly)
  TAIL_MAX_EXTRA: 2.4,   // cap on the bonus tail length (longer snake = bigger lassos, more risk)
  POWERUP_MIN: 16, POWERUP_MAX: 26, // seconds between rare power-up orbs
  POWERUP_DUR: 7,        // seconds a collected power-up lasts
  MAGNET_EQUIP: 70,      // px/sec pull from the equipped Magnet power
  MAGNET_POWER: 240,     // px/sec pull from a collected MAGNET orb
  SLOMO_SCALE: 0.45,     // drone speed factor during a SLO-MO orb

  // --- DIFFICULTY RAMP -----------------------------------------------------
  RAMP_GENTLE_TIME: 20,  // sec of deliberately gentle intro (no wall)
  RAMP_FULL_TIME: 150,   // sec to approach max difficulty
  SCORE_FOR_MAX: 6000,   // score that also pushes difficulty toward 1

  // --- SCORING -------------------------------------------------------------
  BASE_CAPTURE: 110,     // base points per captured drone before area+combo
  AREA_REF_FRACTION: 0.085, // loop area / (arena*this) => normalized 1.0
  AREA_NORM_MIN: 0.4,
  AREA_NORM_MAX: 3.0,
  PERFECT_AREA: 1.6,     // normalized area above which a single-loop earns "PERFECT!"
  COMBO_MAX: 12,         // multiplier cap
  COMBO_DECAY_TIME: 4.5, // sec without a capture before the combo resets
  MILESTONE_STEP: 500,   // every N score -> coins + fanfare
  MILESTONE_COINS: 12,
  COINS_PER_100: 1,      // run coins = floor(score/100) * this

  // --- FEEL / JUICE --------------------------------------------------------
  SHAKE_DECAY: 6,
  HITSTOP_BIG: 0.10,     // sec of slow-mo on a weighty capture
  HITSTOP_THRESHOLD: 2,  // drones in one capture to trigger hit-stop
  CHROMA_COMBO: 4,       // combo >= this turns on subtle chromatic aberration

  // --- ARENA ---------------------------------------------------------------
  WALL_DEATH: false,     // keep ONE death rule (self-cross). Soft containment instead.
  WALL_MARGIN: 26,       // px from edge where containment starts steering inward
  CONTAIN_STRENGTH: 3.2, // how hard the car curves back from a wall

  // --- POOLS ---------------------------------------------------------------
  MAX_PARTICLES: 340,
  MAX_POPUPS: 24,

  // --- MONETIZATION --------------------------------------------------------
  INTERSTITIAL_EVERY_RUNS: 3, // show an interstitial at most once per N game-overs
  REVIVE_INVULN: 1.3,         // sec of safety after a revive
  DOUBLE_COINS_PARTIAL: 1.5,  // ad-block fallback multiplier for "2x coins"

  // ======================= V2 ADDITIONS (below) ============================
  // --- A/B EXPERIMENT HARNESS ---------------------------------------------
  // One flagged steering experiment. Flip here (or via ?ab= URL). Both ship-safe.
  AB_STEERING: 'half',        // 'half' = hold L/R screen half (shipped) | 'curl' = hold-to-curl (one button)

  // --- ONBOARDING ----------------------------------------------------------
  GARAGE_TOAST_MILESTONE: 1,  // which milestone (1st) fires the one-time "Spend coins in Garage" toast

  // --- PERF GOVERNOR (visual-only; NEVER changes gameplay/difficulty/RNG) ---
  PERF_PROBE_TIME: 2.0,       // sec of FPS sampling on boot before locking a tier
  PERF_LOW_FPS: 40,           // avg fps below this => LOW tier (fewer particles, no chroma)
  PERF_MID_FPS: 52,           // avg fps below this => MID tier
  PERF_PARTICLE_LOW: 0.45,    // particle-count multiplier on LOW tier
  PERF_PARTICLE_MID: 0.75,    // particle-count multiplier on MID tier

  // --- LEADERBOARD (local weekly board; portal API drops into LEADER.provider)
  LEADER_TABLE_SIZE: 24,      // entries kept on the weekly board
  LEADER_RIVALS: 14,          // synthetic rival scores seeded per week for a reachable rank nudge

  // --- META / ACCOUNT XP ---------------------------------------------------
  XP_PER_SCORE: 0.05,         // account XP per point of run score
  XP_PER_CAPTURE: 3,          // account XP per drone captured
  XP_PER_PERFECT: 12,         // account XP per PERFECT loop
  XP_PER_OBJECTIVE: 40,       // account XP per objective completed in the run
  XP_LEVEL_BASE: 120,         // XP for account level 2; curve = BASE * level^XP_LEVEL_POW
  XP_LEVEL_POW: 1.35,         // gentle, never-ending account-level curve exponent

  // --- RARE MOMENTS --------------------------------------------------------
  GOLDEN_SWARM_CHANCE: 0.08,  // chance a swarm event is the rare all-gold swarm (RNG-routed)
};

/* Palette — the whole game is colour-coded: cool = safe/score, amber = target,
   red = death only. Keep this disciplined. */
const COL = {
  // bold cartoon 2.5D palette — bright candy colours + a single dark "ink" outline
  ink:'#241A4D',                          // cartoon outline + shadow base (colored near-black)
  bg:'#3FB9FF', sky1:'#5AD1FF', sky2:'#6A5BFF', // vibrant sky gradient
  grid:'rgba(255,255,255,0.10)',
  car:'#FFFFFF', carRim:'#8FE6FF',
  drone:'#FF6B5C', droneHi:'#FFD0A8', droneDark:'#C0392B',     // glossy coral target
  bonus:'#FFCB3A', bonusHi:'#FFF1B0', bonusDark:'#D89200',     // glossy gold target
  trailA:'#00E5FF', trailB:'#FF49C3',     // candy cyan -> pink ribbon
  white:'#FFFFFF', red:'#FF3B5C',
  cyan:'#00E5FF', magenta:'#FF49C3', amber:'#FFB020',          // UI accents (kept names)
  confetti:['#00E5FF','#FF49C3','#FFD23F','#7CFF6B','#FF8A3D','#B16BFF'],
};

/* =============================== [RNG] ===================================== */
/* Seedable PRNG (mulberry32). THE keystone of V2: every gameplay-affecting
   random draw routes through here, so a given seed + the same effective-steer
   timeline reproduces a run EXACTLY. That single guarantee powers deterministic
   daily challenges, fair leaderboards, and ghost replays.

   Hard rule: this stream is advanced ONLY from inside the fixed-timestep sim
   update. Anything that runs at render rate, varies by device, or is purely
   cosmetic (particle spray, screen shake, background decor) MUST use plain
   Math.random instead — otherwise display FPS or the PERF tier would desync the
   sim across machines and break dailies/ghosts. */
const RNG=(()=>{
  let s=1>>>0;
  function seed(n){ s=(n>>>0)||1; return s; }
  function float(){                         // mulberry32 — fast, tiny, well-distributed
    s=(s+0x6D2B79F5)|0;
    let t=Math.imul(s^(s>>>15), 1|s);
    t=(t+Math.imul(t^(t>>>7), 61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  }
  function range(a,b){ return a+float()*(b-a); }
  function int(a,b){ return Math.floor(a+float()*(b-a+1)); }  // inclusive both ends
  function pick(arr){ return arr[(float()*arr.length)|0]; }
  // explicit state get/set so the dev determinism harness can snapshot/restore
  function getState(){ return s>>>0; }
  function setState(v){ s=v>>>0; }
  return { seed, float, range, int, pick, getState, setState };
})();

/* ============================== [UTIL] ===================================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
// rand/randInt are the GAMEPLAY random helpers — they draw from the seeded RNG.
// (Cosmetic-only code paths use Math.random directly; see the [RNG] note above.)
const rand=(a,b)=>a+RNG.float()*(b-a);
const randInt=(a,b)=>Math.floor(a+RNG.float()*(b-a+1));
const crand=(a,b)=>a+Math.random()*(b-a);   // cosmetic random (render-rate / device-varying)
// Reduce-motion accessibility scale (0..1) for shake/chroma/zoom. Read lazily so
// it always reflects the live setting; 1 = full juice, ~0.35 = softened.
function FX_motionScale(){ try{ return (Storage.data.settings&&Storage.data.settings.reduceMotion)?0.35:1; }catch(e){ return 1; } }
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const dist=(ax,ay,bx,by)=>Math.sqrt(dist2(ax,ay,bx,by));

function hexToRgb(h){h=h.replace('#','');return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
function rgbStr(c,a){return 'rgba('+c.r+','+c.g+','+c.b+','+a+')';}
function mixRgb(a,b,t){return {r:Math.round(lerp(a.r,b.r,t)),g:Math.round(lerp(a.g,b.g,t)),b:Math.round(lerp(a.b,b.b,t))};}

/* Segment intersection. Returns true and writes the hit point to OUT if the
   open segments AB and CD properly cross. Endpoint-touching is ignored (so the
   trail's shared joints never read as a self-cross). */
const _hit={x:0,y:0};
function segHit(ax,ay,bx,by,cx,cy,dx,dy,OUT){
  const r1=bx-ax, r2=by-ay, s1=dx-cx, s2=dy-cy;
  const denom=r1*s2 - r2*s1;
  if(denom===0) return false;            // parallel
  const t=((cx-ax)*s2 - (cy-ay)*s1)/denom;
  const u=((cx-ax)*r2 - (cy-ay)*r1)/denom;
  if(t>0 && t<1 && u>0 && u<1){ OUT.x=ax+t*r1; OUT.y=ay+t*r2; return true; }
  return false;
}

/* Shortest distance from point P to segment AB (for near-miss telegraphing). */
function pointSegDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay; const l2=dx*dx+dy*dy;
  if(l2===0) return dist(px,py,ax,ay);
  let t=((px-ax)*dx+(py-ay)*dy)/l2; t=clamp(t,0,1);
  return dist(px,py, ax+t*dx, ay+t*dy);
}

/* Ray-cast point-in-polygon over an array of {x,y} with explicit length n. */
function pointInPoly(px,py,poly,n){
  let inside=false;
  for(let i=0,j=n-1;i<n;j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

/* Shoelace area of an array of {x,y} with explicit length n. */
function polyArea(poly,n){
  let a=0;
  for(let i=0,j=n-1;i<n;j=i++){ a += (poly[j].x+poly[i].x)*(poly[j].y-poly[i].y); }
  return Math.abs(a/2);
}

// Export pure helpers for the dev test harness (no effect in the browser).
if(typeof module!=='undefined' && module.exports){
  module.exports={clamp,lerp,segHit,pointInPoly,polyArea,pointSegDist,CONFIG,RNG};
}

/* ============================ [STORAGE] ==================================== */
/* Thin persistence layer. Swap _read/_write for a portal cloud-save adapter and
   nothing else changes. All game saves go through Storage.data + Storage.save().
   V2: bumped to driftlasso.save.v2 with a one-time migration from v1 that
   preserves coins, highScore, unlocks, equips and custom colours. */
const Storage=(()=>{
  const KEY='driftlasso.save.v2';
  const KEY_V1='driftlasso.save.v1';
  const defaults={
    highScore:0, coins:0, totalRuns:0, bestLevel:1,
    unlocked:['neon','custom','car_core','pow_none'], equippedTrail:'neon', equippedCar:'car_core', equippedPower:'pow_none',
    muted:false, firstRunDone:false, endowed:false, sinceInterstitial:0,
    objectives:null,   // [{id,prog}] persisted; seeded on first load
    recentScores:[],   // last few run scores -> rubber-band difficulty (DDA)
    customA:'#00E5FF', customB:'#FFD23F', customStyle:'comet', // player's custom trail (colours + chosen STYLE)
    // ---- V2 fields ----
    accountXP:0, accountLevel:1, masteryTier:0, prestige:0,   // [META] account spine
    weeklyBest:{},                                            // [LEADER] best per ISO week
    collectionSeen:[],                                        // cosmetics the player has ever owned (collection meter)
    garageHinted:false, schemaV:2,                            // one-time "spend coins" toast; schema marker
    settings:{ colorblind:false, reduceMotion:false },        // accessibility toggles
  };
  const data=Object.assign({},defaults);
  function _read(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
  function _write(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){ /* private mode: run in-memory */ } }
  // Mutate `data` IN PLACE (never reassign) so the exported Storage.data reference
  // stays valid for every Storage.data.* read/write across the game.
  function setData(obj){ for(const k of Object.keys(data)) delete data[k]; Object.assign(data,obj); }
  // One-time v1 -> v2 migration: pull forward only the fields worth keeping.
  function migrateV1(v1){
    const m=Object.assign({},defaults);
    const keep=['highScore','coins','totalRuns','bestLevel','unlocked','equippedTrail','equippedCar',
                'equippedPower','muted','firstRunDone','endowed','objectives','recentScores','customA','customB','customStyle'];
    keep.forEach(k=>{ if(v1[k]!==undefined && v1[k]!==null) m[k]=v1[k]; });
    if(!Array.isArray(m.unlocked)) m.unlocked=defaults.unlocked.slice();
    return m;
  }
  function load(){
    let s=_read(KEY);
    if(!(s && typeof s==='object')){                 // no v2 save -> try migrating a v1 save
      const v1=_read(KEY_V1);
      if(v1 && typeof v1==='object'){ setData(migrateV1(v1)); _write(data); return; }
      setData(defaults); return;
    }
    const m=Object.assign({},defaults,s);
    // heal nested/array fields so a partial/older v2 save can't crash newer code
    if(!Array.isArray(m.unlocked)) m.unlocked=defaults.unlocked.slice();
    if(!Array.isArray(m.recentScores)) m.recentScores=[];
    if(!Array.isArray(m.collectionSeen)) m.collectionSeen=[];
    if(typeof m.weeklyBest!=='object'||!m.weeklyBest) m.weeklyBest={};
    m.settings = (typeof m.settings==='object'&&m.settings) ? Object.assign({},defaults.settings,m.settings) : Object.assign({},defaults.settings);
    setData(m);
  }
  function save(){ _write(data); }
  return { data, load, save,
    get:(k)=>data[k], set:(k,v)=>{ data[k]=v; save(); } };
})();

/* ============================== [PERF] ===================================== */
/* One-time FPS probe over the first ~2 s of rendering. It picks a device tier
   that scales VISUAL load only — particle counts, chroma, the trail sheen pass.
   It NEVER touches drone counts, spawn rates, difficulty, or the RNG stream, so
   a low-end phone plays the exact same deterministic run as a flagship (dailies
   and ghosts stay fair across devices). */
const PERF=(()=>{
  let tier='high', pScale=1, locked=false, probeT=0, frames=0;
  function sample(realDt){                            // fed the REAL frame dt each rendered frame
    if(locked||realDt<=0||realDt>0.5) return;          // ignore stalls (tab return / breakpoints)
    probeT+=realDt; frames++;
    if(probeT>=CONFIG.PERF_PROBE_TIME) lock(frames/probeT);
  }
  function lock(fps){
    locked=true;
    if(fps<CONFIG.PERF_LOW_FPS){ tier='low'; pScale=CONFIG.PERF_PARTICLE_LOW; }
    else if(fps<CONFIG.PERF_MID_FPS){ tier='mid'; pScale=CONFIG.PERF_PARTICLE_MID; }
    else { tier='high'; pScale=1; }
  }
  function particleScale(){ return pScale; }
  function allowChroma(){ return tier!=='low' && !(Storage.data.settings&&Storage.data.settings.reduceMotion); }
  function allowSheen(){ return tier==='high'; }
  function force(t){ locked=true; tier=t; pScale = t==='low'?CONFIG.PERF_PARTICLE_LOW : t==='mid'?CONFIG.PERF_PARTICLE_MID : 1; } // dev soak test
  return { sample, particleScale, allowChroma, allowSheen, force, get tier(){return tier;}, get locked(){return locked;} };
})();

/* ============================== [AUDIO] ==================================== */
/* Procedural WebAudio. CRITICAL: nothing is created or played until the first
   user gesture (Audio.unlock), satisfying autoplay policy and never blaring on
   load. Mute toggles the master gain. All synths are tiny and allocation-light. */
const Audio=(()=>{
  let ctx=null, master=null, music=null, ready=false, muted=false;
  let noiseBuf=null;
  let drift=null, driftGain=null, driftFilter=null; // continuous drift hum

  // background bassline scheduler
  let bassNext=0, bassStep=0;
  const BASS=[0,0,3,0, 5,0,3,0]; // semitone offsets over root
  const ROOT=55; // A1

  function unlock(){
    if(ready) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=muted?0:0.5; master.connect(ctx.destination);  // gentler overall level
      music=ctx.createGain(); music.gain.value=0.0; music.connect(master); // fades in during play
      // noise buffer for death / texture
      noiseBuf=ctx.createBuffer(1, ctx.sampleRate*0.5, ctx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      // persistent drift hum — a SOFT, heavily-filtered triangle (no harsh sawtooth drone)
      drift=ctx.createOscillator(); drift.type='triangle'; drift.frequency.value=60;
      driftFilter=ctx.createBiquadFilter(); driftFilter.type='lowpass'; driftFilter.frequency.value=240;
      driftGain=ctx.createGain(); driftGain.gain.value=0;
      drift.connect(driftFilter); driftFilter.connect(driftGain); driftGain.connect(master);
      drift.start();
      ready=true;
    }catch(e){ ready=false; }
    if(ctx && ctx.state==='suspended') ctx.resume();
  }
  function resume(){ if(ctx && ctx.state==='suspended') ctx.resume(); }
  function setMuted(m){ muted=m; if(master) master.gain.setTargetAtTime(m?0:0.9, ctx.currentTime, 0.02); }
  function isMuted(){ return muted; }

  function env(node, t0, peak, atk, dec){ const g=node.gain; g.cancelScheduledValues(t0); g.setValueAtTime(0.0001,t0); g.exponentialRampToValueAtTime(peak,t0+atk); g.exponentialRampToValueAtTime(0.0001,t0+atk+dec); }

  function tone(freq, type, peak, atk, dec, dest){
    if(!ready) return; const t0=ctx.currentTime;
    const o=ctx.createOscillator(); o.type=type||'sine'; o.frequency.value=freq;
    const g=ctx.createGain(); o.connect(g); g.connect(dest||master);
    env(g,t0,peak,atk,dec); o.start(t0); o.stop(t0+atk+dec+0.02);
  }

  // Capture: pitch climbs a step with the combo. Pavlovian rising ladder.
  function capture(step){
    if(!ready) return;
    const semis=clamp(step,0,18);
    const base=523.25*Math.pow(2,semis/12); // C5 ladder
    tone(base,'triangle',0.5,0.005,0.16);
    tone(base*1.5,'sine',0.25,0.005,0.14);    // a fifth for shine
    tone(base*2,'sine',0.12,0.005,0.10);
  }
  function bonus(){ if(!ready)return; tone(1318,'triangle',0.32,0.005,0.18); tone(1760,'sine',0.18,0.01,0.2); }
  function coin(){ tone(880,'triangle',0.14,0.004,0.06); tone(1320,'sine',0.10,0.02,0.07); }   // softer "blip", not a square buzz
  // near-miss telegraph: a soft, low, infrequent sine pip (NOT a piercing high tick)
  function tick(){ tone(760,'sine',0.045,0.004,0.06); }
  function nearMiss(){ tone(540,'sine',0.04,0.004,0.07); }

  function fanfare(){
    if(!ready) return; const seq=[523,659,784,1046];
    seq.forEach((f,i)=> setTimeout(()=>{ tone(f,'triangle',0.4,0.01,0.22); tone(f*2,'sine',0.18,0.01,0.2);},i*90));
  }
  // Death: dissonant, descending, with noise. It should sting.
  function death(){
    if(!ready) return; const t0=ctx.currentTime;
    const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(330,t0); o.frequency.exponentialRampToValueAtTime(70,t0+0.5);
    const o2=ctx.createOscillator(); o2.type='square'; o2.frequency.setValueAtTime(347,t0); o2.frequency.exponentialRampToValueAtTime(74,t0+0.5); // detuned = dissonant
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.5,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.55);
    o.connect(g); o2.connect(g); g.connect(master); o.start(t0); o2.start(t0); o.stop(t0+0.6); o2.stop(t0+0.6);
    const n=ctx.createBufferSource(); n.buffer=noiseBuf; const ng=ctx.createGain(); ng.gain.setValueAtTime(0.3,t0); ng.gain.exponentialRampToValueAtTime(0.0001,t0+0.25); n.connect(ng); ng.connect(master); n.start(t0); n.stop(t0+0.3);
  }

  // Continuous drift hum tracks how tight the drift is (intensity 0..1).
  // Kept very quiet + low-passed so it reads as a faint cushion, never a drone.
  function setDrift(intensity, playing){
    if(!ready) return; const t=ctx.currentTime;
    driftGain.gain.setTargetAtTime(playing?(0.004+0.02*intensity):0, t, 0.12);
    driftFilter.frequency.setTargetAtTime(200+intensity*380, t, 0.12);
    drift.frequency.setTargetAtTime(55+intensity*35, t, 0.12);
  }
  function setMusic(on,intensity){ if(!ready) return; music.gain.setTargetAtTime(on?0.26:0.0, ctx.currentTime, 0.5); }

  // Soft, sparse pulse — a rounded triangle through a low filter (not a sawtooth
  // drone). Rests on the off-steps so it breathes; tempo eases up with difficulty.
  function updateMusic(playing, difficulty){
    if(!ready || !playing) return;
    const now=ctx.currentTime;
    const beat=lerp(0.55,0.36,clamp(difficulty,0,1));
    while(bassNext < now+0.1){
      const t0=Math.max(bassNext, now);
      const semi=BASS[bassStep%BASS.length];
      if((bassStep%BASS.length)!==1 && (bassStep%BASS.length)!==3){          // skip a couple of steps = sparser, calmer
        const f=ROOT*Math.pow(2,semi/12);
        const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f;
        const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=300;
        const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.26,t0+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t0+beat*0.85);
        o.connect(fl); fl.connect(g); g.connect(music); o.start(t0); o.stop(t0+beat);
      }
      bassStep++; bassNext += beat;
    }
  }
  function resetMusicClock(){ if(ready) bassNext=ctx.currentTime; bassStep=0; }

  // Account level-up: a warm bell-like chime, distinct from the in-run level fanfare.
  function accountLevel(){ if(!ready) return; [784,1046,1318].forEach((f,i)=> setTimeout(()=>{
    tone(f,'sine',0.30,0.01,0.5); tone(f*2.005,'sine',0.08,0.01,0.5); }, i*110)); }

  return { unlock, resume, setMuted, isMuted, capture, bonus, coin, tick, nearMiss,
           fanfare, death, setDrift, setMusic, updateMusic, resetMusicClock,
           accountLevel,
           get ready(){return ready;} };
})();

/* ============================== [ADSDK] ==================================== */
/* Portal-agnostic ad interface. Drop real CrazyGames/Poki/GameDistribution
   calls into the two marked spots — the rest of the game never changes.
   Contract:
     showRewarded(onSuccess, onFail): onSuccess ONLY on genuine completion;
       onFail on skip/early-close/no-fill. Caller decides any partial fallback.
     showInterstitial(): natural breaks only; self-caps frequency. */
const AdSDK=(()=>{
  // ---- swap this object for the real SDK adapter at integration time -------
  const provider={
    available:true,
    // e.g. CrazyGames: window.CrazySDK.ad.requestAd('rewarded', {adFinished, adError})
    rewarded(onComplete,onError){ simulate('Rewarded Video', onComplete, onError); },
    interstitial(onDone){ simulate('Advertisement', onDone, onDone, true); },
  };
  // -------------------------------------------------------------------------

  const adEl=document.getElementById('ad');
  const barEl=document.getElementById('ad-bar');
  const titleEl=document.getElementById('ad-title');
  const subEl=document.getElementById('ad-sub');
  const skipEl=document.getElementById('ad-skip');
  let raf=null, onEnd=null, onAbort=null;

  function simulate(title, onComplete, onError, isInterstitial){
    // Simulated network "no-fill" ~ rarely, to exercise the fallback path.
    if(!provider.available || Math.random()<0.0){ onError&&onError('no-fill'); return; }
    titleEl.textContent=title;
    subEl.textContent=isInterstitial?'Your game continues shortly.':'Watch to the end to earn your reward.';
    skipEl.textContent=isInterstitial?'CLOSE':'SKIP';
    adEl.classList.add('show');
    Audio.setMusic(false);
    const dur=isInterstitial?1600:2600; const start=performance.now();
    onEnd=onComplete; onAbort=onError;
    const step=(now)=>{
      const p=clamp((now-start)/dur,0,1);
      barEl.style.width=(p*100)+'%';
      if(p>=1){ finish(true); } else { raf=requestAnimationFrame(step); }
    };
    raf=requestAnimationFrame(step);
  }
  function finish(completed){
    cancelAnimationFrame(raf); raf=null;
    adEl.classList.remove('show'); barEl.style.width='0%';
    const c=onEnd, a=onAbort; onEnd=onAbort=null;
    if(completed){ c&&c(); } else { a&&a('skipped'); }
  }
  skipEl.addEventListener('click', ()=> finish(false));

  return {
    setProvider(p){ Object.assign(provider,p); },
    showRewarded(onSuccess,onFail){
      if(!provider.available){ onFail&&onFail('unavailable'); return; }
      provider.rewarded(()=>onSuccess&&onSuccess(), (err)=>onFail&&onFail(err));
    },
    showInterstitial(onDone){
      // frequency cap: at most once per INTERSTITIAL_EVERY_RUNS game-overs
      Storage.data.sinceInterstitial=(Storage.data.sinceInterstitial||0)+1;
      if(Storage.data.sinceInterstitial < CONFIG.INTERSTITIAL_EVERY_RUNS || !provider.available){
        Storage.save(); onDone&&onDone(); return;
      }
      Storage.data.sinceInterstitial=0; Storage.save();
      provider.interstitial(()=>onDone&&onDone());
    },
  };
})();

/* ============================== [LEADER] =================================== */
/* Weekly leaderboard. Mirrors the AdSDK pattern EXACTLY: one `provider` object
   behind a stable interface. The local provider is Storage-backed, keyed by ISO
   week. To drop in a portal board later (CrazyGames/Poki), implement submit/fetch
   on a new provider and call LEADER.setProvider(...) — nothing else changes.

   A solo-offline board can't show a real rank, so the local provider seeds the
   week with deterministic synthetic "rivals" — purely to power the "N from #M"
   nudge with a reachable target. They vanish the moment a real provider is wired in. */
const LEADER=(()=>{
  const pad=n=>(n<10?'0':'')+n;
  // ISO-8601 week key, e.g. "2026-W26" — the weekly board bucket.
  function weekKey(d){
    const dt=new Date(d?Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()):Date.now());
    const day=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day+3);
    const firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
    const week=1+Math.round(((dt-firstThu)/86400000 - 3 + ((firstThu.getUTCDay()+6)%7))/7);
    return dt.getUTCFullYear()+'-W'+pad(week);
  }
  // ---- swap this object for the real portal adapter at integration time -----
  const localProvider=(()=>{
    function rivals(seedStr){ // deterministic rivals from a private RNG (never touches gameplay RNG)
      let h=2166136261>>>0; for(let i=0;i<seedStr.length;i++){ h^=seedStr.charCodeAt(i); h=Math.imul(h,16777619); }
      let s=(h>>>0)||1; const rnd=()=>{ s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
      const out=[]; let v=1200+rnd()*5200; for(let i=0;i<CONFIG.LEADER_RIVALS;i++){ out.push({name:'Rival',score:Math.round(v),me:false}); v*=0.78+rnd()*0.12; }
      return out;
    }
    return {
      // returns {rank, total, ahead:{score}|null, top, you} after inserting `score`
      submit(key,score){
        const D=Storage.data; D._lbWeekly=D._lbWeekly||{};
        let list=D._lbWeekly[key] || rivals(key);        // first time this week: seed the rivals
        let me=list.find(e=>e.me); if(!me){ me={name:'You',score:0,me:true}; list.push(me); }
        if(score>me.score) me.score=Math.round(score);
        list.sort((a,b)=>b.score-a.score);
        if(list.length>CONFIG.LEADER_TABLE_SIZE) list=list.slice(0,Math.max(CONFIG.LEADER_TABLE_SIZE, list.findIndex(e=>e.me)+1));
        D._lbWeekly[key]=list; Storage.save();
        const rank=list.indexOf(me)+1;
        const ahead = rank>1 ? list[rank-2] : null;      // the entry directly above you (the reachable target)
        return { rank, total:list.length, ahead:ahead?{score:ahead.score}:null, top:list[0]?list[0].score:me.score, you:me.score };
      },
      fetch(key){ const D=Storage.data; return (D._lbWeekly&&D._lbWeekly[key])||[]; },
    };
  })();
  let provider=localProvider;
  return {
    weekKey,
    setProvider(p){ provider=p||localProvider; },
    submit(key,score){ try{ return provider.submit(key,score); }catch(e){ return null; } },
    fetch(key){ try{ return provider.fetch(key); }catch(e){ return []; } },
  };
})();

/* ============================== [INPUT] ==================================== */
/* One control AXIS (never two at once): -1 = LEFT, +1 = RIGHT, 0 = straight.
   Sources, all collapsed into that single axis:
     • touch/pointer — A/B scheme (CONFIG.AB_STEERING):
         'half' = hold the LEFT or RIGHT half of the screen (shipped V1)
         'curl' = hold ANYWHERE to curl one way (true one-button; release=straight)
     • keyboard  — ← / → or A / D (desktop portals)
     • gamepad   — d-pad L/R or left-stick X (desktop portals; polled in steer())
   We ignore presses that begin on UI so controls never fight the menus. */
const Input=(()=>{
  let keyL=false, keyR=false, touch=0, active=null, lastTouchX=0;
  const onFirst=[]; let firstDone=false;
  function fireFirst(){ if(firstDone) return; firstDone=true; Audio.unlock(); onFirst.forEach(f=>f()); }
  function isUI(t){ return t && t.closest && t.closest('.ui-btn,.overlay,#ad,.toast'); }
  function curlMode(){ return CONFIG.AB_STEERING==='curl'; }
  function sideFromX(x){ return curlMode()? 1 : (x < window.innerWidth/2 ? -1 : 1); } // curl: hold anywhere => curl right
  // gamepad axis (no allocation beyond the snapshot the browser hands back)
  function gamepad(){
    if(!navigator.getGamepads) return 0;
    const gps=navigator.getGamepads(); for(let i=0;i<gps.length;i++){ const g=gps[i]; if(!g) continue;
      const ax=g.axes&&g.axes.length?g.axes[0]:0;
      const dl=g.buttons&&g.buttons[14]&&g.buttons[14].pressed, dr=g.buttons&&g.buttons[15]&&g.buttons[15].pressed;
      let v=(dl?-1:0)+(dr?1:0); if(!v && Math.abs(ax)>0.25) v=ax>0?1:-1;   // deadzone
      if(v){ fireFirst(); return v; }
    }
    return 0;
  }
  function steer(){ return clamp((keyL?-1:0)+(keyR?1:0)+touch+gamepad(), -1, 1); }
  function down(e){
    fireFirst();
    if(isUI(e.target)) return;        // let the UI handle its own taps
    if(e.cancelable) e.preventDefault();
    active=e.pointerId; lastTouchX=e.clientX; touch=sideFromX(e.clientX);
  }
  function move(e){ if(active===e.pointerId){ if(e.cancelable) e.preventDefault(); lastTouchX=e.clientX; touch=sideFromX(e.clientX); } }
  function up(e){ if(active===e.pointerId || e.pointerId===undefined){ active=null; touch=0; } }
  window.addEventListener('pointerdown',down,{passive:false});
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',up,{passive:false});
  window.addEventListener('pointercancel',up,{passive:false});
  // keyboard mapping for desktop
  window.addEventListener('keydown',(e)=>{
    const c=e.code; if(c==='ArrowLeft'||c==='KeyA'){ fireFirst(); keyL=true; e.preventDefault(); }
    else if(c==='ArrowRight'||c==='KeyD'){ fireFirst(); keyR=true; e.preventDefault(); }
  });
  window.addEventListener('keyup',(e)=>{ const c=e.code; if(c==='ArrowLeft'||c==='KeyA')keyL=false; else if(c==='ArrowRight'||c==='KeyD')keyR=false; });
  // stop the page from scrolling/zooming under the GAME — but let the UI overlays
  // (garage / leaderboard / settings) scroll natively on mobile.
  window.addEventListener('touchmove',(e)=>{ if(e.cancelable && !isUI(e.target)) e.preventDefault(); },{passive:false});
  window.addEventListener('gesturestart',(e)=>e.preventDefault());
  window.addEventListener('dblclick',(e)=>e.preventDefault());
  return { steer, onFirstInteraction:(f)=>onFirst.push(f), get held(){return active!==null||keyL||keyR;} };
})();

/* ============================== [POOL] ===================================== */
/* Generic fixed-capacity pool. alive[] holds active objects; spare[] holds the
   rest. No allocation after init — get()/free() just move references. */
function makePool(size, factory){
  const all=new Array(size); const spare=[]; const alive=[];
  for(let i=0;i<size;i++){ const o=factory(); o._alive=false; all[i]=o; spare.push(o); }
  return {
    alive,
    get(){ const o=spare.pop(); if(!o) return null; o._alive=true; alive.push(o); return o; },
    free(o){ if(!o._alive) return; o._alive=false; const i=alive.indexOf(o); if(i>=0){ alive[i]=alive[alive.length-1]; alive.pop(); } spare.push(o); }, // swap-remove: O(1), zero allocation
    freeAll(){ for(let i=alive.length-1;i>=0;i--){ alive[i]._alive=false; spare.push(alive[i]); } alive.length=0; },
    get count(){ return alive.length; },
  };
}

/* ============================= [SPRITES] =================================== */
/* Pre-rendered sprites: glossy "3D" candy balls (cartoon 2.5D look) for the car
   and drones, plus soft radial dots for confetti sparkles + glow. Rendering them
   once into offscreen canvases and drawImage-ing keeps it crisp AND fast. */
const Sprites=(()=>{
  const PAD=10;
  // a glossy sphere with an ink outline + top-left highlight + specular dot
  function ball(diam, base, hi, dark){
    const s=diam+PAD*2, c=document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d'); const cx=s/2, cy=s/2, R=diam/2;
    // ink outline
    g.beginPath(); g.arc(cx,cy,R,0,TAU); g.fillStyle=COL.ink; g.fill();
    // body: radial gradient lit from top-left
    const ir=R-Math.max(3,diam*0.07);
    const grd=g.createRadialGradient(cx-ir*0.38,cy-ir*0.42,ir*0.1, cx,cy,ir);
    grd.addColorStop(0,hi); grd.addColorStop(0.5,base); grd.addColorStop(1,dark);
    g.beginPath(); g.arc(cx,cy,ir,0,TAU); g.fillStyle=grd; g.fill();
    // glossy specular highlight
    g.globalAlpha=0.9; g.fillStyle='rgba(255,255,255,0.95)';
    g.beginPath(); g.ellipse(cx-ir*0.34,cy-ir*0.40, ir*0.30, ir*0.20, -0.6, 0, TAU); g.fill();
    g.globalAlpha=1;
    return c;
  }
  function dot(size, inner){ // soft additive glow / sparkle
    const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
    const r=size/2, grd=g.createRadialGradient(r,r,0,r,r,r);
    grd.addColorStop(0,inner); grd.addColorStop(0.4,inner.replace(/[\d.]+\)$/,'0.5)')); grd.addColorStop(1,inner.replace(/[\d.]+\)$/,'0)'));
    g.fillStyle=grd; g.fillRect(0,0,size,size); return c;
  }
  function shadow(size){ // soft ink ground shadow
    const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
    const r=size/2, grd=g.createRadialGradient(r,r,0,r,r,r);
    grd.addColorStop(0,'rgba(36,26,77,0.42)'); grd.addColorStop(0.7,'rgba(36,26,77,0.22)'); grd.addColorStop(1,'rgba(36,26,77,0)');
    g.fillStyle=grd; g.fillRect(0,0,size,size); return c;
  }
  // spiky grump (the bomb) — a dark ball ringed with ink spikes
  function spiky(diam, base, hi, dark){
    const s=diam+PAD*2, c=document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d'); const cx=s/2, cy=s/2, R=diam/2;
    g.fillStyle=COL.ink;
    for(let i=0;i<10;i++){ const a=i/10*TAU; g.beginPath();
      g.moveTo(cx+Math.cos(a)*R*0.78, cy+Math.sin(a)*R*0.78);
      g.lineTo(cx+Math.cos(a)*(R+5), cy+Math.sin(a)*(R+5));
      g.lineTo(cx+Math.cos(a+0.32)*R*0.78, cy+Math.sin(a+0.32)*R*0.78); g.closePath(); g.fill(); }
    g.beginPath(); g.arc(cx,cy,R*0.86,0,TAU); g.fillStyle=COL.ink; g.fill();
    const ir=R*0.78, grd=g.createRadialGradient(cx-ir*0.38,cy-ir*0.42,ir*0.1, cx,cy,ir);
    grd.addColorStop(0,hi); grd.addColorStop(0.5,base); grd.addColorStop(1,dark);
    g.beginPath(); g.arc(cx,cy,ir,0,TAU); g.fillStyle=grd; g.fill();
    return c;
  }
  return {
    car:null, drone:null, droneRun:null, droneBonus:null, droneBig:null, droneMag:null, droneGlut:null, bomb:null, shadow:null,
    white:null, cyan:null, magenta:null, amber:null, red:null, pad:PAD,
    build(){
      this.car=ball(46, '#FFFFFF', '#FFFFFF', COL.carRim);
      this.drone=ball(40, COL.drone, COL.droneHi, COL.droneDark);     // coral wanderer (also SMALL, scaled)
      this.droneRun=ball(40, '#36DCC0', '#C7FFF3', '#11907D');        // teal coward (runner)
      this.droneBonus=ball(46, COL.bonus, COL.bonusHi, COL.bonusDark);// gold star
      this.droneBig=ball(40, '#4DA8FF', '#CBE9FF', '#1F5FBF');        // big blue lunker
      this.droneMag=ball(40, '#B96BFF', '#EAD3FF', '#6A2EB8');        // violet magnet
      this.droneGlut=ball(40, '#7ED957', '#DBFFC2', '#3E8E2E');       // green glutton
      this.bomb=spiky(42, '#5B4B7A', '#9A86C4', '#2E2348');          // dark grump
      this.shadow=shadow(96);
      this.white=dot(64,'rgba(255,255,255,1)');
      this.cyan=dot(72,'rgba(0,229,255,1)');
      this.magenta=dot(72,'rgba(255,73,195,1)');
      this.amber=dot(72,'rgba(255,176,32,1)');
      this.red=dot(72,'rgba(255,59,92,1)');
    }
  };
})();

/* ============================ [PARTICLES] ================================== */
/* Two flavours from one pool: solid spinning CONFETTI (cartoon pop) + additive
   GLOW sparkles (shine). Gravity + drag give the confetti a satisfying arc. */
const Particles=(()=>{
  const pool=makePool(CONFIG.MAX_PARTICLES, ()=>({x:0,y:0,vx:0,vy:0,life:0,max:1,size:1,spr:null,add:true,confetti:false,color:'#fff',rot:0,vrot:0,grav:0}));
  function burst(x,y,n,opts){
    opts=opts||{};
    n=Math.max(1, Math.round(n*PERF.particleScale()));  // PERF governor: fewer particles on weak devices (visual only)
    for(let i=0;i<n;i++){
      const p=pool.get(); if(!p) break;
      // cosmetic spray uses crand/Math.random ONLY (never the seeded gameplay RNG):
      // the PERF governor scales particle counts per device, so this must not move the sim stream.
      const a=crand(0,TAU), sp=crand(opts.spMin||60, opts.spMax||320);
      p.x=x; p.y=y; p.vx=Math.cos(a)*sp; p.vy=Math.sin(a)*sp - (opts.lift||40);
      p.max=p.life=crand(opts.lifeMin||0.5, opts.lifeMax||1.1);
      p.confetti=!!opts.confetti;
      if(p.confetti){
        p.color=opts.colors? opts.colors[(Math.random()*opts.colors.length)|0] : COL.confetti[(Math.random()*COL.confetti.length)|0];
        p.size=crand(opts.sizeMin||4, opts.sizeMax||9);
        p.rot=crand(0,TAU); p.vrot=crand(-14,14); p.grav=opts.grav!=null?opts.grav:760; p.drag=opts.drag||1.4;
      } else {
        p.spr=opts.spr||Sprites.white; p.size=crand(opts.sizeMin||6, opts.sizeMax||16);
        p.grav=0; p.drag=opts.drag||3.0;
      }
    }
  }
  function update(dt){
    const a=pool.alive;
    for(let i=a.length-1;i>=0;i--){ const p=a[i];
      p.life-=dt; if(p.life<=0){ pool.free(p); continue; }
      const k=Math.exp(-p.drag*dt); p.vx*=k; p.vy*=k; p.vy+=p.grav*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vrot*dt;
    }
  }
  function draw(ctx){
    const a=pool.alive;
    // additive sparkles first
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<a.length;i++){ const p=a[i]; if(p.confetti) continue; const t=p.life/p.max;
      const s=p.size*(0.5+t); ctx.globalAlpha=clamp(t,0,1);
      ctx.drawImage(p.spr, p.x-s, p.y-s, s*2, s*2);
    }
    // solid confetti on top
    ctx.globalCompositeOperation='source-over';
    for(let i=0;i<a.length;i++){ const p=a[i]; if(!p.confetti) continue; const t=p.life/p.max;
      ctx.globalAlpha=clamp(t*1.3,0,1);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      const w=p.size, h=p.size*1.7;
      ctx.fillStyle=COL.ink; ctx.fillRect(-w/2-1,-h/2-1,w+2,h+2);   // tiny ink edge
      ctx.fillStyle=p.color; ctx.fillRect(-w/2,-h/2,w,h);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  return { burst, update, draw, freeAll:()=>pool.freeAll(), get count(){return pool.count;} };
})();

/* ============================== [POPUPS] =================================== */
const Popups=(()=>{
  const pool=makePool(CONFIG.MAX_POPUPS, ()=>({x:0,y:0,vy:0,life:0,max:1,text:'',color:'#fff',size:28,bold:true}));
  function spawn(x,y,text,color,size){
    const p=pool.get(); if(!p) return;
    p.x=x; p.y=y; p.vy=-46; p.max=p.life=1.0; p.text=text; p.color=color||COL.cyan; p.size=size||30;
  }
  function update(dt){ const a=pool.alive; for(let i=a.length-1;i>=0;i--){ const p=a[i]; p.life-=dt; if(p.life<=0){pool.free(p);continue;} p.y+=p.vy*dt; p.vy*=Math.exp(-3*dt); } }
  function draw(ctx){
    const a=pool.alive;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
    for(let i=0;i<a.length;i++){ const p=a[i]; const t=p.life/p.max;
      // pop-in scale + slight overshoot bounce, then drift up and fade
      const sc=(t>0.82?1.25-(t-0.82)/0.18*0.25:1) * (1+(1-t)*0.12);
      ctx.globalAlpha=clamp(t*1.5,0,1);
      ctx.font='900 '+Math.round(p.size*sc)+'px '+FONT_STACK;
      ctx.lineWidth=Math.max(4,p.size*sc*0.16); ctx.strokeStyle=COL.ink; ctx.strokeText(p.text,p.x,p.y); // chunky cartoon ink outline
      ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y);
    }
    ctx.globalAlpha=1;
  }
  return { spawn, update, draw, freeAll:()=>pool.freeAll() };
})();

/* ================================ [FX] ===================================== */
/* Screen shake, hit-stop (slow-mo), colour flashes, near-miss shimmer and the
   subtle chromatic aberration on big combos. The "feel" layer lives here. */
const FX=(()=>{
  let shake=0, hitstop=0, chroma=0, nearShimmer=0, zoom=0;
  const flashEl=document.getElementById('flash');
  let flashT=0, flashColor='rgba(255,255,255,0)';
  function addShake(m){ shake=Math.max(shake,m); }
  function addHitstop(s){ hitstop=Math.max(hitstop,s); }
  function addZoom(v){ zoom=Math.max(zoom,v); }      // camera punch on big hits
  function setChroma(v){ chroma=Math.max(chroma,v); }
  function nearMiss(){ nearShimmer=1; }
  function flash(color,strength){ flashColor=color; flashT=strength; }
  function timeScale(){ return hitstop>0?0.12:1; }
  // hit-stop is counted in REAL time (decoupled from the slow-mo it causes), so the
  // micro-pause lasts its true ~100ms instead of stretching out.
  function tickRealtime(realDt){ if(hitstop>0) hitstop=Math.max(0,hitstop-realDt); }
  function update(dt){
    shake=Math.max(0, shake-CONFIG.SHAKE_DECAY*shake*dt - 6*dt);
    chroma=Math.max(0, chroma-3*dt);
    nearShimmer=Math.max(0, nearShimmer-3*dt);
    zoom=Math.max(0, zoom - zoom*9*dt - 0.04*dt);    // springs back fast
    if(flashT>0){ flashT=Math.max(0,flashT-2.4*dt); flashEl.style.background=flashColor; flashEl.style.opacity=flashT; }
    else flashEl.style.opacity=0;
  }
  function shakeXY(out){ const m=shake*14*FX_motionScale(); out.x=crand(-m,m); out.y=crand(-m,m); } // crand: runs at render rate
  return { addShake, addHitstop, addZoom, setChroma, nearMiss, flash, timeScale, update, tickRealtime, shakeXY,
    get chroma(){return chroma;}, get nearShimmer(){return nearShimmer;}, get shake(){return shake;}, get zoom(){return zoom;},
    reset(){ shake=hitstop=chroma=nearShimmer=zoom=flashT=0; flashEl.style.opacity=0; } };
})();
