/* ============================== [META] ===================================== */
/* The account spine: a gentle, never-ending XP curve, mastery tiers + titles,
   a collection meter and 1-2 cosmetic SET bonuses. Pure data — the UI reads
   from here. Nothing here gates core fun or leaderboard fairness (cosmetic only). */
const META=(()=>{
  // XP to go from level L-1 to L (L>=2). Gentle power curve => always another level.
  function xpForLevel(L){ return Math.round(CONFIG.XP_LEVEL_BASE*Math.pow(Math.max(0,L-1), CONFIG.XP_LEVEL_POW)); }
  function totalXpForLevel(L){ let s=0; for(let i=2;i<=L;i++) s+=xpForLevel(i); return s; }
  function levelFromTotal(xp){ let L=1; while(xp>=totalXpForLevel(L+1)) L++; return L; }
  // mastery tiers unlock at account-level thresholds: cosmetic title + badge colour
  const TIERS=[
    {min:1,  title:'Rookie Wrangler', badge:'#9AA0B5'},
    {min:5,  title:'Drift Hand',      badge:'#36DCC0'},
    {min:10, title:'Lasso Ace',       badge:'#00E5FF'},
    {min:18, title:'Roundup Boss',    badge:'#FF49C3'},
    {min:28, title:'Neon Legend',     badge:'#FFB020'},
    {min:40, title:'Mythic Rancher',  badge:'#B16BFF'},
  ];
  function tierFor(L){ let t=TIERS[0]; for(const x of TIERS) if(L>=x.min) t=x; return t; }
  function title(){ const D=Storage.data; const base=tierFor(D.accountLevel||1).title; return (D.prestige>0?('★'+D.prestige+' '):'')+base; }
  // contribute a run to account XP; returns {gainedXP, leveledTo:0|L, from, to}
  function recordRun(stats){
    const D=Storage.data;
    let xp=Math.round((stats.score||0)*CONFIG.XP_PER_SCORE + (stats.captures||0)*CONFIG.XP_PER_CAPTURE
      + (stats.perfects||0)*CONFIG.XP_PER_PERFECT + (stats.objectives||0)*CONFIG.XP_PER_OBJECTIVE);
    if(xp<0) xp=0;
    const before=D.accountLevel||1;
    D.accountXP=(D.accountXP||0)+xp;
    const after=levelFromTotal(D.accountXP);
    D.accountLevel=after; D.masteryTier=TIERS.indexOf(tierFor(after));
    Storage.save();
    return { gainedXP:xp, leveledTo: after>before?after:0, from:before, to:after };
  }
  function levelProgress(){ const D=Storage.data, L=D.accountLevel||1, base=totalXpForLevel(L), next=totalXpForLevel(L+1);
    return { L, frac:clamp(((D.accountXP||0)-base)/Math.max(1,next-base),0,1), inLevel:Math.round((D.accountXP||0)-base), span:Math.round(next-base) }; }
  // collection meter (exclude the always-present 'custom' editor)
  function collection(){ const all=Cosmetics.all().filter(it=>it.id!=='custom'); const owned=all.filter(it=>Cosmetics.isUnlocked(it.id)).length; return {owned, total:all.length}; }
  function noteOwned(){ const D=Storage.data; D.collectionSeen=D.collectionSeen||[];
    Cosmetics.all().forEach(it=>{ if(Cosmetics.isUnlocked(it.id) && D.collectionSeen.indexOf(it.id)<0) D.collectionSeen.push(it.id); }); Storage.save(); }
  // SET bonuses: equip a whole family => a purely VISUAL flourish (no stats)
  const SETS=[
    {id:'gilded', name:'Gilded',      trail:'gold',   car:'car_gold', flourish:'sparkle'},
    {id:'void',   name:'Void Walker', trail:'galaxy', car:'car_void', flourish:'aura'},
  ];
  function activeSet(){ for(const s of SETS){ if(Storage.data.equippedTrail===s.trail && Storage.data.equippedCar===s.car) return s; } return null; }
  function canPrestige(){ return (Storage.data.accountLevel||1)>=40; }
  function prestige(){ const D=Storage.data; if(!canPrestige()) return false; D.prestige=(D.prestige||0)+1; D.accountXP=0; D.accountLevel=1; D.masteryTier=0; Cosmetics.unlock('prestige'); Storage.save(); return true; }
  return { xpForLevel, totalXpForLevel, levelFromTotal, recordRun, levelProgress, title, tierFor, TIERS, SETS, activeSet, collection, noteOwned, canPrestige, prestige };
})();

/* ============================ [OBJECTIVES] ================================= */
/* Rotating goals = the game's "purpose" beyond high score. 3 active at a time,
   persisted; completing one pays coins + a fanfare and is replaced next run.
   Count goals (runners/stars) accumulate across runs; "best" goals reset each run. */
const Objectives=(()=>{
  const DEFS={
    runner:{icon:'🟢', label:t=>'Lasso '+t+' runners',           tiers:[6,9,12],   reward:40, count:true},
    star:  {icon:'⭐', label:t=>'Catch '+t+' gold star'+(t>1?'s':''), tiers:[2,3], reward:55, count:true},
    combo: {icon:'🔗', label:t=>'Hit a x'+t+' combo',            tiers:[5,6,8],    reward:35, count:false},
    loop:  {icon:'🎯', label:t=>'Lasso '+t+' in one loop',       tiers:[3,4],      reward:50, count:false},
    level: {icon:'🚀', label:t=>'Reach level '+t,                tiers:[4,6,9],    reward:40, count:false},
    score: {icon:'💯', label:t=>'Score '+t+' in a run',          tiers:[1500,2500],reward:30, count:false},
  };
  const KEYS=Object.keys(DEFS);
  function makeOne(avoid){ const pool=KEYS.filter(k=>!avoid.includes(k)); const k=pool[(Math.random()*pool.length)|0]||KEYS[0]; const d=DEFS[k]; return {key:k, t:d.tiers[(Math.random()*d.tiers.length)|0], prog:0, done:false}; }
  function make(){ const out=[]; for(let i=0;i<3;i++) out.push(makeOne(out.map(o=>o.key))); return out; }
  function seed(){ if(!Array.isArray(Storage.data.objectives)||Storage.data.objectives.length!==3){ Storage.data.objectives=make(); Storage.save(); } }
  let runCompleted=0;                              // objectives finished THIS run (feeds account XP)
  function refresh(){ // at run start: replace completed, reset per-run "best" goals
    runCompleted=0;
    const ok=Array.isArray(Storage.data.objectives)&&Storage.data.objectives.length===3&&Storage.data.objectives.every(o=>o&&DEFS[o.key]);
    if(!ok) Storage.data.objectives=make(); // self-heal (corrupt/migrated/old-schema save)
    const o=Storage.data.objectives;
    for(let i=0;i<o.length;i++){ if(o[i].done) o[i]=makeOne(o.map(x=>x.key)); else if(!DEFS[o[i].key].count) o[i].prog=0; }
    Storage.save();
  }
  function complete(ob){ const d=DEFS[ob.key]; ob.done=true; runCompleted++; Storage.data.coins+=d.reward; Storage.save();
    if(typeof UI!=='undefined') UI.toast('GOAL! '+d.label(ob.t)+'  +'+d.reward); if(typeof Audio!=='undefined') Audio.fanfare(); }
  function bump(key,val){ const o=Storage.data.objectives; let ch=false;
    for(const ob of o){ if(ob.key===key && !ob.done){ const d=DEFS[ob.key]; ob.prog = d.count? ob.prog+val : Math.max(ob.prog,val); if(ob.prog>=ob.t) complete(ob); ch=true; } }
    if(ch) Storage.save();
  }
  return { DEFS, seed, refresh, bump, list:()=>Storage.data.objectives||[], get runCompleted(){return runCompleted;} };
})();

/* ============================ [ENTITIES] =================================== */
const FONT_STACK='"Eurostile","Bahnschrift","DIN Alternate Bold","Segoe UI",system-ui,Arial,sans-serif';

// --- Trail: circular buffer of pooled points + self-intersection logic ------
const Trail=(()=>{
  const cap=CONFIG.MAX_TRAIL_POINTS;
  const pts=new Array(cap); for(let i=0;i<cap;i++) pts[i]={x:0,y:0,t:0};
  let head=0, len=0;
  // reusable scratch polygons (no per-frame allocation)
  const scratch=new Array(cap); for(let i=0;i<cap;i++) scratch[i]={x:0,y:0};
  const scratch2=new Array(cap); for(let i=0;i<cap;i++) scratch2[i]={x:0,y:0};

  function reset(){ head=0; len=0; }
  function get(i){ return pts[(head+i)%cap]; }
  function push(x,y,t){
    let idx;
    if(len<cap){ idx=(head+len)%cap; len++; }
    else { idx=head; head=(head+1)%cap; }
    const p=pts[idx]; p.x=x; p.y=y; p.t=t;
  }
  function dropOld(now,lifespan){ while(len>0 && now-get(0).t>lifespan){ head=(head+1)%cap; len--; } }

  // Look for the head segment crossing an earlier segment. Returns a result obj
  // describing the enclosed loop, or null. Scans from near-head backward so we
  // resolve the most-recently-closed loop (matches player intent).
  const result={poly:scratch, n:0, area:0};
  function checkClose(){
    if(len<4) return null;
    const hx0=get(len-2).x, hy0=get(len-2).y, hx1=get(len-1).x, hy1=get(len-1).y;
    const maxI=len-3-CONFIG.SELF_GRACE_SEGMENTS;
    for(let i=maxI;i>=0;i--){
      const a=get(i), b=get(i+1);
      if(segHit(hx0,hy0,hx1,hy1, a.x,a.y,b.x,b.y, _hit)){
        // loop polygon = hit point, then trail points i+1 .. len-2
        let n=0; scratch[n].x=_hit.x; scratch[n].y=_hit.y; n++;
        for(let k=i+1;k<=len-2;k++){ const p=get(k); scratch[n].x=p.x; scratch[n].y=p.y; n++; }
        result.poly=scratch; result.n=n; result.area=polyArea(scratch,n);
        return result;
      }
    }
    return null;
  }

  // Hypothetical "if I closed now" loop for the greed/near-death preview: find
  // the nearest earlier point to the head within PREVIEW_DIST and build its loop.
  const preview={poly:scratch2, n:0, area:0, valid:false};
  function previewLoop(){
    preview.valid=false;
    if(len<6) return preview;
    const hx=get(len-1).x, hy=get(len-1).y;
    const maxI=len-3-CONFIG.SELF_GRACE_SEGMENTS;
    let bestI=-1, bestD=CONFIG.PREVIEW_DIST*CONFIG.PREVIEW_DIST;
    for(let i=0;i<=maxI;i++){ const p=get(i); const d=dist2(hx,hy,p.x,p.y); if(d<bestD){ bestD=d; bestI=i; } }
    if(bestI<0) return preview;
    let n=0; for(let k=bestI;k<=len-1;k++){ const p=get(k); scratch2[n].x=p.x; scratch2[n].y=p.y; n++; }
    preview.poly=scratch2; preview.n=n; preview.area=polyArea(scratch2,n); preview.valid=n>=3;
    return preview;
  }

  // Near-miss: smallest distance from head to a non-adjacent segment (no cross).
  function nearestApproach(){
    if(len<6) return 1e9;
    const hx=get(len-1).x, hy=get(len-1).y;
    const maxI=len-3-CONFIG.SELF_GRACE_SEGMENTS;
    let best=1e9;
    for(let i=0;i<=maxI;i++){ const a=get(i), b=get(i+1); const d=pointSegDist(hx,hy,a.x,a.y,b.x,b.y); if(d<best) best=d; }
    return best;
  }

  return { reset, push, dropOld, checkClose, previewLoop, nearestApproach,
    get len(){return len;}, get(i){return get(i);} };
})();

// --- Drones (little characters: wanderers, runners, bonus stars, bombs, power orbs)
const DTYPE={ WANDER:0, RUNNER:1, BONUS:2, BOMB:3, POWER:4, SMALL:5, BIG:6, MAGNET:7, GLUTTON:8 };
const Drones=(()=>{
  const pool=makePool(CONFIG.MAX_DRONES+18, ()=>({x:0,y:0,vx:0,vy:0,r:CONFIG.DRONE_RADIUS,phase:0,type:0,t:0,spawn:0,blink:0,scared:0,ex:0,ey:0,intro:false,eaten:0}));
  const RSIZE={}; RSIZE[DTYPE.BONUS]=1.28; RSIZE[DTYPE.POWER]=1.35; RSIZE[DTYPE.BOMB]=1.12; RSIZE[DTYPE.SMALL]=0.55; RSIZE[DTYPE.BIG]=1.85; RSIZE[DTYPE.MAGNET]=1.0; RSIZE[DTYPE.GLUTTON]=1.1;
  function spawnAt(x,y,type,intro){
    const d=pool.get(); if(!d) return null;
    d.x=x; d.y=y; const a=rand(0,TAU); d.vx=Math.cos(a); d.vy=Math.sin(a);
    d.phase=rand(0,TAU); d.type=type||DTYPE.WANDER; d.t=0; d.spawn=0; d.blink=rand(1.5,5); d.scared=0; d.ex=0; d.ey=0; d.intro=!!intro; d.eaten=0;
    d.r=CONFIG.DRONE_RADIUS*(RSIZE[d.type]||1);
    return d;
  }
  // push a drone back out of the live trail so it can't slip across your lasso
  // (the trail is a FENCE). The newest few segments near the head are the "mouth"
  // — left open so drones can still be herded in and so the car isn't blocked.
  function fence(d){
    const n=Trail.len; if(n<8) return;
    const minD=d.r + CONFIG.TRAIL_WIDTH*0.5 + 1; const minD2=minD*minD;
    const maxI=n-6;  // skip ~5 head segments (the mouth)
    for(let i=0;i<maxI;i++){
      const a=Trail.get(i), b=Trail.get(i+1);
      const ux=b.x-a.x, uy=b.y-a.y, L2=ux*ux+uy*uy; if(L2<1) continue;
      let t=((d.x-a.x)*ux+(d.y-a.y)*uy)/L2; t=clamp(t,0,1);
      const cx=a.x+t*ux, cy=a.y+t*uy, dx=d.x-cx, dy=d.y-cy, dd2=dx*dx+dy*dy;
      if(dd2<minD2){ const dd=Math.sqrt(dd2)||1, nx=dx/dd, ny=dy/dd;
        d.x=cx+nx*minD; d.y=cy+ny*minD;          // shove out to the fence surface
        const vn=d.vx*nx+d.vy*ny; if(vn<0){ d.vx-=2*vn*nx; d.vy-=2*vn*ny; } // reflect inward velocity
      }
    }
  }
  function nearestPrey(g){ const a=pool.alive; let best=null,bd=1e9; for(let i=0;i<a.length;i++){ const o=a[i]; if(o===g||o.type===DTYPE.BOMB||o.type===DTYPE.POWER||o.type===DTYPE.GLUTTON||o.intro) continue; const dd=dist2(g.x,g.y,o.x,o.y); if(dd<bd){bd=dd;best=o;} } return best; }
  const _eat=[];
  function update(dt, diff, W, H, carX, carY, magnet, speedScale){
    const base=lerp(CONFIG.DRONE_BASE_SPEED,CONFIG.DRONE_MAX_SPEED,diff)*(speedScale||1);
    const a=pool.alive; _eat.length=0;
    for(let i=0;i<a.length;i++){ const d=a[i];
      d.t+=dt; if(d.spawn<1) d.spawn=Math.min(1,d.spawn+dt*3);
      d.phase+=dt*1.6;
      d.blink-=dt; if(d.blink<-0.12) d.blink=rand(1.8,5.5);
      d.scared=Math.max(0, d.scared-dt*2);
      // eyes glance toward the car (smoothed) — every critter, every frame
      const ax=carX-d.x, ay=carY-d.y, al=Math.hypot(ax,ay)||1, mx=d.r*0.18;
      d.ex+=((ax/al)*mx - d.ex)*clamp(8*dt,0,1); d.ey+=((ay/al)*mx - d.ey)*clamp(8*dt,0,1);
      // INTRO drones sit perfectly still (guaranteed first capture).
      if(d.intro) continue;
      let sp=base;
      switch(d.type){       // RNG.float() (not Math.random): drone wander affects captures -> must be deterministic
        case DTYPE.RUNNER:{ const dx=d.x-carX,dy=d.y-carY,dd=Math.hypot(dx,dy)||1;
          if(dd<CONFIG.RUNNER_FLEE){ d.vx=dx/dd; d.vy=dy/dd; sp=base*2.1; d.scared=1; }
          else if(RNG.float()<0.012){ const an=rand(0,TAU); d.vx=Math.cos(an); d.vy=Math.sin(an); } break; }
        case DTYPE.BOMB:{ sp=base*0.5; const dx=carX-d.x,dy=carY-d.y,dd=Math.hypot(dx,dy)||1; // slowly HOMES on you = menace
          d.vx+=(dx/dd-d.vx)*0.4*dt*4; d.vy+=(dy/dd-d.vy)*0.4*dt*4; break; }
        case DTYPE.BONUS:{ sp=base*1.4; if(RNG.float()<0.02){ const an=rand(0,TAU); d.vx=Math.cos(an); d.vy=Math.sin(an); } break; }
        case DTYPE.POWER:{ sp=base*0.6; if(RNG.float()<0.02){ const an=rand(0,TAU); d.vx=Math.cos(an); d.vy=Math.sin(an); } break; }
        case DTYPE.SMALL:{ sp=base*1.7; if(RNG.float()<0.05){ const an=rand(0,TAU); d.vx=Math.cos(an); d.vy=Math.sin(an); } break; } // zippy
        case DTYPE.BIG:{ sp=base*0.45; if(RNG.float()<0.006){ const an=rand(0,TAU); d.vx=Math.cos(an); d.vy=Math.sin(an); } break; } // lumbering
        case DTYPE.MAGNET:{ // drawn toward the snake's trail — comes to you
          let tx=carX,ty=carY; if(Trail.len>3){ const p=Trail.get((Trail.len*0.5)|0); tx=p.x; ty=p.y; }
          const dx=tx-d.x,dy=ty-d.y,dd=Math.hypot(dx,dy)||1; d.vx+=(dx/dd-d.vx)*0.5; d.vy+=(dy/dd-d.vy)*0.5; sp=base*1.1; break; }
        case DTYPE.GLUTTON:{ const p=nearestPrey(d); sp=base*0.8;
          if(p){ const dx=p.x-d.x,dy=p.y-d.y,dd=Math.hypot(dx,dy)||1; d.vx=dx/dd; d.vy=dy/dd; if(dd<d.r+p.r) _eat.push(d,p); }
          else if(RNG.float()<0.02){ const an=rand(0,TAU); d.vx=Math.cos(an); d.vy=Math.sin(an); } break; }
        default:{ if(RNG.float()<0.01){ const an=rand(0,TAU); d.vx=Math.cos(an); d.vy=Math.sin(an); } }
      }
      const vl=Math.hypot(d.vx,d.vy)||1; d.vx/=vl; d.vy/=vl;     // keep heading a unit vector
      d.x+=d.vx*sp*dt; d.y+=d.vy*sp*dt;
      if(magnet>0 && d.type!==DTYPE.BOMB){ const dx=carX-d.x,dy=carY-d.y,dd=Math.hypot(dx,dy)||1; if(dd<360){ d.x+=(dx/dd)*magnet*dt; d.y+=(dy/dd)*magnet*dt; } }
      const m=24;
      if(d.x<m){d.x=m;d.vx=Math.abs(d.vx);} if(d.x>W-m){d.x=W-m;d.vx=-Math.abs(d.vx);}
      if(d.y<m){d.y=m;d.vy=Math.abs(d.vy);} if(d.y>H-m){d.y=H-m;d.vy=-Math.abs(d.vy);}
      if(d.type!==DTYPE.POWER) fence(d);   // power orbs ignore the fence (easy to grab)
    }
    // resolve glutton meals after the loop (safe to free here)
    for(let i=0;i<_eat.length;i+=2){ const g=_eat[i], p=_eat[i+1];
      if(p._alive && g._alive){ pool.free(p); g.eaten++; g.r=Math.min(CONFIG.DRONE_RADIUS*3.2, g.r+3.2); g.scared=0;
        if(typeof Particles!=='undefined') Particles.burst(p.x,p.y,8,{confetti:true,colors:['#7ED957','#DBFFC2','#FFFFFF'],spMax:200,sizeMax:7}); }
    }
  }
  return { pool, spawnAt, update, freeAll:()=>pool.freeAll(), get alive(){return pool.alive;}, get count(){return pool.count;} };
})();

/* ============================== [GAME] ===================================== */
const Game=(()=>{

  // ---- BIOMES: each level is a different "map" (sky + floor motif + witty name) ----

    {name:'NEON GRID',    sky:['#5AD1FF','#6A5BFF'], floor:'grid',     accent:'#00E5FF'},
    {name:'DEEP SPACE',   sky:['#2A2A6E','#0E0B2A'], floor:'stars',    accent:'#9B6BFF'},
    {name:'CORAL REEF',   sky:['#36D6E0','#1E5FBF'], floor:'bubbles',  accent:'#19E3C8'},
    {name:'DISCO FEVER',  sky:['#FF7AD0','#7C3DD6'], floor:'checker',  accent:'#FFD23F'},
    {name:'WILD WEST',    sky:['#FFC36A','#FF7A4D'], floor:'dunes',    accent:'#C8742E'},
    {name:'CANDY RUSH',   sky:['#FFB6E1','#7ED9FF'], floor:'sprinkles',accent:'#FF49C3'},
    {name:'JUNGLE FEVER', sky:['#7BE06A','#1E7A3A'], floor:'waves',    accent:'#2E8B3A'},
    {name:'ARCTIC',       sky:['#D6F1FF','#6AB0E0'], floor:'snow',     accent:'#FFFFFF'},
    {name:'VOLCANO',      sky:['#FF8A4D','#6E1414'], floor:'dunes',    accent:'#FF3B2E'},

    {name:'THE MATRIX',   sky:['#0E2A1E','#04150D'], floor:'grid',     accent:'#39FF88'},

  ];
  function biome(){ return BIOMES[((level-1)%BIOMES.length+BIOMES.length)%BIOMES.length]; }
  let skyFrom=null, skyTgt=null, skyCur=null, skyT=1, curFloor='grid';
  function buildBg(){ if(!skyCur) return; const t=skyCur[0],b=skyCur[1]; bgGrad=ctx.createLinearGradient(0,0,0,H);
    bgGrad.addColorStop(0,'rgb('+(t.r|0)+','+(t.g|0)+','+(t.b|0)+')'); bgGrad.addColorStop(1,'rgb('+(b.r|0)+','+(b.g|0)+','+(b.b|0)+')'); }

  }

    for(let k=0;k<2;k++){ skyCur[k].r=lerp(skyFrom[k].r,skyTgt[k].r,skyT); skyCur[k].g=lerp(skyFrom[k].g,skyTgt[k].g,skyT); skyCur[k].b=lerp(skyFrom[k].b,skyTgt[k].b,skyT); } buildBg(); }
  // cached decor positions per biome (regenerated on resize; zero per-frame alloc)

    for(let i=0;i<16;i++) decoBub.push({x:crand(0,W),y:crand(0,H),r:crand(7,26),sp:crand(18,46)});
    const cc=['#FF49C3','#FFD23F','#7CFF6B','#00E5FF','#FF8A3D','#FFFFFF'];

  // ---- run lifecycle -------------------------------------------------------

    elapsed=0; spawnTimer=0; difficulty=0; nextMilestone=CONFIG.MILESTONE_STEP;
    dyingTimer=0; car.invuln=0; nearMissCd=0; revivedThisRun=false; steerSmooth=0; previewState.valid=false; capFX.active=false;

    swarmTimer=rand(CONFIG.SWARM_MIN,CONFIG.SWARM_MAX); swarmActive=0; swarmBanner=0; goldenSwarm=false;

    Objectives.refresh();                           // fresh goals; "best" goals reset

  function droneValue(d){ switch(d.type){

    Popups.spawn(centerX, centerY, '+'+gained, COL.white, 36);
    if(comboMult()>1) Popups.spawn(centerX, centerY-78, 'x'+comboMult()+'!', COL.cyan, 30);
    if(caught.length>=1 && isPerfect){ Popups.spawn(centerX, centerY-112,'PERFECT!',COL.amber,28); Audio.bonus(); }
    if(bonusHit){ Popups.spawn(centerX, centerY-112,'STAR x3',COL.amber,28); Audio.bonus(); }
