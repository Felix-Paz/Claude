    const big=caught.length>=CONFIG.HITSTOP_THRESHOLD;
    FX.addShake(clamp(0.25+caught.length*0.18+norm*0.15, 0.2, 1.4));
    FX.addZoom(clamp(0.03+caught.length*0.02+norm*0.01, 0.03, 0.12));
    if(big) FX.addHitstop(CONFIG.HITSTOP_BIG + (caught.length-2)*0.02);
    if(combo>=CONFIG.CHROMA_COMBO) FX.setChroma(clamp((combo-CONFIG.CHROMA_COMBO+1)*0.15,0,0.7));
    FX.flash(bonusHit?'rgba(255,176,32,0.14)':'rgba(255,73,195,0.13)', 0.45);
    Audio.capture(pitchStep);

    // coins as a small variable drip (extra reason to chase combos)
    if(RNG.float()<0.5){ const c=1+(bonusHit?2:0); Storage.data.coins+=c; coinsRun+=c; Storage.save(); Audio.coin(); } // coin drip -> RNG (deterministic)

    Trail.reset(); Trail.push(car.x,car.y, elapsed); // lasso "fires" -> consumed loop is safe

    if(!firstCaptureDone){ firstCaptureDone=true; hintAlpha=0; if(!Storage.data.firstRunDone){ Storage.data.firstRunDone=true; Storage.save(); } droneTarget=CONFIG.MIN_DRONES; }
  }

  function die(){
    if(state!==STATE.PLAYING) return;
    if(car.invuln>0) return;            // post-revive grace
    if(shieldArmed){                    // equipped Shield power: save the run once
      shieldArmed=false; Trail.reset(); Trail.push(car.x,car.y,elapsed); car.invuln=1.3;
      Popups.spawn(car.x, car.y-30, 'SHIELD!', COL.cyan, 30); FX.flash('rgba(0,229,255,0.3)',0.7); FX.addShake(0.7); Audio.bonus();
      return;
    }
    state=STATE.DYING; dyingTimer=0.7;
    FX.addShake(1.5); FX.flash('rgba(255,59,92,0.5)',1.0); Audio.death();
    Audio.setMusic(false);
    // combo "shatters" into red shards up top
    if(combo>1){ Particles.burst(W/2,H*0.18, 22, {confetti:true, colors:[COL.red,'#FF8DA0','#FFFFFF'], spMax:260, sizeMax:9}); }
    // big death burst at the car
    Particles.burst(car.x,car.y, 26, {confetti:true, colors:[COL.red,'#FFFFFF','#FF8DA0'], spMax:340, sizeMax:9});
    Particles.burst(car.x,car.y, 10, {spr:Sprites.white, spMax:240, sizeMax:16});
  }

  function revive(){
    // Restore the run EXACTLY as it was — keep every drone, particle, the score,
    // level and combo. Only the fatal trail is cleared and a brief invulnerability
    // granted, at the car's current spot (no teleport, nothing vanishes).
    revivedThisRun=true;
    Trail.reset(); Trail.push(car.x,car.y,elapsed);
    steerSmooth=0; car.invuln=CONFIG.REVIVE_INVULN;
    state=STATE.PLAYING; Audio.setMusic(true); FX.flash('rgba(0,229,255,0.25)',0.6);
    reliefTimer=CONFIG.RELIEF_TIME;   // calm window so you get a quick win back
  }

  // Closest-to-complete objective -> pulls an immediate restart (Zeigarnik).
  function buildTeaser(){
    let best=null, bestFrac=-1;
    Objectives.list().forEach(ob=>{ if(ob.done) return; const d=Objectives.DEFS[ob.key]; const frac=clamp(ob.prog/ob.t,0,1);
      if(frac>bestFrac){ bestFrac=frac; best={icon:d.icon, label:d.label(ob.t), prog:ob.prog, t:ob.t, frac}; } });
    const obj = best ? (best.icon+' '+best.label+'  '+Math.min(best.prog,best.t)+'/'+best.t+(best.frac>=0.6?' — so close!':'')) : '';
    return { obj };
  }

  function gameOver(){
    Storage.data.totalRuns=(Storage.data.totalRuns||0)+1;
    const finalScore=Math.round(score);
    const isBest=finalScore>(Storage.data.highScore||0);
    if(isBest) Storage.data.highScore=finalScore;
    // rolling window of recent scores -> next run's rubber-band difficulty
    const rs=Storage.data.recentScores||[]; rs.push(finalScore); while(rs.length>5) rs.shift(); Storage.data.recentScores=rs;
    // end-of-run coin bonus to BOTH the run tally and the real balance
    const endBonus=Math.floor(finalScore/100)*CONFIG.COINS_PER_100;
    coinsRun += endBonus; Storage.data.coins += endBonus;
    // META: account XP for the run (score + captures + perfects + objectives)
    const metaRes=META.recordRun({ score:finalScore, captures:runCaptures, perfects:runPerfects, objectives:(Objectives.runCompleted||0) });
    META.noteOwned();
    // LEADER: submit to the weekly board + rank/nudge
    const wKey=LEADER.weekKey();
    const wRank=LEADER.submit(wKey, finalScore);
    Storage.data.weeklyBest=Storage.data.weeklyBest||{}; if(finalScore>(Storage.data.weeklyBest[wKey]||0)) Storage.data.weeklyBest[wKey]=finalScore;
    Storage.save();

    cardInfo={ score:finalScore, best:Storage.data.highScore, isBest, coins:coinsRun, prevBest,
      canRevive:!revivedThisRun, level, meta:metaRes, rank:wRank, teaser:buildTeaser() };

    if(metaRes.leveledTo) Audio.accountLevel();
    // peak-end: a ~1s slow-mo replay of the biggest loop + NEW BEST ribbon BEFORE the card
    if(isBest && bestLoopN>=3){ startPeakEnd(); }
    else { showCard(); if(isBest) Audio.fanfare(); }
  }
  function startPeakEnd(){
    state=STATE.PEAKEND;
    peakEnd={ t:0, dur:1.05, n:bestLoopN, cx:0, cy:0 };
    let cx=0,cy=0; for(let i=0;i<bestLoopN;i++){ cx+=bestLoopPoly[i].x; cy+=bestLoopPoly[i].y; } peakEnd.cx=cx/bestLoopN; peakEnd.cy=cy/bestLoopN;
    Particles.burst(peakEnd.cx,peakEnd.cy,46,{confetti:true,spMax:380,sizeMax:11});
    FX.addZoom(0.05); Audio.fanfare();
  }
  function showCard(){ state=STATE.DEAD; if(cardInfo) UI.showGameOver(cardInfo); }

  // ---- difficulty DIRECTOR -------------------------------------------------
  // Layers, low→high: (1) a gentle FLOOR ramp by time, eased for strugglers (DDA);
  // (2) a TENSION wave so it breathes easy→hard→easy (win, then pressure, then win);
  // (3) RELIEF after a revive (guaranteed recovery win). Bombs only past onboarding
  // and mostly at tension peaks. This manufactures the win/lose rhythm.
  let spawnInterval=1.2, bombChance=0, tension=0;
  function director(dt){
    if(reliefTimer>0) reliefTimer-=dt;
    if(swarmActive>0){ swarmActive-=dt; if(swarmActive<=0) goldenSwarm=false; }
    const relief = reliefTimer>0;
    let floorD;
    if(elapsed<CONFIG.RAMP_GENTLE_TIME) floorD=0.25+(elapsed/CONFIG.RAMP_GENTLE_TIME)*0.2;       // busy & fun from the start
    else floorD=0.45+((elapsed-CONFIG.RAMP_GENTLE_TIME)/(CONFIG.RAMP_FULL_TIME-CONFIG.RAMP_GENTLE_TIME))*0.55;
    floorD=clamp(floorD - ddaEase, 0, 1);                                                       // ease strugglers
    tension=0.5+0.5*Math.sin(elapsed*TAU/CONFIG.TENSION_PERIOD - Math.PI/2);                    // starts in a trough
    difficulty=clamp(floorD*(0.7+0.45*tension)*(relief?0.5:1), 0, 1);                           // drives drone speed + music
    // SWARM events: occasional CRAZY crowd (the big "up")
    swarmTimer-=dt;
    if(swarmTimer<=0 && firstCaptureDone){ swarmTimer=rand(CONFIG.SWARM_MIN,CONFIG.SWARM_MAX);
      if(!relief){ swarmActive=rand(3,4.5); swarmBanner=1.6; goldenSwarm=RNG.float()<CONFIG.GOLDEN_SWARM_CHANCE; Audio.fanfare(); if(goldenSwarm) Audio.bonus(); } } // rare all-gold swarm (RNG => dailies fair)
    const swarm=swarmActive>0;
    // density swings hard with the wave (big ups & downs) + swarm bursts
    droneTarget=Math.round(lerp(CONFIG.MIN_DRONES,CONFIG.MAX_DRONES,floorD) + tension*CONFIG.TENSION_SWING + (swarm?CONFIG.SWARM_SIZE:0) - (relief?4:0));
    droneTarget=clamp(droneTarget, relief?3:CONFIG.MIN_DRONES-2, CONFIG.MAX_DRONES+CONFIG.SWARM_SIZE);
    spawnInterval=(swarm?0.12:lerp(1.2,0.42,floorD)*(1.2-0.5*tension));
    bombChance=(level>=2 && !relief) ? CONFIG.BOMB_CHANCE*(0.35+0.85*tension) : 0;
    if(!firstCaptureDone){ droneTarget=1; difficulty=0; swarmActive=0; }                          // intro: only the tracking drone
  }
  function maybeSpawn(dt){
    spawnTimer-=dt;
    if(spawnTimer<=0 && Drones.count<droneTarget){
      spawnTimer=spawnInterval;
      let x,y,tries=0;
      do{ x=rand(50,W-50); y=rand(80,H-80); tries++; }while(dist(x,y,car.x,car.y)<140 && tries<12);
      // swarm composition + pickType -> RNG. goldenSwarm forces all-gold (the rare moment), still seed-fair.
      const swT = swarmActive>0 ? (goldenSwarm?DTYPE.BONUS:(RNG.float()<0.7?DTYPE.SMALL:DTYPE.WANDER)) : pickType();
      Drones.spawnAt(x,y, swT);
    }
  }
  function pickType(){
    let r=RNG.float();                       // spawn-type roll -> RNG (deterministic / seed-fair)
    if((r-=CONFIG.BONUS_CHANCE)<0) return DTYPE.BONUS;
    if((r-=CONFIG.RUNNER_CHANCE)<0) return DTYPE.RUNNER;
    if((r-=CONFIG.SMALL_CHANCE)<0) return DTYPE.SMALL;
    if((r-=CONFIG.BIG_CHANCE)<0) return DTYPE.BIG;
    if((r-=CONFIG.MAGNET_CHANCE)<0) return DTYPE.MAGNET;
    if((r-=CONFIG.GLUTTON_CHANCE)<0) return DTYPE.GLUTTON;
    if((r-=bombChance)<0) return DTYPE.BOMB;
    return DTYPE.WANDER;
  }

  // ---- levels (the "purpose": climb them) ---------------------------------
  function updateLevel(){ const lv=1+Math.floor(score/CONFIG.LEVEL_STEP); if(lv>level){ level=lv; levelUp(); } }
  function levelUp(){
    levelBanner=1.7;
    Storage.data.coins+=8; coinsRun+=8; if(level>(Storage.data.bestLevel||1)) Storage.data.bestLevel=level; Storage.save();
    Audio.fanfare(); FX.flash('rgba(255,255,255,0.18)',0.6); FX.addZoom(0.06); FX.addShake(0.5);
    setSky(level-1);                 // new biome: sky + floor + name all shift
    Popups.spawn(W/2, H*0.34, 'LEVEL '+level, COL.cyan, 42);
    Popups.spawn(W/2, H*0.34+44, biome().name, biome().accent, 26);
    Objectives.bump('level', level);
  }

  // ---- in-run power-up orbs ------------------------------------------------
  const POWER_KINDS=['FRENZY','MAGNET','SLOMO'];
  function hasPowerOrb(){ const a=Drones.alive; for(let i=0;i<a.length;i++) if(a[i].type===DTYPE.POWER) return true; return false; }
  function spawnPowerup(){ let x,y,tries=0; do{ x=rand(70,W-70); y=rand(110,H-110); tries++; }while(dist(x,y,car.x,car.y)<170 && tries<14); Drones.spawnAt(x,y,DTYPE.POWER); }
  function collectPowerups(){
    const a=Drones.alive;
    for(let i=a.length-1;i>=0;i--){ const d=a[i]; if(d.type!==DTYPE.POWER) continue;
      if(d.spawn>0.4 && dist(d.x,d.y,car.x,car.y) < d.r+20){
        powerKind=RNG.pick(POWER_KINDS); powerTimer=CONFIG.POWERUP_DUR; powerBanner=1.4;  // power kind -> RNG
        Particles.burst(d.x,d.y,30,{confetti:true,spMax:360,sizeMax:9}); Particles.burst(d.x,d.y,12,{spr:Sprites.white,spMax:220,sizeMax:15});
        Popups.spawn(d.x,d.y-30, powerKind+'!', COL.cyan, 32); Audio.bonus(); FX.addShake(0.6); FX.addZoom(0.06);
        Drones.pool.free(d);
      }
    }
  }
  function magnetStrength(){ let m=(Cosmetics.power().id==='pow_magnet')?CONFIG.MAGNET_EQUIP:0; if(powerKind==='MAGNET') m=Math.max(m,CONFIG.MAGNET_POWER); return m; }
  function speedScale(){ return powerKind==='SLOMO'?CONFIG.SLOMO_SCALE:1; }

  // ---- car physics: DIRECT STEERING ---------------------------------------
  // PURE integrator shared by the live car AND the ghost replay, so a recorded
  // steer timeline reproduces an IDENTICAL path. Mutates st={x,y,dir,ss}. Uses
  // only the steer input + arena (W,H) + CONFIG — never RNG or drones.
  function stepCar(st, s, dt){
    st.ss += (s-st.ss)*clamp(CONFIG.STEER_LERP*dt,0,1);
    let omega = st.ss * CONFIG.TURN_RATE;
    const m=CONFIG.WALL_MARGIN*2.2;             // soft containment (no wall death — keeps the ONE death rule)
    if(st.x<m||st.x>W-m||st.y<m||st.y>H-m){
      const desired=Math.atan2(H/2-st.y, W/2-st.x);
      const diff=Math.atan2(Math.sin(desired-st.dir),Math.cos(desired-st.dir));
      const edge=clamp((m-Math.min(st.x,st.y,W-st.x,H-st.y))/m,0,1);
      omega += diff*CONFIG.CONTAIN_STRENGTH*edge;
    }
    st.dir += omega*dt;
    st.x += Math.cos(st.dir)*CONFIG.CAR_SPEED*dt;
    st.y += Math.sin(st.dir)*CONFIG.CAR_SPEED*dt;
    st.x=clamp(st.x,6,W-6); st.y=clamp(st.y,6,H-6);
  }
  const _ps={x:0,y:0,dir:0,ss:0};               // reusable car-state scratch (no per-frame alloc)
  function effectiveSteer(){
    // test hook lets the determinism harness script inputs deterministically
    let s = _steerOverride ? _steerOverride(elapsed) : Input.steer();
    // GUARANTEED first win: if the player hasn't touched anything yet, auto-curl
    // (after a short grace) so the car laps the still-opening clump on its own.
    if(!firstCaptureDone && s===0 && elapsed>0.25) s=1;
    return s;
  }
  function updateCar(dt){
    const s=effectiveSteer();
    _ps.x=car.x; _ps.y=car.y; _ps.dir=car.dir; _ps.ss=steerSmooth;
    stepCar(_ps, s, dt);
    car.x=_ps.x; car.y=_ps.y; car.dir=_ps.dir; steerSmooth=_ps.ss;
    if(car.invuln>0) car.invuln-=dt;
    parallaxX=(car.x-W/2)*0.04; parallaxY=(car.y-H/2)*0.04; // subtle depth
  }

  // ---- main update ---------------------------------------------------------
  function update(dt){
    stepSky(dt);   // crossfade the level background colour
    if(state===STATE.PLAYING){
      elapsed+=dt;
      director(dt);
      updateLevel();
      updateCar(dt);
      // INTRO guarantee: the lone intro drone hovers at the car's turn-centre for
      // whichever way it's currently turning, so the first loop always wraps it.
      if(!firstCaptureDone && Drones.count>=1){
        const d=Drones.alive[0], sign=steerSmooth>=0?1:-1, a=car.dir+sign*Math.PI/2;
        const cx=car.x+Math.cos(a)*LASSO_R, cy=car.y+Math.sin(a)*LASSO_R, k=clamp(10*dt,0,1);
        d.x+=(cx-d.x)*k; d.y+=(cy-d.y)*k;
      }
      // record trail point when we've moved far enough
      const last=Trail.len>0?Trail.get(Trail.len-1):null;
      if(!last || dist2(last.x,last.y,car.x,car.y) >= CONFIG.TRAIL_MIN_DIST*CONFIG.TRAIL_MIN_DIST){
        Trail.push(car.x,car.y,elapsed);
        // self-cross resolution (only on a freshly added head segment)
        const loop=Trail.checkClose();
        if(loop){
          const caught=collectEnclosed(loop);
          if(caught.length>0) doCapture(loop, caught);
          else if(!firstCaptureDone || car.invuln>0){ Trail.reset(); Trail.push(car.x,car.y,elapsed); } // intro / post-revive grace: never punish, just break the trail
          else die();                          // empty self-cross = death (the one legible rule)
        }
      }
      Trail.dropOld(elapsed, trailLifespan());

      Drones.update(dt, difficulty, W, H, car.x, car.y, magnetStrength(), speedScale());
      maybeSpawn(dt);

      // power-up orbs: timers + occasional spawn + pickup-by-driving-over
      if(powerTimer>0){ powerTimer-=dt; if(powerTimer<=0) powerKind=''; }
      powerBanner=Math.max(0,powerBanner-dt); levelBanner=Math.max(0,levelBanner-dt); swarmBanner=Math.max(0,swarmBanner-dt);
      powerupTimer-=dt;
      if(powerupTimer<=0 && firstCaptureDone){ powerupTimer=rand(CONFIG.POWERUP_MIN,CONFIG.POWERUP_MAX); if(!hasPowerOrb()&&!powerKind) spawnPowerup(); }
      collectPowerups();

      // combo decay
      if(combo>0){ comboTimer-=dt; if(comboTimer<=0){ combo=0; pitchStep=0; } }
      comboBounce=Math.max(0, comboBounce-dt*3);

      // greed/near-death preview + near-miss telegraph (throttled)
      previewFrame=(previewFrame+1)%2;
      updatePreview();
      nearMissCd=Math.max(0,nearMissCd-dt);
      if(car.invuln<=0 && firstCaptureDone){
        const near=Trail.nearestApproach();
        if(near<CONFIG.NEAR_MISS_DIST){ FX.nearMiss(); if(nearMissCd<=0){ Audio.tick(); nearMissCd=0.16; } } // throttle: no tick storm while skimming
      }

      // drift hum tracks how hard you're steering
      Audio.setDrift(Math.abs(steerSmooth), true);
      Audio.updateMusic(true, difficulty);

      // capture snap-fill animation timer
      if(capFX.active){ capFX.t-=dt*7; if(capFX.t<=0) capFX.active=false; }
    }
    else if(state===STATE.DYING){
      Audio.setDrift(0,false);
      dyingTimer-=dt; if(dyingTimer<=0){ gameOver(); }
    }
    else if(state===STATE.PEAKEND){
      // celebratory new-best beat: keep confetti raining over the biggest loop, then settle the card
      Audio.setDrift(0,false);
      peakEnd.t+=dt;
      if(Math.random()<0.25) Particles.burst(peakEnd.cx+crand(-90,90), peakEnd.cy+crand(-60,60), 6, {confetti:true, spMax:240, sizeMax:9});
      if(peakEnd.t>=peakEnd.dur) showCard();
    }
    // FX + cosmetic systems always update so death/menus stay alive
    FX.update(dt);
    Particles.update(dt);
    Popups.update(dt);
    // smooth score counter
    displayScore += (score-displayScore)*clamp(8*dt,0,1);
    if(Math.abs(score-displayScore)<0.5) displayScore=score;
  }

  // gather drones strictly inside the loop polygon
  const _caught=[];
  function collectEnclosed(loop){
    _caught.length=0;
    const a=Drones.alive;
    for(let i=0;i<a.length;i++){ const d=a[i]; if(d.spawn>0.5 && pointInPoly(d.x,d.y,loop.poly,loop.n)) _caught.push(d); }
    return _caught;
  }

  // preview state for rendering (greed glow / danger warning)
  const previewState={valid:false, danger:false, area:0, n:0, poly:null, ghost:0};
  function updatePreview(){
    if(previewFrame!==0){ return; }
    const pv=Trail.previewLoop();
    if(pv.valid){
      // would the loop enclose drones? (a bomb inside => DANGER, not reward)
      let enclosed=0, valSum=0, gx=0, gy=0, bomb=false;
      const a=Drones.alive;
      for(let i=0;i<a.length;i++){ const d=a[i]; if(pointInPoly(d.x,d.y,pv.poly,pv.n)){ if(d.type===DTYPE.BOMB) bomb=true; else { enclosed++; valSum+=droneValue(d); } gx+=d.x; gy+=d.y; } }
      previewState.valid=true; previewState.poly=pv.poly; previewState.n=pv.n; previewState.area=pv.area;
      previewState.danger=(bomb || enclosed===0);   // empty OR contains a bomb = bad
      if(enclosed>0 && !bomb){
        const arenaArea=W*H; const norm=clamp(pv.area/(arenaArea*CONFIG.AREA_REF_FRACTION),CONFIG.AREA_NORM_MIN,CONFIG.AREA_NORM_MAX);
        previewState.ghost=Math.round(CONFIG.BASE_CAPTURE*norm*comboMult()*valSum);
        previewState.gx=gx/enclosed; previewState.gy=gy/enclosed-40;
      } else previewState.ghost=0;
    } else previewState.valid=false;
  }

  // ---- DETERMINISM HARNESS (dev/test) -------------------------------------
  // Runs the real sim headlessly: same seed + same scripted steer => identical
  // result. This is the proof that RNG is plumbed correctly and the prerequisite
  // for fair dailies + ghost replays. Snapshots/restores the save so it's
  // side-effect-free. Render is never called here.
  function runHeadless(seed, steerFn, frames){
    const prev=_steerOverride; _steerOverride=steerFn||(()=>0);
    fullReset({ seed:seed, test:true });
    const STEP=1/60, N=frames||900;
    for(let i=0;i<N;i++){ if(state!==STATE.PLAYING) break; update(STEP); }
    const res={ score:Math.round(score), elapsed:+elapsed.toFixed(3), captures:runCaptures,
      carx:+car.x.toFixed(4), cary:+car.y.toFixed(4), cardir:+car.dir.toFixed(5),
      drones:Drones.count, rng:RNG.getState(), trail:Trail.len };
    _steerOverride=prev;
    return res;
  }
  function selfTest(){
    const snap=JSON.parse(JSON.stringify(Storage.data));         // sandbox the player's save
    const steer=(t)=>{ const x=Math.sin(t*1.7)+0.5*Math.sin(t*0.6); return x>0.33?1:(x<-0.33?-1:0); };
    const a=runHeadless(0xBEEF, steer, 900);
    const b=runHeadless(0xBEEF, steer, 900);
    const c=runHeadless(0x1234, steer, 900);
    const identical=JSON.stringify(a)===JSON.stringify(b);
    const differs=JSON.stringify(a)!==JSON.stringify(c);
    Storage.data=Object.assign(Storage.data, snap); Storage.save();  // restore the player's save
    const pass=identical&&differs;
    try{ console.log('[Drift Lasso selfTest] same-seed identical:',identical,'| diff-seed differs:',differs,'\n A=',a,'\n C=',c, pass?'\n => DETERMINISM PASS':'\n => DETERMINISM FAIL'); }catch(e){}
    fullReset();                                                  // hand back a clean, playable run
    return { pass, identical, differs, a, b, c };
  }

  return {
    canvas, get ctx(){return ctx;}, STATE, resize,
    fullReset, revive, update, stepCar,
    get state(){return state;}, set state(s){state=s;},
    get W(){return W;}, get H(){return H;}, get car(){return car;},
    get score(){return score;}, get displayScore(){return displayScore;},
    get combo(){return combo;}, get comboBounce(){return comboBounce;},
    get elapsed(){return elapsed;}, get difficulty(){return difficulty;},
    get hintAlpha(){return hintAlpha;}, get capFX(){return capFX;}, get previewState(){return previewState;},
    get parallaxX(){return parallaxX;}, get parallaxY(){return parallaxY;},
    get vignette(){return vignette;}, get bgGrad(){return bgGrad;}, get prevBest(){return prevBest;}, get safeTop(){return safeTop;},
    get level(){return level;}, get levelBanner(){return levelBanner;}, get trailLifespan(){return trailLifespan();},
    get powerKind(){return powerKind;}, get powerTimer(){return powerTimer;}, get powerBanner(){return powerBanner;},
    get swarmBanner(){return swarmBanner;}, get goldenSwarm(){return goldenSwarm;},
    get floor(){return curFloor;}, get biomeName(){return biome().name;}, get biomeAccent(){return biome().accent;},
    get decoStars(){return decoStars;}, get decoBub(){return decoBub;}, get decoSprk(){return decoSprk;},
    // ---- V2 render/state accessors ----
    get peakEnd(){return peakEnd;}, get bestLoopPoly(){return bestLoopPoly;}, get bestLoopN(){return bestLoopN;},
    get runSeed(){return runSeed;}, get droneCount(){return Drones.count;},
    // ---- dev/test harness: deterministic headless run + self-check ----
    _setSteerOverride(fn){ _steerOverride=fn; },
    selfTest, runHeadless,
  };
})();

/* ============================== [RENDER] =================================== */
const Render=(()=>{
  // soft rounded floor grid (bright, playful, parallaxes with the car)
  const wrap=(v,m)=>((v%m)+m)%m;
  // per-biome floor motif (cheap, parallaxed). Drawn over the sky, under gameplay.
  function drawFloor(ctx,W,H,px,py){
    const f=Game.floor, t=Game.elapsed, ac=hexToRgb(Game.biomeAccent);
    if(f==='grid'){
      const sp=58; ctx.lineWidth=2; ctx.strokeStyle='rgba('+ac.r+','+ac.g+','+ac.b+',0.16)'; ctx.beginPath();
      const ox=-wrap(px,sp), oy=-wrap(py,sp);
      for(let x=ox;x<W+sp;x+=sp){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
      for(let y=oy;y<H+sp;y+=sp){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
      ctx.stroke();
    } else if(f==='snow'){
      const st=Game.decoStars; ctx.fillStyle='#fff';
      for(let i=0;i<st.length;i++){ const s=st[i]; ctx.globalAlpha=0.55;
        ctx.beginPath(); ctx.arc(wrap(s.x+Math.sin(t+s.ph)*12+px*0.2,W), wrap(s.y+t*(18+s.r*8),H), s.r+1, 0, TAU); ctx.fill(); }
      ctx.globalAlpha=1;
    } else if(f==='waves'){
      ctx.lineWidth=4; ctx.strokeStyle='rgba('+ac.r+','+ac.g+','+ac.b+',0.30)';
      for(let yy=H*0.3; yy<H; yy+=46){ ctx.beginPath(); for(let x=0;x<=W;x+=24){ const y=yy+Math.sin(x*0.02+t*1.2+yy)*10; if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);} ctx.stroke(); }
    } else if(f==='clouds'){
      const b=Game.decoBub; ctx.fillStyle='rgba(255,255,255,0.5)';
      for(let i=0;i<b.length;i++){ const o=b[i]; const x=wrap(o.x+t*o.sp*0.4+px*0.15,W+120)-60, y=o.y*0.7+30;
        ctx.beginPath(); ctx.ellipse(x,y,o.r*2.4,o.r*1.2,0,0,TAU); ctx.ellipse(x+o.r*1.6,y+o.r*0.2,o.r*1.7,o.r*0.9,0,0,TAU); ctx.fill(); }
    } else if(f==='stars'){
      ctx.fillStyle='rgba(155,107,255,0.45)'; ctx.beginPath(); ctx.arc(W*0.78+px*0.1,H*0.2+py*0.1,72,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(120,80,210,0.5)'; ctx.beginPath(); ctx.arc(W*0.78+px*0.1,H*0.2+py*0.1,72,0,TAU); ctx.fill();
      const st=Game.decoStars; ctx.fillStyle='#fff';
      for(let i=0;i<st.length;i++){ const s=st[i]; ctx.globalAlpha=0.35+0.55*(0.5+0.5*Math.sin(t*2+s.ph));
        ctx.beginPath(); ctx.arc(wrap(s.x+px*0.3,W),wrap(s.y+py*0.3,H),s.r,0,TAU); ctx.fill(); }
      ctx.globalAlpha=1;
    } else if(f==='bubbles'){
      const b=Game.decoBub; ctx.lineWidth=3;
      for(let i=0;i<b.length;i++){ const o=b[i]; const x=wrap(o.x+px*0.2,W), y=wrap(o.y-t*o.sp,H);
        ctx.globalAlpha=0.45; ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(x,y,o.r,0,TAU); ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(x-o.r*0.32,y-o.r*0.32,o.r*0.22,0,TAU); ctx.fill(); }
      ctx.globalAlpha=1;
    } else if(f==='checker'){
      const sp=74, ox=wrap(px*0.4,sp*2), oy=wrap(py*0.4,sp*2); ctx.fillStyle='rgba(255,255,255,0.08)';
      for(let yy=-sp*2,ry=0; yy<H+sp*2; yy+=sp,ry++){ for(let xx=-sp*2,rx=0; xx<W+sp*2; xx+=sp,rx++){ if((rx+ry)&1) ctx.fillRect(xx-ox,yy-oy,sp,sp); } }
    } else if(f==='dunes'){
      const a=hexToRgb(Game.biomeAccent);
      for(let layer=0;layer<3;layer++){ const baseY=H*(0.5+layer*0.17);
        ctx.fillStyle='rgba('+a.r+','+a.g+','+a.b+','+(0.16+layer*0.09)+')'; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,baseY);
        for(let x=0;x<=W;x+=44) ctx.lineTo(x, baseY+Math.sin(x*0.011+layer*1.7)*18); ctx.lineTo(W,H); ctx.closePath(); ctx.fill(); }
    } else if(f==='sprinkles'){
      const s=Game.decoSprk;
      for(let i=0;i<s.length;i++){ const o=s[i]; ctx.save(); ctx.translate(wrap(o.x+px*0.25,W),wrap(o.y+py*0.25,H)); ctx.rotate(o.rot);
        ctx.globalAlpha=0.5; ctx.fillStyle=o.c; ctx.fillRect(-3,-8,6,16); ctx.restore(); }
      ctx.globalAlpha=1;
    }
  }

  // a flattened ink shadow under a lifted object (the #1 cartoon-2.5D trick)
  function drawShadow(ctx,x,y,r){
    const s=r*2.4; ctx.save(); ctx.globalAlpha=1;
    ctx.translate(x, y+r*0.62); ctx.scale(1,0.45);
    ctx.drawImage(Sprites.shadow, -s, -s, s*2, s*2); ctx.restore();
  }

  // ---- trail-STYLE renderer ----------------------------------------------
  // Each equipped skin names a `style`; drawTrail dispatches to these passes.
  // Helpers + the palette scratch (_pal) live at module scope so NO closures or
  // arrays are allocated per frame (per-segment colour strings match V1).
  const _pal={rainbow:false, ar:0,ag:0,ab:0,br:0,bg:0,bb:0, a:'#fff', b:'#fff', shift:0};
  function palColor(tN){
    if(_pal.rainbow) return 'hsl('+(((tN*300)+_pal.shift)%360)+',100%,62%)';
    return 'rgb('+((_pal.ar+(_pal.br-_pal.ar)*tN)|0)+','+((_pal.ag+(_pal.bg-_pal.ag)*tN)|0)+','+((_pal.ab+(_pal.bb-_pal.ab)*tN)|0)+')';
  }
  function trFade(p1,life){ return 1-clamp((Game.elapsed-p1.t)/life,0,1); }
  function trInk(ctx,n,oX,oY,width,life){ ctx.lineWidth=width; ctx.strokeStyle=COL.ink;
    for(let i=1;i<n;i++){ const p0=Trail.get(i-1),p1=Trail.get(i); const f=trFade(p1,life); if(f<=0.04) continue;
      ctx.globalAlpha=f; ctx.beginPath(); ctx.moveTo(p0.x+oX,p0.y+oY); ctx.lineTo(p1.x+oX,p1.y+oY); ctx.stroke(); } }
  function trCore(ctx,n,oX,oY,width,life,dashed){ ctx.lineWidth=width; if(dashed) ctx.setLineDash([width*1.7,width*1.5]);
    for(let i=1;i<n;i++){ const p0=Trail.get(i-1),p1=Trail.get(i); const tN=i/(n-1); const f=trFade(p1,life); if(f<=0.04) continue;
      ctx.globalAlpha=f; ctx.strokeStyle=palColor(tN); ctx.beginPath(); ctx.moveTo(p0.x+oX,p0.y+oY); ctx.lineTo(p1.x+oX,p1.y+oY); ctx.stroke(); }
    if(dashed) ctx.setLineDash([]); }
  function trSheen(ctx,n,oX,oY,core,life){ if(!PERF.allowSheen()) return; ctx.lineWidth=core*0.32; ctx.strokeStyle='rgba(255,255,255,0.75)';
    for(let i=1;i<n;i++){ const p1=Trail.get(i); const f=trFade(p1,life); if(f<=0.2) continue; const p0=Trail.get(i-1); ctx.globalAlpha=f*0.5;
      ctx.beginPath(); ctx.moveTo(p0.x+oX,p0.y-core*0.18+oY); ctx.lineTo(p1.x+oX,p1.y-core*0.18+oY); ctx.stroke(); } }
  function trGlow(ctx,n,oX,oY,w,life){ ctx.globalCompositeOperation='lighter'; ctx.lineWidth=w*1.8;
    for(let i=1;i<n;i++){ const p0=Trail.get(i-1),p1=Trail.get(i); const tN=i/(n-1); const f=trFade(p1,life); if(f<=0.1) continue;
      ctx.globalAlpha=f*0.16; ctx.strokeStyle=palColor(tN); ctx.beginPath(); ctx.moveTo(p0.x+oX,p0.y+oY); ctx.lineTo(p1.x+oX,p1.y+oY); ctx.stroke(); }
    ctx.globalCompositeOperation='source-over'; }
  function trStar(ctx,x,y,r,col,a){ ctx.globalAlpha=a; ctx.fillStyle=col; ctx.beginPath();
    for(let k=0;k<10;k++){ const ang=k*Math.PI/5-Math.PI/2, rad=(k&1)?r*0.42:r; const px=x+Math.cos(ang)*rad, py=y+Math.sin(ang)*rad; k?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.closePath(); ctx.fill(); }
  // sparkle/ember emitter from the head (cosmetic only — Math.random + PERF-scaled, never the sim RNG)
  function trEmit(colors){ if(Game.state!==Game.STATE.PLAYING || Trail.len<2) return;
    if(Math.random()<0.45){ const h=Trail.get(Trail.len-1);
      Particles.burst(h.x,h.y,1, colors? {confetti:true,colors:colors,spMax:130,sizeMax:6} : {spr:Sprites.white,spMax:90,sizeMax:9}); } }

  function drawTrail(ctx, offX, offY){
    const n=Trail.len; if(n<2) return;
    const skin=Cosmetics.trail(); const style=skin.style||'solid';
    ctx.lineCap='round'; ctx.lineJoin='round';
    const life=Game.trailLifespan;
    const core=CONFIG.TRAIL_WIDTH*(1+(life-CONFIG.TRAIL_LIFESPAN)*0.18); // snake fattens as it grows
    // load the palette scratch
    _pal.rainbow=(style==='rainbow'); _pal.shift=(Game.elapsed*60)%360;
    if(!_pal.rainbow){ const ca=hexToRgb(skin.a||'#00E5FF'), cb=hexToRgb(skin.b||'#FF49C3');
      _pal.ar=ca.r;_pal.ag=ca.g;_pal.ab=ca.b;_pal.br=cb.r;_pal.bg=cb.g;_pal.bb=cb.b; _pal.a=skin.a; _pal.b=skin.b; }
    switch(style){
      case 'stripes':   // alternating ~2-segment bands of A / B (candy cane)
        trInk(ctx,n,offX,offY,core+8,life); ctx.lineWidth=core;
        for(let i=1;i<n;i++){ const p0=Trail.get(i-1),p1=Trail.get(i); const f=trFade(p1,life); if(f<=0.04) continue;
          ctx.globalAlpha=f; ctx.strokeStyle=((i>>1)&1)?_pal.b:_pal.a; ctx.beginPath(); ctx.moveTo(p0.x+offX,p0.y+offY); ctx.lineTo(p1.x+offX,p1.y+offY); ctx.stroke(); }
        trSheen(ctx,n,offX,offY,core,life); break;
      case 'dashed':    // gapped dashes
        trInk(ctx,n,offX,offY,core+8,life); trCore(ctx,n,offX,offY,core,life,true); trSheen(ctx,n,offX,offY,core,life); break;
      case 'pixel': {   // square stamps (8-bit)
        const half=core*0.85;
        for(let i=0;i<n;i+=2){ const p=Trail.get(i); const f=trFade(p,life); if(f<=0.06) continue; const tN=i/(n-1);
          ctx.globalAlpha=f; ctx.fillStyle=COL.ink; ctx.fillRect(p.x-half-1+offX,p.y-half-1+offY,half*2+2,half*2+2);
          ctx.fillStyle=palColor(tN); ctx.fillRect(p.x-half+offX,p.y-half+offY,half*2,half*2); } break; }
      case 'electric': {// jagged lightning core + bright white inner bolt
        trInk(ctx,n,offX,offY,core+6,life); ctx.lineWidth=core*0.85;
        for(let i=1;i<n;i++){ const p0=Trail.get(i-1),p1=Trail.get(i); const f=trFade(p1,life); if(f<=0.04) continue; const tN=i/(n-1);
          const dx=p1.x-p0.x,dy=p1.y-p0.y,L=Math.hypot(dx,dy)||1, j=Math.sin(i*0.9+performance.now()*0.02)*core*0.55;
          ctx.globalAlpha=f; ctx.strokeStyle=palColor(tN); ctx.beginPath(); ctx.moveTo(p0.x+offX,p0.y+offY); ctx.lineTo(p1.x+(-dy/L)*j+offX,p1.y+(dx/L)*j+offY); ctx.stroke(); }
        ctx.lineWidth=core*0.3; ctx.strokeStyle='rgba(255,255,255,0.85)';
        for(let i=1;i<n;i++){ const p0=Trail.get(i-1),p1=Trail.get(i); const f=trFade(p1,life); if(f<=0.2) continue; ctx.globalAlpha=f*0.7;
          ctx.beginPath(); ctx.moveTo(p0.x+offX,p0.y+offY); ctx.lineTo(p1.x+offX,p1.y+offY); ctx.stroke(); } break; }
      case 'flame':     // warm gradient, flickering width + rising embers
        trInk(ctx,n,offX,offY,core+8,life); trCore(ctx,n,offX,offY,core*(1+0.12*Math.sin(performance.now()*0.03)),life,false);
        trEmit(['#FFE259','#FF8A3D','#FF1744']); trSheen(ctx,n,offX,offY,core,life); break;
      case 'comet':     // glossy core + glow + sparkle tail
        trInk(ctx,n,offX,offY,core+8,life); if(PERF.allowSheen()) trGlow(ctx,n,offX,offY,core,life);
        trCore(ctx,n,offX,offY,core,life,false); trEmit(null); trSheen(ctx,n,offX,offY,core,life); break;
      case 'stars': {   // faint line + star stamps
        trCore(ctx,n,offX,offY,core*0.4,life,false);
        for(let i=0;i<n;i+=3){ const p=Trail.get(i); const f=trFade(p,life); if(f<=0.08) continue; trStar(ctx,p.x+offX,p.y+offY,core*0.95,palColor(i/(n-1)),f); } break; }
      case 'galaxy': {  // deep nebula core + twinkling star field
        trInk(ctx,n,offX,offY,core+8,life); trCore(ctx,n,offX,offY,core,life,false);
        ctx.globalCompositeOperation='lighter';
        for(let i=0;i<n;i+=2){ const p=Trail.get(i); const f=trFade(p,life); if(f<=0.1) continue;
          ctx.globalAlpha=f*(0.5+0.5*Math.sin(performance.now()*0.01+i)); ctx.fillStyle='#fff';
          ctx.beginPath(); ctx.arc(p.x+offX+Math.sin(i*2.3)*core*0.55, p.y+offY+Math.cos(i*1.7)*core*0.55, 1.6, 0, TAU); ctx.fill(); }
        ctx.globalCompositeOperation='source-over'; break; }
      case 'glow':      // strong additive bloom around the core
        trInk(ctx,n,offX,offY,core+8,life); if(PERF.allowSheen()) trGlow(ctx,n,offX,offY,core*1.1,life);
        trCore(ctx,n,offX,offY,core,life,false); trSheen(ctx,n,offX,offY,core,life); break;
      case 'rainbow':
      case 'solid':
      default:
        trInk(ctx,n,offX,offY,core+8,life); trCore(ctx,n,offX,offY,core,life,false); trSheen(ctx,n,offX,offY,core,life); break;
    }
    ctx.globalAlpha=1; ctx.setLineDash([]); ctx.globalCompositeOperation='source-over';
  }

  function drawPreview(ctx,offX,offY){
    const pv=Game.previewState; if(!pv.valid || pv.n<3) return;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(pv.poly[0].x+offX,pv.poly[0].y+offY);
    for(let i=1;i<pv.n;i++) ctx.lineTo(pv.poly[i].x+offX,pv.poly[i].y+offY);
    ctx.closePath();
    const pulse=0.14+0.07*Math.sin(performance.now()*0.012);
    ctx.fillStyle = pv.danger ? 'rgba(255,59,92,'+(pulse*1.1)+')' : 'rgba(0,229,255,'+pulse+')';
    ctx.fill();
    // COLOUR-BLIND: a hatch pattern on a DANGER loop so it's not red-only
    if(pv.danger && Storage.data.settings && Storage.data.settings.colorblind){
      ctx.clip(); ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,0.5)';
      let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9; for(let i=0;i<pv.n;i++){ const p=pv.poly[i]; if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x; if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y; }
      ctx.beginPath(); for(let x=minx-(maxy-miny); x<maxx; x+=14){ ctx.moveTo(x+offX,miny+offY); ctx.lineTo(x+(maxy-miny)+offX,maxy+offY); } ctx.stroke();
    }
    ctx.restore();
    if(!pv.danger && pv.ghost>0){
      ctx.font='900 24px '+FONT_STACK; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=5; ctx.strokeStyle=COL.ink; ctx.strokeText('+'+pv.ghost, pv.gx+offX, pv.gy+offY);
      ctx.fillStyle=COL.white; ctx.fillText('+'+pv.ghost, pv.gx+offX, pv.gy+offY);
    }
  }

  function drawCaptureFill(ctx,offX,offY){
    const cf=Game.capFX; if(!cf.active || cf.n<3) return;
    const t=clamp(cf.t,0,1); const scale=0.85+0.15*t;
    ctx.save();
    let cx=0,cy=0; for(let i=0;i<cf.n;i++){cx+=cf.poly[i].x;cy+=cf.poly[i].y;} cx/=cf.n; cy/=cf.n;
    ctx.translate(cx+offX,cy+offY); ctx.scale(scale,scale); ctx.translate(-cx-offX,-cy-offY);
    ctx.beginPath(); ctx.moveTo(cf.poly[0].x+offX,cf.poly[0].y+offY);
    for(let i=1;i<cf.n;i++) ctx.lineTo(cf.poly[i].x+offX,cf.poly[i].y+offY); ctx.closePath();
    const cc=hexToRgb(cf.color);
    ctx.fillStyle='rgba('+cc.r+','+cc.g+','+cc.b+','+(0.55*t)+')'; ctx.fill();
    ctx.fillStyle='rgba(255,255,255,'+(0.55*t)+')'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,'+(0.8*t)+')'; ctx.stroke();
    ctx.restore();
  }

  function drawDrones(ctx,offX,offY){
    const a=Drones.alive;
    // shadows first (all drones), then the glossy balls + faces
    for(let i=0;i<a.length;i++){ const d=a[i]; if(d.spawn<0.2) continue; drawShadow(ctx,d.x+offX,d.y+offY,d.r*d.spawn); }
    for(let i=0;i<a.length;i++){ const d=a[i];
      const dx=d.x+offX, dy=d.y-d.r*0.12+offY; // tiny lift = floaty
      if(d.type===DTYPE.POWER){ drawPowerOrb(ctx, d, dx, dy); continue; }
      const scared=d.scared>0.05;
      const pop=(0.92+0.10*Math.sin(d.phase) + (scared?0.06*Math.sin(performance.now()*0.05):0))*d.spawn;
      const spr = d.type===DTYPE.BONUS?Sprites.droneBonus : d.type===DTYPE.RUNNER?Sprites.droneRun
        : d.type===DTYPE.BOMB?Sprites.bomb : d.type===DTYPE.BIG?Sprites.droneBig
        : d.type===DTYPE.MAGNET?Sprites.droneMag : d.type===DTYPE.GLUTTON?Sprites.droneGlut : Sprites.drone;
      // sprites are authored for the base radius; scale to each critter's actual radius
      const s=(CONFIG.DRONE_RADIUS+Sprites.pad)*2*(d.r/CONFIG.DRONE_RADIUS)*pop;
      ctx.globalAlpha=clamp(d.spawn,0,1);
      ctx.drawImage(spr, dx-s/2, dy-s/2, s, s);
      ctx.globalAlpha=1;
      drawFace(ctx, d, dx, dy, scared);
      if(d.spawn>0.6) cbBadge(ctx, d, dx, dy);   // colour-blind shape tags (no-op unless toggled)
    }
  }

  // the rare power-up: a pulsing rainbow orb with a star + glow (drive over to grab)
  function drawPowerOrb(ctx, d, x, y){
    const t=performance.now()*0.004, r=d.r*(1+0.10*Math.sin(t*3))*d.spawn, hue=(t*120)%360;
    ctx.globalAlpha=clamp(d.spawn,0,1)*0.9; ctx.globalCompositeOperation='lighter';
    ctx.drawImage(Sprites.white, x-r*2.2, y-r*2.2, r*4.4, r*4.4);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=clamp(d.spawn,0,1);
    ctx.beginPath(); ctx.arc(x,y,r+3,0,TAU); ctx.fillStyle=COL.ink; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle='hsl('+hue+',100%,62%)'; ctx.fill();
    // little white star
    ctx.fillStyle='#fff'; ctx.save(); ctx.translate(x,y); ctx.rotate(t);
    ctx.beginPath(); for(let k=0;k<5;k++){ const a1=k*2*Math.PI/5-Math.PI/2, a2=a1+Math.PI/5; ctx.lineTo(Math.cos(a1)*r*0.7,Math.sin(a1)*r*0.7); ctx.lineTo(Math.cos(a2)*r*0.3,Math.sin(a2)*r*0.3); } ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }

  // googly eyes (+ expressions) — the personality layer
  function drawFace(ctx, d, x, y, scared){
    if(d.spawn<0.5) return;
    const r=d.r, blinking=d.blink<0;
    const eo=r*0.42, ey=-r*0.12, er=r*0.30;            // eye offset / size
    const bomb=(d.type===DTYPE.BOMB);
    // whites
    ctx.fillStyle='#FFFFFF';
    if(blinking){
      ctx.lineWidth=Math.max(2,r*0.12); ctx.strokeStyle=COL.ink; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x-eo-er*0.6,y+ey); ctx.lineTo(x-eo+er*0.6,y+ey);
      ctx.moveTo(x+eo-er*0.6,y+ey); ctx.lineTo(x+eo+er*0.6,y+ey); ctx.stroke();
    } else {
      const ew=scared?er*1.15:er;
      ctx.beginPath(); ctx.arc(x-eo,y+ey,ew,0,TAU); ctx.arc(x+eo,y+ey,ew,0,TAU); ctx.fill();
      // pupils glance toward the car
      ctx.fillStyle=COL.ink; const pr=er*(scared?0.42:0.55);
      ctx.beginPath(); ctx.arc(x-eo+d.ex,y+ey+d.ey,pr,0,TAU); ctx.arc(x+eo+d.ex,y+ey+d.ey,pr,0,TAU); ctx.fill();
    }
    // expression: bomb scowls; glutton chomps; scared = "o"; otherwise content
    ctx.strokeStyle=COL.ink; ctx.lineWidth=Math.max(2,r*0.11); ctx.lineCap='round';
    if(bomb){
      ctx.beginPath(); ctx.moveTo(x-eo-er*0.5,y+ey-er*0.9); ctx.lineTo(x-eo+er*0.6,y+ey-er*0.4);
      ctx.moveTo(x+eo+er*0.5,y+ey-er*0.9); ctx.lineTo(x+eo-er*0.6,y+ey-er*0.4); ctx.stroke(); // angry brows
      ctx.beginPath(); ctx.arc(x,y+r*0.42,er*0.5,Math.PI*1.15,Math.PI*1.85); ctx.stroke();    // frown
      // a lit fuse sparking on top
      ctx.strokeStyle=COL.ink; ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r*0.16,y-r*1.42); ctx.stroke();
      const fz=0.6+0.4*Math.sin(performance.now()*0.03+d.phase);
      ctx.fillStyle='#FFD23F'; ctx.globalAlpha=fz; ctx.beginPath(); ctx.arc(x+r*0.16,y-r*1.42,r*0.22,0,TAU); ctx.fill();
      ctx.fillStyle='#FF3B5C'; ctx.beginPath(); ctx.arc(x+r*0.16,y-r*1.42,r*0.11,0,TAU); ctx.fill(); ctx.globalAlpha=1;
    } else if(d.type===DTYPE.GLUTTON){
      ctx.fillStyle=COL.ink; const mw=er*(1.0+0.3*Math.sin(performance.now()*0.012)); // chomping mouth
      ctx.beginPath(); ctx.ellipse(x,y+r*0.34,mw,er*0.8,0,0,TAU); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.rect(x-mw*0.6,y+r*0.34-er*0.7,mw*1.2,er*0.22); ctx.fill(); // teeth
    } else if(scared){
      ctx.fillStyle=COL.ink; ctx.beginPath(); ctx.ellipse(x,y+r*0.42,er*0.34,er*0.46,0,0,TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(x,y+r*0.30,er*0.55,0.12*Math.PI,0.88*Math.PI); ctx.stroke();   // smile
    }
  }

  // SET-bonus flourish (cosmetic only): Gilded => gold sparkle orbit; Void => violet aura
  function drawSetFlourish(ctx,x,y,set,r){
    const t=performance.now()*0.004; ctx.save(); ctx.globalCompositeOperation='lighter';
    if(set.flourish==='sparkle'){ for(let k=0;k<6;k++){ const a=t*1.5+k*TAU/6, rr=r*1.9+Math.sin(t*3+k)*4;
      ctx.globalAlpha=0.55; ctx.drawImage(Sprites.amber, x+Math.cos(a)*rr-7, y+Math.sin(a)*rr-7, 14,14); } }
    else { ctx.globalAlpha=0.32+0.16*Math.sin(t*3); ctx.drawImage(Sprites.magenta, x-r*2.6, y-r*2.6, r*5.2, r*5.2); }
    ctx.restore();
  }
  function drawCar(ctx,offX,offY){
    const car=Game.car;
    const blink = car.invuln>0 ? (0.45+0.55*Math.abs(Math.sin(performance.now()*0.02))) : 1;
    drawShadow(ctx, car.x+offX, car.y+offY, 22);
    const s=(23+Sprites.pad)*2;
    const set=META.activeSet(); if(set && PERF.tier!=='low') drawSetFlourish(ctx, car.x+offX, car.y-3+offY, set, 22);
    ctx.globalAlpha=blink;
    ctx.drawImage(Sprites.car, car.x-s/2+offX, car.y-s/2-3+offY, s, s);
    ctx.globalAlpha=1;
    // bold ink direction arrow on top of the ball
    ctx.save(); ctx.translate(car.x+offX,car.y-3+offY); ctx.rotate(car.dir);
    ctx.fillStyle=COL.ink; ctx.beginPath();
    ctx.moveTo(13,0); ctx.lineTo(2,7); ctx.lineTo(5,0); ctx.lineTo(2,-7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // COLOUR-BLIND aid: shape badges so death-red / coral target / amber star never
  // rely on hue alone. Bombs are already spiky+fused; we add a ★ over stars and an
  // ✕ over bombs when the toggle is on. (Drawn after the face, per drone.)
  function cbBadge(ctx,d,x,y){
    if(!Storage.data.settings||!Storage.data.settings.colorblind) return;
    const r=d.r, ty=y-r-7;
    ctx.save(); ctx.lineWidth=Math.max(2,r*0.18); ctx.lineCap='round'; ctx.strokeStyle=COL.ink; ctx.fillStyle='#fff';
    if(d.type===DTYPE.BONUS){ // small 4-point star
      ctx.beginPath(); for(let k=0;k<8;k++){ const a=k*Math.PI/4, rad=(k&1)?r*0.18:r*0.42; const px=x+Math.cos(a-Math.PI/2)*rad, py=ty+Math.sin(a-Math.PI/2)*rad; k?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.closePath();
      ctx.strokeStyle=COL.ink; ctx.lineWidth=3; ctx.stroke(); ctx.fillStyle='#fff'; ctx.fill();
    } else if(d.type===DTYPE.BOMB){ // an ✕
      ctx.strokeStyle='#fff'; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(x-r*0.32,ty-r*0.32); ctx.lineTo(x+r*0.32,ty+r*0.32); ctx.moveTo(x+r*0.32,ty-r*0.32); ctx.lineTo(x-r*0.32,ty+r*0.32); ctx.stroke();
    }
    ctx.restore();
  }

  // chunky outlined HUD text helper
  function inkText(ctx,txt,x,y,size,fill,ink){
    ctx.font='900 '+size+'px '+FONT_STACK;
    ctx.lineJoin='round'; ctx.lineWidth=Math.max(5,size*0.16); ctx.strokeStyle=ink||COL.ink;
    ctx.strokeText(txt,x,y); ctx.fillStyle=fill; ctx.fillText(txt,x,y);
  }
  function drawHUD(ctx,W,H){
    const st=Game.safeTop;
    ctx.textAlign='center'; ctx.textBaseline='top';
    // SCORE — big, white, chunky ink outline, tabular (never jitters)
    inkText(ctx, Math.round(Game.displayScore).toString(), W/2, 16+st, 60, COL.white);
    // BEST line (the target to beat)
    const beat=(Game.score>Game.prevBest && Game.prevBest>0);
    inkText(ctx, beat?'NEW BEST!':'BEST '+Storage.data.highScore, W/2, 84+st, 17, beat?COL.magenta:'#EAF2FF');
    // COMBO — hot pink, bounces on increment
    if(Game.combo>1){ const sc=1+Game.comboBounce*0.6;
      inkText(ctx, 'x'+Game.combo, W/2, 110+st, Math.round(42*sc), COL.magenta);
    }
    // COINS — top-left, below the shop button
    ctx.textAlign='left';
    inkText(ctx, '◉ '+Storage.data.coins, 16, 74+st, 22, COL.amber);
    // LEVEL — top-right, below the mute button, with a progress-to-next bar
    ctx.textAlign='right';
    inkText(ctx, 'LV '+Game.level, W-16, 74+st, 22, COL.cyan);
    const frac=(Game.score%CONFIG.LEVEL_STEP)/CONFIG.LEVEL_STEP, bw=84, bx=W-16-bw, by=102+st;
    ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle=COL.ink;
    ctx.fillStyle='#EADFce'; roundRect(ctx,bx,by,bw,9,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle=COL.cyan; if(frac>0){ roundRect(ctx,bx,by,Math.max(4,bw*frac),9,4); ctx.fill(); }
    // LEVEL-UP banner
    if(Game.levelBanner>0){ const a=clamp(Game.levelBanner/1.7,0,1); ctx.globalAlpha=clamp(a*1.6,0,1); ctx.textAlign='center';
      inkText(ctx,'LEVEL '+Game.level+'!', W/2, H*0.30, 46, COL.cyan); ctx.globalAlpha=1; }
    if(Game.swarmBanner>0){ const a=clamp(Game.swarmBanner/1.6,0,1); const sc=1+0.15*Math.sin(performance.now()*0.02);
      ctx.globalAlpha=clamp(a*1.6,0,1); ctx.textAlign='center'; inkText(ctx, Game.goldenSwarm?'GOLDEN SWARM!':'SWARM!', W/2, H*0.24, Math.round((Game.goldenSwarm?44:50)*sc), Game.goldenSwarm?'#FFD23F':COL.amber); ctx.globalAlpha=1; }
    // POWER-UP active banner + countdown bar
    if(Game.powerKind){ ctx.textAlign='center';
      const pulse=1+0.08*Math.sin(performance.now()*0.02);
      inkText(ctx, Game.powerKind+'!', W/2, H-78-st, Math.round(26*pulse), COL.amber);
      const pf=clamp(Game.powerTimer/CONFIG.POWERUP_DUR,0,1), pw=140, px=(W-pw)/2, py=H-46;
      ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#EADFce'; roundRect(ctx,px,py,pw,10,5); ctx.fill(); ctx.stroke();
      ctx.fillStyle=COL.amber; if(pf>0){ roundRect(ctx,px,py,Math.max(5,pw*pf),10,5); ctx.fill(); }
    }
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // Truthful control hint — matches the SHIPPED steering scheme (CONFIG.AB_STEERING).
  function drawHint(ctx,W,H){
    const a=Game.hintAlpha; if(a<=0) return;
    const car=Game.car; const pulse=0.6+0.4*Math.sin(performance.now()*0.006);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(CONFIG.AB_STEERING==='curl'){
      // hold-to-curl: a single pulsing curl arrow ring (one button, release = straight)
      ctx.save(); ctx.globalAlpha=a*(0.5+0.5*pulse); ctx.lineWidth=6; ctx.lineCap='round'; ctx.strokeStyle=COL.white;
      ctx.beginPath(); ctx.arc(car.x,car.y,52,-0.4,Math.PI*1.25); ctx.stroke();
      const ang=Math.PI*1.25, ex=car.x+Math.cos(ang)*52, ey=car.y+Math.sin(ang)*52;        // arrowhead
      ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex-10,ey-12); ctx.moveTo(ex,ey); ctx.lineTo(ex+12,ey-8); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha=a; inkText(ctx,'HOLD', car.x, car.y+72, Math.round(22*(0.95+0.1*pulse)), COL.white);
      ctx.font='800 13px '+FONT_STACK; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeStyle=COL.ink;
      ctx.strokeText('hold to curl a loop — release to roam', car.x, car.y+96); ctx.fillStyle='#EAF2FF';
      ctx.fillText('hold to curl a loop — release to roam', car.x, car.y+96);
    } else {
      // half-screen steering: arrows on the correct sides
      ctx.globalAlpha=a*(0.55+0.45*pulse);
      inkText(ctx,'◀', car.x-72, car.y, 44, COL.white);
      inkText(ctx,'▶', car.x+72, car.y, 44, COL.white);
      ctx.globalAlpha=a;
      inkText(ctx,'STEER', car.x, car.y+66, Math.round(22*(0.95+0.1*pulse)), COL.white);
      ctx.font='800 13px '+FONT_STACK; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeStyle=COL.ink;
      ctx.strokeText('hold a side to circle a drone', car.x, car.y+90); ctx.fillStyle='#EAF2FF';
      ctx.fillText('hold a side to circle a drone', car.x, car.y+90);
    }
    ctx.globalAlpha=1;
  }

  const _sh={x:0,y:0}; // reused each frame (no allocation)
  function frame(){
    const ctx=Game.ctx, W=Game.W, H=Game.H;
    const playing=(Game.state===Game.STATE.PLAYING||Game.state===Game.STATE.DYING);
    const peak=(Game.state===Game.STATE.PEAKEND);
    // bright candy sky
    ctx.fillStyle=Game.bgGrad||COL.bg; ctx.fillRect(0,0,W,H);
    // ---- world layer: camera zoom-punch + screen shake (HUD stays put) ----
    FX.shakeXY(_sh);
    const z=1+FX.zoom*FX_motionScale();                 // reduce-motion softens the camera punch
    ctx.save();
    ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2+_sh.x, -H/2+_sh.y);

    drawFloor(ctx,W,H, Game.parallaxX, Game.parallaxY);
    drawPreview(ctx,0,0);
    drawCaptureFill(ctx,0,0);
    if(peak) drawPeakEnd(ctx);                          // new-best loop replay fill
    drawTrail(ctx,0,0);
    if(FX.chroma>0.02 && PERF.allowChroma()){           // PERF/reduce-motion gate chroma
      const k=FX.chroma*4; ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.22*FX.chroma;
      ctx.save(); ctx.translate(k,0); drawTrailGhost(ctx,0,0,'rgba(255,0,80,1)'); ctx.restore();
      ctx.save(); ctx.translate(-k,0); drawTrailGhost(ctx,0,0,'rgba(0,210,255,1)'); ctx.restore();
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    }
    drawDrones(ctx,0,0);
    if(playing) drawCar(ctx,0,0);
    Particles.draw(ctx);
    Popups.draw(ctx);
    if(playing) drawHint(ctx,W,H);
    ctx.restore();

    // ---- full-screen overlays (no camera transform) ----
    if(FX.nearShimmer>0.02){ ctx.fillStyle='rgba(255,59,92,'+(FX.nearShimmer*0.12)+')'; ctx.fillRect(0,0,W,H); }
    if(Game.vignette){ ctx.fillStyle=Game.vignette; ctx.fillRect(0,0,W,H); }
    if(playing) drawHUD(ctx,W,H);
    if(peak) drawNewBestRibbon(ctx,W,H);
  }
  // peak-end: the biggest loop fills + a wiping outline trace (a 1s celebratory replay)
  function drawPeakEnd(ctx){
    const pe=Game.peakEnd; if(!pe||pe.n<3) return; const poly=Game.bestLoopPoly, n=Game.bestLoopN;
    const t=clamp(pe.t/pe.dur,0,1);
    ctx.save(); ctx.beginPath(); ctx.moveTo(poly[0].x,poly[0].y);
    for(let i=1;i<n;i++) ctx.lineTo(poly[i].x,poly[i].y); ctx.closePath();
    ctx.fillStyle='rgba(255,176,32,'+(0.30*Math.sin(t*Math.PI))+')'; ctx.fill();
    ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,'+(0.85*(1-t))+')'; ctx.stroke();
    ctx.restore();
  }
  function drawNewBestRibbon(ctx,W,H){
    const pe=Game.peakEnd; const t=clamp(pe.t/pe.dur,0,1);
    const pop=t<0.3? t/0.3 : 1; const sc=0.6+0.4*pop*(1+0.05*Math.sin(performance.now()*0.02));
    ctx.save(); ctx.globalAlpha=clamp(pop*1.4,0,1); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.translate(W/2,H*0.30); ctx.scale(sc,sc);
    ctx.font='900 64px '+FONT_STACK; ctx.lineJoin='round'; ctx.lineWidth=12; ctx.strokeStyle=COL.ink;
    ctx.strokeText('NEW BEST!',0,0); ctx.fillStyle=COL.amber; ctx.fillText('NEW BEST!',0,0);
    ctx.restore();
  }
  function drawTrailGhost(ctx,offX,offY,color){
    const n=Trail.len; if(n<2) return; ctx.lineWidth=CONFIG.TRAIL_WIDTH; ctx.strokeStyle=color; ctx.lineCap='round';
    ctx.beginPath();
    const start=Math.max(1,n-26);
    ctx.moveTo(Trail.get(start-1).x+offX, Trail.get(start-1).y+offY);
    for(let i=start;i<n;i++){ ctx.lineTo(Trail.get(i).x+offX, Trail.get(i).y+offY); }
    ctx.stroke();
  }
  return { frame, drawHeroLoop };
  // Shared "money shot": the near-closed cyan->magenta loop encircling coral drones
  // + 1 amber star, on the ink vignette. Used by the SHARE card (and is the same
  // composition as the favicon / peak-end hero frame). cx,cy,scale in target space.
  function drawHeroLoop(g, cx, cy, R){
    // the lasso loop (open near the top-right "mouth"), cyan->magenta with ink shadow
    g.save(); g.lineCap='round'; g.lineJoin='round';
    const grad=g.createLinearGradient(cx-R,cy-R,cx+R,cy+R); grad.addColorStop(0,COL.cyan); grad.addColorStop(1,COL.magenta);
    function loopPath(){ g.beginPath(); g.arc(cx,cy,R, -0.35, Math.PI*2-0.35); }
    g.lineWidth=R*0.20; g.strokeStyle=COL.ink; loopPath(); g.stroke();         // ink shadow
    g.lineWidth=R*0.13; g.strokeStyle=grad; loopPath(); g.stroke();             // candy core
    g.lineWidth=R*0.045; g.strokeStyle='rgba(255,255,255,0.8)'; loopPath(); g.stroke(); // sheen
    g.restore();
    // 3 coral drones + 1 amber star nestled inside, mid hit-stop
    const ds=R*0.5;
    const spots=[[-0.42,-0.18],[0.30,-0.30],[-0.10,0.36],[0.40,0.22]];
    for(let i=0;i<4;i++){ const sp = i===1?Sprites.droneBonus:Sprites.drone;
      const x=cx+spots[i][0]*R, y=cy+spots[i][1]*R; g.drawImage(sp, x-ds/2, y-ds/2, ds, ds); }
  }
})();

/* ============================== [SHARE] ==================================== */
/* Offscreen-renders a branded score-card PNG (the money-shot loop + score + rank
   + Drift Lasso wordmark) and offers native share or download. Heavy drawing is
   done lazily here, OFF the hot path — only when the player taps SHARE. */
const SHARE=(()=>{
  function drawCard(info){
    const S=1080, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
    // candy sky + ink vignette (matches the game's art direction)
    const sky=g.createLinearGradient(0,0,0,S); sky.addColorStop(0,'#5AD1FF'); sky.addColorStop(1,'#6A5BFF'); g.fillStyle=sky; g.fillRect(0,0,S,S);
    const vig=g.createRadialGradient(S/2,S*0.40,S*0.18, S/2,S*0.5,S*0.82); vig.addColorStop(0,'rgba(36,26,77,0)'); vig.addColorStop(1,'rgba(36,26,77,0.55)'); g.fillStyle=vig; g.fillRect(0,0,S,S);
    // confetti just starting
    const cc=COL.confetti; for(let i=0;i<70;i++){ g.save(); g.translate(crand(0,S),crand(0,S*0.8)); g.rotate(crand(0,TAU));
      g.fillStyle=cc[(Math.random()*cc.length)|0]; g.globalAlpha=0.85; g.fillRect(-7,-12,14,24); g.restore(); }
    g.globalAlpha=1;
    // hero loop (the reachable key-art frame)
    Render.drawHeroLoop(g, S/2, S*0.40, S*0.27);
    // score (big, tabular) + label
    g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round';
    g.font='900 64px '+FONT_STACK; g.lineWidth=12; g.strokeStyle=COL.ink; g.strokeText('SCORE', S/2, S*0.70); g.fillStyle='#EAF2FF'; g.fillText('SCORE', S/2, S*0.70);
    g.font='900 170px '+FONT_STACK; g.lineWidth=20; g.strokeStyle=COL.ink; g.strokeText(String(info.score), S/2, S*0.80); g.fillStyle=COL.magenta; g.fillText(String(info.score), S/2, S*0.80);
    // rank line
    if(info.rankText){ g.font='900 44px '+FONT_STACK; g.lineWidth=9; g.strokeStyle=COL.ink; g.strokeText(info.rankText, S/2, S*0.885); g.fillStyle=COL.amber; g.fillText(info.rankText, S/2, S*0.885); }
    // wordmark
    g.font='900 60px '+FONT_STACK; g.letterSpacing='2px';
    g.lineWidth=12; g.strokeStyle=COL.ink; g.strokeText('DRIFT LASSO', S/2, S*0.955); g.fillStyle=COL.cyan; g.fillText('DRIFT LASSO', S/2, S*0.955);
    return c;
  }
  function download(c){ try{ const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='drift-lasso-'+(Game.score|0)+'.png'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} }
  function share(info){
    let c; try{ c=drawCard(info); }catch(e){ return; }
    const finish=(blob)=>{
      try{
        const file = (window.File&&blob)? new File([blob],'drift-lasso.png',{type:'image/png'}) : null;
        if(navigator.share && file && navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({ files:[file], title:'Drift Lasso', text:'I scored '+info.score+' in Drift Lasso — beat me!' }).catch(()=>download(c));
        } else download(c);
      }catch(e){ download(c); }
    };
    if(c.toBlob) c.toBlob(finish,'image/png'); else finish(null);
  }
  return { drawCard, share };
})();

/* =============================== [UI] ====================================== */
/* DOM overlays. Big touch targets, away from edges, no overlap on phone ratios. */
const UI=(()=>{
  const $=(id)=>document.getElementById(id);
  const overEl=$('over'), shopEl=$('shop'), boardEl=$('board'), setEl=$('settings'), toastEl=$('toast');
  let toastTimer=null, lastCard=null;

  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1700);
  }
  function hideAll(){ [overEl,shopEl,boardEl,setEl].forEach(e=>e.classList.remove('show')); }

  // objectives panel (lives in the Garage now — game-over stays clean)
  function renderGoals(){
    const wrap=$('goals'); if(!wrap) return; wrap.innerHTML='';
    Objectives.list().forEach(ob=>{
      const d=Objectives.DEFS[ob.key]; const done=ob.done;
      const el=document.createElement('div'); el.className='goal'+(done?' done':'');
      const pct=Math.min(100, Math.round(ob.prog/ob.t*100));
      el.innerHTML='<span class="gicon">'+d.icon+'</span>'+
        '<span class="gtext"><span class="gname">'+d.label(ob.t)+'</span>'+
        (done?'':'<span class="gbar"><i style="width:'+pct+'%"></i></span>')+'</span>'+
        '<span class="greward">'+(done?'✓ +'+d.reward:'+'+d.reward)+'</span>';
      wrap.appendChild(el);
    });
  }

  // ---------- rank nudge: always a reachable next target ----------
  function rankText(rank){
    if(!rank) return '';
    if(rank.rank===1) return '#1 — top of the week! 🏆';
    const gap = rank.ahead ? Math.max(1, rank.ahead.score - rank.you) : 0;
    return '#'+rank.rank+' of '+rank.total + (rank.ahead? ('  ·  '+gap+' from #'+(rank.rank-1)) : '');
  }
  // CLEAN game-over: logo, score, account spine, rank nudge + teaser, then buttons.
  function showGameOver(info){
    lastCard=info;
    $('over-score').textContent=info.score;
    $('over-best').textContent=info.best;
    $('over-lvl').textContent='LV '+(info.level||1);
    $('over-newbest').classList.toggle('hidden', !info.isBest);
    $('over-coinTotal').textContent=Storage.data.coins;
    $('over-coins').textContent='+'+info.coins;
    // account spine
    const lp=META.levelProgress();
    $('over-title').textContent=META.title();
    $('over-acctlv').textContent='ACCT LV '+lp.L;
    $('over-xpfill').style.width=Math.round(lp.frac*100)+'%';
    // weekly rank nudge (always a reachable next target)
    const rt=rankText(info.rank);
    $('over-rank').innerHTML = rt ? ('This week: <b>'+rt+'</b>') : '';
    // Zeigarnik teaser (closest goal) — pulls an immediate restart
    const te=info.teaser||{obj:''};
    $('over-teaser').innerHTML = te.obj ? ('Almost: <b>'+te.obj+'</b>') : '';
    // account level-up beat
    if(info.meta && info.meta.leveledTo){ toast('ACCOUNT LV '+info.meta.to+'!  '+META.title()); }
    $('btn-revive').classList.toggle('hidden', info.canRevive===false);
    $('btn-double').removeAttribute('disabled');
    hideAll(); overEl.classList.add('show');
  }

  // ---------- shop / garage ----------
  function catOf(item){ return item.id.indexOf('car_')===0?'car' : item.id.indexOf('pow_')===0?'power' : 'trail'; }
  function equippedId(cat){ return cat==='car'?Storage.data.equippedCar : cat==='power'?Storage.data.equippedPower : Storage.data.equippedTrail; }
  function setEquipped(cat,id){ if(cat==='car')Storage.data.equippedCar=id; else if(cat==='power')Storage.data.equippedPower=id; else Storage.data.equippedTrail=id; }
  // STYLE-AWARE preview so each skin looks unmistakably different in the garage.
  function renderTrailPreview(cv, item){
    const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height); g.lineCap='round'; g.lineJoin='round';
    const style=item.style||(item.custom?(Storage.data.customStyle||'solid'):'solid');
    const A=item.a||Storage.data.customA||'#00E5FF', B=item.b||Storage.data.customB||'#FF49C3';
    const rainbow=(style==='rainbow'), W=cv.width, H=cv.height, steps=30;
    const px=t=>9+t*(W-18), py=t=>H/2+Math.sin(t*Math.PI*2)*11;
    const col=t=> rainbow?('hsl('+(t*300)+',100%,60%)'):rgbStr(mixRgb(hexToRgb(A),hexToRgb(B),t),1);
    if(style==='pixel'){ for(let i=0;i<steps;i++){ const t=i/(steps-1); g.fillStyle=COL.ink; g.fillRect(px(t)-5,py(t)-5,10,10); g.fillStyle=col(t); g.fillRect(px(t)-4,py(t)-4,8,8);} return; }
    if(style==='stars'){ for(let i=0;i<steps;i+=2){ const t=i/(steps-1),x=px(t),y=py(t),r=5; g.fillStyle=col(t); g.beginPath();
      for(let k=0;k<10;k++){const ang=k*Math.PI/5-Math.PI/2,rad=(k&1)?r*0.42:r,sx=x+Math.cos(ang)*rad,sy=y+Math.sin(ang)*rad;k?g.lineTo(sx,sy):g.moveTo(sx,sy);} g.closePath(); g.fill(); } return; }
    for(let i=1;i<steps;i++){ const t=i/(steps-1), pt=(i-1)/(steps-1);
      const x=px(t),y=py(t),x0=px(pt),y0=py(pt);
      g.lineWidth=9; g.strokeStyle=COL.ink; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x,y); g.stroke();   // ink
      let c=col(t), dash=false, yy=y, yy0=y0;
      if(style==='stripes') c=((i>>1)&1)?B:A;
      else if(style==='dashed') dash=true;
      else if(style==='electric'){ yy=y+Math.sin(i*1.6)*4; yy0=y0+Math.sin((i-1)*1.6)*4; }
      if(style==='glow'||style==='comet'||style==='flame'){ g.save(); g.globalAlpha=0.45; g.lineWidth=13; g.strokeStyle=c; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x,y); g.stroke(); g.restore(); }
      g.lineWidth=6; g.strokeStyle=c; if(dash) g.setLineDash([7,6]);
      g.beginPath(); g.moveTo(x0,yy0); g.lineTo(x,yy); g.stroke(); if(dash) g.setLineDash([]);
    }
  }
  function renderCarPreview(cv, item){
    const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height); const cx=cv.width/2, cy=cv.height/2;
    g.beginPath(); g.arc(cx,cy,16,0,TAU); g.fillStyle=COL.ink; g.fill();
    g.beginPath(); g.arc(cx,cy,13,0,TAU); g.fillStyle=item.color; g.fill();
    g.beginPath(); g.ellipse(cx-4,cy-5,5,3,-0.6,0,TAU); g.fillStyle='rgba(255,255,255,0.9)'; g.fill();
  }
  function buildShop(){
    const grid=$('shop-grid'); grid.innerHTML='';
    $('shop-coins').textContent=Storage.data.coins;
    renderGoals();   // current objectives live here now
    // collection meter + active SET bonus + account title (the meta-spine surfaced)
    const col=META.collection(), set=META.activeSet();
    const meta=document.createElement('div'); meta.className='shop-sec'; meta.style.color='var(--ink)';
    meta.innerHTML='🏆 '+META.title()+'  ·  Collection '+col.owned+'/'+col.total+(set?('  ·  SET '+set.name+' ✓'):'');
    grid.appendChild(meta);
    section(grid,'Trails',Cosmetics.TRAILS); section(grid,'Cars',Cosmetics.CARS); section(grid,'Powers',Cosmetics.POWERS);
  }
  function section(grid,title,items){
    const h=document.createElement('div'); h.className='shop-sec'; h.textContent=title; grid.appendChild(h);
    items.forEach(item=>{ if(item.cost<0 && !Cosmetics.isUnlocked(item.id)) return; grid.appendChild(card(item)); }); // hide prestige-only until earned
  }
  const PAL=['#00E5FF','#FF49C3','#FFD23F','#7CFF6B','#FF8A3D','#B16BFF','#FFFFFF','#FF3B5C'];
  // The CUSTOM trail is the power-user option: TWO colours AND a chosen STYLE — so
  // it's far more than the colour-only skins were, and distinct from every preset.
  function customCard(){
    const equipped=Storage.data.equippedTrail==='custom';
    const el=document.createElement('div'); el.className='skin skin-wide'+(equipped?' equipped':'');
    const badge=document.createElement('div'); badge.className='rar'; badge.textContent='CUSTOM'; badge.style.color=Cosmetics.RARITY.legendary.col; badge.style.background='#FFF7EC'; el.appendChild(badge);
    const cv=document.createElement('canvas'); cv.width=130; cv.height=46; el.appendChild(cv);
    setTimeout(()=>renderTrailPreview(cv,{custom:true,a:Storage.data.customA,b:Storage.data.customB,style:Storage.data.customStyle}),0);
    const name=document.createElement('div'); name.className='name'; name.textContent='Custom — your own design'; el.appendChild(name);
    // colour pickers
    ['customA','customB'].forEach(ch=>{
      const row=document.createElement('div'); row.className='swatches';
      PAL.forEach(c=>{ const sw=document.createElement('span'); sw.className='sw'+(Storage.data[ch]===c?' on':''); sw.style.background=c;
        sw.addEventListener('click',(e)=>{ e.stopPropagation(); Storage.data[ch]=c; Storage.data.equippedTrail='custom'; Storage.save(); Audio.tick(); buildShop(); });
        row.appendChild(sw); });
      el.appendChild(row);
    });
    // STYLE chips — the key upgrade: custom isn't just colours any more
    const sr=document.createElement('div'); sr.className='style-row';
    Cosmetics.CUSTOM_STYLES.forEach(st=>{ const chip=document.createElement('span'); chip.className='stylechip'+(Storage.data.customStyle===st?' on':''); chip.textContent=st;
      chip.addEventListener('click',(e)=>{ e.stopPropagation(); Storage.data.customStyle=st; Storage.data.equippedTrail='custom'; Storage.save(); Audio.tick(); buildShop(); });
      sr.appendChild(chip); });
    el.appendChild(sr);
    const state=document.createElement('div'); state.className='state '+(equipped?'eq':'un'); state.textContent=equipped?'EQUIPPED':'TAP TO EQUIP'; el.appendChild(state);
    el.addEventListener('click',()=>{ Storage.data.equippedTrail='custom'; Storage.save(); Audio.tick(); buildShop(); });
    return el;
  }
  function card(item){
    if(item.id==='custom') return customCard();
    const cat=catOf(item), unlocked=Cosmetics.isUnlocked(item.id), equipped=equippedId(cat)===item.id;
    const el=document.createElement('div'); el.className='skin'+(equipped?' equipped':'')+(unlocked?'':' locked');
    // rarity corner badge
    const rar=Cosmetics.RARITY[item.rarity||'common']; const rb=document.createElement('div'); rb.className='rar'; rb.textContent=rar.label; rb.style.color=rar.col; rb.style.background='#FFF7EC'; el.appendChild(rb);
    if(cat==='power'){ const p=document.createElement('div'); p.className='pico'; p.textContent=item.pico; el.appendChild(p); }
    else { const cv=document.createElement('canvas'); cv.width=130; cv.height=46; el.appendChild(cv); setTimeout(()=>{ cat==='car'?renderCarPreview(cv,item):renderTrailPreview(cv,item); },0); }
    const name=document.createElement('div'); name.className='name'; name.textContent=item.name; el.appendChild(name);
    if(cat==='power' && item.desc){ const ds=document.createElement('div'); ds.className='state un'; ds.textContent=item.desc; el.appendChild(ds); }
    const state=document.createElement('div');
    if(equipped){ state.className='state eq'; state.textContent='EQUIPPED'; }
    else if(unlocked){ state.className='state un'; state.textContent='TAP TO EQUIP'; }
    else { const afford=Cosmetics.canAfford(item); state.className='cost '+(afford?'afford':'cant'); state.innerHTML='<span class="mini-coin"></span>'+item.cost+(afford?'  ·  BUY':''); }
    el.appendChild(state);
    el.addEventListener('click',()=>onTap(item,cat,unlocked));
    return el;
  }
  // COINS-ONLY purchase engine: an item is gated by its price and the coins are
  // actually spent. No free unlocks. (Already-owned -> equip; can't afford -> tell them.)
  function onTap(item,cat,unlocked){
    if(unlocked){ setEquipped(cat,item.id); Storage.save(); Audio.tick(); buildShop(); return; }
    if(item.cost<0) return;                                  // prestige-only: not buyable here
    if(Storage.data.coins>=item.cost){
      Storage.data.coins-=item.cost; Cosmetics.unlock(item.id); setEquipped(cat,item.id);
      Storage.save(); Audio.coin(); toast('Unlocked '+item.name+'!  −'+item.cost+' coins'); buildShop();
    } else {
      Audio.tick(); toast('Need '+(item.cost-Storage.data.coins)+' more coins for '+item.name);
    }
  }
  function backToCard(){ if(Game.state===Game.STATE.DEAD) overEl.classList.add('show'); }
  function openShop(){ buildShop(); hideAll(); shopEl.classList.add('show'); }
  function closeShop(){ shopEl.classList.remove('show'); backToCard(); }

  // ---------- leaderboard (weekly) ----------
  function renderBoard(){
    const list=$('board-list'); list.innerHTML='';
    const rows = LEADER.fetch(LEADER.weekKey()) || [];
    if(!rows.length){ const e=document.createElement('div'); e.className='near'; e.textContent='Play a run to join this week’s board!'; list.appendChild(e); return; }
    rows.forEach((r,i)=>{ const el=document.createElement('div'); el.className='brow'+(r.me?' me':'');
      el.innerHTML='<span class="rank">#'+(i+1)+'</span><span class="who">'+(r.me?'You':'Rival')+'</span><span class="sc">'+r.score+'</span>';
      list.appendChild(el); });
  }
  function openBoard(){ hideAll(); renderBoard(); boardEl.classList.add('show'); }
  function closeBoard(){ boardEl.classList.remove('show'); backToCard(); }

  // ---------- settings (accessibility + sound + prestige) ----------
  function syncSettings(){
    const s=Storage.data.settings||{};
    $('set-cb').textContent=s.colorblind?'ON':'OFF'; $('set-cb').classList.toggle('on',!!s.colorblind);
    $('set-rm').textContent=s.reduceMotion?'ON':'OFF'; $('set-rm').classList.toggle('on',!!s.reduceMotion);
    const muted=Audio.isMuted(); $('set-mute').textContent=muted?'OFF':'ON'; $('set-mute').classList.toggle('on',!muted);
    $('set-info').textContent='Tier: '+PERF.tier.toUpperCase()+'  ·  Account: '+META.title();
    $('btn-prestige').classList.toggle('hidden', !META.canPrestige());
  }
  function openSettings(){ hideAll(); syncSettings(); setEl.classList.add('show'); }
  function closeSettings(){ setEl.classList.remove('show'); backToCard(); }

  // ---------- share ----------
  function doShare(){
    if(!lastCard){ return; }
    const rt=rankText(lastCard.rank);
    SHARE.share({ score:lastCard.score, rankText: rt? rt.split('·')[0].trim() : '' });
    toast('Score card ready!');
  }

  // ---------- run flow ----------
  function startRun(opts){ hideAll(); Game.fullReset(opts||{}); }
  function playAgain(){ Audio.tick(); AdSDK.showInterstitial(()=>{ startRun(); }); }

  function wire(){
    $('btn-again').addEventListener('click',playAgain);
    $('btn-share').addEventListener('click',doShare);
    $('btn-board').addEventListener('click',openBoard);
    $('btn-board-close').addEventListener('click',closeBoard);
    $('btn-settings').addEventListener('click',openSettings);
    $('btn-settings-close').addEventListener('click',closeSettings);
    $('btn-openshop').addEventListener('click',openShop);
    $('btn-shop').addEventListener('click',()=>{ Audio.unlock(); openShop(); });
    $('btn-shop-close').addEventListener('click',closeShop);
    // settings toggles (persist + visibly work)
    $('set-cb').addEventListener('click',()=>{ const s=Storage.data.settings; s.colorblind=!s.colorblind; Storage.save(); Audio.tick(); syncSettings(); });
    $('set-rm').addEventListener('click',()=>{ const s=Storage.data.settings; s.reduceMotion=!s.reduceMotion; Storage.save(); Audio.tick(); syncSettings(); });
    $('set-mute').addEventListener('click',()=>{ Audio.unlock(); const m=!Audio.isMuted(); Audio.setMuted(m); Storage.set('muted',m); $('btn-mute').innerHTML=m?'&#128263;':'&#128266;'; syncSettings(); });
    $('btn-prestige').addEventListener('click',()=>{ if(META.prestige()){ Audio.accountLevel(); toast('PRESTIGE! Permanent badge + Prestige trail unlocked'); syncSettings(); } });
    $('btn-revive').addEventListener('click',()=>{
      const btn=$('btn-revive');
      AdSDK.showRewarded(
        ()=>{ overEl.classList.remove('show'); Game.revive(); btn.classList.add('hidden'); },
        (err)=>{ toast('Ad unavailable — play again'); } // revive can't be partial; explain + don't soft-lock
      );
    });
    $('btn-double').addEventListener('click',()=>{
      const btn=$('btn-double');
      AdSDK.showRewarded(
        ()=>{ const add=coinsAddDouble(1.0); toast('+'+add+' bonus coins'); btn.setAttribute('disabled','true'); },
        ()=>{ const add=coinsAddDouble(CONFIG.DOUBLE_COINS_PARTIAL-1); toast('Ad unavailable — +'+add+' coins anyway'); btn.setAttribute('disabled','true'); }
      );
    });
    $('btn-mute').addEventListener('click',()=>{
      Audio.unlock(); const m=!Audio.isMuted(); Audio.setMuted(m); Storage.set('muted',m);
      $('btn-mute').innerHTML=m?'&#128263;':'&#128266;';
    });
  }
  function coinsAddDouble(mult){
    // doubles THIS run's earned coins (already added once at game over)
    const base=parseInt($('over-coins').textContent.replace('+',''))||0;
    const add=Math.max(1,Math.round(base*mult));
    Storage.data.coins+=add; Storage.save();
    $('over-coinTotal').textContent=Storage.data.coins;   // reflect the new balance live
    return add;
  }

  return { toast, showGameOver, openShop, closeShop, openBoard, openSettings, startRun, wire, buildShop, _buy:onTap };
})();

/* ============================== [LOOP] ===================================== */
(function boot(){
  Sprites.build();
  Storage.load();
  // A/B: allow ?ab=curl (or ?ab=half) to flip the steering scheme.
  try{ const q=new URLSearchParams(location.search).get('ab');
    if(q){ if(/curl/.test(q)) CONFIG.AB_STEERING='curl'; if(/half/.test(q)) CONFIG.AB_STEERING='half'; } }catch(e){}
  // restore mute preference
  if(Storage.data.muted){ /* applied on unlock */ }
  Game.resize();
  UI.wire();
  // mute button initial glyph
  document.getElementById('btn-mute').innerHTML=Storage.data.muted?'&#128263;':'&#128266;';

  Objectives.seed();   // create the first 3 goals if none exist
  // endowed progress: on a brand-new save, gift coins ~60% toward the first skin
  if(!Storage.data.endowed){
    const first=Cosmetics.nextLocked();
    if(first){ Storage.data.coins=Math.max(Storage.data.coins, Math.ceil(first.cost*0.6)); }
    Storage.data.endowed=true; Storage.save();
  }

  // resume audio + apply mute on the first interaction (autoplay-safe)
  Input.onFirstInteraction(()=>{ Audio.unlock(); if(Storage.data.muted) Audio.setMuted(true); Audio.resume(); });

  // lifecycle: pause on tab-away, resume cleanly (no dt spike)
  let hidden=false;
  document.addEventListener('visibilitychange',()=>{
    hidden=document.hidden;
    if(hidden){ Audio.setDrift(0,false); Audio.setMusic(false); }
    else { lastT=performance.now(); if(Game.state===Game.STATE.PLAYING) Audio.setMusic(true); Audio.resume(); }
  });
  window.addEventListener('resize',()=>Game.resize());
  window.addEventListener('orientationchange',()=>setTimeout(()=>Game.resize(),120));

  // start: straight into play — no menu, no logo wall (logo lives on game-over)
  Game.fullReset();

  // fixed-timestep update, decoupled render
  const STEP=1/60; let acc=0, lastT=performance.now();
  function tick(now){
    requestAnimationFrame(tick);
    if(hidden) { lastT=now; return; }
    let dt=(now-lastT)/1000; lastT=now;
    if(dt>0.25) dt=0.25;                 // clamp huge gaps (tab return / breakpoints)
    PERF.sample(dt);                     // one-time device-tier probe over the first ~2s (visual only)
    FX.tickRealtime(dt);                 // hit-stop timer runs in real time (~100ms micro-pause)
    dt*=FX.timeScale();                  // then apply the slow-mo to the sim
    acc+=dt;
    let steps=0;
    while(acc>=STEP && steps<5){ Game.update(STEP); acc-=STEP; steps++; }
    if(steps===5) acc=0;                 // avoid spiral of death on weak hardware
    Render.frame();
  }
  requestAnimationFrame(tick);

  // expose for SDK integration + live tuning + the dev determinism harness (Game.selfTest)
  window.DriftLasso={ CONFIG, Storage, AdSDK, Audio, Game, Render, Cosmetics, RNG, LEADER, META, PERF, SHARE, UI,
    selfTest:()=>Game.selfTest() };
})();
</script>
