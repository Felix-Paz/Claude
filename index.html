<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Particle Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    user-select: none;
  }

  /* Hidden video used as MediaPipe input */
  #videoEl {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* Three.js canvas fills the screen */
  #threeCanvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
  }

  /* ── HUD overlay ── */
  #hud {
    position: fixed;
    top: 16px; right: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }

  .hud-card {
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 10px 14px;
    backdrop-filter: blur(12px);
    font-size: 12px;
    line-height: 1.7;
    min-width: 180px;
  }

  .hud-card label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #aaa;
    margin-bottom: 2px;
  }

  .hud-card input[type=range] {
    width: 100%;
    accent-color: #7df;
    cursor: pointer;
  }

  #fps {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    color: #7df;
  }

  #status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(255,255,255,.45);
    letter-spacing: .06em;
    pointer-events: none;
    z-index: 10;
    transition: opacity .5s;
  }
</style>
</head>
<body>

<!-- Hidden webcam feed -->
<video id="videoEl" autoplay playsinline muted></video>

<!-- HUD -->
<div id="hud">
  <div class="hud-card">
    <div id="fps">FPS: --</div>
  </div>
  <div class="hud-card">
    <label>Particles <span id="pCountVal">2000</span></label>
    <input id="pCount" type="range" min="500" max="5000" step="100" value="2000">
    <label style="margin-top:6px">Glow <span id="glowVal">1.4</span></label>
    <input id="glow" type="range" min="0.2" max="3" step="0.1" value="1.4">
    <label style="margin-top:6px">String Reach <span id="reachVal">0.25</span></label>
    <input id="reach" type="range" min="0.05" max="0.6" step="0.01" value="0.25">
  </div>
</div>

<div id="status">Allow camera access to begin · move your hands</div>

<!-- ───────────────────── CDN imports ───────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/postprocessing/ShaderPass.js"></script>

<!-- MediaPipe Hands via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<canvas id="threeCanvas"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════
//  HAND PARTICLE FIELD  —  single-file, no build tools
//  Architecture:
//    1. Three.js scene + UnrealBloom post-processing
//    2. Particle system (BufferGeometry, custom shader)
//    3. MediaPipe Hands → fingertip 3-D positions
//    4. Physics: attraction / repulsion / pinch collapse-explode
//    5. Background fog noise (fullscreen quad shader)
// ═══════════════════════════════════════════════════════════════

// ── Config (sliders write here live) ──────────────────────────
const CFG = {
  particleCount : 2000,
  bloomStrength : 1.4,
  reachRadius   : 0.25,   // normalised NDC radius that fingertips affect
};

// ── Utility ────────────────────────────────────────────────────
const lerp = (a, b, t) => a + (b - a) * t;

// ══════════════════════════════════════════════════════════════
//  1. THREE.JS SETUP
// ══════════════════════════════════════════════════════════════
const canvas   = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// Orthographic camera so NDC coords map cleanly to screen
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;

// ── Post-processing: Bloom ─────────────────────────────────────
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));

const bloomPass = new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  CFG.bloomStrength,  // strength
  0.5,                // radius
  0.1                 // threshold
);
composer.addPass(bloomPass);

// ══════════════════════════════════════════════════════════════
//  2. BACKGROUND — subtle animated noise quad
// ══════════════════════════════════════════════════════════════
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 1.0, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;

    // simple hash noise
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i),         hash(i+vec2(1,0)), f.x),
                 mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)), f.x), f.y);
    }

    void main() {
      vec2 uv = vUv * 3.5 + uTime * 0.012;
      float n = noise(uv) * noise(uv * 2.1 + 1.7) * 0.06;
      gl_FragColor = vec4(vec3(n * 0.18, n * 0.25, n * 0.4), 1.0);
    }
  `,
});
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgMesh.renderOrder = -1;
scene.add(bgMesh);

// ══════════════════════════════════════════════════════════════
//  3. PARTICLE SYSTEM
// ══════════════════════════════════════════════════════════════

/*  Each particle lives in NDC space: x∈[-1,1], y∈[-1,1], z=0
    We store position, velocity, home (rest) position, and a
    colour seed for hue variation.                              */

let PCOUNT = CFG.particleCount;

// Typed arrays — rebuilt when slider changes count
let positions, velocities, homes, colorSeeds, sizes;
let particleGeo, particleMat, particleMesh;

function buildParticles(count) {
  // Cleanup previous mesh
  if (particleMesh) {
    scene.remove(particleMesh);
    particleGeo.dispose();
    particleMat.dispose();
  }

  PCOUNT = count;
  positions  = new Float32Array(PCOUNT * 3);
  velocities = new Float32Array(PCOUNT * 3);  // vx, vy (vz unused)
  homes      = new Float32Array(PCOUNT * 2);  // rest positions
  colorSeeds = new Float32Array(PCOUNT);
  sizes      = new Float32Array(PCOUNT);

  // Distribute rest positions in a loose grid with randomness
  const cols = Math.ceil(Math.sqrt(PCOUNT * (window.innerWidth / window.innerHeight)));
  const rows = Math.ceil(PCOUNT / cols);

  for (let i = 0; i < PCOUNT; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);

    const hx = lerp(-0.95, 0.95, col / (cols - 1)) + (Math.random() - 0.5) * 0.08;
    const hy = lerp(-0.95, 0.95, row / (rows - 1)) + (Math.random() - 0.5) * 0.08;

    homes[i * 2]     = hx;
    homes[i * 2 + 1] = hy;

    positions[i * 3]     = hx + (Math.random() - 0.5) * 0.3;
    positions[i * 3 + 1] = hy + (Math.random() - 0.5) * 0.3;
    positions[i * 3 + 2] = 0;

    colorSeeds[i] = Math.random();
    sizes[i]      = 1.5 + Math.random() * 3.0;
  }

  particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position',  new THREE.BufferAttribute(positions,  3));
  particleGeo.setAttribute('colorSeed', new THREE.BufferAttribute(colorSeeds, 1));
  particleGeo.setAttribute('aSize',     new THREE.BufferAttribute(sizes,      1));

  // Custom shader: round sprite with per-particle hue + glow core
  particleMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite:  false,
    blending:    THREE.AdditiveBlending,
    uniforms: {
      uTime:      { value: 0 },
      uPixelRatio:{ value: renderer.getPixelRatio() },
    },
    vertexShader: `
      attribute float colorSeed;
      attribute float aSize;
      varying   float vSeed;
      varying   float vDist;
      uniform   float uPixelRatio;

      void main() {
        vSeed = colorSeed;
        vec4 mvp = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        vDist = length(position.xy);
        gl_Position  = mvp;
        gl_PointSize = aSize * uPixelRatio * (1.0 + vDist * 0.3);
      }
    `,
    fragmentShader: `
      varying float vSeed;
      varying float vDist;
      uniform float uTime;

      // HSL → RGB conversion
      vec3 hsl2rgb(float h, float s, float l) {
        vec3 rgb = clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0, 0.0, 1.0);
        return l + s * (rgb - 0.5) * (1.0 - abs(2.0*l-1.0));
      }

      void main() {
        // Circular soft sprite
        vec2  uv   = gl_PointCoord - 0.5;
        float dist = length(uv);
        if (dist > 0.5) discard;

        float alpha = 1.0 - smoothstep(0.1, 0.5, dist);

        // Hue cycles: cyan → violet → blue dominant
        float hue = mod(vSeed * 0.6 + 0.55 + uTime * 0.015, 1.0);
        vec3  col = hsl2rgb(hue, 0.85, 0.62);

        // Bright hot core
        float core = 1.0 - smoothstep(0.0, 0.18, dist);
        col = mix(col, vec3(0.9, 0.97, 1.0), core * 0.7);

        gl_FragColor = vec4(col * alpha, alpha);
      }
    `,
  });

  particleMesh = new THREE.Points(particleGeo, particleMat);
  scene.add(particleMesh);
}

buildParticles(PCOUNT);

// ══════════════════════════════════════════════════════════════
//  4. HAND TRACKING DATA  (filled by MediaPipe callback)
// ══════════════════════════════════════════════════════════════

/*  fingertip landmark indices in MediaPipe Hands:
    4 = thumb tip, 8 = index, 12 = middle, 16 = ring, 20 = pinky  */
const TIP_IDS = [4, 8, 12, 16, 20];

// Smoothed fingertip positions in NDC (x∈[-1,1], y∈[-1,1])
// Up to 2 hands × 5 tips
const MAX_TIPS = 10;
const tipPositions = new Float32Array(MAX_TIPS * 2).fill(9999); // 9999 = inactive
const tipRaw       = new Float32Array(MAX_TIPS * 2).fill(9999);

// Pinch states per hand (0 = open, 1 = pinched)
const pinchState   = [0, 0];
const pinchRaw     = [0, 0];

// How "open" the hand is (spread of tips, 0-1)
const handSpread   = [0, 0];

// Smoothing factor (higher = smoother but more lag)
const SMOOTH_TIPS  = 0.25;
const SMOOTH_PINCH = 0.18;

function updateHandData(results) {
  // Reset all tips inactive
  tipPositions.fill(9999);
  pinchRaw[0] = 0;
  pinchRaw[1] = 0;

  if (!results.multiHandLandmarks) return;

  results.multiHandLandmarks.forEach((landmarks, handIdx) => {
    if (handIdx >= 2) return;

    // Mirror: MediaPipe outputs mirrored x, so we invert to match natural feel
    // (user's right hand appears on right of screen)
    TIP_IDS.forEach((lmIdx, tipIdx) => {
      const lm = landmarks[lmIdx];
      // lm.x ∈ [0,1] left→right (already mirrored by mediapipe selfie mode)
      const nx =  (1 - lm.x) * 2 - 1;  // NDC, keep mirrored feel
      const ny = -(lm.y * 2 - 1);       // flip Y (screen→NDC)

      const slot = handIdx * 5 + tipIdx;
      tipRaw[slot * 2]     = nx;
      tipRaw[slot * 2 + 1] = ny;
    });

    // Pinch = distance between thumb tip (4) and index tip (8)
    const t = landmarks[4], i = landmarks[8];
    const pinchDist = Math.hypot(t.x - i.x, t.y - i.y);
    pinchRaw[handIdx] = pinchDist < 0.06 ? 1 : 0;

    // Spread = mean distance of tips from palm center (landmark 9)
    const palm = landmarks[9];
    let spread = 0;
    TIP_IDS.forEach(id => {
      spread += Math.hypot(landmarks[id].x - palm.x, landmarks[id].y - palm.y);
    });
    handSpread[handIdx] = Math.min(spread / TIP_IDS.length / 0.25, 1);
  });
}

// Smooth tip positions every frame (called in animate loop)
function smoothTips() {
  for (let i = 0; i < MAX_TIPS * 2; i++) {
    if (tipRaw[i] === 9999) {
      tipPositions[i] = 9999;
    } else if (tipPositions[i] === 9999) {
      tipPositions[i] = tipRaw[i];
    } else {
      tipPositions[i] = lerp(tipPositions[i], tipRaw[i], SMOOTH_TIPS);
    }
  }
  for (let h = 0; h < 2; h++) {
    pinchState[h] = lerp(pinchState[h], pinchRaw[h], SMOOTH_PINCH);
  }
}

// ══════════════════════════════════════════════════════════════
//  5. PARTICLE PHYSICS
// ══════════════════════════════════════════════════════════════

const INERTIA      = 0.88;   // velocity damping per frame
const HOME_SPRING  = 0.012;  // pull back toward rest position
const HOME_SPRING_MAX = 0.04;

function tickParticles(dt) {
  const reach2 = CFG.reachRadius * CFG.reachRadius;
  const pos  = positions;
  const vel  = velocities;

  for (let i = 0; i < PCOUNT; i++) {
    const ix = i * 3, iy = i * 3 + 1;
    let px = pos[ix], py = pos[iy];

    // Spring toward home position
    const hx = homes[i * 2], hy = homes[i * 2 + 1];
    const springK = pinchState[0] > 0.5 || pinchState[1] > 0.5
      ? HOME_SPRING * 0.3   // weak spring during pinch for collapse effect
      : HOME_SPRING;

    vel[ix] += (hx - px) * springK;
    vel[iy] += (hy - py) * springK;

    // ── Per-hand interaction ───────────────────────────────
    for (let h = 0; h < 2; h++) {
      const ps = pinchState[h];
      const spread = handSpread[h];

      for (let t = 0; t < 5; t++) {
        const slot = h * 5 + t;
        const tx = tipPositions[slot * 2];
        if (tx === 9999) continue;
        const ty = tipPositions[slot * 2 + 1];

        const dx = px - tx;
        const dy = py - ty;
        const d2 = dx * dx + dy * dy;

        if (d2 < reach2 && d2 > 0.00001) {
          const d  = Math.sqrt(d2);
          const nd = d / CFG.reachRadius;  // 0 near tip, 1 at edge

          // Attraction: pull particles toward tips (string effect)
          const attractF = (1 - nd) * (1 - nd) * 0.018;

          // Repulsion core: push away when very close
          const repelF   = nd < 0.15 ? (0.15 - nd) * 0.12 : 0;

          const forceNet = repelF - attractF;
          const nx = dx / d, ny = dy / d;

          vel[ix] += nx * forceNet;
          vel[iy] += ny * forceNet;

          // Pinch collapse: suck toward centroid of hand
          if (ps > 0.5) {
            vel[ix] -= nx * attractF * ps * 2.5;
            vel[iy] -= ny * attractF * ps * 2.5;
          }

          // Open-hand explode: push outward proportional to spread
          if (spread > 0.7 && ps < 0.2) {
            vel[ix] += nx * 0.008 * spread;
            vel[iy] += ny * 0.008 * spread;
          }
        }
      }
    }

    // Damping
    vel[ix] *= INERTIA;
    vel[iy] *= INERTIA;

    // Clamp velocity for stability
    const spd = Math.hypot(vel[ix], vel[iy]);
    if (spd > 0.04) {
      vel[ix] = (vel[ix] / spd) * 0.04;
      vel[iy] = (vel[iy] / spd) * 0.04;
    }

    // Integrate
    pos[ix] = px + vel[ix];
    pos[iy] = py + vel[iy];

    // Soft boundary wrap — keep particles on screen
    if (pos[ix] >  1.05) pos[ix] = -1.0;
    if (pos[ix] < -1.05) pos[ix] =  1.0;
    if (pos[iy] >  1.05) pos[iy] = -1.0;
    if (pos[iy] < -1.05) pos[iy] =  1.0;
  }

  particleGeo.attributes.position.needsUpdate = true;
}

// ══════════════════════════════════════════════════════════════
//  6. ENERGY STRINGS — line segments from tips to nearby particles
// ══════════════════════════════════════════════════════════════

/*  We draw thin additive lines between each active fingertip and
    the N nearest particles, creating the "magic string" look.   */

const MAX_STRING_SEGS = 2000;
let stringGeo, stringMat, stringMesh;
const stringPositions = new Float32Array(MAX_STRING_SEGS * 6); // 2 verts × 3 comps

function buildStrings() {
  stringGeo = new THREE.BufferGeometry();
  stringGeo.setAttribute('position', new THREE.BufferAttribute(stringPositions, 3));

  stringMat = new THREE.LineBasicMaterial({
    color:     0x88ddff,
    transparent: true,
    opacity:   0.18,
    blending:  THREE.AdditiveBlending,
    depthWrite: false,
    linewidth:  1,
  });

  stringMesh = new THREE.LineSegments(stringGeo, stringMat);
  scene.add(stringMesh);
}
buildStrings();

function updateStrings() {
  let seg = 0;
  const maxReach2 = (CFG.reachRadius * 0.9) ** 2;

  for (let h = 0; h < 2; h++) {
    for (let t = 0; t < 5; t++) {
      const slot = h * 5 + t;
      const tx = tipPositions[slot * 2];
      if (tx === 9999) continue;
      const ty = tipPositions[slot * 2 + 1];

      // Find nearest particles within reach
      for (let i = 0; i < PCOUNT && seg < MAX_STRING_SEGS; i++) {
        const px = positions[i * 3];
        const py = positions[i * 3 + 1];
        const d2 = (px - tx) ** 2 + (py - ty) ** 2;
        if (d2 < maxReach2) {
          const base = seg * 6;
          stringPositions[base]   = tx; stringPositions[base+1] = ty; stringPositions[base+2] = 0;
          stringPositions[base+3] = px; stringPositions[base+4] = py; stringPositions[base+5] = 0;
          seg++;
        }
      }
    }
  }

  // Zero out unused segments (move them offscreen)
  for (let i = seg; i < MAX_STRING_SEGS; i++) {
    const base = i * 6;
    for (let k = 0; k < 6; k++) stringPositions[base + k] = 0;
  }

  stringGeo.setDrawRange(0, seg * 2);
  stringGeo.attributes.position.needsUpdate = true;
}

// ══════════════════════════════════════════════════════════════
//  7. MEDIAPIPE HANDS SETUP
// ══════════════════════════════════════════════════════════════

const videoEl  = document.getElementById('videoEl');
const statusEl = document.getElementById('status');

async function initMediaPipe() {
  const hands = new Hands({
    locateFile: (f) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`,
  });

  hands.setOptions({
    maxNumHands:        2,
    modelComplexity:    1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence:  0.55,
  });

  hands.onResults((results) => {
    updateHandData(results);
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      statusEl.style.opacity = '0';
    } else {
      statusEl.style.opacity = '1';
    }
  });

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
      audio: false,
    });
    videoEl.srcObject = stream;
    await videoEl.play();

    // Drive MediaPipe at ~30 fps using Camera utility
    const mpCam = new Camera(videoEl, {
      onFrame: async () => { await hands.send({ image: videoEl }); },
      width: 640, height: 480,
    });
    mpCam.start();
    statusEl.textContent = 'Show your hands · pinch to collapse · open to explode';
    statusEl.style.opacity = '1';
    setTimeout(() => statusEl.style.opacity = '0', 4000);
  } catch (err) {
    statusEl.textContent = 'Camera access denied — grant permission and reload';
    statusEl.style.opacity = '1';
    console.error(err);
  }
}

// ══════════════════════════════════════════════════════════════
//  8. RENDER LOOP
// ══════════════════════════════════════════════════════════════

let lastTime   = performance.now();
let fpsTimer   = 0;
let frameCount = 0;
const fpsEl    = document.getElementById('fps');

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 16.67, 3); // capped delta, normalized to 60fps
  lastTime = now;

  // FPS counter (update every second)
  frameCount++;
  fpsTimer += now - (now - (now - lastTime));  // just use wall clock
  if (frameCount % 30 === 0) {
    const elapsed = performance.now();
    fpsEl.textContent = `FPS: ${Math.round(1000 / ((elapsed - fpsTimer) || 16))}`;
    fpsTimer = elapsed;
  }

  // Update time uniforms
  const t = now * 0.001;
  bgMat.uniforms.uTime.value      = t;
  particleMat.uniforms.uTime.value = t;

  // Hand smoothing
  smoothTips();

  // Physics
  tickParticles(dt);

  // Energy strings
  updateStrings();

  // Render with bloom
  composer.render();
}

// ── Simpler FPS implementation ─────────────────────────────────
let _fpsLast = performance.now(), _fpsFrames = 0;
function trackFPS(now) {
  _fpsFrames++;
  if (now - _fpsLast >= 500) {
    fpsEl.textContent = `FPS: ${Math.round(_fpsFrames / ((now - _fpsLast) / 1000))}`;
    _fpsFrames = 0;
    _fpsLast   = now;
  }
}

// Override animate with clean version
function animateClean(now) {
  requestAnimationFrame(animateClean);
  const dt = Math.min((now - lastTime) / 16.67, 3);
  lastTime = now;

  trackFPS(now);

  const t = now * 0.001;
  bgMat.uniforms.uTime.value       = t;
  particleMat.uniforms.uTime.value  = t;

  smoothTips();
  tickParticles(dt);
  updateStrings();

  composer.render();
}

// ══════════════════════════════════════════════════════════════
//  9. RESIZE HANDLING
// ══════════════════════════════════════════════════════════════
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.resolution.set(w, h);
  particleMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
}
window.addEventListener('resize', onResize);

// ══════════════════════════════════════════════════════════════
//  10. UI CONTROLS
// ══════════════════════════════════════════════════════════════
const pCountSlider = document.getElementById('pCount');
const pCountVal    = document.getElementById('pCountVal');
const glowSlider   = document.getElementById('glow');
const glowVal      = document.getElementById('glowVal');
const reachSlider  = document.getElementById('reach');
const reachVal     = document.getElementById('reachVal');

pCountSlider.addEventListener('input', () => {
  const v = parseInt(pCountSlider.value);
  pCountVal.textContent = v;
  CFG.particleCount = v;
  buildParticles(v);
});

glowSlider.addEventListener('input', () => {
  const v = parseFloat(glowSlider.value);
  glowVal.textContent = v.toFixed(1);
  CFG.bloomStrength = v;
  bloomPass.strength = v;
});

reachSlider.addEventListener('input', () => {
  const v = parseFloat(reachSlider.value);
  reachVal.textContent = v.toFixed(2);
  CFG.reachRadius = v;
});

// ══════════════════════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════════════════════
initMediaPipe();
requestAnimationFrame(animateClean);
</script>
</body>
</html>
