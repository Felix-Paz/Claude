<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memory Palace Builder — Don't memorize notes. Explore them.</title>
<meta name="description" content="Transform any study material into an explorable 3D memory palace. Built on the Method of Loci, spaced repetition, and 25+ techniques from cognitive science.">
<meta name="theme-color" content="#07040f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🏛️</text></svg>">
<style>
/* ════════════════════════════════════════════════════════════════
   MEMORY PALACE BUILDER
   A single-file memory training platform.
   "Don't memorize notes. Explore them."
   ════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg0: #07040f;
  --bg1: #0d0920;
  --bg2: #151034;
  --glass: rgba(255,255,255,.042);
  --glass2: rgba(255,255,255,.07);
  --line: rgba(255,255,255,.09);
  --line2: rgba(255,255,255,.16);
  --ink: #efeaff;
  --dim: #a79dd6;
  --faint: #6f66a3;
  --gold: #f0c068;
  --gold2: #ffe2a3;
  --gold-deep: #b67e2e;
  --violet: #8b7cf6;
  --violet2: #c4b5fd;
  --teal: #5eead4;
  --rose: #fb7185;
  --green: #4ade80;
  --amber: #fbbf24;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --r: 18px;
  --shadow: 0 24px 70px -18px rgba(0,0,0,.65);
  --tr: .32s cubic-bezier(.22,.9,.3,1);
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg0);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
}
::selection { background: rgba(240,192,104,.32); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; border: 2px solid var(--bg0); }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: var(--gold2); text-decoration: none; }
strong { color: var(--ink); }
em.gold { color: var(--gold); font-style: italic; font-family: var(--serif); }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

/* ── Cosmic backdrop ─────────────────────────────────────────── */
#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.nebula { position: fixed; inset: -20%; z-index: 0; pointer-events: none; opacity: .9; filter: blur(70px);
  background:
    radial-gradient(38% 30% at 12% 18%, rgba(139,124,246,.16), transparent 70%),
    radial-gradient(30% 26% at 86% 12%, rgba(240,192,104,.10), transparent 70%),
    radial-gradient(40% 34% at 78% 86%, rgba(94,234,212,.08), transparent 70%),
    radial-gradient(34% 30% at 18% 88%, rgba(251,113,133,.07), transparent 70%);
  animation: nebulaDrift 60s ease-in-out infinite alternate;
}
@keyframes nebulaDrift { from { transform: translate3d(-1.5%, -1%, 0) scale(1); } to { transform: translate3d(1.5%, 2%, 0) scale(1.06); } }

/* ── App shell ───────────────────────────────────────────────── */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  padding: 22px 16px; gap: 6px;
  background: linear-gradient(180deg, rgba(13,9,32,.85), rgba(7,4,15,.65));
  border-right: 1px solid var(--line);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 6px 8px 20px; }
.brand svg { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 0 14px rgba(240,192,104,.45)); }
.brand-name { font-family: var(--serif); font-size: 17px; line-height: 1.15; letter-spacing: .01em; }
.brand-name em { display: block; font-size: 11.5px; font-style: italic; color: var(--gold); letter-spacing: .06em; }

.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 13px; border-radius: 12px; color: var(--dim);
  font-size: 14.5px; font-weight: 500; letter-spacing: .01em;
  transition: var(--tr); position: relative; text-align: left;
}
.nav-item .ni { font-size: 17px; width: 22px; text-align: center; filter: grayscale(.35) brightness(.9); transition: var(--tr); }
.nav-item:hover { background: var(--glass); color: var(--ink); }
.nav-item:hover .ni { filter: none; transform: translateY(-1px); }
.nav-item.active { background: linear-gradient(135deg, rgba(240,192,104,.14), rgba(139,124,246,.10)); color: var(--gold2); box-shadow: inset 0 0 0 1px rgba(240,192,104,.22); }
.nav-item.active .ni { filter: none; }
.nav-badge { margin-left: auto; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 99px; background: var(--rose); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 12px rgba(251,113,133,.5); }

.side-foot { margin-top: auto; padding: 14px 10px 4px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.side-mini { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--dim); }
.side-mini b { color: var(--gold2); font-weight: 700; }
.xp-rail { height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.xp-rail i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold2)); box-shadow: 0 0 10px rgba(240,192,104,.6); transition: width .6s cubic-bezier(.22,.9,.3,1); }
.lvl-title { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--violet2); }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
  padding: 14px 30px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(7,4,15,.88), rgba(7,4,15,.55));
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
#crumb { font-family: var(--serif); font-size: 16px; color: var(--dim); }
#crumb b { color: var(--ink); font-weight: 600; }
.top-stats { margin-left: auto; display: flex; gap: 9px; align-items: center; }
.top-pill { display: flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--dim); transition: var(--tr); white-space: nowrap; }
.top-pill b { color: var(--ink); }
.top-pill.hot { border-color: rgba(251,191,36,.4); color: var(--amber); background: rgba(251,191,36,.08); }
.top-pill.due { cursor: pointer; }
.top-pill.due:hover { border-color: var(--rose); color: var(--rose); }

#view { padding: 34px 34px 90px; max-width: 1180px; width: 100%; margin: 0 auto; animation: fadeUp .45s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ── Typography ──────────────────────────────────────────────── */
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 10px; }
.eyebrow::after { content: ""; height: 1px; width: 46px; background: linear-gradient(90deg, var(--gold), transparent); }
h1.display { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.08; letter-spacing: -.01em; margin: 14px 0 12px; }
h1.display i { color: var(--gold); }
h2.sect { font-family: var(--serif); font-weight: 500; font-size: clamp(21px, 2.6vw, 28px); margin: 0 0 6px; }
h2.sect i { color: var(--gold); }
.lede { font-size: 16px; color: var(--dim); max-width: 640px; }
.subnote { font-size: 13px; color: var(--faint); }
.sect-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 38px 0 18px; flex-wrap: wrap; }

/* ── Cards, grids, chips ─────────────────────────────────────── */
.card {
  background: linear-gradient(160deg, rgba(255,255,255,.055), rgba(255,255,255,.022));
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 22px; position: relative;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.card.lift { transition: var(--tr); }
.card.lift:hover { transform: translateY(-3px); border-color: var(--line2); box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4.5px 11px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--glass2); border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.chip.t-gold { color: var(--gold2); border-color: rgba(240,192,104,.32); background: rgba(240,192,104,.09); }
.chip.t-violet { color: var(--violet2); border-color: rgba(139,124,246,.35); background: rgba(139,124,246,.10); }
.chip.t-teal { color: var(--teal); border-color: rgba(94,234,212,.3); background: rgba(94,234,212,.08); }
.chip.t-rose { color: var(--rose); border-color: rgba(251,113,133,.32); background: rgba(251,113,133,.08); }

.whychip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--violet2); background: rgba(139,124,246,.12); border: 1px dashed rgba(139,124,246,.45); cursor: pointer; transition: var(--tr); }
.whychip:hover { background: rgba(139,124,246,.22); transform: translateY(-1px); }

.kbd { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.08); border: 1px solid var(--line2); border-bottom-width: 2px; color: var(--dim); }

/* ── Buttons ─────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 22px; border-radius: 13px; font-size: 14.5px; font-weight: 700; letter-spacing: .01em;
  background: linear-gradient(135deg, var(--gold2), var(--gold) 45%, var(--gold-deep));
  color: #241503; transition: var(--tr); position: relative; overflow: hidden;
  box-shadow: 0 10px 26px -10px rgba(240,192,104,.55), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -10px rgba(240,192,104,.7), inset 0 1px 0 rgba(255,255,255,.5); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: var(--glass2); color: var(--ink); border: 1px solid var(--line2); box-shadow: none; }
.btn.ghost:hover { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.26); }
.btn.violet { background: linear-gradient(135deg, #c4b5fd, #8b7cf6 50%, #6b5ce0); color: #16103a; box-shadow: 0 10px 26px -10px rgba(139,124,246,.6); }
.btn.danger { background: rgba(251,113,133,.12); color: var(--rose); border: 1px solid rgba(251,113,133,.4); box-shadow: none; }
.btn.small { padding: 8px 15px; font-size: 13px; border-radius: 10px; }
.btn.big { padding: 16px 30px; font-size: 16px; border-radius: 16px; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); color: var(--dim); font-size: 15px; transition: var(--tr); }
.iconbtn:hover { color: var(--ink); border-color: var(--line2); background: var(--glass2); }

/* ── Forms ───────────────────────────────────────────────────── */
.label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 7px 2px; }
.input, .textarea, .select {
  width: 100%; padding: 12px 15px; border-radius: 12px;
  background: rgba(0,0,0,.30); border: 1px solid var(--line2); color: var(--ink);
  font-size: 14.5px; transition: var(--tr); appearance: none;
}
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: rgba(240,192,104,.6); box-shadow: 0 0 0 3px rgba(240,192,104,.14); background: rgba(0,0,0,.42); }
.textarea { min-height: 150px; resize: vertical; line-height: 1.6; font-family: var(--sans); }
.select { background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 19px) 55%, calc(100% - 14px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 38px; }
.select option { background: var(--bg1); color: var(--ink); }
.field { margin-bottom: 16px; }
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 2; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid var(--line2); transition: var(--tr); }
.switch i::after { content: ""; position: absolute; top: 2px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--dim); transition: var(--tr); }
.switch input:checked + i { background: rgba(240,192,104,.3); border-color: rgba(240,192,104,.5); }
.switch input:checked + i::after { left: 22px; background: var(--gold); box-shadow: 0 0 10px rgba(240,192,104,.7); }

/* ── Hero ────────────────────────────────────────────────────── */
.hero { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,.85fr); gap: 30px; align-items: center; padding: 26px 0 8px; }
.hero-tag { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--violet2); margin: 4px 0 22px; }
.hero-art { position: relative; display: grid; place-items: center; min-height: 320px; }
.hero-art svg { width: min(100%, 380px); overflow: visible; animation: floatY 7s ease-in-out infinite; filter: drop-shadow(0 30px 60px rgba(139,124,246,.25)); }
@keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
.orbit { position: absolute; border: 1px dashed rgba(255,255,255,.10); border-radius: 50%; animation: spin 40s linear infinite; }
.orbit.o1 { width: 380px; height: 380px; } .orbit.o2 { width: 500px; height: 500px; animation-duration: 70s; animation-direction: reverse; }
.orbit .sat { position: absolute; top: -16px; left: 50%; font-size: 22px; filter: drop-shadow(0 0 10px rgba(240,192,104,.6)); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Stats / rings ───────────────────────────────────────────── */
.stat-card { display: flex; flex-direction: column; gap: 3px; padding: 18px 20px; }
.stat-v { font-family: var(--serif); font-size: 31px; line-height: 1.1; color: var(--ink); }
.stat-v small { font-size: 15px; color: var(--faint); }
.stat-l { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.stat-ico { position: absolute; top: 14px; right: 16px; font-size: 21px; opacity: .85; }
.ringwrap { position: relative; width: 64px; height: 64px; flex: none; }
.ringwrap svg { transform: rotate(-90deg); }
.ringwrap .ring-num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 800; }

/* ── Palace cards & journey ─────────────────────────────────── */
.palace-card { display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
.palace-card h3 { font-family: var(--serif); font-weight: 500; font-size: 20px; }
.palace-rooms-row { display: flex; gap: 6px; flex-wrap: wrap; }
.room-pip { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; background: var(--glass2); border: 1px solid var(--line); }
.meta-line { display: flex; gap: 14px; font-size: 12.5px; color: var(--faint); flex-wrap: wrap; }
.meta-line b { color: var(--dim); }

.journey { position: relative; display: flex; flex-direction: column; gap: 0; margin-top: 8px; }
.journey-room { position: relative; display: flex; gap: 18px; padding: 0 0 26px 30px; }
.journey-room::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: -6px; width: 2px; background: linear-gradient(180deg, rgba(240,192,104,.5), rgba(139,124,246,.25)); }
.journey-room:last-child::before { bottom: auto; height: 24px; }
.journey-room::after { content: ""; position: absolute; left: 3.5px; top: 6px; width: 13px; height: 13px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(240,192,104,.18), 0 0 14px rgba(240,192,104,.7); }
.room-card { flex: 1; transition: var(--tr); }
.room-card:hover { border-color: var(--line2); transform: translateX(3px); }
.room-head { display: flex; align-items: center; gap: 13px; }
.room-glyph { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; font-size: 26px; flex: none; background: radial-gradient(circle at 32% 28%, hsla(var(--h), 70%, 62%, .34), hsla(var(--h), 70%, 30%, .14)); border: 1px solid hsla(var(--h), 70%, 64%, .4); box-shadow: 0 0 22px hsla(var(--h), 75%, 55%, .22); }
.room-head h4 { font-family: var(--serif); font-weight: 500; font-size: 18.5px; }
.loci-dots { display: flex; gap: 5px; margin-top: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.14); }
.dot.s1 { background: var(--rose); box-shadow: 0 0 7px rgba(251,113,133,.7); }
.dot.s2 { background: var(--amber); box-shadow: 0 0 7px rgba(251,191,36,.6); }
.dot.s3 { background: var(--green); box-shadow: 0 0 7px rgba(74,222,128,.6); }
.dot.s4 { background: var(--teal); box-shadow: 0 0 8px rgba(94,234,212,.8); }

.locus-line { display: flex; align-items: baseline; gap: 10px; padding: 9px 12px; border-radius: 11px; transition: var(--tr); border: 1px solid transparent; }
.locus-line:hover { background: var(--glass); border-color: var(--line); }
.locus-n { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 18px; flex: none; }
.locus-station { font-size: 13px; color: var(--violet2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.locus-key { font-weight: 700; font-size: 14px; color: var(--ink); }

/* ── Walkthrough (the showpiece) ─────────────────────────────── */
.walk { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; background: var(--bg0); animation: fadeUp .3s ease both; }
.walk-bg { position: absolute; inset: 0; overflow: hidden; }
.walk-bg .wash { position: absolute; inset: -10%; background:
  radial-gradient(60% 55% at 50% 8%, hsla(var(--h), 75%, 56%, .26), transparent 65%),
  radial-gradient(50% 45% at 12% 80%, hsla(var(--h), 60%, 40%, .18), transparent 70%),
  radial-gradient(45% 40% at 90% 75%, hsla(calc(var(--h) + 60), 65%, 50%, .12), transparent 70%);
  transition: background 1s ease; }
.walk-floor { position: absolute; left: 50%; bottom: -12%; width: 190%; height: 62%; transform: translateX(-50%) perspective(620px) rotateX(63deg); transform-origin: 50% 0;
  background-image: linear-gradient(hsla(var(--h),70%,70%,.13) 1.5px, transparent 1.5px), linear-gradient(90deg, hsla(var(--h),70%,70%,.13) 1.5px, transparent 1.5px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(60% 85% at 50% 0%, #000 30%, transparent 78%);
          mask-image: radial-gradient(60% 85% at 50% 0%, #000 30%, transparent 78%);
  animation: floorScroll 13s linear infinite; }
@keyframes floorScroll { from { background-position: 0 0; } to { background-position: 0 56px; } }
.walk-cols { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 4vw; pointer-events: none; }
.walk-col { width: clamp(34px, 5vw, 70px); height: 100%; background: linear-gradient(90deg, transparent, hsla(var(--h), 45%, 60%, .10) 35%, hsla(var(--h), 45%, 72%, .16) 50%, hsla(var(--h),45%,60%,.10) 65%, transparent); box-shadow: inset 0 0 40px rgba(0,0,0,.3); }
.mote { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: hsla(var(--h), 90%, 78%, .8); box-shadow: 0 0 9px hsla(var(--h), 90%, 70%, .9); animation: moteRise linear infinite; bottom: -10px; }
@keyframes moteRise { from { transform: translateY(0) translateX(0); opacity: 0; } 12% { opacity: .9; } 88% { opacity: .65; } to { transform: translateY(-108vh) translateX(26px); opacity: 0; } }

.walk-hud { position: relative; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 16px 24px; }
.walk-room-tag { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 16.5px; }
.walk-room-tag .rg { font-size: 22px; filter: drop-shadow(0 0 10px hsla(var(--h), 90%, 65%, .8)); }
.walk-progress { flex: 1; max-width: 440px; height: 7px; margin: 0 auto; border-radius: 99px; background: rgba(255,255,255,.10); overflow: hidden; }
.walk-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold2)); border-radius: 99px; box-shadow: 0 0 12px rgba(240,192,104,.8); transition: width .5s cubic-bezier(.22,.9,.3,1); }

function splitSentences(text){
  return text.replace(/([.!?])\s+(?=[A-Z0-9"“(])/g, "$1\u0001").split("\u0001").map(s => s.trim()).filter(Boolean);
}
function salientKey(sentence){
  const words = sentence.replace(/[(),;:"“”]/g, " ").split(/\s+/).filter(Boolean);
  // proper-noun phrase (capitalized run, not sentence-initial)
  for (let i = 1; i < words.length; i++){
    const w = words[i].replace(/[^A-Za-z0-9'-]/g, "");
    if (/^[A-Z][a-z]/.test(w) && !STOPWORDS.has(w.toLowerCase())){
      let phrase = [w];
      for (let j = i + 1; j < words.length && phrase.length < 3; j++){
        const x = words[j].replace(/[^A-Za-z0-9'-]/g, "");
        if (/^[A-Z]/.test(x) && !STOPWORDS.has(x.toLowerCase())) phrase.push(x); else break;
      }
      return phrase.join(" ");
    }
  }
  const num = words.find(w => /\d/.test(w));
  if (num){
    const i = words.indexOf(num);
    const next = words[i+1] ? words[i+1].replace(/[^A-Za-z-]/g, "") : "";
    return (num + (next && !STOPWORDS.has(next.toLowerCase()) ? " " + next : "")).trim();
  }
  let best = "", score = -1;
  for (const raw of words){
    const w = raw.replace(/[^A-Za-z'-]/g, "");
    if (w.length < 4 || STOPWORDS.has(w.toLowerCase())) continue;
    const sc = w.length + (/^[A-Z]/.test(w) ? 3 : 0);
    if (sc > score){ score = sc; best = w; }
  }
  return best || words.slice(0, 2).join(" ");
}

  const loose = [];

    line = line.replace(/^[\-–—*•>]+\s*/, "").replace(/^\d{1,2}[.)]\s+/, "");
    let m = line.match(/^(.{2,70}?)\s*(?:::|:|—|–|->|=>|\t)\s+(.{3,})$/);
    if (!m) m = line.match(/^(.{2,60}?)\s+-\s+(.{6,})$/);
    if (m){ push(m[1], m[2]); continue; }
    loose.push(line);
  }
  if (loose.length){
    for (const sent of splitSentences(loose.join(" "))){
      if (sent.length < 18 || sent.length > 400) continue;
      push(salientKey(sent), sent);
    }
  }
  return items.slice(0, 84);
}
function makeImage(key, station, seedBump){
  const rng = mulberry32(hash(norm(key) + "|" + (seedBump || 0)));
  const ch = pick(rng, CHARACTERS), act = pick(rng, ACTIONS), mat = pick(rng, MATERIALS);
  const KEY = key.length <= 26 ? key.toUpperCase() : cap(key);
  const obj = `<b>“${esc(KEY)}”</b> sculpted out of ${mat}`;
  const tmpl = Math.floor(rng() * 4);
  let scene;
  if (tmpl === 0) scene = `${cap(ch)} is ${act} ${obj}, right at ${station}.`;
  else if (tmpl === 1) scene = `Something crashes through the ceiling beside ${station}: ${obj}. ${cap(ch)} rushes over and starts ${act} it.`;
  else if (tmpl === 2) scene = `At ${station}, ${ch} has built a little shrine around ${obj} — and is now ${act} it.`;
  else scene = `${cap(obj)} has wrapped itself around ${station}, while ${ch} is busy ${act} it.`;
  const numMatch = key.match(/\b([0-9]|1[0-2])\b/);
  let pegLine = "";
  if (numMatch){ const n = +numMatch[1]; pegLine = `Peg it: ${n} is “${PEGS[n]}” — let the ${PEGS[n]} appear inside the scene.`; }
  const senseIsSmell = rng() < 0.5;
  return {
    scene, pegLine,
    char: ch, material: mat,
    exagg: pick(rng, EXAGGS),
    sound: pick(rng, SOUNDS),
    sense: senseIsSmell ? "the air smells of " + pick(rng, SMELLS) : pick(rng, FEELS),
    emotion: pick(rng, EMOTIONS),
    hook: `${key} → look for the ${mat.split(" ").slice(-1)[0]} sculpture`,
    by: "engine"
  };
}
function roomAcronym(loci, rng){
  const letters = loci.map(l => (norm(l.key)[0] || "x"));
  const words = letters.map(ch => { const bank = ACRO_WORDS[ch] || ["Xtra"]; return pick(rng, bank); });
  return { letters: letters.join("·").toUpperCase(), sentence: words.join(" ") + "." };
}
function roomStory(loci, theme, rng){
  const conn = ["Then", "Suddenly", "Next", "Without warning", "Right after", "Finally"];
  const bits = loci.map((l, i) => {
    const mat = l.img ? l.img.material : "mystery material";
    const st = l.station;
    const lead = i === 0 ? `Your journey through ${theme.name} begins at ${st}` : `${conn[Math.min(i - 1, conn.length - 1)]}, at ${st}`;
    return `${lead}, where “${l.key}” waits, sculpted in ${mat}.`;
  });
  return bits.join(" ");
}
function conceptLinks(pal){
  const items = allItems(pal);
  const links = [];
  const sig = it => new Set(norm(it.it.key + " " + it.it.detail).split(" ").filter(w => w.length > 4 && !STOPWORDS.has(w)));
  const sigs = items.map(sig);
  for (let i = 0; i < items.length; i++){
    for (let j = i + 1; j < items.length; j++){
      if (items[i].room.id === items[j].room.id && j === i + 1) continue;
      let shared = 0; for (const w of sigs[i]) if (sigs[j].has(w)) shared++;
      if (shared >= 1 && items[i].it.key !== items[j].it.key) links.push([i, j, shared]);
    }
  }
  return { items, links: links.sort((a,b) => b[2]-a[2]).slice(0, Math.min(40, items.length * 2)) };
}
function effectiveAssist(){
  const s = S.profile.settings.assist;

function buildPalace({ title, text, themeIds, assist, examDate }){
  const items = parseContent(text);
  if (items.length < 2) return null;
  const rng = mulberry32(hash(title + text.length));
  const perRoom = items.length <= 7 ? items.length : Math.ceil(items.length / Math.min(12, Math.ceil(items.length / 5)));
  const chunks = [];
  for (let i = 0; i < items.length; i += Math.min(7, Math.max(4, perRoom))) chunks.push(items.slice(i, i + Math.min(7, Math.max(4, perRoom))));
  let pool = themeIds && themeIds.length ? themeIds : shuffled(rng, ROOMS.map(r => r.id));
  if (S.profile.homeStations && (!themeIds || !themeIds.length) && rng() < 0.4) pool = ["home", ...pool];
  const rooms = chunks.map((chunk, ri) => {
    const theme = roomTheme(pool[ri % pool.length]);
    const loci = chunk.map((item, li) => {
      const [stName, stIcon] = theme.stations[li % theme.stations.length];
      const blank = assist <= 0 || (assist === 1) || (assist === 2 && li % 3 === 2);
      const img = blank ? null : makeImage(item.key, stName, 0);
      return { id: uid(), idx: li, station: stName, stationIcon: stIcon, key: item.key, detail: item.detail,
        img, hint: assist === 1 ? makeImage(item.key, stName, 0).hook : null,
        userImg: "", note: "", seedBump: 0,
        srs: { reps: 0, ease: 2.3, ivl: 0, due: NOW(), hist: [] } };
    });
    const room = { id: uid(), themeId: theme.id, name: theme.name, icon: theme.icon, hue: theme.hue, amb: theme.amb, loci };
    const ac = roomAcronym(loci, rng);
    room.acroLetters = ac.letters; room.acroSentence = ac.sentence;
    room.story = roomStory(loci, theme, rng);
    return room;
  });
  return { id: uid(), title: title || "Untitled Palace", created: NOW(), src: text, rooms,
    assist, examDate: examDate || null, aiMade: false };
}

/* ═══════════════════ 6 · SPACED REPETITION (SM-2 inspired) ═══════════════════ */
function gradeItem(pal, it, g){
  const s = it.srs;
  s.hist.push({ t: NOW(), g });
  if (s.hist.length > 60) s.hist.shift();
  if (g === 0){ s.reps = 0; s.ivl = 0; s.ease = Math.max(1.3, s.ease - 0.2); s.due = NOW() + 10 * 6e4; }
  else {
    s.reps++;
    if (g === 1){ s.ivl = Math.max(0.5, (s.ivl || 0.5) * 1.2); s.ease = Math.max(1.3, s.ease - 0.15); }
    else if (g === 2){ s.ivl = s.reps <= 1 ? 1 : (s.ivl || 1) * s.ease; }
    else { s.ease = Math.min(3.2, s.ease + 0.12); s.ivl = Math.max(2, (s.ivl || 1) * s.ease * 1.3); }
    if (pal && pal.examDate){
      const daysLeft = (new Date(pal.examDate).getTime() - NOW()) / DAY;
      if (daysLeft > 0) s.ivl = Math.min(s.ivl, Math.max(1, daysLeft / 3));
    }
    s.due = NOW() + s.ivl * DAY;
  }
  S.profile.reviews++;
  addXP(g === 0 ? 2 : 3 + g * 2, "review");
  touchStreak();
  save();
}
function strengthOf(it){
  const s = it.srs;
  if (!s.hist.length) return 0;
  const last = s.hist[s.hist.length - 1];
  if (last.g === 0 && NOW() - last.t < 36e5) return 0.08;
  const elapsed = (NOW() - last.t) / DAY;
  const ivl = Math.max(0.4, s.ivl || 0.4);
  return clamp(Math.exp(-elapsed / (ivl * 1.55)), 0, 1);
}
function strengthClass(v){ return v <= 0.001 ? "" : v < 0.3 ? "s1" : v < 0.6 ? "s2" : v < 0.85 ? "s3" : "s4"; }
function dueItems(pal){ return allItems(pal).filter(x => x.it.srs.due <= NOW()); }
function palaceStrength(pal){ const xs = allItems(pal); if (!xs.length) return 0; return xs.reduce((a, x) => a + strengthOf(x.it), 0) / xs.length; }
function retentionForecast(days){
  const xs = allItems();
  const out = [];
  for (let d = 0; d <= days; d++){
    let sum = 0, n = 0;
    for (const x of xs){
      const s = x.it.srs;
      if (!s.hist.length) continue;
      const last = s.hist[s.hist.length - 1];
      const elapsed = (NOW() + d * DAY - last.t) / DAY;
      sum += clamp(Math.exp(-elapsed / (Math.max(0.4, s.ivl || 0.4) * 1.55)), 0, 1);
      n++;
    }
    out.push(n ? sum / n : 0);
  }
  return out;
}

function levelInfo(xp = S.profile.xp){
  let lvl = 1, need = 120, rem = xp;

  return { lvl, into: rem, need, title: LVL_TITLES[Math.min(lvl - 1, LVL_TITLES.length - 1)] };
}

const sfx = (() => {
  let ctx = null;
  function ac(){ if (!S.profile.settings.sound) return null; try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; } catch(e){ return null; } }
  function tone(freq, t0, dur, type="sine", gain=0.08){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + t0);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
  }
  return {
    tick(){ tone(880, 0, 0.07, "triangle", 0.04); },
    reveal(){ tone(523.25, 0, 0.3); tone(783.99, 0.07, 0.4); },
    good(){ tone(659.25, 0, 0.18); tone(987.77, 0.09, 0.3); },
    bad(){ tone(220, 0, 0.25, "sawtooth", 0.05); },
    fanfare(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5)); },
  };
})();

/* ═══════════════════ 9 · CHARTS (canvas helpers) ═══════════════════ */
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 300, h = cv.clientHeight || 170;
  cv.width = w * dpr; cv.height = h * dpr;
  const x = cv.getContext("2d");
  x.scale(dpr, dpr);
  return { x, w, h };
}
function drawLine(cv, pts, { color = "#f0c068", fill = true, yMax = 1, labels = null } = {}){
  if (!cv) return;
  const { x, w, h } = setupCanvas(cv);
  const padL = 8, padB = labels ? 20 : 10, padT = 10;
  const iw = w - padL * 2, ih = h - padT - padB;
  x.clearRect(0, 0, w, h);
  x.strokeStyle = "rgba(255,255,255,.07)"; x.lineWidth = 1;
  for (let i = 0; i <= 4; i++){ const y = padT + ih * i / 4; x.beginPath(); x.moveTo(padL, y); x.lineTo(w - padL, y); x.stroke(); }
  if (pts.length < 2) return;
  const px = i => padL + iw * i / (pts.length - 1);
  const py = v => padT + ih * (1 - clamp(v / yMax, 0, 1));
  if (fill){
    const grad = x.createLinearGradient(0, padT, 0, h);
    grad.addColorStop(0, color + "55"); grad.addColorStop(1, color + "00");
    x.beginPath(); x.moveTo(px(0), py(pts[0]));
    pts.forEach((v, i) => x.lineTo(px(i), py(v)));
    x.lineTo(px(pts.length - 1), h - padB); x.lineTo(px(0), h - padB); x.closePath();
    x.fillStyle = grad; x.fill();
  }
  x.beginPath(); x.moveTo(px(0), py(pts[0]));
  pts.forEach((v, i) => x.lineTo(px(i), py(v)));
  x.strokeStyle = color; x.lineWidth = 2.2; x.lineJoin = "round"; x.stroke();
  x.fillStyle = color; x.beginPath(); x.arc(px(0), py(pts[0]), 3.4, 0, 7); x.fill();
  x.beginPath(); x.arc(px(pts.length - 1), py(pts[pts.length - 1]), 3.4, 0, 7); x.fill();
  if (labels){
    x.fillStyle = "rgba(255,255,255,.4)"; x.font = "10px " + getComputedStyle(document.body).fontFamily; x.textAlign = "center";
    labels.forEach((lb, i) => { if (lb != null) x.fillText(lb, px(i), h - 6); });
  }
}
function drawBars(cv, data, { yMax = 1 } = {}){ // data: [{label, value, color}]
  if (!cv) return;
  const { x, w, h } = setupCanvas(cv);
  const padB = 22, padT = 12;
  const ih = h - padT - padB;
  x.clearRect(0, 0, w, h);
  const bw = Math.min(54, (w - 20) / data.length * 0.6);
  data.forEach((d, i) => {
    const cx = 10 + (w - 20) * (i + 0.5) / data.length;
    const bh = ih * clamp(d.value / yMax, 0, 1);
    const grad = x.createLinearGradient(0, padT + ih - bh, 0, padT + ih);
    grad.addColorStop(0, d.color); grad.addColorStop(1, d.color + "33");
    x.fillStyle = grad;
    const r = 6, bx = cx - bw / 2, by = padT + ih - bh;
    x.beginPath(); x.moveTo(bx, by + r); x.arcTo(bx, by, bx + r, by, r); x.arcTo(bx + bw, by, bx + bw, by + r, r); x.lineTo(bx + bw, padT + ih); x.lineTo(bx, padT + ih); x.closePath(); x.fill();
    x.fillStyle = "rgba(255,255,255,.55)"; x.font = "10.5px " + getComputedStyle(document.body).fontFamily; x.textAlign = "center";
    x.fillText(d.label, cx, h - 7);
    x.fillStyle = "#fff"; x.font = "700 11px " + getComputedStyle(document.body).fontFamily;
    if (d.value > 0.001) x.fillText(Math.round(d.value / yMax * 100) + "%", cx, Math.max(padT + 10, by - 5));
  });
}

function toast(msg, type = ""){
  const el = document.createElement("div");
  el.className = "toast " + type;

  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 350); }, 3400);
}
function openModal(html, wide = false){
  closeModal();

  back.className = "modal-back";
  back.innerHTML = `<div class="modal ${wide ? "wide" : ""}"><button class="iconbtn modal-x" aria-label="Close">✕</button>${html}</div>`;
  back.addEventListener("click", e => { if (e.target === back || e.target.closest(".modal-x")) closeModal(); });
  $("#modalHost").appendChild(back);
  return back;
}
function closeModal(){ $("#modalHost").innerHTML = ""; }
function confirmDlg(msg, onYes){

function ring(pct, size = 64, color = null){
  const r = (size - 8) / 2, c = 2 * Math.PI * r;
  const col = color || (pct < 30 ? "var(--rose)" : pct < 60 ? "var(--amber)" : pct < 85 ? "var(--green)" : "var(--teal)");
  return `<div class="ringwrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" style="filter:drop-shadow(0 0 6px ${col})"/>
    </svg><div class="ring-num" style="color:${col}">${Math.round(pct)}<small style="font-size:9px">%</small></div></div>`;
}

  document.body.appendChild(host);
  const steps = ["Surveying your knowledge…","Carving the rooms…","Choosing stations along the journey…","Binding facts to impossible images…","Weaving the room stories…","Engraving mnemonics over each door…","Lighting the lanterns…"];
  let si = 0;

    }, wait);
  }).catch(err => {
    clearInterval(tick); host.remove();

function scoreImage(text){
  const t = " " + norm(text) + " ";
  const words = text.trim().split(/\s+/).filter(Boolean);
  const checks = [
    { ok: words.length >= 8, label: "Detail — at least a full sentence of it" },
    { ok: /\w+ing\b/.test(text) || /(smash|crash|throw|jump|dance|explode|run|fly|spin|eat|sing|burn)/.test(t), label: "Action — something must HAPPEN" },
    { ok: /(hear|sound|smell|taste|touch|warm|cold|loud|soft|sticky|glow|bright|hum|roar|whisper)/.test(t), label: "Senses — sound, smell, touch or light" },
    { ok: /(giant|huge|enormous|massive|tiny|thousand|million|impossibl|towering|blinding|deafening|colossal)/.test(t), label: "Exaggeration — break physics" },
    { ok: /(laugh|terrif|afraid|love|hate|awe|fear|joy|disgust|shock|proud|cry|scream|amaz)/.test(t), label: "Emotion — make yourself feel it" },
  ];
  return { score: checks.filter(c => c.ok).length, checks };
}
function scoreImageHTML(text){
  if (!text.trim()) return `<span class="subnote">Write something first.</span>`;
  const { score, checks } = scoreImage(text);
  const stars = "★".repeat(score) + "☆".repeat(5 - score);
  return `<div class="card" style="padding:13px">
    <div style="font-size:18px;color:var(--gold);letter-spacing:3px">${stars}</div>
    ${checks.map(c => `<div style="font-size:13px;margin-top:5px;color:${c.ok ? "var(--green)" : "var(--faint)"}">${c.ok ? "✓" : "○"} ${c.label}</div>`).join("")}
    ${score >= 4 ? `<div style="margin-top:8px;font-size:13px;color:var(--teal)">That will stick. Beautiful work.</div>` : `<div style="margin-top:8px;font-size:13px;color:var(--violet2)">Push it further — weirder is stronger (Von Restorff effect).</div>`}</div>`;
}
function drawConceptMap(p){
  const cv = $("#cmap"); if (!cv) return;
  const tip = $("#cmapTip");
  const { x, w, h } = setupCanvas(cv);
  const { items, links } = conceptLinks(p);
  if (!items.length) return;
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 30;
  const pos = items.map((it, i) => {
    const a = (i / items.length) * Math.PI * 2 - Math.PI / 2;
    const rr = R * (0.72 + 0.24 * ((i % 3) / 2));
    return { x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr, it };
  });
  x.clearRect(0, 0, w, h);
  for (const [i, j, s] of links){
    const a = pos[i], b = pos[j];
    x.beginPath();
    x.moveTo(a.x, a.y);
    x.quadraticCurveTo(cx + (a.x + b.x - 2 * cx) * 0.18, cy + (a.y + b.y - 2 * cy) * 0.18, b.x, b.y);
    x.strokeStyle = `rgba(139,124,246,${clamp(0.12 + s * 0.1, 0, 0.4)})`;
    x.lineWidth = 1;
    x.stroke();
  }
  for (const pnode of pos){
    const st = strengthOf(pnode.it.it);
    const col = st < 0.3 ? "#fb7185" : st < 0.6 ? "#fbbf24" : st < 0.85 ? "#4ade80" : "#5eead4";
    x.beginPath(); x.arc(pnode.x, pnode.y, 4.2, 0, 7);
    x.fillStyle = pnode.it.it.srs.hist.length ? col : "#8b7cf6";
    x.shadowColor = x.fillStyle; x.shadowBlur = 8;
    x.fill(); x.shadowBlur = 0;
  }
  cv.onmousemove = e => {
    const rect = cv.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const hit = pos.find(pn => (pn.x - mx) ** 2 + (pn.y - my) ** 2 < 110);
    if (hit){
      tip.style.display = "block";
      tip.style.left = Math.min(mx + 12, rect.width - 200) + "px";
      tip.style.top = (my + 12) + "px";
      tip.innerHTML = `<b>${esc(hit.it.it.key)}</b><br><span style="color:var(--faint)">${esc(hit.it.room.name)}</span>`;
    } else tip.style.display = "none";
  };
  cv.onmouseleave = () => tip.style.display = "none";
}

/* ═══════════════════ 15 · THE WALKTHROUGH ═══════════════════ */
let WALK = null;
function startWalk(p, { mode = "encode", roomId = null, dueOnly = false } = {}){
  let list = [];
  for (const r of p.rooms){
    if (roomId && r.id !== roomId) continue;
    for (const l of r.loci){
      if (dueOnly && l.srs.due > NOW()) continue;
      list.push({ room: r, it: l });
    }
  }
  if (!list.length){ toast("Nothing due on this route — every memory is holding strong. 💪"); return; }
  WALK = { pal: p, list, i: 0, mode, phase: 0, grades: [], done: false };
  renderWalk();
}
function closeWalk(){ WALK = null; $("#walkHost").innerHTML = ""; render(); }
function walkAdvance(){
  const W = WALK; if (!W) return;
  if (W.phase < 2){ W.phase++; sfx.reveal(); }
  else {
    const cur = W.list[W.i];
    if (W.mode === "encode"){
      if (!cur.it.srs.hist.length && cur.it.srs.reps === 0) cur.it.srs.due = Math.max(cur.it.srs.due, NOW() + 6 * 36e5);
      addXP(4, "encode");
    }
    W.i++; W.phase = 0; sfx.tick();
    if (W.i >= W.list.length) finishWalk();
  }
  renderWalk();
}
function walkGrade(g){
  const W = WALK; if (!W || W.mode !== "recall") return;
  const cur = W.list[W.i];
  gradeItem(W.pal, cur.it, g);
  W.grades.push(g);
  g >= 2 ? sfx.good() : sfx.bad();
  W.i++; W.phase = 0;
  if (W.i >= W.list.length) finishWalk();
  renderWalk();
}
function finishWalk(){
  const W = WALK;
  W.done = true;
  S.profile.walks++;
  addXP(20, "walk");
  touchStreak();
  checkBadges();

let QUIZ = null;
function makeQ(type, x, scope){
  const { pal, room, it } = x;
  if (type === "where"){
    const stations = [...new Set(scope.flatMap(s => [s.it.station]))].filter(s => s !== it.station);
    if (stations.length < 2) type = "recall";
    else {
      const rng = mulberry32(hash(it.id + "w"));
      const opts = shuffled(rng, [it.station, ...shuffled(rng, stations).slice(0, 3)]);
      return { type, icon: "🗺️", label: "Spatial recall", tech: "loci", x,
        prompt: `In your journey, where does <b>${esc(it.key)}</b> live?`, answer: it.station, options: opts, typed: false };
    }
  }
  if (type === "after"){
    const idx = scope.findIndex(s => s.it.id === it.id);
    const next = scope[idx + 1];
    if (!next || scope.length < 4) type = "detail";
    else {
      const rng = mulberry32(hash(it.id + "a"));
      const others = scope.filter(s => s.it.id !== next.it.id && s.it.id !== it.id).map(s => s.it.key);
      const opts = shuffled(rng, [next.it.key, ...shuffled(rng, others).slice(0, 3)]);
      return { type, icon: "👣", label: "Journey order", tech: "story", x: next,
        prompt: `Walking on from <b>${esc(it.key)}</b> — what waits at the very next station?`, answer: next.it.key, options: opts, typed: false };
    }
  }
  if (type === "detail"){
    const words = it.detail.split(/\s+/);
    let bi = -1, bl = 0;
    words.forEach((w, i) => { const c = w.replace(/[^A-Za-z0-9]/g, ""); if (c.length > bl && !STOPWORDS.has(c.toLowerCase()) && norm(c) !== norm(it.key)){ bl = c.length; bi = i; } });
    if (bi >= 0 && bl >= 4){
      const answer = words[bi].replace(/[^A-Za-z0-9'-]/g, "");
      const cloze = words.map((w, i) => i === bi ? `<b style="letter-spacing:2px">［____］</b>` : esc(w)).join(" ");
      return { type, icon: "🧩", label: "Cloze recall", tech: "retrieval", x,
        prompt: `<span style="color:var(--gold2)">${esc(it.key)}:</span><br><span style="font-size:17px">${cloze}</span>`, answer, typed: true };
    }
    type = "recall";
  }
  return { type: "recall", icon: "🎣", label: "Locus recall", tech: "testing", x,
    prompt: `You're standing at <b>${esc(it.station)}</b> ${it.stationIcon} in <i>${esc(room.name)}</i>.<br>What is anchored here?`, answer: it.key, typed: true };
}
function startQuiz(pal = null, n = 8){
  const scope = allItems(pal);
  if (scope.length < 2){ toast("Build a palace first — the lab needs material.", "bad"); return; }
  let pool = [...scope].sort((a, b) => (a.it.srs.due - b.it.srs.due) || (strengthOf(a.it) - strengthOf(b.it))).slice(0, Math.max(n, 8));
  pool = shuffled(mulberry32(NOW() % 999983), pool).slice(0, Math.min(n, pool.length));
  const types = ["recall", "where", "detail", "after"];
  const qs = pool.map((x, i) => makeQ(types[i % types.length], x, scope));
  QUIZ = { qs, i: 0, answered: false, ok: 0, conf: 60, rapid: false, byType: {}, pal };
  renderQuiz();
}
function startRapid(){
  const scope = allItems();
  if (!scope.length){ toast("Build a palace first.", "bad"); return; }
  const pool = [...scope].sort((a, b) => (a.it.srs.due - b.it.srs.due) || (strengthOf(a.it) - strengthOf(b.it))).slice(0, 12);
  QUIZ = { qs: pool.map(x => ({ type: "rapid", x })), i: 0, phase: 0, ok: 0, rapid: true, timer: null };
  renderQuiz();
}

        <button class="btn" id="qSubmit" style="margin-top:10px">Answer</button>` :
        q.options.map((o, i) => `<button class="opt" data-opt="${esc(o)}"><span class="ol">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}

  $("#qExit").onclick = closeQuiz;

      <h4 style="font-family:var(--serif);font-size:19px;margin-bottom:14px">🎛️ Preferences</h4>
      <div class="spread" style="padding:9px 0;border-bottom:1px dashed var(--line)"><span>🔊 Sound effects</span><span class="switch"><input type="checkbox" id="setSound" ${s.sound ? "checked" : ""}><i></i></span></div>
      <div class="spread" style="padding:9px 0;border-bottom:1px dashed var(--line)"><span>🌊 Motion & ambience</span><span class="switch"><input type="checkbox" id="setMotion" ${s.motion ? "checked" : ""}><i></i></span></div>
      <div class="field" style="margin-top:14px"><label class="label">Default assistance ${whyChip("gen")}</label>
        <select class="select" id="setAssist">
          <option value="auto" ${s.assist === "auto" ? "selected" : ""}>Auto — follows your Academy stage</option>
          <option value="3" ${s.assist === "3" ? "selected" : ""}>Full magic</option>
          <option value="2" ${s.assist === "2" ? "selected" : ""}>Co-create</option>
          <option value="1" ${s.assist === "1" ? "selected" : ""}>Sketch</option>
          <option value="0" ${s.assist === "0" ? "selected" : ""}>Solo</option>
        </select></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h4 style="font-family:var(--serif);font-size:19px;margin-bottom:6px">🗄️ Your data</h4>
    <p class="subnote" style="margin-bottom:14px">Everything lives in this browser — nothing is uploaded anywhere. Export regularly if this knowledge matters to you.</p>
    <div class="row">
      <button class="btn ghost small" id="setExport">⬇ Export everything</button>
      <button class="btn ghost small" id="setImport">📥 Import backup</button>
      <span style="flex:1"></span>
      <button class="btn danger small" id="setWipe">🗑 Erase all data</button>
    </div>
    <input type="file" id="setImportFile" accept=".json" style="display:none">
  </div>
  <div class="card" style="margin-top:16px;text-align:center;padding:28px">
    <div style="font-family:var(--serif);font-style:italic;font-size:19px;color:var(--violet2)">“Don't memorize notes. Explore them.”</div>
    <p class="subnote" style="margin-top:8px">Memory Palace Builder · a single-file app · works offline forever · your mind is the cloud</p>
  </div>`;
  $("#setSaveAI").onclick = () => { s.apiKey = $("#setKey").value.trim(); s.model = $("#setModel").value; save(); toast(s.apiKey ? "✨ AI unlocked." : "Key removed.", "gold"); };
  $("#setTest").onclick = async () => {
    s.apiKey = $("#setKey").value.trim(); s.model = $("#setModel").value; save();
    const out = $("#setTestOut");
    if (!s.apiKey){ out.textContent = "enter a key first"; return; }
    out.textContent = "testing…";
    try { await AI.test(); out.innerHTML = `<span style="color:var(--green)">✓ connected</span>`; }
    catch (e){ out.innerHTML = `<span style="color:var(--rose)">✕ ${esc(e.message).slice(0, 60)}</span>`; }
  };
  $("#setSound").onchange = e => { s.sound = e.target.checked; save(); if (s.sound) sfx.good(); };
  $("#setMotion").onchange = e => { s.motion = e.target.checked; save(); document.body.classList.toggle("nomotion", !s.motion); };
  $("#setAssist").onchange = e => { s.assist = e.target.value; save(); toast("Default assistance updated."); };
  $("#setExport").onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "memory-palace-builder-backup-" + dayStr() + ".json";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $("#setImport").onclick = () => $("#setImportFile").click();
  $("#setImportFile").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try {
      const d = JSON.parse(rd.result);
      if (!d.profile || !Array.isArray(d.palaces)) throw new Error();
      S = d; save(); render(); toast("📥 Backup restored.", "gold");
    } catch (err){ toast("That file isn't a valid backup.", "bad"); } };
    rd.readAsText(f);
  };
  $("#setWipe").onclick = () => confirmDlg("Erase <b>everything</b> — palaces, progress, streaks, badges?", () => {
    localStorage.removeItem(DB_KEY); S = defaultDB(); save(); go("home"); toast("A blank mind. A fresh start.");
  });
}

/* ═══════════════════ 21 · ONBOARDING + DEMO ═══════════════════ */
function seedDemo(){
  if (S.palaces.length) return S.palaces[0];
  const pal = buildPalace({ title: SAMPLES[0].title, text: SAMPLES[0].text, themeIds: null, assist: 3, examDate: null });
  S.palaces.push(pal); save();
  return pal;
}
function onboarding(){
  if (S.profile.onboarded) return;
  let pane = 0;
  const panes = [
    { art: "🏛️", h: `Welcome to <i>Memory Palace Builder</i>`, p: `Since ancient Greece, the world's best memories have used one trick: they don't memorize information — they <b>place it inside imagined buildings</b> and walk through to retrieve it. This app builds those buildings for you, from your own notes.` },
    { art: "🧠", h: `Built on <i>real science</i>`, p: `Every screen runs on proven cognitive psychology — retrieval practice, spacing, dual coding, the Von Restorff effect and ${TECHS.length - 4} more. Tap any <button class="whychip">🧠 why</button> chip, anywhere, to see the science behind what you're doing.` },
    { art: "🗽", h: `The goal: <i>needing nothing</i>`, p: `The Academy gradually hands you the pen — from full magic, to co-creation, to palaces you build entirely in your head. Students who finish carry the skill for life. Ready? We've prepared a demo palace to explore.` },
  ];
  const draw = () => {
    const pn = panes[pane];
    openModal(`
      <div class="ob-art">${pn.art}</div>
      <h3 style="text-align:center">${pn.h}</h3>
      <p style="text-align:center;color:var(--dim);margin:14px 0 22px;line-height:1.65">${pn.p}</p>
      <div class="ob-dots" style="margin-bottom:18px">${panes.map((_, i) => `<i class="${i === pane ? "on" : ""}"></i>`).join("")}</div>
      <div class="row" style="justify-content:center">
        ${pane < panes.length - 1 ? `<button class="btn" id="obNext">Continue →</button><button class="btn ghost" id="obSkip">Skip</button>` :
          `<button class="btn big" id="obGo">🏛️ Open my demo palace</button>`}
      </div>`);
    const nx = $("#obNext"); if (nx) nx.onclick = () => { pane++; draw(); };
    const sk = $("#obSkip"); if (sk) sk.onclick = () => { S.profile.onboarded = true; save(); closeModal(); };
    const gob = $("#obGo"); if (gob) gob.onclick = () => {
      S.profile.onboarded = true; save(); closeModal();
      const pal = seedDemo();
      go("palace/" + pal.id);
      setTimeout(() => toast("✨ Tip: hit <b>🚶 Walk the palace</b> to take your first journey.", "gold"), 900);
    };
  };
  draw();
}

/* ═══════════════════ 22 · STARFIELD + INIT ═══════════════════ */
function starfield(){
  const cv = $("#stars"), x = cv.getContext("2d");
  let stars = [];
  const build = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.min(170, innerWidth / 7) }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() * 1.5 + 0.3, ph: Math.random() * Math.PI * 2, sp: 0.3 + Math.random() * 1.2,
      hue: Math.random() < 0.12 ? "240,200,140" : Math.random() < 0.2 ? "180,170,255" : "235,232,255",
    }));
  };
  build();
  addEventListener("resize", build);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(t){
    x.clearRect(0, 0, innerWidth, innerHeight);
    const noAnim = still || !S.profile.settings.motion;
    for (const s of stars){
      const a = noAnim ? 0.55 : 0.3 + 0.45 * (0.5 + 0.5 * Math.sin(t / 1000 * s.sp + s.ph));
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7);
      x.fillStyle = `rgba(${s.hue},${a})`;
      x.fill();
    }
    if (!noAnim) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function init(){
  load();
  document.body.classList.toggle("nomotion", !S.profile.settings.motion);
  starfield();
  render();
  onboarding();
  let rsT = null;
  addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { const r = curRoute().split("/")[0]; if (r === "progress" || r === "palace") render(); }, 250); });
}
init();
</script>
