<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#1E4D6B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="España 2026" />
<title>Andalucía & Castilla · España 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ANDALUCÍA & CASTILLA — Compañero de Viaje
   ========================================================= */

:root {
  /* Andalusian palette: sun-bleached limestone, terracotta tile, azulejo blue */
  --bg: #F7F1E3;
  --bg-soft: #FBF6E8;
  --surface: #FFFFFF;
  --surface-elev: #FFFFFF;
  --ink: #1B1814;
  --ink-soft: #4A4540;
  --ink-mute: #847C72;
  --line: #E8DFC9;
  --line-soft: #F0E8D2;

  --terracotta: #C45A38;
  --terracotta-deep: #A8462A;
  --terracotta-soft: #F3DCD0;
  --azulejo: #1E4D6B;
  --azulejo-deep: #143847;
  --azulejo-soft: #D6E2EA;
  --ochre: #C9A05B;
  --ochre-soft: #F5E6C7;
  --olive: #6B7A4B;
  --olive-soft: #E1E5D2;
  --plum: #6B3B5E;

  --shadow-sm: 0 1px 2px rgba(27, 24, 20, 0.04), 0 1px 3px rgba(27, 24, 20, 0.06);
  --shadow-md: 0 4px 12px rgba(27, 24, 20, 0.08), 0 2px 4px rgba(27, 24, 20, 0.04);
  --shadow-lg: 0 12px 32px rgba(27, 24, 20, 0.12), 0 4px 12px rgba(27, 24, 20, 0.06);

  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(196, 90, 56, 0.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(30, 77, 107, 0.05), transparent 60%),
    var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; }
a { color: inherit; text-decoration: none; }

/* ---------- Layout shell ---------- */
.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 0 calc(96px + var(--safe-bottom));
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ---------- Top header ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  padding: calc(var(--safe-top) + 12px) 20px 12px;
  background: linear-gradient(180deg, rgba(247, 241, 227, 0.98) 0%, rgba(247, 241, 227, 0.92) 70%, rgba(247, 241, 227, 0) 100%);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.topbar-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.brand {
  display: flex; flex-direction: column;
  line-height: 1;
}
.brand-eyebrow {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--terracotta);
  margin-bottom: 4px;
}
.brand-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.brand-title em { font-style: italic; color: var(--azulejo); font-weight: 500; }

.day-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--azulejo);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.day-chip .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #fff;
  opacity: 0.9;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.9; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
.day-chip.outside { background: var(--ink-mute); }
.day-chip.outside .dot { animation: none; opacity: 0.7; }

/* ---------- Progress strip ---------- */
.progress-strip {
  margin-top: 10px;
  display: flex; gap: 3px;
}
.progress-strip .pip {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--line);
  transition: background 0.4s;
}
.progress-strip .pip.done { background: var(--ochre); }
.progress-strip .pip.current { background: var(--terracotta); position: relative; }
.progress-strip .pip.current::after {
  content: ''; position: absolute;
  inset: -3px; border-radius: 4px;
  box-shadow: 0 0 0 2px rgba(196, 90, 56, 0.2);
  animation: ringPulse 2s infinite;
}
@keyframes ringPulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(196, 90, 56, 0.25); }
  50% { box-shadow: 0 0 0 4px rgba(196, 90, 56, 0.05); }
}

/* ---------- Main content area ---------- */
.screen {
  padding: 4px 20px 24px;
  animation: screenIn 0.35s ease both;
}
@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Day header ---------- */
.day-header {
  margin: 8px 0 18px;
  padding: 20px 22px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--line-soft);
  position: relative;
  overflow: hidden;
}
.day-header::before {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--terracotta), var(--ochre));
}
.day-header-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.day-nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-soft);
  display: grid; place-items: center;
  border: 1px solid var(--line);
  transition: all 0.2s;
  color: var(--ink-soft);
}
.day-nav-btn:active { transform: scale(0.92); background: var(--line-soft); }
.day-nav-btn:disabled { opacity: 0.3; }
.day-nav-btn svg { width: 16px; height: 16px; }

.day-date-pill {
  flex: 1;
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.day-heading {
  font-family: var(--serif);
  font-size: 32px;
  line-height: 1.05;
  font-weight: 500;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin: 4px 0 6px;
}
.day-heading em { font-style: italic; color: var(--terracotta); }
.day-subtitle {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.5;
  margin-bottom: 14px;
}

.day-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line-soft);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-top: 4px;
}
.day-meta-item {
  background: var(--bg-soft);
  padding: 10px 12px;
}
.day-meta-item.full { grid-column: span 2; }
.day-meta-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 3px;
}
.day-meta-value {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.35;
}
.day-meta-value .tiny {
  font-size: 11px;
  color: var(--ink-mute);
  font-weight: 400;
}

/* ---------- Ahora mismo card ---------- */
.now-card {
  background: linear-gradient(155deg, var(--azulejo) 0%, var(--azulejo-deep) 100%);
  color: #fff;
  border-radius: var(--radius-lg);
  padding: 22px 22px 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(30, 77, 107, 0.25);
  position: relative;
  overflow: hidden;
}
.now-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(420px 220px at 110% -30%, rgba(255, 215, 170, 0.15), transparent 60%),
    radial-gradient(380px 200px at -20% 130%, rgba(196, 90, 56, 0.18), transparent 60%);
  pointer-events: none;
}
.now-card > * { position: relative; z-index: 1; }
.now-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.now-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.7);
  display: flex; align-items: center; gap: 6px;
}
.now-label .live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #FFB89D;
  box-shadow: 0 0 0 3px rgba(255, 184, 157, 0.3);
  animation: pulse 2s infinite;
}
.now-time {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.85);
}

.now-current-title {
  font-family: var(--serif);
  font-size: 24px;
  line-height: 1.15;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}
.now-current-desc {
  font-size: 13.5px;
  line-height: 1.45;
  color: rgba(255, 255, 255, 0.82);
  margin-bottom: 16px;
}

.now-next {
  border-top: 1px solid rgba(255, 255, 255, 0.14);
  padding-top: 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}
.now-next-icon {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.12);
  display: grid; place-items: center;
  color: #FFD7A8;
}
.now-next-icon svg { width: 18px; height: 18px; }
.now-next-info {
  min-width: 0;
}
.now-next-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.55);
  font-weight: 600;
  margin-bottom: 2px;
}
.now-next-title {
  font-size: 13.5px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.now-next-countdown {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  text-align: right;
  color: #FFD7A8;
  letter-spacing: 0.04em;
}
.now-next-countdown .big {
  display: block;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 1px;
}

.now-card.idle {
  background: linear-gradient(155deg, #2A2A28 0%, #1A1815 100%);
}
.now-card.future {
  background: linear-gradient(155deg, var(--terracotta) 0%, var(--terracotta-deep) 100%);
  box-shadow: 0 8px 24px rgba(196, 90, 56, 0.25);
}

/* ---------- Timeline ---------- */
.timeline-section-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-mute);
  margin: 24px 4px 12px;
  display: flex; align-items: center; gap: 10px;
}
.timeline-section-label::after {
  content: ''; flex: 1; height: 1px;
  background: var(--line);
}

.timeline {
  position: relative;
  padding-left: 0;
}
.timeline-empty {
  padding: 32px 20px;
  text-align: center;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px dashed var(--line);
  color: var(--ink-mute);
  font-size: 14px;
}

.tl-item {
  position: relative;
  padding: 0 0 14px 56px;
  min-height: 56px;
}
.tl-item:last-child { padding-bottom: 4px; }

.tl-item::before {
  content: '';
  position: absolute;
  left: 21px;
  top: 32px;
  bottom: -4px;
  width: 2px;
  background: var(--line);
}
.tl-item:last-child::before { display: none; }
.tl-item.past::before { background: var(--line-soft); }
.tl-item.current::before {
  background: linear-gradient(180deg, var(--terracotta), var(--line));
}

.tl-time {
  position: absolute;
  left: 0;
  top: 0;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: 0.02em;
  box-shadow: var(--shadow-sm);
  z-index: 1;
}
.tl-time small { font-size: 9px; font-weight: 600; }

.tl-item.past .tl-time {
  background: var(--bg-soft);
  color: var(--ink-mute);
  border-color: var(--line-soft);
}
.tl-item.past .tl-time::before {
  content: '✓';
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 14px; height: 14px;
  background: var(--olive);
  border-radius: 50%;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: grid; place-items: center;
  border: 1.5px solid var(--bg);
}

.tl-item.current .tl-time {
  background: var(--terracotta);
  color: #fff;
  border-color: var(--terracotta);
  box-shadow: 0 0 0 4px rgba(196, 90, 56, 0.18), var(--shadow-md);
  animation: glowPulse 2.4s infinite;
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(196, 90, 56, 0.18), var(--shadow-md); }
  50% { box-shadow: 0 0 0 8px rgba(196, 90, 56, 0.06), var(--shadow-md); }
}

.tl-card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 12px 14px 12px;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
  cursor: pointer;
}
.tl-card:active { transform: scale(0.99); }
.tl-item.past .tl-card {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  padding: 8px 4px 8px;
  opacity: 0.6;
}
.tl-item.current .tl-card {
  border-color: rgba(196, 90, 56, 0.25);
  box-shadow: 0 6px 18px rgba(196, 90, 56, 0.12);
  background: linear-gradient(180deg, #fff, var(--terracotta-soft));
}

.tl-row {
  display: flex; align-items: flex-start; gap: 10px;
}
.tl-icon {
  width: 28px; height: 28px;
  border-radius: 9px;
  display: grid; place-items: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.tl-icon svg { width: 16px; height: 16px; }

.tl-icon.t-drive { background: var(--azulejo-soft); color: var(--azulejo); }
.tl-icon.t-walk { background: var(--olive-soft); color: var(--olive); }
.tl-icon.t-monument { background: var(--ochre-soft); color: #8B6E2C; }
.tl-icon.t-food { background: var(--terracotta-soft); color: var(--terracotta-deep); }
.tl-icon.t-coffee { background: #EFDFC4; color: #7A4F1E; }
.tl-icon.t-hotel { background: #E5DEEF; color: var(--plum); }
.tl-icon.t-reservation { background: #FCE3D8; color: var(--terracotta-deep); }
.tl-icon.t-sunset { background: #FCE8B5; color: #B07A0E; }
.tl-icon.t-flight { background: var(--azulejo-soft); color: var(--azulejo); }
.tl-icon.t-shop { background: #E4E1EE; color: #5F4B7C; }
.tl-icon.t-rest { background: var(--bg-soft); color: var(--ink-mute); }
.tl-icon.t-tour { background: var(--ochre-soft); color: #8B6E2C; }

.tl-body { flex: 1; min-width: 0; }
.tl-title {
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--ink);
  line-height: 1.3;
  margin-bottom: 3px;
}
.tl-desc {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.5;
}
.tl-desc .price {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  background: var(--ochre-soft);
  color: #8B6E2C;
  border-radius: 4px;
  margin-left: 2px;
}
.tl-item.past .tl-desc { display: none; }
.tl-item.past .tl-title { font-weight: 500; font-size: 13.5px; }

.tl-tags {
  display: flex; flex-wrap: wrap; gap: 5px;
  margin-top: 8px;
}
.tl-tag {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--bg-soft);
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tl-tag.reserved { background: var(--terracotta-soft); color: var(--terracotta-deep); border-color: rgba(196, 90, 56, 0.2); }
.tl-tag.must { background: #FCE8B5; color: #8B6E2C; border-color: rgba(201, 160, 91, 0.3); }
.tl-tag.optional { background: var(--bg-soft); color: var(--ink-mute); }
.tl-item.past .tl-tags { display: none; }

.tl-actions {
  margin-top: 10px;
  display: flex; gap: 6px;
  flex-wrap: wrap;
}
.tl-action {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 10px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  transition: all 0.15s;
}
.tl-action:active { transform: scale(0.96); background: var(--line-soft); }
.tl-action svg { width: 13px; height: 13px; }
.tl-action.primary { background: var(--azulejo); color: #fff; border-color: var(--azulejo); }
.tl-item.past .tl-actions { display: none; }

/* ---------- Notes card ---------- */
.notes-block {
  margin-top: 24px;
  padding: 16px 18px;
  background: linear-gradient(170deg, var(--ochre-soft) 0%, #F8EBC8 100%);
  border-radius: var(--radius);
  border: 1px solid rgba(201, 160, 91, 0.25);
  position: relative;
  overflow: hidden;
}
.notes-block::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--ochre);
}
.notes-title {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  color: #8B6E2C;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.notes-title svg { width: 13px; height: 13px; }
.notes-body {
  font-size: 13.5px;
  line-height: 1.55;
  color: #5C4416;
}
.notes-body + .notes-title { margin-top: 12px; }
.notes-body strong { font-weight: 700; color: #3D2D08; }

/* ---------- Hotel summary card ---------- */
.hotel-block {
  margin-top: 22px;
  padding: 18px 20px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.hotel-block::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--plum), var(--terracotta), var(--ochre));
}
.hotel-eyebrow {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--plum);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}
.hotel-eyebrow svg { width: 13px; height: 13px; }
.hotel-name {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
  line-height: 1.1;
}
.hotel-meta {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 12px;
}
.hotel-meta .pill {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  background: var(--bg-soft);
  border-radius: 5px;
  color: var(--ink-soft);
  margin-left: 4px;
}
.hotel-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.hotel-action {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 11px 8px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink);
  transition: all 0.15s;
}
.hotel-action:active { transform: scale(0.96); background: var(--line-soft); }
.hotel-action svg { width: 18px; height: 18px; color: var(--azulejo); }

/* ---------- Day card list (Días screen) ---------- */
.days-screen { padding: 4px 18px 24px; }
.days-screen-title {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.015em;
  margin: 10px 4px 4px;
}
.days-screen-sub {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 18px;
  padding: 0 4px;
}
.day-card {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  margin-bottom: 10px;
  transition: all 0.2s;
  box-shadow: var(--shadow-sm);
}
.day-card:active { transform: scale(0.99); }
.day-card.today {
  background: linear-gradient(155deg, var(--terracotta) 0%, var(--terracotta-deep) 100%);
  color: #fff;
  border-color: var(--terracotta);
  box-shadow: 0 6px 18px rgba(196, 90, 56, 0.25);
}
.day-card.past { opacity: 0.55; }

.day-card-date {
  width: 64px;
  text-align: center;
  padding: 8px 0;
  background: var(--bg-soft);
  border-radius: 12px;
}
.day-card.today .day-card-date {
  background: rgba(255, 255, 255, 0.16);
}
.day-card-month {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--terracotta);
}
.day-card.today .day-card-month { color: #FFD7A8; }
.day-card-day {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 600;
  line-height: 1;
  margin: 1px 0 0;
}
.day-card-weekday {
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 600;
  margin-top: 2px;
}
.day-card.today .day-card-weekday { color: rgba(255, 255, 255, 0.7); }

.day-card-info {
  min-width: 0;
}
.day-card-num {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 2px;
}
.day-card.today .day-card-num { color: rgba(255, 255, 255, 0.75); }
.day-card-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.2;
  color: var(--ink);
}
.day-card.today .day-card-title { color: #fff; }
.day-card-sub {
  font-size: 12px;
  color: var(--ink-mute);
  margin-top: 2px;
}
.day-card.today .day-card-sub { color: rgba(255, 255, 255, 0.78); }
.day-card-cta {
  color: var(--ink-mute);
}
.day-card.today .day-card-cta { color: rgba(255, 255, 255, 0.8); }

/* ---------- Hotels screen ---------- */
.hotels-screen { padding: 4px 18px 24px; }
.hotel-list-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line-soft);
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.hotel-list-head {
  padding: 16px 18px 12px;
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg-soft) 100%);
  border-bottom: 1px solid var(--line-soft);
}
.hotel-list-city {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--terracotta);
  margin-bottom: 4px;
}
.hotel-list-name {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.15;
  margin-bottom: 6px;
}
.hotel-list-dates {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-soft);
  font-weight: 500;
}
.hotel-list-dates .nights {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  background: var(--azulejo-soft);
  color: var(--azulejo);
  border-radius: 4px;
  letter-spacing: 0.06em;
}
.hotel-list-body {
  padding: 14px 18px;
}
.hotel-detail-row {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0;
  font-size: 13px;
  color: var(--ink-soft);
  border-bottom: 1px dashed var(--line-soft);
}
.hotel-detail-row:last-child { border: none; }
.hotel-detail-row svg { width: 15px; height: 15px; color: var(--azulejo); flex-shrink: 0; }
.hotel-detail-row .lab {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-mute);
  width: 70px;
  flex-shrink: 0;
}
.hotel-detail-row a {
  color: var(--azulejo);
  font-weight: 600;
  text-decoration: none;
}
.hotel-list-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line-soft);
  border-top: 1px solid var(--line-soft);
}
.hotel-list-actions .hotel-action {
  border-radius: 0;
  border: none;
  background: var(--surface);
  flex-direction: row;
  padding: 14px 8px;
  font-size: 12px;
  gap: 6px;
}
.hotel-list-actions .hotel-action:active { background: var(--bg-soft); }

/* ---------- Info screen ---------- */
.info-screen { padding: 4px 20px 24px; }
.info-title {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.015em;
  margin: 10px 0 4px;
}
.info-sub {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 22px;
}
.info-section {
  margin-bottom: 22px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line-soft);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.info-section-head {
  padding: 14px 18px;
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  user-select: none;
}
.info-section-icon {
  width: 32px; height: 32px;
  border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--azulejo);
}
.info-section-icon svg { width: 16px; height: 16px; }
.info-section-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
  flex: 1;
}
.info-toggle {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  color: var(--ink-mute);
  transition: transform 0.25s;
}
.info-section.collapsed .info-toggle { transform: rotate(-90deg); }
.info-section-body {
  padding: 6px 18px 16px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink-soft);
  display: block;
}
.info-section.collapsed .info-section-body { display: none; }
.info-section-body ul {
  padding-left: 18px;
  margin: 8px 0;
}
.info-section-body li { margin-bottom: 6px; }
.info-section-body strong { color: var(--ink); font-weight: 600; }
.info-row {
  display: grid;
  grid-template-columns: minmax(80px, auto) 1fr;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line-soft);
}
.info-row:last-child { border: none; }
.info-row .label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--terracotta);
  padding-top: 2px;
}
.info-row .value {
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.5;
}
.info-row .value strong { color: var(--ink); }
.info-row .value .euro {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  background: var(--ochre-soft);
  color: #8B6E2C;
  border-radius: 4px;
  margin-left: 4px;
}

.reservations-table {
  display: flex; flex-direction: column;
  gap: 1px;
  background: var(--line-soft);
  border-radius: 12px;
  overflow: hidden;
}
.reservations-table .res-row {
  background: var(--surface);
  padding: 14px 16px;
}
.res-row-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.res-row-name {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.005em;
}
.res-row-price {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--terracotta-deep);
  background: var(--terracotta-soft);
  padding: 3px 8px;
  border-radius: 6px;
}
.res-row-price.done {
  background: var(--olive-soft);
  color: var(--olive);
}
.res-row-desc {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.5;
}

/* ---------- Bottom tabbar ---------- */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  padding: 6px 12px calc(8px + var(--safe-bottom));
  background: rgba(247, 241, 227, 0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line-soft);
}
.tabbar-inner {
  max-width: 560px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 12px;
  color: var(--ink-mute);
  transition: all 0.2s;
}
.tab svg { width: 22px; height: 22px; stroke-width: 1.6; }
.tab span {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.tab.active { color: var(--terracotta); }
.tab.active svg { stroke-width: 2; }
.tab:active { transform: scale(0.94); }

/* ---------- Trip stats ---------- */
.trip-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 16px 0 4px;
  padding: 0 4px;
}
.stat {
  text-align: center;
  padding: 10px 4px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 12px;
}
.stat-val {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  line-height: 1;
  color: var(--ink);
}
.stat-lab {
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 600;
  margin-top: 4px;
}

/* ---------- Cities visual journey ---------- */
.journey {
  margin: 12px 0 6px;
  padding: 14px 16px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line-soft);
  box-shadow: var(--shadow-sm);
}
.journey-label {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-mute);
  margin-bottom: 12px;
}
.journey-track {
  display: flex; align-items: center;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 4px;
  margin: 0 -4px;
  padding-left: 4px;
  padding-right: 4px;
}
.journey-track::-webkit-scrollbar { display: none; }
.journey-stop {
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0;
  font-size: 11px;
}
.journey-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--line);
  border: 2px solid var(--bg);
  margin-bottom: 4px;
}
.journey-stop.done .journey-dot { background: var(--ochre); }
.journey-stop.current .journey-dot {
  background: var(--terracotta);
  box-shadow: 0 0 0 3px rgba(196, 90, 56, 0.2);
}
.journey-name {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-mute);
  white-space: nowrap;
}
.journey-stop.current .journey-name { color: var(--terracotta); }
.journey-stop.done .journey-name { color: var(--ink-soft); }
.journey-line {
  height: 2px;
  width: 28px;
  background: var(--line);
  margin: 0 -2px 16px;
  flex-shrink: 0;
}
.journey-line.done { background: var(--ochre); }

/* ---------- Welcome / pre-trip / post-trip states ---------- */
.placeholder-state {
  background: linear-gradient(160deg, var(--azulejo) 0%, var(--azulejo-deep) 100%);
  color: #fff;
  border-radius: var(--radius-lg);
  padding: 32px 24px 26px;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(30, 77, 107, 0.25);
  position: relative;
  overflow: hidden;
  text-align: center;
}
.placeholder-state .icon-big {
  font-size: 36px;
  margin-bottom: 8px;
  display: inline-block;
}
.placeholder-state h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 28px;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}
.placeholder-state .countdown {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  margin-top: 14px;
  padding: 8px 14px;
  display: inline-block;
  background: rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  letter-spacing: 0.04em;
}
.placeholder-state p {
  font-size: 14px;
  line-height: 1.55;
  color: rgba(255, 255, 255, 0.82);
  margin: 0;
}

/* ---------- Misc ---------- */
.divider-soft {
  border: 0;
  height: 1px;
  background: var(--line-soft);
  margin: 22px 0;
}

.section-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 24px 4px 8px;
}

/* Tomorrow preview card */
.tomorrow-card {
  margin-top: 22px;
  padding: 16px 18px;
  background: linear-gradient(170deg, var(--azulejo-soft) 0%, #E8F0F5 100%);
  border-radius: var(--radius);
  border: 1px solid rgba(30, 77, 107, 0.12);
}
.tomorrow-eyebrow {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--azulejo);
  margin-bottom: 4px;
}
.tomorrow-title {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--ink);
  margin-bottom: 2px;
}
.tomorrow-sub {
  font-size: 13px;
  color: var(--ink-soft);
}

/* Larger screens (tablets / desktop) — keep mobile feel */
@media (min-width: 720px) {
  body { background: #EFE6D2; }
  .app {
    margin: 24px auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.04);
    border-radius: 32px;
    overflow: hidden;
    background: var(--bg);
  }
  .tabbar {
    border-radius: 0 0 32px 32px;
  }
}

/* "Jump to today" floating button */
.jump-today {
  position: fixed;
  right: 16px;
  bottom: calc(86px + var(--safe-bottom));
  background: var(--terracotta);
  color: #fff;
  padding: 10px 14px;
  border-radius: 999px;
  box-shadow: 0 8px 24px rgba(196, 90, 56, 0.4);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  display: flex; align-items: center; gap: 6px;
  z-index: 30;
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
  transition: all 0.3s;
}
.jump-today.show {
  opacity: 1; transform: translateY(0); pointer-events: auto;
}
.jump-today svg { width: 14px; height: 14px; }
.jump-today:active { transform: scale(0.95); }

.app[data-tab="dias"] .jump-today,
.app[data-tab="hoteles"] .jump-today,
.app[data-tab="info"] .jump-today { opacity: 0 !important; pointer-events: none !important; }

</style>
</head>
<body>

<div class="app" id="app" data-tab="hoy">

  <!-- =========== TOP BAR (sticky) =========== -->
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-eyebrow">España · 2026</span>
        <span class="brand-title">Andalucía <em>&</em> Castilla</span>
      </div>
      <div id="dayChip" class="day-chip"><span class="dot"></span><span id="dayChipText">Día 1 de 18</span></div>
    </div>
    <div class="progress-strip" id="progressStrip"></div>
  </header>

  <!-- =========== HOY SCREEN =========== -->
  <main id="screenHoy" class="screen"></main>

  <!-- =========== DÍAS SCREEN =========== -->
  <main id="screenDias" class="screen days-screen" hidden>
    <h1 class="days-screen-title">Los <em style="color: var(--terracotta); font-style: italic;">diecisiete</em> días</h1>
    <p class="days-screen-sub">Del 25 de mayo al 11 de junio · 1.700 km · 9 hoteles</p>
    <div class="journey" style="margin-bottom: 16px;">
      <div class="journey-label">El recorrido</div>
      <div class="journey-track" id="journeyTrack"></div>
    </div>
    <div id="daysList"></div>
  </main>

  <!-- =========== HOTELES SCREEN =========== -->
  <main id="screenHoteles" class="screen hotels-screen" hidden>
    <h1 class="days-screen-title">Hoteles</h1>
    <p class="days-screen-sub">Los nueve alojamientos del viaje, con sus contactos directos.</p>
    <div id="hotelsList"></div>
  </main>

  <!-- =========== INFO SCREEN =========== -->
  <main id="screenInfo" class="screen info-screen" hidden>
    <h1 class="info-title">Información práctica</h1>
    <p class="info-sub">Reservas, manejo, dinero y lo demás que conviene saber.</p>
    <div id="infoContent"></div>
  </main>

  <!-- =========== FLOATING JUMP-TO-TODAY =========== -->
  <button class="jump-today" id="jumpToday" aria-label="Volver a hoy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Ir a hoy</span>
  </button>

  <!-- =========== TABBAR =========== -->
  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab active" data-tab="hoy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/><circle cx="12" cy="16" r="1.4" fill="currentColor"/></svg>
        <span>Hoy</span>
      </button>
      <button class="tab" data-tab="dias">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
        <span>Días</span>
      </button>
      <button class="tab" data-tab="hoteles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/><path d="M3 21h18"/></svg>
        <span>Hoteles</span>
      </button>
      <button class="tab" data-tab="info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
        <span>Info</span>
      </button>
    </div>
  </nav>

</div>

<script>
/* =========================================================
   ICONS (inline SVG strings keyed by activity type)
   ========================================================= */
const ICON = {
  drive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.5-5A2 2 0 0 1 6.4 6.6h11.2A2 2 0 0 1 19.5 8L21 13"/><rect x="2" y="13" width="20" height="6" rx="1.5"/><circle cx="7" cy="18.5" r="1.5" fill="currentColor"/><circle cx="17" cy="18.5" r="1.5" fill="currentColor"/></svg>',
  walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M9 21l2-6 3 1 2 4M9 13l-2-3 4-2 3 4 3 1"/></svg>',

/* =========================================================
   STATE
   ========================================================= */
const state = {
  selectedIso: null,
  tab: 'hoy',
  expandedNotes: {}
};

/* =========================================================
   UTILITIES
   ========================================================= */
function todayIso() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isoToDate(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function isoDiffDays(a, b) {
  const ad = isoToDate(a), bd = isoToDate(b);
  return Math.round((bd - ad) / 86400000);
}
function nowMinutes() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function timeToMin(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  return h*60 + m;
}
function minToHuman(min) {
  if (min < 0) return '';
  if (min < 1) return 'ahora';
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (m === 0) return `${h} h`;
  return `${h} h ${m} min`;
}
function dayIndex(iso) { return DAYS.findIndex(d => d.iso === iso); }

const MONTHS_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_LONG  = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function formatLongDate(iso) {
  const d = isoToDate(iso);
  const day = d.getDate();
  const m = MONTHS_LONG[d.getMonth()];
  return `${day} de ${m}`;
}
function formatShortDate(iso) {
  const d = isoToDate(iso);
  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
}

function hotelById(id) { return HOTELS.find(h => h.id === id); }

function activeDayIso() {
  if (state.selectedIso) return state.selectedIso;
  const t = todayIso();
  // If today is within trip range, use it. Otherwise use first day.
  const idx = dayIndex(t);
  if (idx >= 0) return t;
  if (t < TRIP.startISO) return TRIP.startISO;
  return TRIP.endISO;
}

function mapsUrl(query) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

/* =========================================================
   RENDER — TOP BAR
   ========================================================= */
function renderTopbar() {
  const t = todayIso();
  const idx = dayIndex(t);
  const chip = document.getElementById('dayChip');
  const txt = document.getElementById('dayChipText');
  if (idx >= 0) {
    chip.classList.remove('outside');
    txt.textContent = `Día ${idx+1} de ${DAYS.length}`;
  } else if (t < TRIP.startISO) {
    chip.classList.add('outside');
    const days = isoDiffDays(t, TRIP.startISO);
    txt.textContent = days === 1 ? 'Mañana empieza' : `Faltan ${days} días`;
  } else {
    chip.classList.add('outside');
    txt.textContent = 'Viaje completado';
  }

  // Progress strip
  const strip = document.getElementById('progressStrip');
  strip.innerHTML = '';
  DAYS.forEach((d, i) => {
    const pip = document.createElement('div');
    pip.className = 'pip';
    if (d.iso < t) pip.classList.add('done');
    if (d.iso === t) pip.classList.add('current');
    strip.appendChild(pip);
  });
}

/* =========================================================
   RENDER — HOY SCREEN
   ========================================================= */
function renderHoy() {
  const screen = document.getElementById('screenHoy');
  screen.innerHTML = '';
  const t = todayIso();
  const showingIso = activeDayIso();
  const day = DAYS.find(d => d.iso === showingIso);
  const idx = dayIndex(showingIso);
  const isToday = (showingIso === t);
  const tIdx = dayIndex(t);

  // ── Pre-trip placeholder
  if (t < TRIP.startISO && !state.selectedIso) {
    const days = isoDiffDays(t, TRIP.startISO);

      <div class="countdown">${TRIP.startISO === showingIso ? 'Día 1 · 25 de mayo' : `${formatLongDate(TRIP.startISO)} · vuelo nocturno`}</div>

  }

  // ── Post-trip placeholder
  if (t > TRIP.endISO && !state.selectedIso) {
    const post = document.createElement('div');

      <h2>Buen viaje · y bienvenidos a casa</h2>

    `;
    screen.appendChild(post);
  }

  // ── Day header card
  const header = document.createElement('section');
  header.className = 'day-header';

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="day-date-pill">${day.weekday} · ${formatLongDate(day.iso)}${isToday ? ' · Hoy' : ''}</div>
      <button class="day-nav-btn" id="navNext" ${!canNext ? 'disabled' : ''} aria-label="Día siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <h1 class="day-heading">${day.title}</h1>
    <p class="day-subtitle">${day.subtitle || ''}</p>
    <div class="day-meta">
      ${day.cities.length ? `
        <div class="day-meta-item">
          <div class="day-meta-label">Ciudades</div>
          <div class="day-meta-value">${day.cities.join(' · ')}</div>
        </div>` : ''}
      ${day.hotel ? `
        <div class="day-meta-item">
          <div class="day-meta-label">Noche en</div>
          <div class="day-meta-value">${hotelById(day.hotel).city} <span class="tiny">· ${hotelById(day.hotel).name.split(' — ')[0]}</span></div>
        </div>` : `
        <div class="day-meta-item">
          <div class="day-meta-label">Noche</div>
          <div class="day-meta-value">— <span class="tiny">vuelo</span></div>
        </div>`}
      ${day.drive ? `
        <div class="day-meta-item full">
          <div class="day-meta-label">Conducción</div>
          <div class="day-meta-value">${day.drive.from} → ${day.drive.to}<span class="tiny"> · ${day.drive.dist}${day.drive.time ? ' · ' + day.drive.time : ''}</span></div>
        </div>` : `
        <div class="day-meta-item full">
          <div class="day-meta-label">Conducción</div>
          <div class="day-meta-value">Día sin auto</div>

  if (isToday && day.events.length > 0) {
    const nowCard = buildNowCard(day);

  // ── Empty events case (e.g., Day 1)
  if (day.events.length === 0) {
    const empty = document.createElement('div');

    screen.appendChild(empty);
  } else {
    // ── Timeline section label
    const lbl = document.createElement('div');
    lbl.className = 'timeline-section-label';
    lbl.textContent = isToday ? 'Hoy · timeline' : 'Plan del día';
    screen.appendChild(lbl);

    // ── Timeline
    const timeline = buildTimeline(day, isToday);
    screen.appendChild(timeline);

  if (day.hotel) {

  if (day.notes && day.notes.length) {
    day.notes.forEach(n => {
      const nb = document.createElement('div');
      nb.className = 'notes-block';
      nb.innerHTML = `
        <div class="notes-title">

        <div class="notes-body">${n.body}</div>
      `;
      screen.appendChild(nb);

  }

  // ── Tomorrow preview (only on Hoy = today)
  if (isToday && tIdx >= 0 && tIdx < DAYS.length - 1) {
    const next = DAYS[tIdx + 1];
    const tom = document.createElement('div');
    tom.className = 'tomorrow-card';
    tom.innerHTML = `
      <div class="tomorrow-eyebrow">Mañana · ${next.weekday}</div>

    tom.style.cursor = 'pointer';
    tom.addEventListener('click', () => {

  }

  // Wire up nav
  document.getElementById('navPrev')?.addEventListener('click', () => {
    if (idx > 0) {
      state.selectedIso = DAYS[idx-1].iso;

    }
  });
  document.getElementById('navNext')?.addEventListener('click', () => {
    if (idx < DAYS.length - 1) {
      state.selectedIso = DAYS[idx+1].iso;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

  // Toggle jump-to-today
  const jump = document.getElementById('jumpToday');
  const tInRange = dayIndex(t) >= 0;
  if (tInRange && !isToday) jump.classList.add('show');
  else jump.classList.remove('show');
}

/* =========================================================
   RENDER — Now card
   ========================================================= */
function buildNowCard(day) {
  const now = nowMinutes();
  const evts = day.events.slice();
  // Find current (most recent <= now) and next (> now)
  let current = null, next = null;
  for (const e of evts) {
    const m = timeToMin(e.time);
    if (m <= now) current = e;
  }
  for (const e of evts) {
    const m = timeToMin(e.time);
    if (m > now) { next = e; break; }
  }

  const card = document.createElement('div');
  card.className = 'now-card';
  const currentTime = (() => {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  })();

  if (!current && next) {
    // Before first event
    card.classList.add('future');
    const inMin = timeToMin(next.time) - now;
    card.innerHTML = `
      <div class="now-header">
        <div class="now-label"><span class="live-dot"></span>Ahora mismo</div>
        <div class="now-time">${currentTime}</div>
      </div>
      <div class="now-current-title">Aún no empieza el día</div>
      <div class="now-current-desc">Tu primera actividad es <strong>${next.title}</strong> a las ${next.time}.</div>
      <div class="now-next">
        <div class="now-next-icon">${ICON[next.type] || ICON.rest}</div>
        <div class="now-next-info">
          <div class="now-next-label">En ${minToHuman(inMin)}</div>
          <div class="now-next-title">${next.time} · ${next.title}</div>
        </div>
        <div class="now-next-countdown"><span class="big">${minToHuman(inMin)}</span></div>
      </div>
    `;
    return card;
  }
  if (current && !next) {
    // After last event
    card.classList.add('idle');
    card.innerHTML = `
      <div class="now-header">
        <div class="now-label"><span class="live-dot"></span>Ahora mismo</div>
        <div class="now-time">${currentTime}</div>
      </div>
      <div class="now-current-title">Día completado</div>
      <div class="now-current-desc">Último: ${current.title}.</div>
    `;
    return card;
  }
  if (current && next) {
    const inMin = timeToMin(next.time) - now;
    card.innerHTML = `
      <div class="now-header">
        <div class="now-label"><span class="live-dot"></span>Ahora mismo · ${current.time}</div>
        <div class="now-time">${currentTime}</div>
      </div>
      <div class="now-current-title">${current.title}</div>
      <div class="now-current-desc">${(current.desc || '').replace(/<[^>]*>/g, '').slice(0, 180)}</div>
      <div class="now-next">
        <div class="now-next-icon">${ICON[next.type] || ICON.rest}</div>
        <div class="now-next-info">
          <div class="now-next-label">A continuación</div>
          <div class="now-next-title">${next.time} · ${next.title}</div>
        </div>
        <div class="now-next-countdown"><span class="big">${minToHuman(inMin)}</span>${minToHuman(inMin) === 'ahora' ? '' : ''}</div>
      </div>
    `;
    return card;
  }
  return null;
}

/* =========================================================
   RENDER — Timeline
   ========================================================= */
function buildTimeline(day, isToday) {
  const wrap = document.createElement('div');
  wrap.className = 'timeline';

  const now = isToday ? nowMinutes() : -1;

  // Determine "current" event: last event whose time <= now
  let currentIdx = -1;
  if (isToday) {
    day.events.forEach((e, i) => {
      const m = timeToMin(e.time);
      if (m <= now) currentIdx = i;
    });
    // current event is only "current" if next event hasn't started yet
    if (currentIdx >= 0 && currentIdx < day.events.length - 1) {
      const nextM = timeToMin(day.events[currentIdx + 1].time);
      if (nextM <= now) { /* shouldn't happen */ }
    }
  }

  day.events.forEach((e, i) => {
    const item = document.createElement('div');
    item.className = 'tl-item';
    if (isToday) {
      if (i < currentIdx) item.classList.add('past');
      else if (i === currentIdx) item.classList.add('current');
    }

    const [hh, mm] = e.time.split(':');
    const icon = ICON[e.type] || ICON.rest;
    const tags = (e.tags || []).map(t => {
      let cls = '';
      if (t === 'reservada' || t === 'reservar') cls = 'reserved';
      else if (t === 'imprescindible' || t === 'crítico' || t === 'especial') cls = 'must';
      else if (t === 'opcional') cls = 'optional';
      return `<span class="tl-tag ${cls}">${t}</span>`;
    }).join('');

    const actions = [];
    if (e.maps) actions.push(`<a class="tl-action" href="${mapsUrl(e.maps)}" target="_blank" rel="noopener">${ICON_MAPS}<span>Ir</span></a>`);
    if (e.hotel) {
      const h = hotelById(e.hotel);
      actions.push(`<a class="tl-action" href="tel:${(h.phone||'').replace(/[^\d+]/g,'')}">${ICON_PHONE}<span>${h.city}</span></a>`);
    }
    const actionsHtml = actions.length ? `<div class="tl-actions">${actions.join('')}</div>` : '';

    item.innerHTML = `
      <div class="tl-time">${hh}<small>:${mm}</small></div>
      <div class="tl-card">
        <div class="tl-row">
          <div class="tl-icon t-${e.type}">${icon}</div>
          <div class="tl-body">
            <div class="tl-title">${e.title}</div>
            ${e.desc ? `<div class="tl-desc">${e.desc}${e.price ? ` <span class="price">${e.price}</span>` : ''}</div>` : ''}
            ${tags ? `<div class="tl-tags">${tags}</div>` : ''}
            ${actionsHtml}
          </div>
        </div>
      </div>
    `;
    wrap.appendChild(item);
  });

  return wrap;
}

/* =========================================================
   RENDER — DÍAS SCREEN
   ========================================================= */
function renderDias() {
  const t = todayIso();
  // Journey strip
  const track = document.getElementById('journeyTrack');
  track.innerHTML = '';
  TRIP.cities.forEach((c, i) => {
    const stop = document.createElement('div');
    stop.className = 'journey-stop';
    // Determine state by checking if any day having this as its hotel city has occurred
    const cityDay = DAYS.find(d => d.hotel && hotelById(d.hotel).city.toLowerCase().includes(c.toLowerCase().split(' ')[0]));
    if (cityDay) {
      if (cityDay.iso < t) stop.classList.add('done');
      else if (cityDay.iso === t || (DAYS.find(d => d.iso === t)?.cities.includes(c))) stop.classList.add('current');
    }
    stop.innerHTML = `<div class="journey-dot"></div><div class="journey-name">${c}</div>`;
    track.appendChild(stop);
    if (i < TRIP.cities.length - 1) {
      const line = document.createElement('div');
      line.className = 'journey-line';
      if (cityDay && cityDay.iso < t) line.classList.add('done');
      track.appendChild(line);
    }
  });

  // Day list
  const list = document.getElementById('daysList');
  list.innerHTML = '';
  DAYS.forEach((d, i) => {
    const date = isoToDate(d.iso);
    const isToday = d.iso === t;
    const isPast = d.iso < t;
    const card = document.createElement('div');
    card.className = 'day-card' + (isToday ? ' today' : '') + (isPast ? ' past' : '');
    card.innerHTML = `
      <div class="day-card-date">
        <div class="day-card-month">${MONTHS_SHORT[date.getMonth()]}</div>
        <div class="day-card-day">${date.getDate()}</div>
        <div class="day-card-weekday">${d.weekday.slice(0,3)}</div>
      </div>
      <div class="day-card-info">
        <div class="day-card-num">Día ${i+1}${isToday ? ' · hoy' : ''}</div>
        <div class="day-card-title">${d.title}</div>
        <div class="day-card-sub">${d.subtitle || ''}</div>
      </div>
      <div class="day-card-cta">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    `;
    card.addEventListener('click', () => {
      state.selectedIso = d.iso;
      switchTab('hoy');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    list.appendChild(card);
  });
}

        ${h.email ? `<div class="hotel-detail-row"><span class="lab">Email</span><a href="mailto:${h.email}">${h.email}</a></div>` : ''}
        ${h.web ? `<div class="hotel-detail-row"><span class="lab">Web</span><a href="https://${h.web}" target="_blank" rel="noopener">${h.web}</a></div>` : ''}
        ${h.note ? `<div class="hotel-detail-row" style="color:var(--terracotta-deep);font-style:italic;"><span class="lab" style="color:var(--terracotta);">Nota</span><span>${h.note}</span></div>` : ''}
      </div>
      <div class="hotel-list-actions">
        <a class="hotel-action" href="${mapsUrl(h.address)}" target="_blank" rel="noopener">${ICON_MAPS}<span>Mapa</span></a>
        <a class="hotel-action" href="tel:${tel}">${ICON_PHONE}<span>Llamar</span></a>
        ${h.email ? `<a class="hotel-action" href="mailto:${h.email}">${ICON_MAIL}<span>Email</span></a>` : (h.web ? `<a class="hotel-action" href="https://${h.web}" target="_blank" rel="noopener">${ICON_WEB}<span>Web</span></a>` : '<div></div>')}
      </div>
    `;
    list.appendChild(card);
  });
}

function renderInfo() {
  const c = document.getElementById('infoContent');
  c.innerHTML = '';
  INFO_SECTIONS.forEach((s, idx) => {
    const div = document.createElement('div');
    div.className = 'info-section' + (idx > 0 ? ' collapsed' : '');
    div.innerHTML = `
      <div class="info-section-head">
        <div class="info-section-icon">${ICON[s.iconType] || ICON.rest}</div>
        <div class="info-section-title">${s.title}</div>
        <div class="info-toggle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="info-section-body">${s.body}</div>
    `;
    div.querySelector('.info-section-head').addEventListener('click', () => {
      div.classList.toggle('collapsed');
    });
    c.appendChild(div);
  });
}

/* =========================================================
   TAB SWITCHING
   ========================================================= */
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  ['Hoy','Dias','Hoteles','Info'].forEach(name => {
    const el = document.getElementById('screen' + name);
    el.hidden = (name.toLowerCase() !== tab);
  });
  document.getElementById('app').dataset.tab = tab;
  if (tab === 'hoy') renderHoy();
  if (tab === 'dias') renderDias();
  if (tab === 'hoteles') renderHoteles();
  if (tab === 'info') renderInfo();
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render() {
  renderTopbar();
  if (state.tab === 'hoy') renderHoy();
  if (state.tab === 'dias') renderDias();
  if (state.tab === 'hoteles') renderHoteles();
  if (state.tab === 'info') renderInfo();
}

/* =========================================================
   INIT
   ========================================================= */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});
document.getElementById('jumpToday').addEventListener('click', () => {
  state.selectedIso = null;
  switchTab('hoy');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();

// Update "now" widget every minute
setInterval(() => {
  if (state.tab === 'hoy' && !state.selectedIso) {
    renderHoy();
  }
  renderTopbar();
}, 60000);

</script>
