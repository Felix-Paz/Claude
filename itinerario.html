<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1E4D6B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="España 2026" />
<title>Andalucía & Castilla · España 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ANDALUCÍA & CASTILLA · COMPAÑERO DE VIAJE 2.0
   ========================================================= */
:root {
  --bg: #F7F1E3;
  --bg-soft: #FBF6E8;
  --surface: #FFFFFF;
  --surface-elev: #FFFFFF;
  --ink: #1B1814;
  --ink-soft: #4A4540;
  --ink-mute: #847C72;
  --ink-faint: #B8AEA0;
  --line: #E8DFC9;
  --line-soft: #F0E8D2;
  --terracotta: #C45A38;
  --terracotta-deep: #A8462A;
  --terracotta-soft: #F3DCD0;
  --terracotta-glow: rgba(196, 90, 56, 0.18);
  --azulejo: #1E4D6B;
  --azulejo-deep: #143847;
  --azulejo-soft: #D6E2EA;
  --ochre: #C9A05B;
  --ochre-soft: #F5E6C7;
  --olive: #6B7A4B;
  --olive-soft: #E1E5D2;
  --plum: #6B3B5E;
  --shadow-sm: 0 1px 2px rgba(27,24,20,.04), 0 1px 3px rgba(27,24,20,.06);
  --shadow-md: 0 4px 12px rgba(27,24,20,.08), 0 2px 4px rgba(27,24,20,.04);
  --shadow-lg: 0 12px 32px rgba(27,24,20,.12), 0 4px 12px rgba(27,24,20,.06);
  --shadow-glow: 0 0 0 1px rgba(196,90,56,.18), 0 8px 28px rgba(196,90,56,.18), 0 2px 6px rgba(27,24,20,.06);
  --r-sm: 10px; --r: 16px; --r-lg: 22px; --r-xl: 28px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--sans);
  font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100dvh; overflow-x: hidden;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(196,90,56,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(30,77,107,.05), transparent 60%),
    var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; }
a { color: inherit; text-decoration: none; }

/* ---------- App shell ---------- */
.app { max-width: 560px; margin: 0 auto; padding: 0 0 calc(96px + var(--safe-bottom)); position: relative; min-height: 100dvh; }

/* ---------- Top bar (collapses on scroll) ---------- */
.topbar {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 560px; z-index: 50;
  padding: calc(var(--safe-top) + 10px) 20px 10px;
  background: linear-gradient(180deg, rgba(247,241,227,.96) 0%, rgba(247,241,227,.82) 75%, rgba(247,241,227,0) 100%);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .35s var(--ease), opacity .25s var(--ease);
}
body.scrolled .topbar { transform: translateX(-50%) translateY(-100%); opacity: 0; pointer-events: none; }
body.scrolled .topbar.peek { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }

.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-eyebrow {
  font-size: 10px; font-weight: 600; letter-spacing: .18em;
  text-transform: uppercase; color: var(--terracotta); margin-bottom: 3px;
}
.brand-title { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
.brand-title em { font-style: italic; color: var(--azulejo); font-weight: 500; }

.day-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px;
  background: var(--azulejo); color: #fff;
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  white-space: nowrap;
}
.day-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .9; animation: pulse 2s infinite; }
.day-chip.outside { background: var(--ink-mute); }
.day-chip.outside .dot { animation: none; opacity: .7; }
@keyframes pulse { 0%,100%{opacity:.9;transform:scale(1)} 50%{opacity:.4;transform:scale(.85)} }

/* hairline progress under topbar */
.progress-strip { margin-top: 10px; display: flex; gap: 3px; }
.progress-strip .pip {
  flex: 1; height: 3px; border-radius: 2px;
  background: var(--line); transition: background .4s;
}
.progress-strip .pip.done { background: var(--ochre); }
.progress-strip .pip.current { background: var(--terracotta); position: relative; }
.progress-strip .pip.current::after {
  content: ''; position: absolute; inset: -3px; border-radius: 4px;
  box-shadow: 0 0 0 2px rgba(196,90,56,.25);
  animation: ringPulse 2s infinite;
}
@keyframes ringPulse { 0%,100%{box-shadow:0 0 0 2px rgba(196,90,56,.25)} 50%{box-shadow:0 0 0 4px rgba(196,90,56,.05)} }

/* ---------- Screens ---------- */
.screen { padding: calc(var(--safe-top) + 76px) 16px 24px; animation: fadeIn .4s var(--ease); }
.screen[hidden] { display: none; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

/* ---------- Hero (only on top of Hoy) ---------- */
.hero {
  margin-bottom: 18px;
  padding: 18px 18px 16px;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--azulejo) 0%, var(--azulejo-deep) 100%);
  color: #fff; position: relative; overflow: hidden;
  box-shadow: var(--shadow-md);
}
.hero::before {
  content: ''; position: absolute; inset: -40% -20% auto auto;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201,160,91,.25), transparent 70%);
}
.hero-eyebrow { font-size: 10px; letter-spacing: .2em; opacity: .7; text-transform: uppercase; font-weight: 600; }
.hero-title { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 4px 0 6px; letter-spacing: -.01em; }
.hero-title em { font-style: italic; color: var(--ochre); font-weight: 500; }
.hero-sub { font-size: 13px; opacity: .85; line-height: 1.5; }
.hero-meta { display: flex; gap: 16px; margin-top: 12px; font-size: 11px; opacity: .8; }
.hero-meta span { display: flex; align-items: center; gap: 5px; }

/* ---------- Section headers ---------- */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px 4px 10px;
}
.sec-head h2 {
  font-family: var(--serif); font-size: 21px; font-weight: 600;
  letter-spacing: -.01em; margin: 0; color: var(--ink);
}
.sec-head .sec-sub { font-size: 11px; color: var(--ink-mute); letter-spacing: .04em; }
.sec-head .toggle {
  font-size: 11px; color: var(--azulejo); font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
  background: var(--azulejo-soft); transition: background .2s;
}
.sec-head .toggle:hover { background: #c5d4dd; }

/* ---------- Alerts strip ---------- */
.alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.alert {
  display: flex; gap: 12px; padding: 12px 14px;
  border-radius: var(--r); background: var(--surface);
  border-left: 3px solid var(--ochre);
  box-shadow: var(--shadow-sm); animation: slideIn .4s var(--ease);
}
.alert.urgent { border-left-color: var(--terracotta); background: linear-gradient(90deg, var(--terracotta-soft) 0%, var(--surface) 30%); }
.alert.info { border-left-color: var(--azulejo); }
.alert-ico {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--ochre-soft); color: var(--terracotta-deep);
  display: grid; place-items: center; flex-shrink: 0;
}
.alert.urgent .alert-ico { background: var(--terracotta-soft); }
.alert.info .alert-ico { background: var(--azulejo-soft); color: var(--azulejo); }
.alert-body { flex: 1; min-width: 0; }
.alert-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 2px; }
.alert-sub { font-size: 12px; color: var(--ink-mute); line-height: 1.4; }
@keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

/* =========================================================
   AHORA — current event mega card
   ========================================================= */
.now-card {
  position: relative;
  margin-bottom: 18px;
  padding: 20px 18px;
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, #FFFCF4 0%, var(--surface) 100%);
  box-shadow: var(--shadow-glow);
  border: 1px solid rgba(196,90,56,.15);
  overflow: hidden;
}
.now-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--terracotta), var(--terracotta-deep));
}
.now-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--terracotta); color: #fff;
  font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
}
.now-tag .live {
  width: 6px; height: 6px; border-radius: 50%;
  background: #fff; animation: pulse 1.5s infinite;
}
.now-time {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  color: var(--terracotta-deep); margin-left: 10px; letter-spacing: .04em;
}
.now-title {
  font-family: var(--serif); font-size: 26px; font-weight: 600;
  letter-spacing: -.01em; margin: 10px 0 6px; line-height: 1.2;
}
.now-desc { font-size: 14px; color: var(--ink-soft); line-height: 1.55; margin-bottom: 14px; }
.now-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.now-tags { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Action chips ---------- */
.act {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 600; letter-spacing: -.005em;
  transition: transform .15s var(--ease), background .2s, box-shadow .2s;
  white-space: nowrap;
}
.act:active { transform: scale(.97); }
.act svg { width: 14px; height: 14px; }
.act.primary { background: var(--azulejo); color: #fff; box-shadow: 0 2px 6px rgba(30,77,107,.25); }
.act.primary:hover { background: var(--azulejo-deep); }
.act.secondary { background: var(--terracotta-soft); color: var(--terracotta-deep); }
.act.secondary:hover { background: #ecc7b8; }
.act.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
.act.ghost:hover { background: var(--bg-soft); }

.tag {
  display: inline-flex; padding: 3px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
.tag.reservada { background: var(--olive-soft); color: var(--olive); }
.tag.reservar { background: var(--terracotta-soft); color: var(--terracotta-deep); }
.tag.imprescindible { background: var(--ochre-soft); color: #8a6a2a; }
.tag.opcional { background: var(--line-soft); color: var(--ink-mute); }
.tag.especial { background: #ead7e5; color: var(--plum); }
.tag.critico { background: #fde0d6; color: var(--terracotta-deep); }

/* =========================================================
   TIMELINE (compact / current / future / past)
   ========================================================= */
.timeline { display: flex; flex-direction: column; gap: 6px; }

/* shared event base */
.event {
  position: relative;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  transition: all .25s var(--ease);
  cursor: pointer;
  overflow: hidden;
}
.event-head {
  display: flex; align-items: center; gap: 10px;
  min-width: 0;
}
.event-time {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--ink-mute); letter-spacing: .02em;
  min-width: 38px; text-align: right; flex-shrink: 0;
}
.event-icon {
  width: 26px; height: 26px; border-radius: 7px;
  display: grid; place-items: center; flex-shrink: 0;
  background: var(--bg-soft); color: var(--ink-mute);
}
.event-icon svg { width: 14px; height: 14px; }
.event-title {
  font-size: 13.5px; font-weight: 600; line-height: 1.3;
  flex: 1; min-width: 0; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
}
.event-caret {
  width: 16px; height: 16px; color: var(--ink-faint);
  transition: transform .3s var(--ease);
  flex-shrink: 0;
}
.event.open .event-caret { transform: rotate(180deg); }

.event-body {
  max-height: 0; opacity: 0;
  overflow: hidden;
  transition: max-height .35s var(--ease), opacity .25s var(--ease), padding .3s var(--ease);
  padding: 0 0 0 48px;
}
.event.open .event-body { max-height: 600px; opacity: 1; padding: 10px 0 4px 48px; }
.event-desc { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin-bottom: 10px; }
.event-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.event-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.event-actions .act { padding: 7px 12px; font-size: 12px; }

/* state: past (small, dim, no expand) */
.event.past {
  background: transparent;
  border: 1px dashed var(--line);
  padding: 6px 12px;
  opacity: .55;
}
.event.past .event-time { font-size: 10px; }
.event.past .event-icon { width: 18px; height: 18px; border-radius: 5px; background: transparent; }
.event.past .event-icon svg { width: 10px; height: 10px; }
.event.past .event-title { font-size: 12px; font-weight: 500; color: var(--ink-mute); text-decoration: line-through; text-decoration-color: var(--line); }
.event.past .event-caret { display: none; }
.event.past .event-body { display: none; }
.event.past .event-check {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--olive); color: #fff;
  display: grid; place-items: center; flex-shrink: 0;
  margin-left: 6px;
}
.event.past .event-check svg { width: 10px; height: 10px; }

/* state: current */
.event.current {
  background: linear-gradient(180deg, #FFFCF4 0%, var(--surface) 100%);
  border: 1px solid rgba(196,90,56,.2);
  box-shadow: var(--shadow-glow);
  padding: 16px 18px;
}
.event.current .event-time { color: var(--terracotta-deep); font-size: 12px; font-weight: 700; }
.event.current .event-icon {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--terracotta); color: #fff;
}
.event.current .event-icon svg { width: 17px; height: 17px; }
.event.current .event-title { font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.25; -webkit-line-clamp: 2; }
.event.current .event-caret { display: none; }
.event.current .event-body { max-height: 600px; opacity: 1; padding: 12px 0 4px 50px; }
.event.current .event-desc { color: var(--ink-soft); font-size: 13.5px; }
.event.current::after {
  content: 'AHORA'; position: absolute; top: 14px; right: 14px;
  font-size: 9px; font-weight: 700; letter-spacing: .18em;
  padding: 3px 8px; border-radius: 999px;
  background: var(--terracotta); color: #fff;
}

/* state: future (default compact, expands on tap) */
.event.future { background: var(--surface); border: 1px solid var(--line-soft); }
.event.future:hover { background: var(--bg-soft); border-color: var(--line); }
.event.future.next { border-color: rgba(30,77,107,.2); background: linear-gradient(90deg, var(--azulejo-soft) 0%, var(--surface) 30%); }
.event.future.next::after {
  content: 'PRÓXIMO'; position: absolute; top: 8px; right: 10px;
  font-size: 8px; font-weight: 700; letter-spacing: .14em;
  padding: 2px 6px; border-radius: 999px;
  background: var(--azulejo); color: #fff;
}

/* event icon type colors */
.event-icon.flight { background: var(--azulejo-soft); color: var(--azulejo); }
.event-icon.drive { background: #f0e0d0; color: #8a5a2a; }
.event-icon.hotel { background: var(--olive-soft); color: var(--olive); }
.event-icon.food { background: var(--terracotta-soft); color: var(--terracotta-deep); }
.event-icon.coffee { background: #f1e3d2; color: #8a5a3a; }
.event-icon.monument { background: var(--ochre-soft); color: #8a6a2a; }
.event-icon.walk { background: var(--olive-soft); color: var(--olive); }
.event-icon.sunset { background: #fde4c8; color: #b86a2a; }
.event-icon.shop { background: #ead7e5; color: var(--plum); }
.event-icon.rest { background: var(--line-soft); color: var(--ink-mute); }
.event-icon.tour { background: var(--azulejo-soft); color: var(--azulejo); }
.event-icon.reservation { background: var(--terracotta); color: #fff; }

/* ---------- Choice event (A/B) ---------- */
.choice {
  margin: 6px 0; padding: 12px 14px;
  border-radius: var(--r); background: var(--surface);
  border: 1px dashed var(--azulejo); position: relative;
}
.choice-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--azulejo); margin-bottom: 10px;
}
.choice-head .event-time { color: var(--azulejo); font-weight: 700; }
.choice-options { display: grid; gap: 8px; }
.choice-opt {
  display: flex; gap: 12px; padding: 11px 12px;
  border-radius: 10px; background: var(--bg-soft);
  border: 1px solid var(--line-soft); cursor: pointer;
  transition: all .2s var(--ease); text-align: left; width: 100%;
}
.choice-opt:hover { background: #f3ead2; }
.choice-opt-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--azulejo); display: block; margin-bottom: 2px; }
.choice-opt-title { font-size: 13.5px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
.choice-opt-desc { font-size: 12px; color: var(--ink-mute); line-height: 1.4; }
.choice-opt-ico {
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center; flex-shrink: 0;
}
.choice-opt-ico svg { width: 15px; height: 15px; }
.choice.picked .choice-opt:not(.selected) { opacity: .35; }
.choice.picked .choice-opt.selected { background: var(--surface); border-color: var(--azulejo); box-shadow: var(--shadow-sm); }
.choice .undo {
  margin-top: 10px; font-size: 11px; color: var(--ink-mute);
  text-decoration: underline; cursor: pointer; display: none;
}
.choice.picked .undo { display: inline; }

/* ---------- Past events collapsed group ---------- */
.past-group {
  margin: 6px 0 10px; padding: 10px 14px;
  border-radius: 12px; background: transparent;
  border: 1px dashed var(--line);
  cursor: pointer; transition: background .2s;
}
.past-group:hover { background: var(--bg-soft); }
.past-group-head {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--ink-mute); font-weight: 500;
}
.past-group-count {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--olive); color: #fff;
  font-size: 11px; font-weight: 700;
}
.past-group-list { display: none; margin-top: 8px; }
.past-group.open .past-group-list { display: flex; flex-direction: column; gap: 4px; }
.past-group .arrow { margin-left: auto; transition: transform .25s; }
.past-group.open .arrow { transform: rotate(180deg); }

/* =========================================================
   DAY DECK (Hoy + Días page card)
   ========================================================= */
.day-deck {
  margin-bottom: 18px;
  padding: 18px 18px 16px;
  border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--line-soft);
  position: relative;
  overflow: hidden;
}
.day-deck .day-num {
  position: absolute; top: 14px; right: 16px;
  font-family: var(--serif); font-size: 14px; font-style: italic;
  color: var(--ink-faint); letter-spacing: .04em;
}
.day-deck-date {
  font-size: 11px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--terracotta);
  margin-bottom: 8px;
}
.day-bundle {
  display: flex; align-items: flex-start; gap: 14px;
  margin-bottom: 4px;
}
.day-bundle-ico {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--ochre-soft), var(--terracotta-soft));
  color: var(--terracotta-deep);
  display: grid; place-items: center; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(196,90,56,.15);
}
.day-bundle-ico svg { width: 22px; height: 22px; }
.day-bundle-text { flex: 1; min-width: 0; }
.day-bundle-city {
  font-family: var(--serif); font-size: 26px; font-weight: 600;
  letter-spacing: -.01em; line-height: 1.15; color: var(--ink);
}
.day-bundle-activity {
  font-family: var(--serif); font-style: italic; font-size: 16px;
  color: var(--azulejo); margin-top: 2px; font-weight: 500;
  line-height: 1.3;
}
.day-tone {
  margin-top: 12px; padding: 10px 12px;
  background: var(--bg-soft); border-radius: 10px;
  font-size: 12.5px; color: var(--ink-soft); line-height: 1.45;
  font-style: italic;
}
.day-route {
  margin-top: 10px; display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--ink-mute);
}
.day-route svg { width: 14px; height: 14px; }

/* =========================================================
   ESTA NOCHE / hotel mini card
   ========================================================= */
.tonight {
  margin-top: 18px; padding: 16px;
  border-radius: var(--r); background: var(--surface);
  border: 1px solid var(--line-soft); box-shadow: var(--shadow-sm);
}
.tonight-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .16em;
  color: var(--olive); text-transform: uppercase; margin-bottom: 10px;
}
.tonight-head svg { width: 14px; height: 14px; }
.tonight-name { font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.2; margin-bottom: 4px; }
.tonight-meta { font-size: 12px; color: var(--ink-mute); margin-bottom: 12px; }
.tonight-code {
  display: flex; align-items: center; gap: 10px;
  margin: 10px 0; padding: 10px 12px;
  background: var(--bg-soft); border-radius: 10px;
  border-left: 3px solid var(--ochre);
}
.tonight-code-label {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  color: var(--ink-mute); text-transform: uppercase;
}
.tonight-code-val {
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  color: var(--ink); margin-top: 2px;
  word-break: break-all; line-height: 1.3;
}
.tonight-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* copy button */
.copy-btn {
  margin-left: auto; flex-shrink: 0;
  padding: 6px 10px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 11px; font-weight: 600; color: var(--ink-soft);
  display: inline-flex; align-items: center; gap: 4px;
  transition: all .15s var(--ease);
}
.copy-btn:hover { background: var(--bg); }
.copy-btn.copied { background: var(--olive); color: #fff; border-color: var(--olive); }
.copy-btn svg { width: 11px; height: 11px; }

/* enlarge modal trigger */
.code-enlarge {
  display: inline-flex; padding: 4px; margin-left: 4px;
  color: var(--ink-mute);
}
.code-enlarge svg { width: 12px; height: 12px; }

/* =========================================================
   DAYS LIST PAGE
   ========================================================= */
.days-list { display: flex; flex-direction: column; gap: 12px; }
.day-row {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
  padding: 14px; border-radius: var(--r); background: var(--surface);
  border: 1px solid var(--line-soft); box-shadow: var(--shadow-sm);
  cursor: pointer; transition: all .2s var(--ease);
}
.day-row:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.day-row.past { opacity: .55; }
.day-row.current { border-color: rgba(196,90,56,.3); box-shadow: var(--shadow-glow); }
.day-row-date {
  text-align: center; padding: 6px 0;
  border-radius: 10px; background: var(--bg-soft);
}
.day-row.current .day-row-date { background: var(--terracotta); color: #fff; }
.day-row-day { font-size: 18px; font-weight: 700; line-height: 1; font-family: var(--serif); }
.day-row-month { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-top: 2px; }
.day-row-body { min-width: 0; }
.day-row-city { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.2; }
.day-row-activity { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--azulejo); margin-top: 1px; }
.day-row-ico { color: var(--ink-faint); }
.day-row-ico svg { width: 22px; height: 22px; }

/* =========================================================
   HOTELES PAGE
   ========================================================= */
.hotels-list { display: flex; flex-direction: column; gap: 10px; }
.hotel-card {
  padding: 14px 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line-soft);
  box-shadow: var(--shadow-sm); transition: all .25s var(--ease);
  position: relative; overflow: hidden;
}
.hotel-card.past {
  opacity: .48; padding: 9px 14px;
  background: transparent; border: 1px dashed var(--line);
  cursor: pointer;
}
.hotel-card.past .hotel-body { display: none; }
.hotel-card.past.open .hotel-body { display: block; opacity: 1; margin-top: 10px; }
.hotel-card.past.open { opacity: .85; padding: 14px 16px; background: var(--surface); border-style: solid; }
.hotel-card.current {
  border: 1px solid rgba(196,90,56,.25);
  box-shadow: var(--shadow-glow);
  background: linear-gradient(180deg, #FFFCF4 0%, var(--surface) 100%);
}
.hotel-card.current::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--terracotta), var(--terracotta-deep));
}
.hotel-card.future { border-color: var(--line); }
.hotel-card.future.next { border-color: rgba(30,77,107,.2); background: linear-gradient(90deg, var(--azulejo-soft) 0%, var(--surface) 40%); }

.hotel-head {
  display: flex; align-items: flex-start; gap: 12px;
}
.hotel-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px;
  background: var(--bg-soft); color: var(--ink-mute);
  font-size: 10px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; margin-bottom: 4px;
}
.hotel-card.current .hotel-pill { background: var(--terracotta); color: #fff; }
.hotel-card.next .hotel-pill { background: var(--azulejo); color: #fff; }
.hotel-city {
  font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-mute);
}
.hotel-card.current .hotel-city { color: var(--terracotta-deep); }
.hotel-name { font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
.hotel-card.past .hotel-name { font-size: 14px; }
.hotel-card.past.open .hotel-name { font-size: 18px; }
.hotel-meta { font-size: 12px; color: var(--ink-mute); margin-top: 4px; }
.hotel-nights {
  text-align: right; font-family: var(--serif); font-size: 13px;
  font-style: italic; color: var(--ink-mute); flex-shrink: 0;
}
.hotel-nights .num { font-size: 22px; font-style: normal; font-weight: 600; color: var(--ink); display: block; line-height: 1; }
.hotel-body { margin-top: 12px; }
.hotel-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.hotel-code {
  margin-top: 10px; padding: 10px 12px;
  background: var(--bg-soft); border-radius: 10px;
  border-left: 3px solid var(--ochre);
  display: flex; align-items: center; gap: 10px;
}
.hotel-code-block { flex: 1; min-width: 0; }
.hotel-code-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--ink-mute); text-transform: uppercase; }
.hotel-code-val { font-family: var(--mono); font-size: 13px; font-weight: 600; margin-top: 2px; word-break: break-all; line-height: 1.3; }

/* =========================================================
   INFO PAGE — accordions
   ========================================================= */
.info-list { display: flex; flex-direction: column; gap: 10px; }
.acc {
  border-radius: var(--r); background: var(--surface);
  border: 1px solid var(--line-soft); box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.acc-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; cursor: pointer; width: 100%;
  text-align: left; transition: background .2s;
}
.acc-head:hover { background: var(--bg-soft); }
.acc-ico {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--ochre-soft); color: #8a6a2a;
  display: grid; place-items: center; flex-shrink: 0;
}
.acc-ico svg { width: 17px; height: 17px; }
.acc-title { font-family: var(--serif); font-size: 17px; font-weight: 600; flex: 1; line-height: 1.2; }
.acc-arrow {
  width: 18px; height: 18px; color: var(--ink-faint);
  transition: transform .3s var(--ease);
}
.acc.open .acc-arrow { transform: rotate(180deg); }
.acc-body {
  max-height: 0; opacity: 0; overflow: hidden;
  transition: max-height .4s var(--ease), opacity .25s var(--ease);
  padding: 0 16px;
}
.acc.open .acc-body { max-height: 3000px; opacity: 1; padding: 4px 16px 16px; }

.res-list { display: flex; flex-direction: column; gap: 10px; }
.res-item {
  padding: 12px; border-radius: 10px; background: var(--bg-soft);
  border-left: 3px solid var(--olive);
}
.res-item.pending { border-left-color: var(--terracotta); background: var(--terracotta-soft); }
.res-item.urgent { border-left-color: var(--terracotta-deep); }
.res-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.res-name { font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.2; }
.res-status {
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  padding: 3px 8px; border-radius: 6px;
  text-transform: uppercase; flex-shrink: 0;
}
.res-status.ok { background: var(--olive); color: #fff; }
.res-status.todo { background: var(--terracotta); color: #fff; }
.res-detail { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin: 6px 0; }
.res-foot { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--ink-mute); margin-top: 8px; flex-wrap: wrap; }

.tip-list { display: flex; flex-direction: column; gap: 10px; }
.tip {
  padding: 10px 12px; background: var(--bg-soft);
  border-radius: 10px; border-left: 3px solid var(--azulejo);
}
.tip strong { color: var(--ink); }
.tip-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--azulejo); margin-bottom: 4px; }
.tip-body { font-size: 13px; line-height: 1.55; color: var(--ink-soft); }

/* ---------- Note cards (within timeline view) ---------- */
.notes-block { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.note {
  padding: 10px 12px; border-radius: 10px;
  background: var(--ochre-soft); border-left: 3px solid var(--ochre);
}
.note-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a6a2a; margin-bottom: 4px; }
.note-body { font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); }
.note-body strong { color: var(--ink); }

/* =========================================================
   TABBAR
   ========================================================= */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 560px; z-index: 60;
  padding: 8px 14px calc(8px + var(--safe-bottom));
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line-soft);
  display: flex; justify-content: space-around;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 8px; border-radius: 12px;
  color: var(--ink-mute); transition: all .2s var(--ease);
}
.tab.active { color: var(--terracotta-deep); }
.tab svg { width: 22px; height: 22px; transition: transform .2s var(--ease); }
.tab.active svg { transform: scale(1.1); }
.tab-label { font-size: 10px; font-weight: 600; letter-spacing: .04em; }

/* =========================================================
   EMERGENCY FAB
   ========================================================= */
.fab {
  position: fixed; right: 20px; bottom: calc(78px + var(--safe-bottom)); z-index: 70;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--terracotta); color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(196,90,56,.4);
  transition: transform .2s var(--ease);
  animation: fabIn .5s var(--ease-spring) .3s both;
}
@keyframes fabIn { from{transform:scale(0)} to{transform:scale(1)} }
.fab:hover { transform: scale(1.05); }
.fab:active { transform: scale(.92); }
.fab svg { width: 22px; height: 22px; }

/* =========================================================
   MODAL
   ========================================================= */
.modal-bg {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(27,24,20,.45);
  backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn .25s var(--ease);
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--r-lg);
  padding: 24px 20px; max-width: 440px; width: 100%;
  box-shadow: var(--shadow-lg);
  animation: modalIn .35s var(--ease-spring);
}
@keyframes modalIn { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
.modal-title { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.modal-sub { font-size: 12px; color: var(--ink-mute); margin-bottom: 18px; }
.modal-code {
  font-family: var(--mono); font-size: 26px; font-weight: 600;
  text-align: center; padding: 18px; border-radius: 12px;
  background: var(--bg-soft); margin-bottom: 14px;
  word-break: break-all; line-height: 1.35; letter-spacing: .02em;
}
.modal-actions { display: flex; gap: 8px; }
.modal-actions .act { flex: 1; justify-content: center; }

.emergency-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.emergency-item {
  padding: 12px 14px; border-radius: 12px;
  background: var(--bg-soft);
  display: flex; align-items: center; gap: 12px;
}
.emergency-ico {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--terracotta-soft); color: var(--terracotta-deep);
  display: grid; place-items: center; flex-shrink: 0;
}
.emergency-body { flex: 1; min-width: 0; }
.emergency-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
.emergency-num { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); margin-top: 2px; }

/* =========================================================
   TABLET (768+) — wider single column with breathing room
   ========================================================= */
@media (min-width: 768px) {
  .app { max-width: 720px; padding: 0 0 calc(110px + var(--safe-bottom)); }
  .topbar { max-width: 720px; padding: calc(var(--safe-top) + 16px) 32px 12px; }
  .screen { padding: calc(var(--safe-top) + 90px) 28px 32px; }
  .tabbar { max-width: 720px; padding: 10px 32px calc(10px + var(--safe-bottom)); }
  .brand-title { font-size: 26px; }
  .hero { padding: 28px 28px 24px; }
  .hero-title { font-size: 34px; }
  .day-bundle-city { font-size: 32px; }
  .day-bundle-activity { font-size: 18px; }
  .now-title { font-size: 30px; }
  .event.current .event-title { font-size: 22px; }
}

/* =========================================================
   DESKTOP (1100+) — 2-column grid where useful
   ========================================================= */
@media (min-width: 1100px) {
  .app { max-width: 1180px; padding: 0 24px calc(40px + var(--safe-bottom)); }
  .topbar {
    max-width: 1180px; padding: calc(var(--safe-top) + 18px) 40px 14px;
    background: linear-gradient(180deg, rgba(247,241,227,.96) 0%, rgba(247,241,227,.85) 80%, rgba(247,241,227,0) 100%);
  }
  .screen { padding: calc(var(--safe-top) + 96px) 40px 40px; }
  .tabbar {
    max-width: none; left: 0; right: 0; transform: none;
    background: rgba(255,255,255,.95);
  }
  .tabbar-inner { max-width: 1180px; margin: 0 auto; display: flex; justify-content: center; gap: 24px; }
  .tab { flex: 0 0 auto; min-width: 90px; flex-direction: row; padding: 8px 18px; }
  .tab svg { width: 18px; height: 18px; }
  .hero { padding: 36px 32px 28px; }
  .hero-title { font-size: 40px; }

  /* 2-column Hoy layout */
  .hoy-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    align-items: start;
  }
  .hoy-col-main { grid-column: 1; }
  .hoy-col-side { grid-column: 2; position: sticky; top: 110px; }
  .day-deck { padding: 26px 26px 22px; }
  .day-bundle-city { font-size: 38px; }
  .day-bundle-activity { font-size: 20px; }

  /* Hoteles grid */
  .hotels-list { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .days-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fab { right: 32px; bottom: 90px; }
}

@media (min-width: 1400px) {
  .app { max-width: 1320px; }
  .topbar, .tabbar-inner { max-width: 1320px; }
  .hotels-list, .days-list { grid-template-columns: repeat(3, 1fr); }
}

/* utility */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.flash {
  animation: flash .5s var(--ease);
}
@keyframes flash {
  0% { background: var(--olive-soft); }
  100% { background: transparent; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== TOP BAR ===== -->
  <header class="topbar" id="topbar">

  </div></nav>

</div>

<!-- ===== MODAL ===== -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<script>

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoToDate(iso){ const[y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function isoDiffDays(a,b){ return Math.round((isoToDate(b)-isoToDate(a))/86400000); }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function timeToMin(t){ if(!t) return 0; const[h,m]=t.split(':').map(Number); return h*60+(m||0); }
function dayIndex(iso){ return DAYS.findIndex(d=>d.iso===iso); }
const M_LONG = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const M_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtLong(iso){ const d=isoToDate(iso); return `${d.getDate()} de ${M_LONG[d.getMonth()]}`; }
function fmtShort(iso){ const d=isoToDate(iso); return `${d.getDate()} ${M_SHORT[d.getMonth()]}`; }
function hotelById(id){ return HOTELS.find(h=>h.id===id); }
function activeDayIso(){
  const t = todayIso();
  if (isoDiffDays(t, TRIP.startISO) > 0) return TRIP.startISO;
  if (isoDiffDays(t, TRIP.endISO) < 0)   return TRIP.endISO;
  const idx = dayIndex(t);
  return idx >= 0 ? t : TRIP.startISO;
}
function mapsUrl(query){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query); }
function hotelMapsUrl(h){ return mapsUrl(h.mapsQuery || (h.name + ' ' + h.address)); }
function telUrl(p){ return 'tel:' + p.replace(/\s+/g,''); }
function mailUrl(e){ return 'mailto:' + e; }
function webUrl(w){ return w.startsWith('http') ? w : 'https://' + w; }

/* =========================================================

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (btn) {
      btn.classList.add('copied');
      const orig = btn.innerHTML;
      btn.innerHTML = svg('check') + 'Copiado';
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1500);
    }
  });
}
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}
document.getElementById('modalBg').addEventListener('click', e => {

});
function enlargeCode(label, code) {

}

   ALERTS
   ========================================================= */
function buildAlerts() {
  const today = todayIso();
  const alerts = [];
  const tIdx = dayIndex(today);
  if (tIdx >= 0 && tIdx < DAYS.length - 1) {
    const tomorrow = DAYS[tIdx + 1];
    if (tomorrow.iso === '2026-06-07') {
      alerts.push({ icon:'ticket', kind:'urgent', title:'Mañana es La Alhambra', sub:'Llevar pasaportes. Los Palacios no admiten retraso.' });
    }
    if (tomorrow.drive && parseInt((tomorrow.drive.dist.match(/(\d+)/)||[0,0])[1],10) > 200) {
      alerts.push({ icon:'car', kind:'info', title:`Mañana traslado largo · ${tomorrow.drive.dist}`, sub:`De ${tomorrow.drive.from} a ${tomorrow.drive.to}. Tanque lleno y desayuno temprano.` });
    }
  }
  if (tIdx >= 0) {
    const td = DAYS[tIdx];
    if (td.packHint) alerts.push({ icon:'pack', kind:'info', title:td.packHint.title, sub:td.packHint.items.join(' · ') });
  }
  return alerts;
}

/* =========================================================
   EVENT RENDERERS
   ========================================================= */
function eventKey(dayIso, evIdx) { return `${dayIso}#${evIdx}`; }

function renderEventBody(e, dayIso) {
  const parts = [];
  if (e.desc) parts.push(`<div class="event-desc">${e.desc}</div>`);
  const tags = (e.tags || []).map(t => `<span class="tag ${t}">${t}</span>`).join('');
  if (tags) parts.push(`<div class="event-meta">${tags}</div>`);
  const actions = [];
  if (e.hotel) {
    const h = hotelById(e.hotel);
    if (h) {
      actions.push(`<a class="act primary" href="${hotelMapsUrl(h)}" target="_blank" rel="noopener">${svg('maps')}Cómo llegar</a>`);
      actions.push(`<a class="act secondary" href="${telUrl(h.phone)}">${svg('phone')}Llamar</a>`);
    }
  } else if (e.maps) {
    actions.push(`<a class="act primary" href="${mapsUrl(e.maps)}" target="_blank" rel="noopener">${svg('maps')}Cómo llegar</a>`);
  }
  if (e.price) actions.push(`<span class="act ghost">${e.price}</span>`);
  if (actions.length) parts.push(`<div class="event-actions">${actions.join('')}</div>`);
  return parts.join('');
}

function renderEvent(e, dayIso, evIdx, status, isNext) {
  const key = eventKey(dayIso, evIdx);
  const open = status === 'current' || status === 'past-done' ? true : !!state.expanded[key];
  const showCaret = status === 'future';
  const cls = `event ${status}${open && status === 'future' ? ' open' : ''}${isNext ? ' next' : ''}`;
  const icoCls = `event-icon ${e.type || ''}`;
  const ico = svg(e.type) || svg('rest');
  const time = e.time || '';
  const checkMark = status === 'past'
    ? `<span class="event-check" title="Hecho">${svg('check')}</span>` : '';
  const caret = showCaret ? `<svg class="event-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I.caret}</svg>` : '';
  const body = (status === 'current' || (status === 'future' && open))
    ? `<div class="event-body">${renderEventBody(e, dayIso)}</div>`
    : (status === 'future' ? `<div class="event-body">${renderEventBody(e, dayIso)}</div>` : '');
  return `
    <div class="${cls}" data-event-key="${key}" data-status="${status}">
      <div class="event-head">
        <span class="event-time">${time}</span>
        <span class="${icoCls}">${ico}</span>
        <span class="event-title">${e.title || ''}</span>
        ${checkMark}
        ${caret}
      </div>
      ${body}
    </div>
  `;
}

function renderChoice(c, dayIso, evIdx, status) {
  const key = eventKey(dayIso, evIdx);
  const picked = state.choices[key];
  const isPicked = !!picked;
  const opts = c.options.map(o => {
    const selected = picked === o.id;
    return `
      <button class="choice-opt ${selected ? 'selected' : ''}" data-choice-key="${key}" data-opt-id="${o.id}">
        <span class="choice-opt-ico event-icon ${o.type}">${svg(o.type) || svg('walk')}</span>
        <span style="flex:1;min-width:0">
          <span class="choice-opt-label">Opción ${o.id.toUpperCase()}</span>
          <span class="choice-opt-title">${o.title}</span>
          <span class="choice-opt-desc">${o.desc || ''}</span>
        </span>
      </button>
    `;
  }).join('');
  return `
    <div class="choice ${isPicked ? 'picked' : ''}" data-status="${status}">
      <div class="choice-head"><span class="event-time">${c.time || ''}</span><span>${c.label || 'Elige tu próximo paso'}</span></div>
      <div class="choice-options">${opts}</div>
      <span class="undo" data-undo-key="${key}">Cambiar elección</span>
    </div>
  `;
}

function eventStatus(dayIso, ev, now) {
  if (dayIso < now.iso) return 'past';
  if (dayIso > now.iso) return 'future';
  // same day
  const evMin = timeToMin(ev.time || '00:00');
  const cur = now.min;
  if (evMin + 60 < cur) return 'past';   // assume each event ~1h
  if (evMin <= cur && cur <= evMin + 60) return 'current';
  return 'future';
}

/* =========================================================
   TIMELINE (Hoy)
   ========================================================= */
function renderTimeline(day) {
  if (!day.events.length) {
    return `<div style="text-align:center;padding:30px 20px;color:var(--ink-mute);font-style:italic;font-family:var(--serif);font-size:16px">${day.tone || 'Sin programación hoy.'}</div>`;
  }
  const today = todayIso();
  const now = { iso: today, min: nowMin() };
  const isToday = day.iso === today;

  // determine statuses
  const items = day.events.map((e, i) => {
    if (e.kind === 'choice') {
      const picked = state.choices[eventKey(day.iso, i)];
      const status = !isToday ? (day.iso < today ? 'past' : 'future')
        : (picked ? 'past' : 'current');
      return { kind:'choice', e, idx:i, status };
    }
    let status;
    if (!isToday) status = (day.iso < today ? 'past' : 'future');
    else status = eventStatus(day.iso, e, now);
    return { kind:'event', e, idx:i, status };
  });

  // ensure at most one current; mark next future
  if (isToday) {
    let foundCurrent = false;
    for (let i = items.length-1; i >= 0; i--) {
      if (items[i].status === 'current') {
        if (foundCurrent) items[i].status = 'past';
        else foundCurrent = true;
      }
    }
    if (!foundCurrent) {
      // pick the next future as "next"
      const fi = items.findIndex(x => x.status === 'future');
      if (fi >= 0) items[fi].isNext = true;
    } else {
      const ci = items.findIndex(x => x.status === 'current');
      const fi = items.findIndex((x,i) => i>ci && x.status === 'future');
      if (fi >= 0) items[fi].isNext = true;
    }
  }

  // collapse past block (if not all past)
  const pastItems = items.filter(x => x.status === 'past');
  const livePastBlock = isToday && pastItems.length >= 2;
  const html = [];
  if (livePastBlock) {
    const openCls = state.openPast ? 'open' : '';
    html.push(`
      <div class="past-group ${openCls}" id="pastGroup">
        <div class="past-group-head">
          <span class="past-group-count">${pastItems.length}</span>
          <span>Ya hecho hoy</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I.caret}</svg>
        </div>
        <div class="past-group-list">
          ${pastItems.map(x => x.kind==='event' ? renderEvent(x.e, day.iso, x.idx, 'past', false) : '').join('')}
        </div>
      </div>
    `);
    items.forEach(x => {
      if (x.status === 'past') return;
      if (x.kind === 'choice') html.push(renderChoice(x.e, day.iso, x.idx, x.status));
      else html.push(renderEvent(x.e, day.iso, x.idx, x.status, !!x.isNext));
    });
  } else {
    items.forEach(x => {
      if (x.kind === 'choice') html.push(renderChoice(x.e, day.iso, x.idx, x.status));
      else html.push(renderEvent(x.e, day.iso, x.idx, x.status, !!x.isNext));
    });
  }
  return `<div class="timeline">${html.join('')}</div>`;
}

   DAY DECK (top of Hoy)

/* =========================================================
   HOY SCREEN
   ========================================================= */
function renderHoy() {
  const iso = activeDayIso();
  const day = DAYS[dayIndex(iso)] || DAYS[0];
  const isDesktop = (window.matchMedia && window.matchMedia('(min-width: 1100px)').matches) || false;
  const today = todayIso();
  const isPre = isoDiffDays(today, TRIP.startISO) > 0;

  const heroBlock = isPre
    ? `<div class="hero">
        <div class="hero-eyebrow">${isoDiffDays(today, TRIP.startISO)} días para empezar</div>
        <div class="hero-title">Andalucía <em>&amp;</em> Castilla</div>
        <div class="hero-sub">${TRIP.cities.join(' · ')}</div>
        <div class="hero-meta"><span>25 may – 11 jun 2026</span><span>18 días · 9 ciudades</span></div>
      </div>`
    : '';

  const main = `
    ${heroBlock}
    ${renderAlerts()}
    ${renderDayDeck(day)}
    <div class="sec-head"><h2>Hoy</h2><span class="sec-sub">${day.events.length} momentos</span></div>
    ${renderTimeline(day)}
  `;
  const side = renderTonight(day);

  const screen = document.getElementById('screenHoy');
  if (isDesktop && side) {
    screen.innerHTML = `<div class="hoy-grid">
      <div class="hoy-col-main">${main}</div>
      <div class="hoy-col-side">${side}</div>
    </div>`;
  } else {
    screen.innerHTML = main + side;
  }
  attachHoyHandlers();
}

function attachHoyHandlers() {
  document.querySelectorAll('.event.future').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('a') || e.target.closest('button')) return;
      const k = el.dataset.eventKey;
      state.expanded[k] = !state.expanded[k];
      saveState();
      el.classList.toggle('open');
    });
  });
  document.querySelectorAll('.choice-opt').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.choiceKey;
      state.choices[k] = el.dataset.optId;
      saveState();
      renderHoy();
    });
  });
  document.querySelectorAll('.undo').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.undoKey;
      delete state.choices[k];
      saveState();
      renderHoy();
    });
  });
  const pg = document.getElementById('pastGroup');
  if (pg) pg.addEventListener('click', () => {
    state.openPast = !state.openPast;
    saveState();
    pg.classList.toggle('open');
  });
}

        <div class="event-head">
          <span class="event-time">${e.time||''}</span>
          <span class="event-icon ${e.type||''}">${svg(e.type)||svg('rest')}</span>

      ${d.drive ? `<div class="day-route" style="margin-bottom:12px">${svg('car')}<span>${d.drive.from} → ${d.drive.to} · ${d.drive.dist}${d.drive.time ? ' · ' + d.drive.time : ''}</span></div>` : ''}
      ${d.tone ? `<div class="day-tone" style="margin-bottom:14px">${d.tone}</div>` : ''}
      <div class="timeline">${evHtml}</div>
      ${notesHtml ? `<div class="notes-block">${notesHtml}</div>` : ''}
    </div>
    <div class="modal-actions" style="margin-top:14px"><button class="act ghost" style="flex:1;justify-content:center" onclick="closeModal()">Cerrar</button></div>
  `);
  // attach choice handlers within modal
  document.querySelectorAll('#modalContent .choice-opt').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.choiceKey;
      state.choices[k] = el.dataset.optId;
      saveState();
      openDayDetail(iso);
    });
  });
}

/* =========================================================
   HOTELES SCREEN
   ========================================================= */
function hotelStatus(h) {
  const today = todayIso();
  // find the day window for this hotel
  const days = DAYS.filter(d => d.hotel === h.id);
  if (!days.length) return 'future';
  const first = days[0].iso, last = days[days.length-1].iso;
  if (today > last) return 'past';
  if (today >= first && today <= last) return 'current';
  return 'future';
}
function renderHoteles() {
  let nextMarked = false;
  const today = todayIso();
  const cards = HOTELS.map(h => {
    let status = hotelStatus(h);
    let isNext = false;
    if (!nextMarked && status === 'future') { isNext = true; nextMarked = true; }
    const open = status === 'past' ? !!state.openHotel[h.id] : true;
    const pillTxt = status === 'current' ? 'Aquí ahora' : status === 'past' ? 'Ya estuviste' : (isNext ? 'Próximo' : 'Próximo destino');
    const body = `
      <div class="hotel-body">
        <div class="hotel-meta">${h.address}</div>
        <div class="hotel-code">
          <div class="hotel-code-block">
            <div class="hotel-code-label">${h.codeNote || 'Localizador'}</div>
            <div class="hotel-code-val">${h.code}</div>
          </div>
          <button class="copy-btn" onclick="copyToClipboard('${h.code}', this)">${svg('copy')}Copiar</button>
          <button class="code-enlarge" onclick="enlargeCode('${h.name}', '${h.code}')" aria-label="Agrandar">${svg('expand')}</button>
        </div>
        ${h.codeAlt ? `<div class="hotel-code" style="margin-top:6px">
          <div class="hotel-code-block">
            <div class="hotel-code-label">Referencia</div>
            <div class="hotel-code-val">${h.codeAlt}</div>
          </div>
          <button class="copy-btn" onclick="copyToClipboard('${h.codeAlt}', this)">${svg('copy')}Copiar</button>
        </div>` : ''}
        <div class="hotel-actions">
          <a class="act primary" href="${hotelMapsUrl(h)}" target="_blank" rel="noopener">${svg('maps')}Cómo llegar</a>
          <a class="act secondary" href="${telUrl(h.phone)}">${svg('phone')}Llamar</a>
          ${h.email ? `<a class="act ghost" href="${mailUrl(h.email)}">${svg('mail')}Email</a>` : ''}
          ${h.web ? `<a class="act ghost" href="${webUrl(h.web)}" target="_blank" rel="noopener">${svg('web')}Web</a>` : ''}
        </div>
        ${h.note ? `<div class="note" style="margin-top:10px"><div class="note-body">${h.note}</div></div>` : ''}
      </div>
    `;
    const openCls = (status === 'past' && state.openHotel[h.id]) ? ' open' : '';
    return `
      <div class="hotel-card ${status}${isNext ? ' next' : ''}${openCls}" data-hotel-id="${h.id}">
        <div class="hotel-head">
          <div style="flex:1;min-width:0">
            <span class="hotel-pill">${pillTxt}</span>
            <div class="hotel-city">${h.city}</div>
            <div class="hotel-name">${h.name}</div>
            <div class="hotel-meta" style="margin-top:2px">${h.dates}</div>
          </div>
          <div class="hotel-nights"><span class="num">${h.nights}</span>noche${h.nights>1?'s':''}</div>
        </div>
        ${(status !== 'past' || state.openHotel[h.id]) ? body : ''}
      </div>
    `;
  }).join('');
  document.getElementById('screenHoteles').innerHTML = `
    <div class="sec-head"><h2>Hoteles</h2><span class="sec-sub">9 alojamientos</span></div>
    <div class="hotels-list">${cards}</div>
  `;
  document.querySelectorAll('#screenHoteles .hotel-card.past').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('a') || e.target.closest('button')) return;
      const id = el.dataset.hotelId;
      state.openHotel[id] = !state.openHotel[id];
      saveState();
      renderHoteles();
    });
  });
}

/* =========================================================
   INFO SCREEN (accordions, all closed)
   ========================================================= */
function renderInfo() {
  const reservas = RESERVATIONS.map(r => {
    const cls = r.booked ? '' : 'pending';
    const status = r.booked ? '<span class="res-status ok">Reservada</span>' : '<span class="res-status todo">Sin reserva</span>';
    return `
      <div class="res-item ${cls}">
        <div class="res-row"><div class="res-name">${r.name}</div>${status}</div>
        <div class="res-detail">${r.detail}</div>
        <div class="res-foot">
          <span>Visita ${fmtLong(r.visitIso)}</span>
          ${r.url ? `<a class="act ghost" style="padding:5px 10px;font-size:11px" href="${r.url}" target="_blank" rel="noopener">${svg('web')}${r.actionLabel || 'Ver'}</a>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const tramos = [
    'Madrid → Toledo · 1 h corta. Salir directo del aeropuerto.',
    'Toledo → Córdoba · 3 h 30 m por la A-4 + parada en Consuegra (molinos de Don Quijote).',
    'Córdoba → Sevilla · 1 h 40 m por autopista, sin paradas.',
    'Sevilla → Carmona · 35 m. Llegada relajada al Parador.',
    'Carmona → Jerez → Costa · 1 h a Jerez; luego Vejer y Caños de Meca.',
    'Jerez → Ronda · 2 h por la A-382 (viñedos, dehesas, sierra).',
    'Ronda → Setenil → Grazalema → Ronda · medio día, distancias cortas.',
    'Ronda → Frigiliana → Málaga · 3 h con parada en Frigiliana.',
    'Málaga → Granada · 1 h 30 m por la A-92.',
    'Granada → Madrid · 4 h 30 m por la A-4. Día reservado al traslado.'
  ];

  const evitar = [
    'Puerto Banús, Mijas, Costa del Sol urbanizada — opuesto al espíritu del viaje.',
    'Cádiz capital el mismo día que Jerez + Vejer + Caños — agotador. Elegir uno.',
    'Iznájar, Priego, Úbeda, Guadix, Aracena, Caravaca, Murcia, Huelva — fuera de ruta lógica o ya muy denso.',
    'Colomares (Benalmádena) — pintoresco pero fuera de ruta y algo kitsch.'
  ];

  const avisos = [
    {title:'Alhambra', body:'El ticket es nominal y se controla al ingresar a los Palacios Nazaríes con el pasaporte. La franja de Palacios es estricta — si llegan tarde, no las dejan entrar.'},
    {title:'Pulsera Toledo', body:'Por 12 € acceso a 7 monumentos: Iglesia de los Jesuitas, Iglesia del Salvador, Santo Tomé, San Juan de los Reyes, Santa María la Blanca, Mezquita del Cristo de la Luz, Real Colegiata de Santa María.'},
    {title:'Horarios de comida', body:'Almuerzo 14:00–15:30. Cena desde las 21:00. Muchos restaurantes cierran entre 16:00 y 20:00. Los hoteles ofrecen cena más temprano (desde 19:30).'},
    {title:'Domingos', body:'Muchos comercios cierran. Los museos abren con horario reducido. Ajustar compras a sábado o lunes.'}
  ];

  function acc(id, ico, title, content) {
    const open = state.openAcc[id] ? 'open' : '';
    return `
      <div class="acc ${open}" data-acc-id="${id}">
        <button class="acc-head">
          <div class="acc-ico">${svg(ico)}</div>
          <div class="acc-title">${title}</div>
          <svg class="acc-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I.caret}</svg>
        </button>
        <div class="acc-body">${content}</div>
      </div>
    `;
  }

  document.getElementById('screenInfo').innerHTML = `
    <div class="sec-head"><h2>Información</h2><span class="sec-sub">Reservas, ruta y avisos</span></div>
    <div class="info-list">
      ${acc('reservas','ticket','Reservas anticipadas', `<div class="res-list">${reservas}</div>`)}
      ${acc('ruta','car','El recorrido en auto', `<div class="tip-list">${tramos.map(t => `<div class="tip"><div class="tip-body">${t}</div></div>`).join('')}</div>`)}
      ${acc('evitar','warning','Lo que conviene evitar', `<div class="tip-list">${evitar.map(t => `<div class="tip" style="border-left-color:var(--terracotta)"><div class="tip-body">${t}</div></div>`).join('')}</div>`)}
      ${acc('avisos','alert','Avisos importantes', `<div class="tip-list">${avisos.map(a => `<div class="tip"><div class="tip-title">${a.title}</div><div class="tip-body">${a.body}</div></div>`).join('')}</div>`)}
      ${acc('ritmo','rest','Sobre el ritmo general', `<div class="tip"><div class="tip-body">Ningún día requiere más de 3 h 30 m de auto, y la mayoría son trayectos cortos. Tres bloques de descanso real: Córdoba 2 noches, Ronda 2 noches, Granada 3 noches, Málaga 2 noches, Madrid 3 noches. La idea: no agregar ciudades extra.</div></div>`)}
    </div>
  `;
  document.querySelectorAll('#screenInfo .acc').forEach(el => {
    el.querySelector('.acc-head').addEventListener('click', () => {
      const id = el.dataset.accId;
      state.openAcc[id] = !state.openAcc[id];
      saveState();
      el.classList.toggle('open');
    });
  });
}

/* =========================================================
   TABS
   ========================================================= */
function switchTab(tab) {
  state.tab = tab;
  saveState();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('screenHoy').hidden = tab !== 'hoy';
  document.getElementById('screenDias').hidden = tab !== 'dias';
  document.getElementById('screenHoteles').hidden = tab !== 'hoteles';
  document.getElementById('screenInfo').hidden = tab !== 'info';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

/* =========================================================
   SCROLL: hide topbar after threshold, peek on scroll up
   ========================================================= */
let lastScroll = 0;
let scrollDir = 'down';
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (y > 80) document.body.classList.add('scrolled');
  else { document.body.classList.remove('scrolled'); document.getElementById('topbar').classList.remove('peek'); }
  if (y < lastScroll - 10 && y > 80) {
    document.getElementById('topbar').classList.add('peek');
  } else if (y > lastScroll + 4) {
    document.getElementById('topbar').classList.remove('peek');
  }
  lastScroll = y;
}, { passive: true });

/* =========================================================
   FAB
   ========================================================= */
document.getElementById('fab').addEventListener('click', openEmergency);

/* =========================================================
   INIT
   ========================================================= */
function init() {
  renderTopbar();
  renderHoy();
  renderDias();
  renderHoteles();
  renderInfo();
  switchTab(state.tab || 'hoy');
}
init();

// Re-render Hoy every 5 minutes to keep current/past status fresh
setInterval(() => {
  if (state.tab === 'hoy') renderHoy();
  renderTopbar();
}, 5 * 60 * 1000);

</script>
