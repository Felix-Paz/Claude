<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Drift Lasso — Neon Drift &amp; Capture</title>
<meta name="description" content="Drift Lasso: hold to tighten your drift, release to widen, and lasso glowing drones with your neon trail. One mechanic, endless combos. A free hypercasual drift .io arcade game." />
<meta name="theme-color" content="#0A0A14" />
<!-- Discoverability / portal share card. Genre-clear, searchable: drift, io, arcade, hypercasual. -->
<meta property="og:title" content="Drift Lasso" />
<meta property="og:description" content="Hold to tighten, release to widen. Lasso the drones. Don't cross your own trail." />

<style>
  /* ---------------------------------------------------------------------------
     Drift Lasso — styles. Self-contained, no external fonts/CDN (fast first paint).
     A heavy geometric system-font stack gives the "neon poster" feel with zero
     network cost. Tabular numerals keep the score from jittering as it counts.
  --------------------------------------------------------------------------- */
  :root{
    --bg:#0A0A14; --grid:#1A1A2E; --cyan:#00F0FF; --magenta:#FF2D95;
    --amber:#FFB800; --red:#FF1744; --white:#FFFFFF;
    --font: 800 16px/1.1 "Eurostile","Bahnschrift","DIN Alternate Bold","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%; background:var(--bg);
    overflow:hidden; position:fixed; inset:0;
    touch-action:none; overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
    font:var(--font); color:#fff;
    -webkit-font-smoothing:antialiased;
  }
  #game{ position:absolute; inset:0; display:block; z-index:0; }

  /* CSS-driven full-screen feedback flashes (cheap, GPU-composited) */
  #flash{ position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; }

  .ui-btn{
    position:absolute; z-index:5; cursor:pointer; border:none; color:#fff;
    background:rgba(20,22,40,.55); border:1.5px solid rgba(255,255,255,.18);
    border-radius:14px; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    font:800 18px/1 inherit; letter-spacing:.5px;
    width:52px; height:52px; display:flex; align-items:center; justify-content:center;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .ui-btn:active{ transform:scale(.92); }
  #btn-mute{ top:max(14px,env(safe-area-inset-top)); right:14px; }
  #btn-shop{ top:max(14px,env(safe-area-inset-top)); left:14px; }

  /* Overlay screens (game over / shop / daily). DOM = crisp text + reliable
     large touch targets, and it's off the hot render path. */
  .overlay{
    position:absolute; inset:0; z-index:10; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 38%, rgba(10,10,20,.62), rgba(10,10,20,.93));
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    text-align:center; opacity:0; transition:opacity .28s ease;
  }
  .overlay.show{ display:flex; opacity:1; }
  .panel{ width:min(440px,94vw); display:flex; flex-direction:column; align-items:center; gap:14px; }

  .eyebrow{ font-size:14px; letter-spacing:4px; text-transform:uppercase; color:var(--cyan); opacity:.85; }
  .headline{ font-size:clamp(34px,11vw,58px); letter-spacing:2px; line-height:.95; margin:2px 0; }
  .headline.close{ color:var(--magenta); text-shadow:0 0 24px rgba(255,45,149,.55); }
  .sub{ font-size:15px; color:#aeb6d6; font-weight:600; letter-spacing:.4px; }

  .score-big{ font-size:clamp(56px,18vw,96px); color:var(--cyan); text-shadow:0 0 30px rgba(0,240,255,.45); letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .best-row{ display:flex; gap:18px; justify-content:center; align-items:center; font-size:15px; color:#9aa3c7; letter-spacing:1px; }
  .best-row b{ color:#fff; font-variant-numeric:tabular-nums; }

  .near{ font-size:14px; color:#c7cdf0; line-height:1.5; max-width:340px; }
  .near b{ color:var(--magenta); }

  .btn{
    width:100%; max-width:380px; min-height:60px; border:none; border-radius:16px;
    color:#031018; font:900 19px/1 inherit; letter-spacing:.6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .08s ease, filter .15s ease; padding:0 16px;
  }
  .btn:active{ transform:translateY(2px) scale(.99); }
  .btn.primary{ background:linear-gradient(135deg,var(--cyan),#56ffd5); box-shadow:0 8px 26px rgba(0,240,255,.32); }
  .btn.reward{ background:linear-gradient(135deg,var(--magenta),#ff7ab3); color:#fff; box-shadow:0 8px 26px rgba(255,45,149,.32); }
  .btn.ghost{ background:rgba(255,255,255,.08); color:#dfe4ff; border:1.5px solid rgba(255,255,255,.16); box-shadow:none; }
  .btn .tag{ font-size:12px; font-weight:800; padding:3px 8px; border-radius:999px; background:rgba(0,0,0,.22); letter-spacing:.5px; }
  .btn[disabled]{ filter:grayscale(.7) brightness(.7); pointer-events:none; }
  .btn-row{ display:flex; gap:12px; width:100%; max-width:380px; }
  .btn-row .btn{ flex:1; min-width:0; }

  /* Coins + next-unlock progress (always-visible goal) */
  .wallet{ display:flex; align-items:center; gap:8px; font-size:18px; color:var(--amber); font-weight:900; letter-spacing:.5px; }
  .wallet .coin{ width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6cf, var(--amber) 60%, #b87b00); box-shadow:0 0 10px rgba(255,184,0,.6); display:inline-block; }
  .progress-wrap{ width:100%; max-width:380px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12.5px; color:#9aa3c7; letter-spacing:.6px; margin-bottom:6px; }
  .progress-label b{ color:#fff; }
  .bar{ height:10px; border-radius:999px; background:rgba(255,255,255,.10); overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--amber),#ffd86b); box-shadow:0 0 12px rgba(255,184,0,.55); transition:width .4s ease; }

  /* Shop grid */
  .shop-grid{ width:100%; display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px; max-height:46vh; overflow-y:auto; padding:4px; -webkit-overflow-scrolling:touch; }
  .skin{ position:relative; border-radius:16px; padding:12px 10px 11px; background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.10); display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; transition:border-color .15s ease, transform .08s ease; }
  .skin:active{ transform:scale(.98); }
  .skin.equipped{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset, 0 6px 20px rgba(0,240,255,.18); }
  .skin.locked{ opacity:.96; }
  .skin canvas{ width:110px; height:46px; display:block; }
  .skin .name{ font-size:13px; letter-spacing:.4px; }
  .skin .cost{ font-size:12px; color:var(--amber); font-weight:900; display:flex; align-items:center; gap:5px; }
  .skin .state{ font-size:11.5px; letter-spacing:1px; text-transform:uppercase; font-weight:800; }
  .skin .state.eq{ color:var(--cyan); }
  .skin .state.un{ color:#9aa3c7; }
  .skin .mini-coin{ width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6cf, var(--amber) 60%, #b87b00); display:inline-block; }

  .toast{ position:absolute; left:50%; top:14%; transform:translateX(-50%); z-index:30; background:rgba(10,12,24,.9); border:1.5px solid rgba(0,240,255,.4); color:#eaf6ff; padding:12px 18px; border-radius:14px; font-weight:800; letter-spacing:.5px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; text-align:center; max-width:88vw; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(6px); }

  /* Simulated ad modal (stub). Real SDK replaces this entirely — see AdSDK. */
  #ad{ position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.92); flex-direction:column; gap:20px; text-align:center; padding:24px; }
  #ad.show{ display:flex; }
  #ad .ad-box{ width:min(420px,92vw); border:1.5px solid rgba(255,255,255,.14); border-radius:18px; padding:26px 22px; background:linear-gradient(160deg,#10131f,#0a0c16); }
  #ad .ad-mark{ font-size:11px; letter-spacing:3px; color:#7e88ad; text-transform:uppercase; }
  #ad .ad-title{ font-size:22px; margin:10px 0 4px; }
  #ad .ad-sub{ font-size:13.5px; color:#9aa3c7; margin-bottom:18px; }
  #ad .ad-bar{ height:8px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; margin-bottom:18px; }
  #ad .ad-bar > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--magenta),var(--cyan)); }
  #ad .ad-actions{ display:flex; gap:10px; justify-content:center; }
  #ad .ad-actions .btn{ min-height:48px; font-size:16px; }

  .hidden{ display:none !important; }
  a{ color:var(--cyan); }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="flash"></div>

  <button id="btn-shop" class="ui-btn" aria-label="Shop">&#9733;</button>
  <button id="btn-mute" class="ui-btn" aria-label="Mute">&#128266;</button>

  <!-- GAME OVER -->
  <div id="over" class="overlay">
    <div class="panel">
      <div class="eyebrow" id="over-eyebrow">Run Over</div>

      <div class="score-big" id="over-score">0</div>
      <div class="best-row"><span>BEST <b id="over-best">0</b></span><span id="over-newbest" class="hidden" style="color:var(--magenta)">NEW BEST!</span></div>

  <!-- SHOP / GARAGE -->
  <div id="shop" class="overlay">
