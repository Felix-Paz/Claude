/* ============================ [OBJECTIVES] ================================= */
/* Rotating goals = the game's "purpose" beyond high score. 3 active at a time,
   persisted; completing one pays coins + a fanfare and is replaced next run.
   Count goals (runners/stars) accumulate across runs; "best" goals reset each run. */
const Objectives=(()=>{
  const DEFS={
    runner:{icon:'🟢', label:t=>'Lasso '+t+' runners',           tiers:[6,9,12],   reward:40, count:true},
    star:  {icon:'⭐', label:t=>'Catch '+t+' gold star'+(t>1?'s':''), tiers:[2,3], reward:55, count:true},
    combo: {icon:'🔗', label:t=>'Hit a x'+t+' combo',            tiers:[5,6,8],    reward:35, count:false},
    loop:  {icon:'🎯', label:t=>'Lasso '+t+' in one loop',       tiers:[3,4],      reward:50, count:false},
    level: {icon:'🚀', label:t=>'Reach level '+t,                tiers:[4,6,9],    reward:40, count:false},
    score: {icon:'💯', label:t=>'Score '+t+' in a run',          tiers:[1500,2500],reward:30, count:false},
  };
  const KEYS=Object.keys(DEFS);
  function makeOne(avoid){ const pool=KEYS.filter(k=>!avoid.includes(k)); const k=pool[(Math.random()*pool.length)|0]||KEYS[0]; const d=DEFS[k]; return {key:k, t:d.tiers[(Math.random()*d.tiers.length)|0], prog:0, done:false}; }
  function make(){ const out=[]; for(let i=0;i<3;i++) out.push(makeOne(out.map(o=>o.key))); return out; }
  function seed(){ if(!Array.isArray(Storage.data.objectives)||Storage.data.objectives.length!==3){ Storage.data.objectives=make(); Storage.save(); } }
  function refresh(){ // at run start: replace completed, reset per-run "best" goals
    const o=Storage.data.objectives;
    for(let i=0;i<o.length;i++){ if(o[i].done) o[i]=makeOne(o.map(x=>x.key)); else if(!DEFS[o[i].key].count) o[i].prog=0; }
    Storage.save();
  }
  function complete(ob){ const d=DEFS[ob.key]; ob.done=true; Storage.data.coins+=d.reward; Storage.save();
    if(typeof UI!=='undefined') UI.toast('GOAL! '+d.label(ob.t)+'  +'+d.reward); if(typeof Audio!=='undefined') Audio.fanfare(); }
  function bump(key,val){ const o=Storage.data.objectives; let ch=false;
    for(const ob of o){ if(ob.key===key && !ob.done){ const d=DEFS[ob.key]; ob.prog = d.count? ob.prog+val : Math.max(ob.prog,val); if(ob.prog>=ob.t) complete(ob); ch=true; } }
    if(ch) Storage.save();
  }
  return { DEFS, seed, refresh, bump, list:()=>Storage.data.objectives||[] };
})();

/* ============================ [ENTITIES] =================================== */
const FONT_STACK='"Eurostile","Bahnschrift","DIN Alternate Bold","Segoe UI",system-ui,Arial,sans-serif';

// --- Trail: circular buffer of pooled points + self-intersection logic ------
const Trail=(()=>{
  const cap=CONFIG.MAX_TRAIL_POINTS;
  const pts=new Array(cap); for(let i=0;i<cap;i++) pts[i]={x:0,y:0,t:0};
  let head=0, len=0;
  // reusable scratch polygons (no per-frame allocation)
  const scratch=new Array(cap); for(let i=0;i<cap;i++) scratch[i]={x:0,y:0};
  const scratch2=new Array(cap); for(let i=0;i<cap;i++) scratch2[i]={x:0,y:0};

  function reset(){ head=0; len=0; }
  function get(i){ return pts[(head+i)%cap]; }
  function push(x,y,t){
    let idx;
    if(len<cap){ idx=(head+len)%cap; len++; }
    else { idx=head; head=(head+1)%cap; }
    const p=pts[idx]; p.x=x; p.y=y; p.t=t;
  }
  function dropOld(now,lifespan){ while(len>0 && now-get(0).t>lifespan){ head=(head+1)%cap; len--; } }

  // Look for the head segment crossing an earlier segment. Returns a result obj
  // describing the enclosed loop, or null. Scans from near-head backward so we
  // resolve the most-recently-closed loop (matches player intent).
  const result={poly:scratch, n:0, area:0};
  function checkClose(){
    if(len<4) return null;
    const hx0=get(len-2).x, hy0=get(len-2).y, hx1=get(len-1).x, hy1=get(len-1).y;
    const maxI=len-3-CONFIG.SELF_GRACE_SEGMENTS;
    for(let i=maxI;i>=0;i--){
      const a=get(i), b=get(i+1);
      if(segHit(hx0,hy0,hx1,hy1, a.x,a.y,b.x,b.y, _hit)){
        // loop polygon = hit point, then trail points i+1 .. len-2
        let n=0; scratch[n].x=_hit.x; scratch[n].y=_hit.y; n++;
        for(let k=i+1;k<=len-2;k++){ const p=get(k); scratch[n].x=p.x; scratch[n].y=p.y; n++; }
        result.poly=scratch; result.n=n; result.area=polyArea(scratch,n);
        return result;
      }
    }
    return null;
  }

  // Hypothetical "if I closed now" loop for the greed/near-death preview: find
  // the nearest earlier point to the head within PREVIEW_DIST and build its loop.
  const preview={poly:scratch2, n:0, area:0, valid:false};
  function previewLoop(){
    preview.valid=false;
    if(len<6) return preview;
    const hx=get(len-1).x, hy=get(len-1).y;
    const maxI=len-3-CONFIG.SELF_GRACE_SEGMENTS;
    let bestI=-1, bestD=CONFIG.PREVIEW_DIST*CONFIG.PREVIEW_DIST;
    for(let i=0;i<=maxI;i++){ const p=get(i); const d=dist2(hx,hy,p.x,p.y); if(d<bestD){ bestD=d; bestI=i; } }
    if(bestI<0) return preview;
    let n=0; for(let k=bestI;k<=len-1;k++){ const p=get(k); scratch2[n].x=p.x; scratch2[n].y=p.y; n++; }
    preview.poly=scratch2; preview.n=n; preview.area=polyArea(scratch2,n); preview.valid=n>=3;
    return preview;
  }

  // Near-miss: smallest distance from head to a non-adjacent segment (no cross).
  function nearestApproach(){
    if(len<6) return 1e9;
    const hx=get(len-1).x, hy=get(len-1).y;
    const maxI=len-3-CONFIG.SELF_GRACE_SEGMENTS;
    let best=1e9;
    for(let i=0;i<=maxI;i++){ const a=get(i), b=get(i+1); const d=pointSegDist(hx,hy,a.x,a.y,b.x,b.y); if(d<best) best=d; }
    return best;
  }

  return { reset, push, dropOld, checkClose, previewLoop, nearestApproach,
    get len(){return len;}, get(i){return get(i);} };
})();

// --- Drones (little characters: wanderers, runners, bonus stars, bombs, power orbs)
const DTYPE={ WANDER:0, RUNNER:1, BONUS:2, BOMB:3, POWER:4 };
const Drones=(()=>{
  const pool=makePool(CONFIG.MAX_DRONES+8, ()=>({x:0,y:0,vx:0,vy:0,r:CONFIG.DRONE_RADIUS,phase:0,type:0,t:0,spawn:0,blink:0,scared:0,ex:0,ey:0}));
  function spawnAt(x,y,type){
    const d=pool.get(); if(!d) return null;
    d.x=x; d.y=y; const a=rand(0,TAU); d.vx=Math.cos(a); d.vy=Math.sin(a);
    d.phase=rand(0,TAU); d.type=type||DTYPE.WANDER; d.t=0; d.spawn=0; d.blink=rand(1.5,5); d.scared=0; d.ex=0; d.ey=0;
    d.r=CONFIG.DRONE_RADIUS*(d.type===DTYPE.BONUS?1.28:d.type===DTYPE.POWER?1.35:d.type===DTYPE.BOMB?1.12:1);
    return d;
  }
  // push a drone back out of the live trail so it can't slip across your lasso
  // (the trail is a FENCE). The newest few segments near the head are the "mouth"
  // — left open so drones can still be herded in and so the car isn't blocked.
  function fence(d){
    const n=Trail.len; if(n<8) return;
    const minD=d.r + CONFIG.TRAIL_WIDTH*0.5 + 1; const minD2=minD*minD;
    const maxI=n-6;  // skip ~5 head segments (the mouth)
    for(let i=0;i<maxI;i++){
      const a=Trail.get(i), b=Trail.get(i+1);
      const ux=b.x-a.x, uy=b.y-a.y, L2=ux*ux+uy*uy; if(L2<1) continue;
      let t=((d.x-a.x)*ux+(d.y-a.y)*uy)/L2; t=clamp(t,0,1);
      const cx=a.x+t*ux, cy=a.y+t*uy, dx=d.x-cx, dy=d.y-cy, dd2=dx*dx+dy*dy;
      if(dd2<minD2){ const dd=Math.sqrt(dd2)||1, nx=dx/dd, ny=dy/dd;
        d.x=cx+nx*minD; d.y=cy+ny*minD;          // shove out to the fence surface
        const vn=d.vx*nx+d.vy*ny; if(vn<0){ d.vx-=2*vn*nx; d.vy-=2*vn*ny; } // reflect inward velocity
      }
    }
  }
  function update(dt, diff, W, H, carX, carY, magnet, speedScale){
    const base=lerp(CONFIG.DRONE_BASE_SPEED,CONFIG.DRONE_MAX_SPEED,diff)*(speedScale||1);
    const a=pool.alive;
    for(let i=0;i<a.length;i++){ const d=a[i];
      d.t+=dt; if(d.spawn<1) d.spawn=Math.min(1,d.spawn+dt*3);
      d.phase+=dt*1.6;
      d.blink-=dt; if(d.blink<-0.12) d.blink=rand(1.8,5.5);
      d.scared=Math.max(0, d.scared-dt*2);
      let sp=base;
      if(d.type===DTYPE.RUNNER){
        const dx=d.x-carX, dy=d.y-carY, dd=Math.hypot(dx,dy)||1;
        if(dd<CONFIG.RUNNER_FLEE){ d.vx=dx/dd; d.vy=dy/dd; sp=base*2.1; d.scared=1; }
        else if(Math.random()<0.012){ const ang=rand(0,TAU); d.vx=Math.cos(ang); d.vy=Math.sin(ang); }
      } else if(d.type===DTYPE.BOMB){ sp=base*0.55; if(Math.random()<0.008){ const ang=rand(0,TAU); d.vx=Math.cos(ang); d.vy=Math.sin(ang); } }
      else if(d.type===DTYPE.BONUS){ sp=base*1.35; if(Math.random()<0.02){ const ang=rand(0,TAU); d.vx=Math.cos(ang); d.vy=Math.sin(ang); } }
      else if(d.type===DTYPE.POWER){ sp=base*0.6; if(Math.random()<0.02){ const ang=rand(0,TAU); d.vx=Math.cos(ang); d.vy=Math.sin(ang); } }
      else { if(Math.random()<0.01){ const ang=rand(0,TAU); d.vx=Math.cos(ang); d.vy=Math.sin(ang); } }
      d.x+=d.vx*sp*dt; d.y+=d.vy*sp*dt;
      // MAGNET (equipped or power-up): gently reel non-bomb critters toward the car
      if(magnet>0 && d.type!==DTYPE.BOMB){ const dx=carX-d.x, dy=carY-d.y, dd=Math.hypot(dx,dy)||1; if(dd<360){ d.x+=(dx/dd)*magnet*dt; d.y+=(dy/dd)*magnet*dt; } }
      const m=24;
      if(d.x<m){d.x=m;d.vx=Math.abs(d.vx);} if(d.x>W-m){d.x=W-m;d.vx=-Math.abs(d.vx);}
      if(d.y<m){d.y=m;d.vy=Math.abs(d.vy);} if(d.y>H-m){d.y=H-m;d.vy=-Math.abs(d.vy);}
      if(d.type!==DTYPE.POWER) fence(d);   // power orbs ignore the fence (easy to grab)
      // eyes glance toward the car (smoothed)
      const ax=carX-d.x, ay=carY-d.y, al=Math.hypot(ax,ay)||1, mx=d.r*0.18;
      d.ex+=((ax/al)*mx - d.ex)*clamp(8*dt,0,1); d.ey+=((ay/al)*mx - d.ey)*clamp(8*dt,0,1);
    }
  }
  return { pool, spawnAt, update, freeAll:()=>pool.freeAll(), get alive(){return pool.alive;}, get count(){return pool.count;} };
})();

/* ============================== [GAME] ===================================== */
const Game=(()=>{
  // canvas + view
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d',{alpha:false});
  let W=0,H=0,DPR=1, vignette=null, bgGrad=null, safeTop=0;

  // run state
  const STATE={BOOT:0,PLAYING:1,DYING:2,DEAD:3};
  let state=STATE.BOOT;
  const car={x:0,y:0,dir:0, invuln:0};
  let steerSmooth=0;     // eased steering input (-1..1)
  let score=0, displayScore=0, coinsRun=0;
  let combo=0, comboTimer=0, comboBounce=0, pitchStep=0;
  let elapsed=0, spawnTimer=0, difficulty=0, droneTarget=1, nextMilestone=CONFIG.MILESTONE_STEP;
  let firstCaptureDone=false, hintAlpha=0, dyingTimer=0, prevBest=0, revivedThisRun=false;
  let parallaxX=0, parallaxY=0;
  let previewFrame=0, nearMissCd=0;
  let level=1, levelBanner=0, tailExtra=0;          // progression: level + growing tail
  let powerKind='', powerTimer=0, powerBanner=0;    // in-run power-up (FRENZY/MAGNET/SLOMO)
  let shieldArmed=false, powerupTimer=8;            // equipped shield; power-orb spawn clock
  const LASSO_R=CONFIG.CAR_SPEED/CONFIG.TURN_RATE; // the radius a held turn carves (~93px)
  function trailLifespan(){ return CONFIG.TRAIL_LIFESPAN + tailExtra; } // tail grows as you catch more
  function scoreMult(){ return powerKind==='FRENZY'?2:1; }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1, 2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    // measure the notch / safe-area inset once so the canvas HUD never hides under it
    safeTop=measureSafeTop();
    // bright candy sky + soft vignette (rebuilt on resize; cached, drawn once/frame)
    bgGrad=ctx.createLinearGradient(0,0,0,H);
    bgGrad.addColorStop(0,COL.sky1); bgGrad.addColorStop(0.55,'#5aa8ff'); bgGrad.addColorStop(1,COL.sky2);
    vignette=ctx.createRadialGradient(W/2,H*0.44,Math.min(W,H)*0.34, W/2,H*0.5, Math.max(W,H)*0.78);
    vignette.addColorStop(0,'rgba(36,26,77,0)'); vignette.addColorStop(1,'rgba(36,26,77,0.34)');
  }

  // read env(safe-area-inset-top) via a one-off probe (no per-frame cost)
  function measureSafeTop(){
    try{
      const p=document.createElement('div');
      p.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none;';
      document.body.appendChild(p); const h=p.offsetHeight||0; document.body.removeChild(p);
      return Math.min(h,60);
    }catch(e){ return 0; }
  }

  // ---- run lifecycle -------------------------------------------------------
  function fullReset(){
    // FULLY reset everything — no partial state survives a restart.
    score=0; displayScore=0; coinsRun=0; combo=0; comboTimer=0; comboBounce=0; pitchStep=0;
    elapsed=0; spawnTimer=0; difficulty=0; nextMilestone=CONFIG.MILESTONE_STEP;
    dyingTimer=0; car.invuln=0; nearMissCd=0; revivedThisRun=false; steerSmooth=0; previewState.valid=false; capFX.active=false;
    level=1; levelBanner=0; tailExtra=0; powerKind=''; powerTimer=0; powerBanner=0; powerupTimer=rand(7,11);
    Trail.reset(); Drones.freeAll(); Particles.freeAll(); Popups.freeAll(); FX.reset();
    prevBest=Storage.data.highScore;
    Objectives.refresh();                           // fresh goals; "best" goals reset
    // equipped superpowers
    const pw=Cosmetics.power().id;
    shieldArmed=(pw==='pow_shield');
    if(pw==='pow_hot'){ combo=3; comboTimer=CONFIG.COMBO_DECAY_TIME; pitchStep=3; }
    // Car starts low-centre driving up into the arena (live within ~1s of load).
    car.x=W*0.5; car.y=H*0.62; car.dir=-Math.PI/2;
    droneTarget=3; firstCaptureDone=false;
    // Opening clump: one drone at the LEFT-turn centre and one at the RIGHT-turn centre
    // (plus one ahead), so whichever way the player first steers, a loop wraps a drone —
    // and intro deaths are softened to trail-resets, so the first try can't fail.
    Drones.spawnAt(car.x-LASSO_R, car.y, DTYPE.WANDER);
    Drones.spawnAt(car.x+LASSO_R, car.y, DTYPE.WANDER);
    Drones.spawnAt(car.x, car.y-LASSO_R*1.1, DTYPE.WANDER);
    hintAlpha = Storage.data.firstRunDone?0:1;  // "HOLD" hint on the very first run only
    Audio.resetMusicClock(); Audio.setMusic(true);
    state=STATE.PLAYING;
  }

  // ---- scoring + capture ---------------------------------------------------
  function comboMult(){ return Math.max(1, combo); }
  function addScore(n){ score+=n; if(score>=nextMilestone){ milestone(); } }
  function milestone(){
    nextMilestone+=CONFIG.MILESTONE_STEP;
    Storage.data.coins+=CONFIG.MILESTONE_COINS; coinsRun+=CONFIG.MILESTONE_COINS; Storage.save();
    Audio.fanfare(); FX.flash('rgba(0,240,255,0.18)',0.5);
    Popups.spawn(W/2, H*0.30, 'MILESTONE +'+CONFIG.MILESTONE_COINS, COL.amber, 26);
  }

  // The capture FX: snap-fill the loop, pop drones, score, juice.
  const capFX={active:false, t:0, poly:[], n:0, color:'#fff'};
  for(let i=0;i<CONFIG.MAX_TRAIL_POINTS;i++) capFX.poly.push({x:0,y:0});

  const CAPWORDS=['YOINK!','GOTCHA!','ROUNDUP!','SNAGGED!','WRANGLED!','NICE!','SWEET!','LASSO!','BOOM!','HOWDY!'];
  const BONKWORDS=['NOPE!','YIKES!','BONK!','OOF!'];
  function droneValue(d){ return d.type===DTYPE.BONUS?CONFIG.BONUS_VALUE : d.type===DTYPE.RUNNER?CONFIG.RUNNER_VALUE : 1; }

  function doCapture(loop, caught){
    // centroid (for popups / fx), and split bombs from the catch
    let centerX=0, centerY=0; for(let i=0;i<caught.length;i++){ centerX+=caught[i].x; centerY+=caught[i].y; }
    centerX/=caught.length; centerY/=caught.length;
    const hasBomb=caught.some(d=>d.type===DTYPE.BOMB);

    // copy the loop polygon for the snap-fill animation either way
    capFX.n=loop.n; for(let i=0;i<loop.n;i++){ capFX.poly[i].x=loop.poly[i].x; capFX.poly[i].y=loop.poly[i].y; }
    capFX.active=true; capFX.t=1;

    if(hasBomb){
      // wrapping a bomb SPOILS the loop: lose the combo, no points, sharp BONK.
      // (Fair, not fatal — the one death rule stays "empty self-cross".)
      capFX.color=COL.red; combo=0; pitchStep=0;
      caught.forEach(d=>{ if(d.type===DTYPE.BOMB){ d.scared=1; Particles.burst(d.x,d.y,18,{confetti:true,colors:[COL.red,'#FFFFFF','#FF8DA0'],spMax:300,sizeMax:9}); } });
      Popups.spawn(centerX, centerY, BONKWORDS[(Math.random()*BONKWORDS.length)|0], COL.red, 34);
      Popups.spawn(centerX, centerY-38, 'combo lost', '#8a83ad', 20);
      FX.addShake(0.9); FX.flash('rgba(255,59,92,0.22)',0.6); Audio.death();
      Trail.reset(); Trail.push(car.x,car.y, elapsed);
      return;
    }

    const norm=clamp(loop.area/(W*H*CONFIG.AREA_REF_FRACTION), CONFIG.AREA_NORM_MIN, CONFIG.AREA_NORM_MAX);
    combo=Math.min(CONFIG.COMBO_MAX, combo+1); comboTimer=CONFIG.COMBO_DECAY_TIME; comboBounce=1; pitchStep++;
    let valueSum=0, bonusHit=false, runners=0, stars=0;
    caught.forEach(d=>{ valueSum+=droneValue(d); if(d.type===DTYPE.BONUS){ bonusHit=true; stars++; } if(d.type===DTYPE.RUNNER) runners++; });
    const gained=Math.round(CONFIG.BASE_CAPTURE*norm*comboMult()*valueSum*scoreMult());
    addScore(gained);
    capFX.color=bonusHit?COL.amber:COL.magenta;
    // tail grows as you catch more critters this run
    tailExtra=Math.min(CONFIG.TAIL_MAX_EXTRA, tailExtra+CONFIG.TAIL_GROW*caught.length);
    // objectives progress
    if(runners) Objectives.bump('runner',runners); if(stars) Objectives.bump('star',stars);
    Objectives.bump('loop',caught.length); Objectives.bump('combo',comboMult()); Objectives.bump('score',score);

    // pop the little critters -> candy confetti + sparkle
    caught.forEach(d=>{
      Particles.burst(d.x,d.y, d.type===DTYPE.BONUS?34:20, {confetti:true, spMax:340, sizeMax:9});
      Particles.burst(d.x,d.y, 7, {spr:Sprites.white, spMax:180, sizeMax:13});
      Drones.pool.free(d);
    });

    // popups: a witty callout + the points + multiplier (dopamine core)
    Popups.spawn(centerX, centerY-40, CAPWORDS[(Math.random()*CAPWORDS.length)|0], COL.magenta, 30);
    Popups.spawn(centerX, centerY, '+'+gained, COL.white, 36);
    if(comboMult()>1) Popups.spawn(centerX, centerY-78, 'x'+comboMult()+'!', COL.cyan, 30);
    if(caught.length>=1 && norm>=CONFIG.PERFECT_AREA){ Popups.spawn(centerX, centerY-112,'PERFECT!',COL.amber,28); Audio.bonus(); }
    if(bonusHit){ Popups.spawn(centerX, centerY-112,'STAR x3',COL.amber,28); Audio.bonus(); }

    // feel: shake + hit-stop + camera punch scaled to the moment
    const big=caught.length>=CONFIG.HITSTOP_THRESHOLD;
    FX.addShake(clamp(0.25+caught.length*0.18+norm*0.15, 0.2, 1.4));
    FX.addZoom(clamp(0.03+caught.length*0.02+norm*0.01, 0.03, 0.12));
    if(big) FX.addHitstop(CONFIG.HITSTOP_BIG + (caught.length-2)*0.02);
    if(combo>=CONFIG.CHROMA_COMBO) FX.setChroma(clamp((combo-CONFIG.CHROMA_COMBO+1)*0.15,0,0.7));
    FX.flash(bonusHit?'rgba(255,176,32,0.14)':'rgba(255,73,195,0.13)', 0.45);
    Audio.capture(pitchStep);

    // coins as a small variable drip (extra reason to chase combos)
    if(Math.random()<0.5){ const c=1+(bonusHit?2:0); Storage.data.coins+=c; coinsRun+=c; Storage.save(); Audio.coin(); }

    Trail.reset(); Trail.push(car.x,car.y, elapsed); // lasso "fires" -> consumed loop is safe

    if(!firstCaptureDone){ firstCaptureDone=true; hintAlpha=0; if(!Storage.data.firstRunDone){ Storage.data.firstRunDone=true; Storage.save(); } droneTarget=CONFIG.MIN_DRONES; }
  }

  function die(){
    if(state!==STATE.PLAYING) return;
    if(car.invuln>0) return;            // post-revive grace
    if(shieldArmed){                    // equipped Shield power: save the run once
      shieldArmed=false; Trail.reset(); Trail.push(car.x,car.y,elapsed); car.invuln=1.3;
      Popups.spawn(car.x, car.y-30, 'SHIELD!', COL.cyan, 30); FX.flash('rgba(0,229,255,0.3)',0.7); FX.addShake(0.7); Audio.bonus();
      return;
    }
    state=STATE.DYING; dyingTimer=0.7;
    FX.addShake(1.5); FX.flash('rgba(255,59,92,0.5)',1.0); Audio.death();
    Audio.setMusic(false);
    // combo "shatters" into red shards up top
    if(combo>1){ Particles.burst(W/2,H*0.18, 22, {confetti:true, colors:[COL.red,'#FF8DA0','#FFFFFF'], spMax:260, sizeMax:9}); }
    // big death burst at the car
    Particles.burst(car.x,car.y, 26, {confetti:true, colors:[COL.red,'#FFFFFF','#FF8DA0'], spMax:340, sizeMax:9});
    Particles.burst(car.x,car.y, 10, {spr:Sprites.white, spMax:240, sizeMax:16});
  }

  function revive(){
    // restore at the same score; clear hazards; brief invulnerability. Once per run.
    revivedThisRun=true;
    Trail.reset(); Drones.freeAll(); Particles.freeAll();
    car.x=W*0.5; car.y=H*0.5; car.dir=-Math.PI/2; steerSmooth=0; car.invuln=CONFIG.REVIVE_INVULN;
    Trail.push(car.x,car.y,elapsed);
    droneTarget=Math.max(CONFIG.MIN_DRONES, droneTarget);
    state=STATE.PLAYING; Audio.setMusic(true); FX.flash('rgba(0,229,255,0.25)',0.6);
  }

  function gameOver(){
    state=STATE.DEAD;
    Storage.data.totalRuns=(Storage.data.totalRuns||0)+1;
    const isBest=score>Storage.data.highScore;
    if(isBest) Storage.data.highScore=score;
    // credit the end-of-run coin bonus to BOTH the run tally and the real balance
    const endBonus=Math.floor(score/100)*CONFIG.COINS_PER_100;
    coinsRun += endBonus; Storage.data.coins += endBonus;
    Storage.save();
    UI.showGameOver({ score:Math.round(score), best:Storage.data.highScore, isBest:isBest,
      coins:coinsRun, prevBest:prevBest, canRevive:!revivedThisRun, level:level });
    if(isBest) Audio.fanfare();
  }

  // ---- spawn director ------------------------------------------------------
  function updateDifficulty(){
    let base;
    if(elapsed<CONFIG.RAMP_GENTLE_TIME) base=(elapsed/CONFIG.RAMP_GENTLE_TIME)*0.25;
    else base=0.25+((elapsed-CONFIG.RAMP_GENTLE_TIME)/(CONFIG.RAMP_FULL_TIME-CONFIG.RAMP_GENTLE_TIME))*0.75;
    const sd=clamp(score/CONFIG.SCORE_FOR_MAX,0,1)*0.85;
    difficulty=clamp(Math.max(base,sd),0,1);
    if(firstCaptureDone) droneTarget=Math.round(lerp(CONFIG.MIN_DRONES, CONFIG.MAX_DRONES, difficulty));
  }
  function maybeSpawn(dt){
    spawnTimer-=dt;
    const interval=lerp(1.4,0.5,difficulty);
    if(spawnTimer<=0 && Drones.count<droneTarget){
      spawnTimer=interval;
      // spawn away from the car so nothing pops in on top of the player
      let x,y,tries=0;
      do{ x=rand(60,W-60); y=rand(80,H-80); tries++; }while(dist(x,y,car.x,car.y)<150 && tries<12);
      Drones.spawnAt(x,y, pickType());
    }
  }
  function pickType(){
    const r=Math.random();
    if(r<CONFIG.BONUS_CHANCE) return DTYPE.BONUS;
    if(r<CONFIG.BONUS_CHANCE+CONFIG.RUNNER_CHANCE) return DTYPE.RUNNER;
    if(score>=CONFIG.BOMB_AFTER_SCORE && r<CONFIG.BONUS_CHANCE+CONFIG.RUNNER_CHANCE+CONFIG.BOMB_CHANCE) return DTYPE.BOMB;
    return DTYPE.WANDER;
  }

  // ---- levels (the "purpose": climb them) ---------------------------------
  function updateLevel(){ const lv=1+Math.floor(score/CONFIG.LEVEL_STEP); if(lv>level){ level=lv; levelUp(); } }
  function levelUp(){
    levelBanner=1.7;
    Storage.data.coins+=8; coinsRun+=8; if(level>(Storage.data.bestLevel||1)) Storage.data.bestLevel=level; Storage.save();
    Audio.fanfare(); FX.flash('rgba(0,229,255,0.16)',0.5); FX.addZoom(0.05); FX.addShake(0.4);
    Popups.spawn(W/2, H*0.36, 'LEVEL '+level, COL.cyan, 42);
    Objectives.bump('level', level);
  }

  // ---- in-run power-up orbs ------------------------------------------------
  const POWER_KINDS=['FRENZY','MAGNET','SLOMO'];
  function hasPowerOrb(){ const a=Drones.alive; for(let i=0;i<a.length;i++) if(a[i].type===DTYPE.POWER) return true; return false; }
  function spawnPowerup(){ let x,y,tries=0; do{ x=rand(70,W-70); y=rand(110,H-110); tries++; }while(dist(x,y,car.x,car.y)<170 && tries<14); Drones.spawnAt(x,y,DTYPE.POWER); }
  function collectPowerups(){
    const a=Drones.alive;
    for(let i=a.length-1;i>=0;i--){ const d=a[i]; if(d.type!==DTYPE.POWER) continue;
      if(d.spawn>0.4 && dist(d.x,d.y,car.x,car.y) < d.r+20){
        powerKind=POWER_KINDS[(Math.random()*POWER_KINDS.length)|0]; powerTimer=CONFIG.POWERUP_DUR; powerBanner=1.4;
        Particles.burst(d.x,d.y,30,{confetti:true,spMax:360,sizeMax:9}); Particles.burst(d.x,d.y,12,{spr:Sprites.white,spMax:220,sizeMax:15});
        Popups.spawn(d.x,d.y-30, powerKind+'!', COL.cyan, 32); Audio.bonus(); FX.addShake(0.6); FX.addZoom(0.06);
        Drones.pool.free(d);
      }
    }
  }
  function magnetStrength(){ let m=(Cosmetics.power().id==='pow_magnet')?CONFIG.MAGNET_EQUIP:0; if(powerKind==='MAGNET') m=Math.max(m,CONFIG.MAGNET_POWER); return m; }
  function speedScale(){ return powerKind==='SLOMO'?CONFIG.SLOMO_SCALE:1; }

  // ---- car physics: DIRECT STEERING ---------------------------------------
  function updateCar(dt){
    // steer = -1 (left) / 0 (straight) / +1 (right); eased for a smooth feel
    steerSmooth += (Input.steer()-steerSmooth)*clamp(CONFIG.STEER_LERP*dt,0,1);
    let omega = steerSmooth * CONFIG.TURN_RATE;
    // soft containment: if heading toward a wall, nudge back toward centre (no wall death)
    const m=CONFIG.WALL_MARGIN*2.2;
    if(car.x<m||car.x>W-m||car.y<m||car.y>H-m){
      const desired=Math.atan2(H/2-car.y, W/2-car.x);
      const diff=Math.atan2(Math.sin(desired-car.dir),Math.cos(desired-car.dir));
      const edge=clamp((m-Math.min(car.x,car.y,W-car.x,H-car.y))/m,0,1);
      omega += diff*CONFIG.CONTAIN_STRENGTH*edge;
    }
    car.dir += omega*dt;
    car.x += Math.cos(car.dir)*CONFIG.CAR_SPEED*dt;
    car.y += Math.sin(car.dir)*CONFIG.CAR_SPEED*dt;
    car.x=clamp(car.x,6,W-6); car.y=clamp(car.y,6,H-6);
    if(car.invuln>0) car.invuln-=dt;
    parallaxX=(car.x-W/2)*0.04; parallaxY=(car.y-H/2)*0.04; // subtle depth
  }

  // ---- main update ---------------------------------------------------------
  function update(dt){
    if(state===STATE.PLAYING){
      elapsed+=dt;
      updateDifficulty();
      updateLevel();
      updateCar(dt);
      // record trail point when we've moved far enough
      const last=Trail.len>0?Trail.get(Trail.len-1):null;
      if(!last || dist2(last.x,last.y,car.x,car.y) >= CONFIG.TRAIL_MIN_DIST*CONFIG.TRAIL_MIN_DIST){
        Trail.push(car.x,car.y,elapsed);
        // self-cross resolution (only on a freshly added head segment)
        const loop=Trail.checkClose();
        if(loop){
          const caught=collectEnclosed(loop);
          if(caught.length>0) doCapture(loop, caught);
          else if(!firstCaptureDone || car.invuln>0){ Trail.reset(); Trail.push(car.x,car.y,elapsed); } // intro / post-revive grace: never punish, just break the trail
          else die();                          // empty self-cross = death (the one legible rule)
        }
      }
      Trail.dropOld(elapsed, trailLifespan());

      Drones.update(dt, difficulty, W, H, car.x, car.y, magnetStrength(), speedScale());
      maybeSpawn(dt);

      // power-up orbs: timers + occasional spawn + pickup-by-driving-over
      if(powerTimer>0){ powerTimer-=dt; if(powerTimer<=0) powerKind=''; }
      powerBanner=Math.max(0,powerBanner-dt); levelBanner=Math.max(0,levelBanner-dt);
      powerupTimer-=dt;
      if(powerupTimer<=0 && firstCaptureDone){ powerupTimer=rand(CONFIG.POWERUP_MIN,CONFIG.POWERUP_MAX); if(!hasPowerOrb()&&!powerKind) spawnPowerup(); }
      collectPowerups();

      // combo decay
      if(combo>0){ comboTimer-=dt; if(comboTimer<=0){ combo=0; pitchStep=0; } }
      comboBounce=Math.max(0, comboBounce-dt*3);

      // greed/near-death preview + near-miss telegraph (throttled)
      previewFrame=(previewFrame+1)%2;
      updatePreview();
      nearMissCd=Math.max(0,nearMissCd-dt);
      if(car.invuln<=0 && firstCaptureDone){
        const near=Trail.nearestApproach();
        if(near<CONFIG.NEAR_MISS_DIST){ FX.nearMiss(); if(nearMissCd<=0){ Audio.tick(); nearMissCd=0.16; } } // throttle: no tick storm while skimming
      }

      // drift hum tracks how hard you're steering
      Audio.setDrift(Math.abs(steerSmooth), true);
      Audio.updateMusic(true, difficulty);

      // capture snap-fill animation timer
      if(capFX.active){ capFX.t-=dt*7; if(capFX.t<=0) capFX.active=false; }
    }
    else if(state===STATE.DYING){
      Audio.setDrift(0,false);
      dyingTimer-=dt; if(dyingTimer<=0){ gameOver(); }
    }
    // FX + cosmetic systems always update so death/menus stay alive
    FX.update(dt);
    Particles.update(dt);
    Popups.update(dt);
    // smooth score counter
    displayScore += (score-displayScore)*clamp(8*dt,0,1);
    if(Math.abs(score-displayScore)<0.5) displayScore=score;
  }

  // gather drones strictly inside the loop polygon
  const _caught=[];
  function collectEnclosed(loop){
    _caught.length=0;
    const a=Drones.alive;
    for(let i=0;i<a.length;i++){ const d=a[i]; if(d.spawn>0.5 && pointInPoly(d.x,d.y,loop.poly,loop.n)) _caught.push(d); }
    return _caught;
  }

  // preview state for rendering (greed glow / danger warning)
  const previewState={valid:false, danger:false, area:0, n:0, poly:null, ghost:0};
  function updatePreview(){
    if(previewFrame!==0){ return; }
    const pv=Trail.previewLoop();
    if(pv.valid){
      // would the loop enclose drones? (a bomb inside => DANGER, not reward)
      let enclosed=0, valSum=0, gx=0, gy=0, bomb=false;
      const a=Drones.alive;
      for(let i=0;i<a.length;i++){ const d=a[i]; if(pointInPoly(d.x,d.y,pv.poly,pv.n)){ if(d.type===DTYPE.BOMB) bomb=true; else { enclosed++; valSum+=droneValue(d); } gx+=d.x; gy+=d.y; } }
      previewState.valid=true; previewState.poly=pv.poly; previewState.n=pv.n; previewState.area=pv.area;
      previewState.danger=(bomb || enclosed===0);   // empty OR contains a bomb = bad
      if(enclosed>0 && !bomb){
        const arenaArea=W*H; const norm=clamp(pv.area/(arenaArea*CONFIG.AREA_REF_FRACTION),CONFIG.AREA_NORM_MIN,CONFIG.AREA_NORM_MAX);
        previewState.ghost=Math.round(CONFIG.BASE_CAPTURE*norm*comboMult()*valSum);
        previewState.gx=gx/enclosed; previewState.gy=gy/enclosed-40;
      } else previewState.ghost=0;
    } else previewState.valid=false;
  }

  return {
    canvas, get ctx(){return ctx;}, STATE, resize,
    fullReset, revive, update,
    get state(){return state;}, set state(s){state=s;},
    get W(){return W;}, get H(){return H;}, get car(){return car;},
    get score(){return score;}, get displayScore(){return displayScore;},
    get combo(){return combo;}, get comboBounce(){return comboBounce;},
    get elapsed(){return elapsed;}, get difficulty(){return difficulty;},
    get hintAlpha(){return hintAlpha;}, get capFX(){return capFX;}, get previewState(){return previewState;},
    get parallaxX(){return parallaxX;}, get parallaxY(){return parallaxY;},
    get vignette(){return vignette;}, get bgGrad(){return bgGrad;}, get prevBest(){return prevBest;}, get safeTop(){return safeTop;},
    get level(){return level;}, get levelBanner(){return levelBanner;}, get trailLifespan(){return trailLifespan();},
    get powerKind(){return powerKind;}, get powerTimer(){return powerTimer;}, get powerBanner(){return powerBanner;},
  };
})();

/* ============================== [RENDER] =================================== */
const Render=(()=>{
  // soft rounded floor grid (bright, playful, parallaxes with the car)
  function drawGrid(ctx,W,H,px,py){
    const sp=58; ctx.lineWidth=2; ctx.strokeStyle=COL.grid; ctx.beginPath();
    const ox=-((px%sp)+sp)%sp, oy=-((py%sp)+sp)%sp;
    for(let x=ox;x<W+sp;x+=sp){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for(let y=oy;y<H+sp;y+=sp){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();
  }

  // a flattened ink shadow under a lifted object (the #1 cartoon-2.5D trick)
  function drawShadow(ctx,x,y,r){
    const s=r*2.4; ctx.save(); ctx.globalAlpha=1;
    ctx.translate(x, y+r*0.62); ctx.scale(1,0.45);
    ctx.drawImage(Sprites.shadow, -s, -s, s*2, s*2); ctx.restore();
  }

  function drawTrail(ctx, offX, offY){
    const n=Trail.len; if(n<2) return;
    const skin=Cosmetics.trail(); const rainbow=(skin.a==='rainbow');
    const headShift=(Game.elapsed*60)%360;
    let ar=0,ag=0,ab=0,br=0,bg=0,bb=0;
    if(!rainbow){ const ca=hexToRgb(skin.a), cb=hexToRgb(skin.b); ar=ca.r;ag=ca.g;ab=ca.b;br=cb.r;bg=cb.g;bb=cb.b; }
    ctx.lineCap='round'; ctx.lineJoin='round';
    const core=CONFIG.TRAIL_WIDTH, life=Game.trailLifespan;
    // PASS 1 — ink outline (whole ribbon first, so cores always sit on top)
    ctx.lineWidth=core+8; ctx.strokeStyle=COL.ink;
    for(let i=1;i<n;i++){ const p0=Trail.get(i-1),p1=Trail.get(i);
      const fade=1-clamp((Game.elapsed-p1.t)/life,0,1); if(fade<=0.04) continue;
      ctx.globalAlpha=fade; ctx.beginPath(); ctx.moveTo(p0.x+offX,p0.y+offY); ctx.lineTo(p1.x+offX,p1.y+offY); ctx.stroke();
    }
    // PASS 2 — solid candy core (cyan -> pink)
    ctx.lineWidth=core;
    for(let i=1;i<n;i++){ const p0=Trail.get(i-1),p1=Trail.get(i);
      const tN=i/(n-1); const fade=1-clamp((Game.elapsed-p1.t)/life,0,1); if(fade<=0.04) continue;
      ctx.globalAlpha=fade;
      if(rainbow) ctx.strokeStyle='hsl('+(((tN*300)+headShift)%360)+',100%,62%)';
      else { const r=(ar+(br-ar)*tN)|0,g=(ag+(bg-ag)*tN)|0,b=(ab+(bb-ab)*tN)|0; ctx.strokeStyle='rgb('+r+','+g+','+b+')'; }
      ctx.beginPath(); ctx.moveTo(p0.x+offX,p0.y+offY); ctx.lineTo(p1.x+offX,p1.y+offY); ctx.stroke();
    }
    // PASS 3 — glossy white sheen highlight running along the ribbon
    ctx.lineWidth=core*0.32; ctx.strokeStyle='rgba(255,255,255,0.75)';
    for(let i=1;i<n;i++){ const p1=Trail.get(i);
      const fade=1-clamp((Game.elapsed-p1.t)/life,0,1); if(fade<=0.2) continue;
      const p0=Trail.get(i-1); ctx.globalAlpha=fade*0.5;
      ctx.beginPath(); ctx.moveTo(p0.x+offX,p0.y-core*0.18+offY); ctx.lineTo(p1.x+offX,p1.y-core*0.18+offY); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  function drawPreview(ctx,offX,offY){
    const pv=Game.previewState; if(!pv.valid || pv.n<3) return;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(pv.poly[0].x+offX,pv.poly[0].y+offY);
    for(let i=1;i<pv.n;i++) ctx.lineTo(pv.poly[i].x+offX,pv.poly[i].y+offY);
    ctx.closePath();
    const pulse=0.14+0.07*Math.sin(performance.now()*0.012);
    ctx.fillStyle = pv.danger ? 'rgba(255,59,92,'+(pulse*1.1)+')' : 'rgba(0,229,255,'+pulse+')';
    ctx.fill(); ctx.restore();
    if(!pv.danger && pv.ghost>0){
      ctx.font='900 24px '+FONT_STACK; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=5; ctx.strokeStyle=COL.ink; ctx.strokeText('+'+pv.ghost, pv.gx+offX, pv.gy+offY);
      ctx.fillStyle=COL.white; ctx.fillText('+'+pv.ghost, pv.gx+offX, pv.gy+offY);
    }
  }

  function drawCaptureFill(ctx,offX,offY){
    const cf=Game.capFX; if(!cf.active || cf.n<3) return;
    const t=clamp(cf.t,0,1); const scale=0.85+0.15*t;
    ctx.save();
    let cx=0,cy=0; for(let i=0;i<cf.n;i++){cx+=cf.poly[i].x;cy+=cf.poly[i].y;} cx/=cf.n; cy/=cf.n;
    ctx.translate(cx+offX,cy+offY); ctx.scale(scale,scale); ctx.translate(-cx-offX,-cy-offY);
    ctx.beginPath(); ctx.moveTo(cf.poly[0].x+offX,cf.poly[0].y+offY);
    for(let i=1;i<cf.n;i++) ctx.lineTo(cf.poly[i].x+offX,cf.poly[i].y+offY); ctx.closePath();
    const cc=hexToRgb(cf.color);
    ctx.fillStyle='rgba('+cc.r+','+cc.g+','+cc.b+','+(0.55*t)+')'; ctx.fill();
    ctx.fillStyle='rgba(255,255,255,'+(0.55*t)+')'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,'+(0.8*t)+')'; ctx.stroke();
    ctx.restore();
  }

  function drawDrones(ctx,offX,offY){
    const a=Drones.alive;
    // shadows first (all drones), then the glossy balls + faces
    for(let i=0;i<a.length;i++){ const d=a[i]; if(d.spawn<0.2) continue; drawShadow(ctx,d.x+offX,d.y+offY,d.r*d.spawn); }
    for(let i=0;i<a.length;i++){ const d=a[i];
      const dx=d.x+offX, dy=d.y-d.r*0.12+offY; // tiny lift = floaty
      if(d.type===DTYPE.POWER){ drawPowerOrb(ctx, d, dx, dy); continue; }
      const scared=d.scared>0.05;
      const pop=(0.92+0.10*Math.sin(d.phase) + (scared?0.06*Math.sin(performance.now()*0.05):0))*d.spawn;
      const spr = d.type===DTYPE.BONUS?Sprites.droneBonus : d.type===DTYPE.RUNNER?Sprites.droneRun : d.type===DTYPE.BOMB?Sprites.bomb : Sprites.drone;
      const s=(d.r+Sprites.pad)*2*pop;
      ctx.globalAlpha=clamp(d.spawn,0,1);
      ctx.drawImage(spr, dx-s/2, dy-s/2, s, s);
      ctx.globalAlpha=1;
      drawFace(ctx, d, dx, dy, scared);
    }
  }

  // the rare power-up: a pulsing rainbow orb with a star + glow (drive over to grab)
  function drawPowerOrb(ctx, d, x, y){
    const t=performance.now()*0.004, r=d.r*(1+0.10*Math.sin(t*3))*d.spawn, hue=(t*120)%360;
    ctx.globalAlpha=clamp(d.spawn,0,1)*0.9; ctx.globalCompositeOperation='lighter';
    ctx.drawImage(Sprites.white, x-r*2.2, y-r*2.2, r*4.4, r*4.4);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=clamp(d.spawn,0,1);
    ctx.beginPath(); ctx.arc(x,y,r+3,0,TAU); ctx.fillStyle=COL.ink; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle='hsl('+hue+',100%,62%)'; ctx.fill();
    // little white star
    ctx.fillStyle='#fff'; ctx.save(); ctx.translate(x,y); ctx.rotate(t);
    ctx.beginPath(); for(let k=0;k<5;k++){ const a1=k*2*Math.PI/5-Math.PI/2, a2=a1+Math.PI/5; ctx.lineTo(Math.cos(a1)*r*0.7,Math.sin(a1)*r*0.7); ctx.lineTo(Math.cos(a2)*r*0.3,Math.sin(a2)*r*0.3); } ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }

  // googly eyes (+ expressions) — the personality layer
  function drawFace(ctx, d, x, y, scared){
    if(d.spawn<0.5) return;
    const r=d.r, blinking=d.blink<0;
    const eo=r*0.42, ey=-r*0.12, er=r*0.30;            // eye offset / size
    const bomb=(d.type===DTYPE.BOMB);
    // whites
    ctx.fillStyle='#FFFFFF';
    if(blinking){
      ctx.lineWidth=Math.max(2,r*0.12); ctx.strokeStyle=COL.ink; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x-eo-er*0.6,y+ey); ctx.lineTo(x-eo+er*0.6,y+ey);
      ctx.moveTo(x+eo-er*0.6,y+ey); ctx.lineTo(x+eo+er*0.6,y+ey); ctx.stroke();
    } else {
      const ew=scared?er*1.15:er;
      ctx.beginPath(); ctx.arc(x-eo,y+ey,ew,0,TAU); ctx.arc(x+eo,y+ey,ew,0,TAU); ctx.fill();
      // pupils glance toward the car
      ctx.fillStyle=COL.ink; const pr=er*(scared?0.42:0.55);
      ctx.beginPath(); ctx.arc(x-eo+d.ex,y+ey+d.ey,pr,0,TAU); ctx.arc(x+eo+d.ex,y+ey+d.ey,pr,0,TAU); ctx.fill();
    }
    // expression: bomb scowls; scared = little "o" mouth; otherwise content
    ctx.strokeStyle=COL.ink; ctx.lineWidth=Math.max(2,r*0.11); ctx.lineCap='round';
    if(bomb){
      ctx.beginPath(); ctx.moveTo(x-eo-er*0.5,y+ey-er*0.9); ctx.lineTo(x-eo+er*0.6,y+ey-er*0.4);
      ctx.moveTo(x+eo+er*0.5,y+ey-er*0.9); ctx.lineTo(x+eo-er*0.6,y+ey-er*0.4); ctx.stroke(); // angry brows
      ctx.beginPath(); ctx.arc(x,y+r*0.42,er*0.5,Math.PI*1.15,Math.PI*1.85); ctx.stroke();    // frown
    } else if(scared){
      ctx.fillStyle=COL.ink; ctx.beginPath(); ctx.ellipse(x,y+r*0.42,er*0.34,er*0.46,0,0,TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(x,y+r*0.30,er*0.55,0.12*Math.PI,0.88*Math.PI); ctx.stroke();   // smile
    }
  }

  function drawCar(ctx,offX,offY){
    const car=Game.car;
    const blink = car.invuln>0 ? (0.45+0.55*Math.abs(Math.sin(performance.now()*0.02))) : 1;
    drawShadow(ctx, car.x+offX, car.y+offY, 22);
    const s=(23+Sprites.pad)*2;
    ctx.globalAlpha=blink;
    ctx.drawImage(Sprites.car, car.x-s/2+offX, car.y-s/2-3+offY, s, s);
    ctx.globalAlpha=1;
    // bold ink direction arrow on top of the ball
    ctx.save(); ctx.translate(car.x+offX,car.y-3+offY); ctx.rotate(car.dir);
    ctx.fillStyle=COL.ink; ctx.beginPath();
    ctx.moveTo(13,0); ctx.lineTo(2,7); ctx.lineTo(5,0); ctx.lineTo(2,-7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // chunky outlined HUD text helper
  function inkText(ctx,txt,x,y,size,fill,ink){
    ctx.font='900 '+size+'px '+FONT_STACK;
    ctx.lineJoin='round'; ctx.lineWidth=Math.max(5,size*0.16); ctx.strokeStyle=ink||COL.ink;
    ctx.strokeText(txt,x,y); ctx.fillStyle=fill; ctx.fillText(txt,x,y);
  }
  function drawHUD(ctx,W,H){
    const st=Game.safeTop;
    ctx.textAlign='center'; ctx.textBaseline='top';
    // SCORE — big, white, chunky ink outline, tabular (never jitters)
    inkText(ctx, Math.round(Game.displayScore).toString(), W/2, 16+st, 60, COL.white);
    // BEST line (the target to beat)
    const beat=(Game.score>Game.prevBest && Game.prevBest>0);
    inkText(ctx, beat?'NEW BEST!':'BEST '+Storage.data.highScore, W/2, 84+st, 17, beat?COL.magenta:'#EAF2FF');
    // COMBO — hot pink, bounces on increment
    if(Game.combo>1){ const sc=1+Game.comboBounce*0.6;
      inkText(ctx, 'x'+Game.combo, W/2, 110+st, Math.round(42*sc), COL.magenta);
    }
    // COINS — top-left, below the shop button
    ctx.textAlign='left';
    inkText(ctx, '◉ '+Storage.data.coins, 16, 74+st, 22, COL.amber);
    // LEVEL — top-right, below the mute button, with a progress-to-next bar
    ctx.textAlign='right';
    inkText(ctx, 'LV '+Game.level, W-16, 74+st, 22, COL.cyan);
    const frac=(Game.score%CONFIG.LEVEL_STEP)/CONFIG.LEVEL_STEP, bw=84, bx=W-16-bw, by=102+st;
    ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle=COL.ink;
    ctx.fillStyle='#EADFce'; roundRect(ctx,bx,by,bw,9,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle=COL.cyan; if(frac>0){ roundRect(ctx,bx,by,Math.max(4,bw*frac),9,4); ctx.fill(); }
    // LEVEL-UP banner
    if(Game.levelBanner>0){ const a=clamp(Game.levelBanner/1.7,0,1); ctx.globalAlpha=clamp(a*1.6,0,1); ctx.textAlign='center';
      inkText(ctx,'LEVEL '+Game.level+'!', W/2, H*0.30, 46, COL.cyan); ctx.globalAlpha=1; }
    // POWER-UP active banner + countdown bar
    if(Game.powerKind){ ctx.textAlign='center';
      const pulse=1+0.08*Math.sin(performance.now()*0.02);
      inkText(ctx, Game.powerKind+'!', W/2, H-78-st, Math.round(26*pulse), COL.amber);
      const pf=clamp(Game.powerTimer/CONFIG.POWERUP_DUR,0,1), pw=140, px=(W-pw)/2, py=H-46;
      ctx.lineWidth=3; ctx.strokeStyle=COL.ink; ctx.fillStyle='#EADFce'; roundRect(ctx,px,py,pw,10,5); ctx.fill(); ctx.stroke();
      ctx.fillStyle=COL.amber; if(pf>0){ roundRect(ctx,px,py,Math.max(5,pw*pf),10,5); ctx.fill(); }
    }
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function drawHint(ctx,W,H){
    const a=Game.hintAlpha; if(a<=0) return;
    const car=Game.car; const pulse=0.6+0.4*Math.sin(performance.now()*0.006);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // big left/right steering arrows flanking the car (teach the touch zones)
    ctx.globalAlpha=a*(0.55+0.45*pulse);
    inkText(ctx,'◀', car.x-72, car.y, 44, COL.white);
    inkText(ctx,'▶', car.x+72, car.y, 44, COL.white);
    ctx.globalAlpha=a;
    inkText(ctx,'STEER', car.x, car.y+66, Math.round(22*(0.95+0.1*pulse)), COL.white);
    ctx.font='800 13px '+FONT_STACK; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeStyle=COL.ink;
    ctx.strokeText('hold a side to circle a drone', car.x, car.y+90); ctx.fillStyle='#EAF2FF';
    ctx.fillText('hold a side to circle a drone', car.x, car.y+90);
    ctx.globalAlpha=1;
  }

  const _sh={x:0,y:0}; // reused each frame (no allocation)
  function frame(){
    const ctx=Game.ctx, W=Game.W, H=Game.H;
    const playing=(Game.state===Game.STATE.PLAYING||Game.state===Game.STATE.DYING);
    // bright candy sky
    ctx.fillStyle=Game.bgGrad||COL.bg; ctx.fillRect(0,0,W,H);
    // ---- world layer: camera zoom-punch + screen shake (HUD stays put) ----
    FX.shakeXY(_sh);
    const z=1+FX.zoom;
    ctx.save();
    ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2+_sh.x, -H/2+_sh.y);

    drawGrid(ctx,W,H, Game.parallaxX, Game.parallaxY);
    drawPreview(ctx,0,0);
    drawCaptureFill(ctx,0,0);
    drawTrail(ctx,0,0);
    if(FX.chroma>0.02){
      const k=FX.chroma*4; ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.22*FX.chroma;
      ctx.save(); ctx.translate(k,0); drawTrailGhost(ctx,0,0,'rgba(255,0,80,1)'); ctx.restore();
      ctx.save(); ctx.translate(-k,0); drawTrailGhost(ctx,0,0,'rgba(0,210,255,1)'); ctx.restore();
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    }
    drawDrones(ctx,0,0);
    if(playing) drawCar(ctx,0,0);
    Particles.draw(ctx);
    Popups.draw(ctx);
    drawHint(ctx,W,H);
    ctx.restore();

    // ---- full-screen overlays (no camera transform) ----
    if(FX.nearShimmer>0.02){ ctx.fillStyle='rgba(255,59,92,'+(FX.nearShimmer*0.12)+')'; ctx.fillRect(0,0,W,H); }
    if(Game.vignette){ ctx.fillStyle=Game.vignette; ctx.fillRect(0,0,W,H); }
    if(playing) drawHUD(ctx,W,H);
  }
  function drawTrailGhost(ctx,offX,offY,color){
    const n=Trail.len; if(n<2) return; ctx.lineWidth=CONFIG.TRAIL_WIDTH; ctx.strokeStyle=color; ctx.lineCap='round';
    ctx.beginPath();
    const start=Math.max(1,n-26);
    ctx.moveTo(Trail.get(start-1).x+offX, Trail.get(start-1).y+offY);
    for(let i=start;i<n;i++){ ctx.lineTo(Trail.get(i).x+offX, Trail.get(i).y+offY); }
    ctx.stroke();
  }
  return { frame };
})();

/* =============================== [UI] ====================================== */
/* DOM overlays. Big touch targets, away from edges, no overlap on phone ratios. */
const UI=(()=>{
  const $=(id)=>document.getElementById(id);
  const overEl=$('over'), shopEl=$('shop'), toastEl=$('toast');
  let toastTimer=null;

  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1700);
  }
  function hideAll(){ [overEl,shopEl].forEach(e=>e.classList.remove('show')); }

  // objectives panel on the game-over card (the "purpose")
  function renderGoals(){
    const wrap=$('goals'); wrap.innerHTML='';
    Objectives.list().forEach(ob=>{
      const d=Objectives.DEFS[ob.key]; const done=ob.done;
      const el=document.createElement('div'); el.className='goal'+(done?' done':'');
      const pct=Math.min(100, Math.round(ob.prog/ob.t*100));
      el.innerHTML='<span class="gicon">'+d.icon+'</span>'+
        '<span class="gtext"><span class="gname">'+d.label(ob.t)+'</span>'+
        (done?'':'<span class="gbar"><i style="width:'+pct+'%"></i></span>')+'</span>'+
        '<span class="greward">'+(done?'✓ +'+d.reward:'+'+d.reward)+'</span>';
      wrap.appendChild(el);
    });
  }

  function updateNextUnlock(){
    const next=Cosmetics.nextLocked();
    if(next){
      $('next-name').textContent='Next: '+next.name;
      const have=Storage.data.coins, need=next.cost;
      $('next-coins').textContent=Math.max(0,need-have);
      $('next-bar').style.width=clamp(have/need*100,0,100)+'%';
    } else {
      $('next-name').textContent='All skins unlocked';
      $('next-coins').textContent='0'; $('next-bar').style.width='100%';
    }
  }

  function showGameOver(info){
    // "SO CLOSE" near-miss framing + the next milestone they nearly hit
    const next=Math.ceil((info.score+1)/CONFIG.MILESTONE_STEP)*CONFIG.MILESTONE_STEP;
    const away=next-info.score;
    $('over-score').textContent=info.score;
    $('over-best').textContent=info.best;
    $('over-coins').textContent='+'+info.coins;
    $('over-newbest').classList.toggle('hidden', !info.isBest);
    const hl=$('over-headline'); const eye=$('over-eyebrow');
    if(info.isBest){ hl.textContent='NEW BEST!'; hl.classList.remove('close'); eye.textContent='Record'; }
    else if(away<=Math.max(60, CONFIG.MILESTONE_STEP*0.4)){ hl.textContent='SO CLOSE'; hl.classList.add('close'); eye.textContent='Run Over'; }
    else { hl.textContent='RUN OVER'; hl.classList.remove('close'); eye.textContent='Run Over'; }
    $('over-lvl').textContent='LV '+(info.level||1);
    $('over-near').innerHTML = info.isBest
      ? 'You set a new personal best.'
      : 'You were <b>'+away+'</b> from <b>'+next+'</b>.'+(info.best>info.score?' Best is <b>'+info.best+'</b>.':'');
    renderGoals();
    updateNextUnlock();
    // revive is offered at most once per run (the emotional-peak ad moment)
    $('btn-revive').classList.toggle('hidden', info.canRevive===false);
    hideAll(); overEl.classList.add('show');
  }

  // ---------- shop / garage ----------
  function catOf(item){ return item.id.indexOf('car_')===0?'car' : item.id.indexOf('pow_')===0?'power' : 'trail'; }
  function equippedId(cat){ return cat==='car'?Storage.data.equippedCar : cat==='power'?Storage.data.equippedPower : Storage.data.equippedTrail; }
  function setEquipped(cat,id){ if(cat==='car')Storage.data.equippedCar=id; else if(cat==='power')Storage.data.equippedPower=id; else Storage.data.equippedTrail=id; }
  function renderTrailPreview(cv, item){
    const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height); g.lineCap='round';
    const steps=26;
    for(let i=1;i<steps;i++){
      const t=i/(steps-1), pt=(i-1)/(steps-1);
      const x=10+t*(cv.width-20), y=cv.height/2+Math.sin(t*Math.PI*2)*12;
      const x0=10+pt*(cv.width-20), y0=cv.height/2+Math.sin(pt*Math.PI*2)*12;
      let col = item.a==='rainbow' ? 'hsl('+(t*300)+',100%,60%)' : rgbStr(mixRgb(hexToRgb(item.a),hexToRgb(item.b),t),1);
      g.lineWidth=9; g.strokeStyle=COL.ink; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x,y); g.stroke();
      g.lineWidth=6; g.strokeStyle=col; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x,y); g.stroke();
    }
  }
  function renderCarPreview(cv, item){
    const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height); const cx=cv.width/2, cy=cv.height/2;
    g.beginPath(); g.arc(cx,cy,16,0,TAU); g.fillStyle=COL.ink; g.fill();
    g.beginPath(); g.arc(cx,cy,13,0,TAU); g.fillStyle=item.color; g.fill();
    g.beginPath(); g.ellipse(cx-4,cy-5,5,3,-0.6,0,TAU); g.fillStyle='rgba(255,255,255,0.9)'; g.fill();
  }
  function buildShop(){
    const grid=$('shop-grid'); grid.innerHTML='';
    $('shop-coins').textContent=Storage.data.coins;
    section(grid,'Trails',Cosmetics.TRAILS); section(grid,'Cars',Cosmetics.CARS); section(grid,'Powers',Cosmetics.POWERS);
  }
  function section(grid,title,items){
    const h=document.createElement('div'); h.className='shop-sec'; h.textContent=title; grid.appendChild(h);
    items.forEach(item=>grid.appendChild(card(item)));
  }
  function card(item){
    const cat=catOf(item), unlocked=Cosmetics.isUnlocked(item.id), equipped=equippedId(cat)===item.id;
    const el=document.createElement('div'); el.className='skin'+(equipped?' equipped':'');
    if(cat==='power'){ const p=document.createElement('div'); p.className='pico'; p.textContent=item.pico; el.appendChild(p); }
    else { const cv=document.createElement('canvas'); cv.width=110; cv.height=46; el.appendChild(cv); setTimeout(()=>{ cat==='car'?renderCarPreview(cv,item):renderTrailPreview(cv,item); },0); }
    const name=document.createElement('div'); name.className='name'; name.textContent=item.name; el.appendChild(name);
    if(cat==='power' && item.desc){ const ds=document.createElement('div'); ds.className='state un'; ds.textContent=item.desc; el.appendChild(ds); }
    const state=document.createElement('div');
    if(equipped){ state.className='state eq'; state.textContent='EQUIPPED'; }
    else if(unlocked){ state.className='state un'; state.textContent='TAP TO EQUIP'; }
    else { state.className='cost'; state.innerHTML='<span class="mini-coin"></span>'+item.cost; }
    el.appendChild(state);
    if(!unlocked){ const ad=document.createElement('div'); ad.className='state un'; ad.textContent='▶ or watch ad'; el.appendChild(ad); }
    el.addEventListener('click',()=>onTap(item,cat,unlocked));
    return el;
  }
  function onTap(item,cat,unlocked){
    if(unlocked){ setEquipped(cat,item.id); Storage.save(); Audio.tick(); buildShop(); return; }
    if(Storage.data.coins>=item.cost){
      Storage.data.coins-=item.cost; Cosmetics.unlock(item.id); setEquipped(cat,item.id);
      Storage.save(); Audio.coin(); toast('Unlocked '+item.name+'!'); buildShop(); updateNextUnlock();
    } else {
      AdSDK.showRewarded(
        ()=>{ Cosmetics.unlock(item.id); setEquipped(cat,item.id); Storage.save(); Audio.fanfare(); toast('Unlocked '+item.name+'!'); buildShop(); updateNextUnlock(); },
        ()=>{ toast('Need '+(item.cost-Storage.data.coins)+' more coins'); }
      );
    }
  }
  function openShop(){ buildShop(); hideAll(); shopEl.classList.add('show'); }
  function closeShop(){ shopEl.classList.remove('show'); if(Game.state===Game.STATE.DEAD) overEl.classList.add('show'); }

  // ---------- run flow ----------
  function startRun(){ hideAll(); Game.fullReset(); }
  function playAgain(){ Audio.tick(); AdSDK.showInterstitial(()=>{ startRun(); }); }

  function wire(){
    $('btn-again').addEventListener('click',playAgain);
    $('btn-openshop').addEventListener('click',openShop);
    $('btn-shop').addEventListener('click',()=>{ Audio.unlock(); openShop(); });
    $('btn-shop-close').addEventListener('click',closeShop);
    $('btn-revive').addEventListener('click',()=>{
      const btn=$('btn-revive');
      AdSDK.showRewarded(
        ()=>{ overEl.classList.remove('show'); Game.revive(); btn.classList.add('hidden'); },
        (err)=>{ // ad-block / skip fallback: a revive can't be partial, so explain + don't soft-lock
          toast('Ad unavailable — play again'); }
      );
    });
    $('btn-double').addEventListener('click',()=>{
      const btn=$('btn-double');
      AdSDK.showRewarded(
        ()=>{ const add=coinsAddDouble(1.0); toast('+'+add+' bonus coins'); btn.setAttribute('disabled','true'); },
        ()=>{ const add=coinsAddDouble(CONFIG.DOUBLE_COINS_PARTIAL-1); toast('Ad unavailable — +'+add+' coins anyway'); btn.setAttribute('disabled','true'); } // graceful partial
      );
    });
    $('btn-mute').addEventListener('click',()=>{
      Audio.unlock(); const m=!Audio.isMuted(); Audio.setMuted(m); Storage.set('muted',m);
      $('btn-mute').innerHTML=m?'&#128263;':'&#128266;';
    });
  }
  function coinsAddDouble(mult){
    // doubles THIS run's earned coins (already added once at game over)
    const base=parseInt($('over-coins').textContent.replace('+',''))||0;
    const add=Math.max(1,Math.round(base*mult));
    Storage.data.coins+=add; Storage.save(); $('shop-coins') && ($('shop-coins').textContent=Storage.data.coins);
    return add;
  }

  return { toast, showGameOver, openShop, closeShop, startRun, wire, updateNextUnlock, buildShop };
})();

/* ============================== [LOOP] ===================================== */
(function boot(){
  Sprites.build();
  Storage.load();
  // restore mute preference
  if(Storage.data.muted){ /* applied on unlock */ }
  Game.resize();
  UI.wire();
  // mute button initial glyph
  document.getElementById('btn-mute').innerHTML=Storage.data.muted?'&#128263;':'&#128266;';

  Objectives.seed();   // create the first 3 goals if none exist
  // endowed progress: on a brand-new save, gift coins ~60% toward the first skin
  if(!Storage.data.endowed){
    const first=Cosmetics.nextLocked();
    if(first){ Storage.data.coins=Math.max(Storage.data.coins, Math.ceil(first.cost*0.6)); }
    Storage.data.endowed=true; Storage.save();
  }

  // resume audio + apply mute on the first interaction (autoplay-safe)
  Input.onFirstInteraction(()=>{ Audio.unlock(); if(Storage.data.muted) Audio.setMuted(true); Audio.resume(); });

  // lifecycle: pause on tab-away, resume cleanly (no dt spike)
  let hidden=false;
  document.addEventListener('visibilitychange',()=>{
    hidden=document.hidden;
    if(hidden){ Audio.setDrift(0,false); Audio.setMusic(false); }
    else { lastT=performance.now(); if(Game.state===Game.STATE.PLAYING) Audio.setMusic(true); Audio.resume(); }
  });
  window.addEventListener('resize',()=>Game.resize());
  window.addEventListener('orientationchange',()=>setTimeout(()=>Game.resize(),120));

  // start: straight into play — no menu, no logo wall (logo lives on game-over)
  Game.fullReset();

  // fixed-timestep update, decoupled render
  const STEP=1/60; let acc=0, lastT=performance.now();
  function tick(now){
    requestAnimationFrame(tick);
    if(hidden) { lastT=now; return; }
    let dt=(now-lastT)/1000; lastT=now;
    if(dt>0.25) dt=0.25;                 // clamp huge gaps (tab return / breakpoints)
    FX.tickRealtime(dt);                 // hit-stop timer runs in real time (~100ms micro-pause)
    dt*=FX.timeScale();                  // then apply the slow-mo to the sim
    acc+=dt;
    let steps=0;
    while(acc>=STEP && steps<5){ Game.update(STEP); acc-=STEP; steps++; }
    if(steps===5) acc=0;                 // avoid spiral of death on weak hardware
    Render.frame();
  }
  requestAnimationFrame(tick);

  // expose for SDK integration + live tuning from console
  window.DriftLasso={ CONFIG, Storage, AdSDK, Audio, Game, Cosmetics };
})();
</script>
