<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Segoe UI',system-ui,Arial,sans-serif">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AD1FF"/><stop offset="1" stop-color="#6A5BFF"/></linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75"><stop offset="0.45" stop-color="#241A4D" stop-opacity="0"/><stop offset="1" stop-color="#241A4D" stop-opacity="0.34"/></radialGradient>
  <linearGradient id="rib" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF49C3"/></linearGradient>
  <radialGradient id="coral" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFD0A8"/><stop offset=".5" stop-color="#FF6B5C"/><stop offset="1" stop-color="#C0392B"/></radialGradient>
  <radialGradient id="teal" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#C7FFF3"/><stop offset=".5" stop-color="#36DCC0"/><stop offset="1" stop-color="#11907D"/></radialGradient>
  <radialGradient id="gold" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFF1B0"/><stop offset=".5" stop-color="#FFCB3A"/><stop offset="1" stop-color="#D89200"/></radialGradient>
  <radialGradient id="blue" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#CBE9FF"/><stop offset=".5" stop-color="#4DA8FF"/><stop offset="1" stop-color="#1F5FBF"/></radialGradient>
  <radialGradient id="viol" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#EAD3FF"/><stop offset=".5" stop-color="#B96BFF"/><stop offset="1" stop-color="#6A2EB8"/></radialGradient>
  <radialGradient id="grn" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#DBFFC2"/><stop offset=".5" stop-color="#7ED957"/><stop offset="1" stop-color="#3E8E2E"/></radialGradient>
  <radialGradient id="car" cx="0.36" cy="0.28" r="0.8"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#8FE6FF"/></radialGradient>
</defs>
<rect width="1080" height="1350" fill="url(#sky)"/>
<g stroke="#fff" stroke-opacity="0.10" stroke-width="2"><path d="M150 0V1350 M270 0V1350 M390 0V1350 M510 0V1350 M630 0V1350 M750 0V1350 M870 0V1350 M990 0V1350 M0 250H1080 M0 370H1080 M0 490H1080 M0 610H1080 M0 730H1080 M0 850H1080 M0 970H1080 M0 1090H1080 M0 1210H1080"/></g>

<!-- the big lasso loop mid-snap around a crowd -->
<path id="lp" d="M560 560 C820 560 880 760 840 920 C800 1080 600 1130 470 1100 C300 1062 250 940 270 800 C288 660 380 560 560 560 Z"/>
<use href="#lp" fill="#00E5FF" fill-opacity="0.15"/>
<use href="#lp" fill="none" stroke="#241A4D" stroke-width="32" stroke-linejoin="round"/>
<use href="#lp" fill="none" stroke="url(#rib)" stroke-width="21" stroke-linejoin="round"/>

<!-- CROWD of critters inside (variety = busy) -->
<!-- small zippy x3 -->
<g transform="translate(420,720)"><ellipse cx="0" cy="20" rx="20" ry="7" fill="#241A4D" opacity=".22"/><circle r="17" fill="#241A4D"/><circle r="14" fill="url(#coral)"/><circle cx="-5" cy="-2" r="3.6" fill="#241A4D"/><circle cx="5" cy="-2" r="3.6" fill="#241A4D"/></g>
<g transform="translate(640,690)"><ellipse cx="0" cy="20" rx="20" ry="7" fill="#241A4D" opacity=".22"/><circle r="17" fill="#241A4D"/><circle r="14" fill="url(#coral)"/><circle cx="-5" cy="-2" r="3.6" fill="#241A4D"/><circle cx="5" cy="-2" r="3.6" fill="#241A4D"/></g>
<g transform="translate(700,860)"><ellipse cx="0" cy="18" rx="16" ry="6" fill="#241A4D" opacity=".22"/><circle r="14" fill="#241A4D"/><circle r="11" fill="url(#coral)"/><circle cx="-4" cy="-2" r="3" fill="#241A4D"/><circle cx="4" cy="-2" r="3" fill="#241A4D"/></g>
<!-- BIG blue lunker -->
<g transform="translate(500,920)"><ellipse cx="0" cy="48" rx="66" ry="20" fill="#241A4D" opacity=".22"/><circle r="56" fill="#241A4D"/><circle r="50" fill="url(#blue)"/><circle cx="-17" cy="-6" r="11" fill="#fff"/><circle cx="17" cy="-6" r="11" fill="#fff"/><circle cx="-17" cy="-5" r="6" fill="#241A4D"/><circle cx="17" cy="-5" r="6" fill="#241A4D"/><path d="M-20 26 Q0 42 20 26" fill="none" stroke="#241A4D" stroke-width="6" stroke-linecap="round"/></g>
<!-- teal runner (worried) -->
<g transform="translate(360,880)"><ellipse cx="0" cy="30" rx="34" ry="11" fill="#241A4D" opacity=".22"/><circle r="30" fill="#241A4D"/><circle r="25" fill="url(#teal)"/><circle cx="-9" cy="-3" r="8" fill="#fff"/><circle cx="9" cy="-3" r="8" fill="#fff"/><circle cx="-9" cy="-2" r="4" fill="#241A4D"/><circle cx="9" cy="-2" r="4" fill="#241A4D"/><ellipse cx="0" cy="14" rx="5" ry="7" fill="#241A4D"/></g>
<!-- gold star -->
<g transform="translate(690,1000)"><ellipse cx="0" cy="34" rx="42" ry="13" fill="#241A4D" opacity=".22"/><circle r="36" fill="#241A4D"/><circle r="31" fill="url(#gold)"/><circle cx="-11" cy="-4" r="10" fill="#fff"/><circle cx="11" cy="-4" r="10" fill="#fff"/><circle cx="-11" cy="-3" r="5" fill="#241A4D"/><circle cx="11" cy="-3" r="5" fill="#241A4D"/><path d="M-13 18 Q0 30 13 18" fill="none" stroke="#241A4D" stroke-width="5" stroke-linecap="round"/></g>
<!-- GREEN glutton with chomping mouth -->
<g transform="translate(560,770)"><ellipse cx="0" cy="40" rx="52" ry="16" fill="#241A4D" opacity=".22"/><circle r="44" fill="#241A4D"/><circle r="39" fill="url(#grn)"/><circle cx="-13" cy="-8" r="9" fill="#fff"/><circle cx="13" cy="-8" r="9" fill="#fff"/><circle cx="-13" cy="-7" r="5" fill="#241A4D"/><circle cx="13" cy="-7" r="5" fill="#241A4D"/><ellipse cx="0" cy="16" rx="18" ry="13" fill="#241A4D"/><rect x="-11" y="6" width="22" height="5" fill="#fff"/></g>

<!-- VIOLET magnet drifting in from left, on the rope -->
<g transform="translate(300,640)"><ellipse cx="0" cy="28" rx="30" ry="10" fill="#241A4D" opacity=".22"/><circle r="26" fill="#241A4D"/><circle r="22" fill="url(#viol)"/><circle cx="-8" cy="-3" r="7" fill="#fff"/><circle cx="8" cy="-3" r="7" fill="#fff"/><circle cx="-7" cy="-2" r="3.6" fill="#241A4D"/><circle cx="9" cy="-2" r="3.6" fill="#241A4D"/></g>

<!-- the car on the rope -->
<g transform="translate(560,560)"><ellipse cx="0" cy="26" rx="34" ry="13" fill="#241A4D" opacity=".22"/><circle r="30" fill="#241A4D"/><circle r="25" fill="url(#car)"/><circle cx="-9" cy="-4" r="7" fill="#241A4D"/><circle cx="9" cy="-4" r="7" fill="#241A4D"/><path d="M16 0 L1 9 L5 0 L1 -9 Z" fill="#241A4D"/></g>

<!-- BOMB (with lit fuse) lurking OUTSIDE the loop -->
<g transform="translate(180,1130)">
  <ellipse cx="0" cy="34" rx="40" ry="13" fill="#241A4D" opacity=".22"/>
  <g fill="#241A4D"><path d="M0 -40 L7 -28 L-7 -28Z"/><path d="M28 -28 L33 -15 L19 -21Z"/><path d="M40 0 L28 6 L28 -7Z"/><path d="M28 28 L19 21 L33 15Z"/><path d="M0 40 L-7 28 L7 28Z"/><path d="M-28 28 L-33 15 L-19 21Z"/><path d="M-40 0 L-28 -7 L-28 6Z"/><path d="M-28 -28 L-19 -21 L-33 -15Z"/></g>
  <circle r="32" fill="#241A4D"/><circle r="28" fill="#5B4B7A"/>
  <circle cx="-10" cy="-4" r="9" fill="#fff"/><circle cx="10" cy="-4" r="9" fill="#fff"/><circle cx="-10" cy="-2" r="4.5" fill="#241A4D"/><circle cx="10" cy="-2" r="4.5" fill="#241A4D"/>
  <path d="M-18 -16 L-4 -10 M18 -16 L4 -10" stroke="#241A4D" stroke-width="5" stroke-linecap="round"/>
  <path d="M0 -28 L7 -50" stroke="#241A4D" stroke-width="5"/><circle cx="7" cy="-52" r="9" fill="#FFD23F"/><circle cx="7" cy="-52" r="4.5" fill="#FF3B5C"/>
</g>

<!-- power-up orb -->
<g transform="translate(852,720)"><circle r="42" fill="#fff" opacity=".35"/><circle r="28" fill="#241A4D"/><circle r="25" fill="#FF8A3D"/><path d="M0 -18 L5 -6 L19 -6 L8 3 L12 17 L0 9 L-12 17 L-8 3 L-19 -6 L-5 -6 Z" fill="#fff"/></g>

<!-- confetti -->
<g stroke="#241A4D" stroke-width="2">
  <rect x="430" y="640" width="13" height="22" rx="3" fill="#00E5FF" transform="rotate(20 436 651)"/>
  <rect x="780" y="800" width="13" height="22" rx="3" fill="#FFD23F" transform="rotate(-30 786 811)"/>
  <rect x="330" y="980" width="13" height="22" rx="3" fill="#7CFF6B" transform="rotate(40 336 991)"/>
  <rect x="720" y="1090" width="13" height="22" rx="3" fill="#B16BFF" transform="rotate(25 726 1101)"/>
</g>

<!-- HUD -->
<text x="540" y="120" text-anchor="middle" font-size="118" font-weight="900" fill="#fff" stroke="#241A4D" stroke-width="13" paint-order="stroke" letter-spacing="2">4,610</text>
<text x="540" y="246" text-anchor="middle" font-size="36" font-weight="900" fill="#FF49C3" stroke="#241A4D" stroke-width="7" paint-order="stroke">x7</text>
<text x="540" y="350" text-anchor="middle" font-size="54" font-weight="900" fill="#FFB020" stroke="#241A4D" stroke-width="9" paint-order="stroke">SWARM!</text>
<text x="40" y="150" font-size="40" font-weight="900" fill="#FFB020" stroke="#241A4D" stroke-width="7" paint-order="stroke">&#9673; 240</text>
<text x="1040" y="150" text-anchor="end" font-size="40" font-weight="900" fill="#00E5FF" stroke="#241A4D" stroke-width="7" paint-order="stroke">LV 9</text>
<rect x="916" y="168" width="124" height="16" rx="8" fill="#EADFCE" stroke="#241A4D" stroke-width="4"/>
<rect x="916" y="168" width="96" height="16" rx="8" fill="#00E5FF"/>
<rect width="1080" height="1350" fill="url(#vig)"/>
</svg>
