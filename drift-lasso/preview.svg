<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AD1FF"/><stop offset="0.55" stop-color="#5AA8FF"/><stop offset="1" stop-color="#6A5BFF"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.45" stop-color="#241A4D" stop-opacity="0"/><stop offset="1" stop-color="#241A4D" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF49C3"/>
    </linearGradient>
    <radialGradient id="coral" cx="0.36" cy="0.30" r="0.75"><stop offset="0" stop-color="#FFD0A8"/><stop offset="0.5" stop-color="#FF6B5C"/><stop offset="1" stop-color="#C0392B"/></radialGradient>
    <radialGradient id="teal" cx="0.36" cy="0.30" r="0.75"><stop offset="0" stop-color="#C7FFF3"/><stop offset="0.5" stop-color="#36DCC0"/><stop offset="1" stop-color="#11907D"/></radialGradient>
    <radialGradient id="gold" cx="0.36" cy="0.30" r="0.75"><stop offset="0" stop-color="#FFF1B0"/><stop offset="0.5" stop-color="#FFCB3A"/><stop offset="1" stop-color="#D89200"/></radialGradient>
    <radialGradient id="bomb" cx="0.36" cy="0.30" r="0.75"><stop offset="0" stop-color="#C9B6FF"/><stop offset="0.5" stop-color="#7C5BE0"/><stop offset="1" stop-color="#4A2EA0"/></radialGradient>
    <radialGradient id="carb" cx="0.36" cy="0.28" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8FE6FF"/></radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#sky)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2">
    <path d="M150 0V1350 M270 0V1350 M390 0V1350 M510 0V1350 M630 0V1350 M750 0V1350 M870 0V1350 M990 0V1350"/>
    <path d="M0 250H1080 M0 370H1080 M0 490H1080 M0 610H1080 M0 730H1080 M0 850H1080 M0 970H1080 M0 1090H1080 M0 1210H1080"/>
  </g>

  <!-- the lasso loop snapping shut -->
  <path id="loop" d="M540 600 C760 600 840 740 820 880 C800 1020 660 1090 540 1080 C400 1068 270 1010 268 870 C266 720 360 600 540 600 Z"/>
  <use href="#loop" fill="#00E5FF" fill-opacity="0.16"/>
  <use href="#loop" fill="none" stroke="#241A4D" stroke-width="30" stroke-linejoin="round"/>
  <use href="#loop" fill="none" stroke="url(#ribbon)" stroke-width="20" stroke-linejoin="round"/>

  <!-- captured critters with googly faces (eyes glance toward the car) -->
  <!-- coral wanderer -->
  <g>
    <ellipse cx="470" cy="812" rx="58" ry="20" fill="#241A4D" opacity="0.22"/>
    <circle cx="470" cy="786" r="46" fill="#241A4D"/><circle cx="470" cy="786" r="40" fill="url(#coral)"/>
    <circle cx="453" cy="780" r="13" fill="#fff"/><circle cx="487" cy="780" r="13" fill="#fff"/>
    <circle cx="456" cy="777" r="7" fill="#241A4D"/><circle cx="490" cy="777" r="7" fill="#241A4D"/>
    <path d="M457 798 Q470 808 483 798" fill="none" stroke="#241A4D" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- teal runner (worried) -->
  <g>
    <ellipse cx="648" cy="852" rx="52" ry="18" fill="#241A4D" opacity="0.22"/>
    <circle cx="648" cy="828" r="42" fill="#241A4D"/><circle cx="648" cy="828" r="36" fill="url(#teal)"/>
    <circle cx="633" cy="822" r="13" fill="#fff"/><circle cx="663" cy="822" r="13" fill="#fff"/>
    <circle cx="635" cy="821" r="6" fill="#241A4D"/><circle cx="665" cy="821" r="6" fill="#241A4D"/>
    <ellipse cx="648" cy="842" rx="6" ry="8" fill="#241A4D"/>
  </g>
  <!-- gold star (happy) -->
  <g>
    <ellipse cx="540" cy="956" rx="64" ry="22" fill="#241A4D" opacity="0.22"/>
    <circle cx="540" cy="928" r="52" fill="#241A4D"/><circle cx="540" cy="928" r="46" fill="url(#gold)"/>
    <circle cx="521" cy="921" r="15" fill="#fff"/><circle cx="559" cy="921" r="15" fill="#fff"/>
    <circle cx="524" cy="919" r="8" fill="#241A4D"/><circle cx="562" cy="919" r="8" fill="#241A4D"/>
    <path d="M523 942 Q540 956 557 942" fill="none" stroke="#241A4D" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- the bomb grump, lurking OUTSIDE the loop (don't lasso me!) -->
  <g transform="translate(168,1150)">
    <ellipse cx="0" cy="30" rx="44" ry="15" fill="#241A4D" opacity="0.22"/>
    <g fill="#241A4D"><path d="M0 -42 L8 -30 L-8 -30Z"/><path d="M30 -30 L34 -16 L20 -22Z"/><path d="M42 0 L30 6 L30 -8Z"/><path d="M30 30 L20 22 L34 16Z"/><path d="M0 42 L-8 30 L8 30Z"/><path d="M-30 30 L-34 16 L-20 22Z"/><path d="M-42 0 L-30 -8 L-30 6Z"/><path d="M-30 -30 L-20 -22 L-34 -16Z"/></g>
    <circle r="34" fill="#241A4D"/><circle r="30" fill="url(#bomb)"/>
    <circle cx="-11" cy="-4" r="10" fill="#fff"/><circle cx="11" cy="-4" r="10" fill="#fff"/>
    <circle cx="-11" cy="-2" r="5" fill="#241A4D"/><circle cx="11" cy="-2" r="5" fill="#241A4D"/>
    <path d="M-18 -16 L-4 -10 M18 -16 L4 -10" stroke="#241A4D" stroke-width="5" stroke-linecap="round"/>
    <path d="M-10 16 Q0 8 10 16" fill="none" stroke="#241A4D" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- the car: glossy ball + steering arrows + tiny eyes -->
  <g transform="translate(540,600)">
    <ellipse cx="0" cy="26" rx="34" ry="13" fill="#241A4D" opacity="0.22"/>
    <circle r="30" fill="#241A4D"/><circle r="25" fill="url(#carb)"/>
    <circle cx="-9" cy="-4" r="7" fill="#241A4D"/><circle cx="9" cy="-4" r="7" fill="#241A4D"/>
    <path d="M16 0 L1 9 L5 0 L1 -9 Z" fill="#241A4D"/>
  </g>
  <text x="436" y="612" text-anchor="middle" font-size="60" font-weight="900" fill="#FFFFFF" stroke="#241A4D" stroke-width="9" paint-order="stroke">&#9664;</text>
  <text x="644" y="612" text-anchor="middle" font-size="60" font-weight="900" fill="#FFFFFF" stroke="#241A4D" stroke-width="9" paint-order="stroke">&#9654;</text>

  <!-- confetti + witty callout -->
  <g stroke="#241A4D" stroke-width="2">
    <rect x="300" y="690" width="14" height="24" rx="3" fill="#00E5FF" transform="rotate(20 307 702)"/>
    <rect x="800" y="760" width="14" height="24" rx="3" fill="#FFD23F" transform="rotate(-30 807 772)"/>
    <rect x="700" y="700" width="13" height="22" rx="3" fill="#7CFF6B" transform="rotate(40 706 711)"/>
    <rect x="700" y="1010" width="14" height="24" rx="3" fill="#B16BFF" transform="rotate(25 707 1022)"/>
    <rect x="470" y="640" width="12" height="20" rx="3" fill="#FF49C3" transform="rotate(-25 476 650)"/>
    <rect x="250" y="900" width="13" height="22" rx="3" fill="#FFD23F" transform="rotate(15 256 911)"/>
  </g>
  <text x="540" y="540" text-anchor="middle" font-size="56" font-weight="900" fill="#FF49C3" stroke="#241A4D" stroke-width="8" paint-order="stroke">YOINK!  +540</text>

  <!-- HUD -->
  <text x="540" y="120" text-anchor="middle" font-size="118" font-weight="900" fill="#FFFFFF" stroke="#241A4D" stroke-width="13" paint-order="stroke" letter-spacing="2">2,480</text>
  <text x="540" y="250" text-anchor="middle" font-size="34" font-weight="900" fill="#FF49C3" stroke="#241A4D" stroke-width="7" paint-order="stroke">x4</text>
  <text x="540" y="210" text-anchor="middle" font-size="30" font-weight="900" fill="#EAF2FF" stroke="#241A4D" stroke-width="6" paint-order="stroke">BEST 1,960</text>
  <text x="40" y="150" font-size="40" font-weight="900" fill="#FFB020" stroke="#241A4D" stroke-width="7" paint-order="stroke">&#9673; 128</text>

  <rect width="1080" height="1350" fill="url(#vig)"/>
</svg>
